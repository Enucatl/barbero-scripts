- id: Q-001
  transcript:
  - U-00076–U-00085
  attribution: Carducci
  quotation_kind: direct
  source_ids:
  - SRC-001
  original_language: Italian
  original_text: V’immaginate il levar del sole nel primo giorno dell’anno mille? Questo fatto di tutte
    le mattine ricordate che fu quasi miracolo, fu promessa di vita nuova, per le generazioni uscenti
    dal secolo decimo?
  translation: Can you imagine the sun rising on the first day of the year one thousand? Do you remember
    that this everyday event was almost a miracle, a promise of new life, for the generations emerging
    from the tenth century?
  locator: Discorso primo I
  verdict: confirmed
  source_replacement: eligible
  status: resolved
  research_note: Contextual rendering; no new long excerpt. U-00083–85 is the adjacent attributed summary
    of Carducci’s terrors catalogue; contextual paraphrase, not an expanded quotation.
- id: Q-002
  transcript:
  - U-00087–U-00092
  attribution: Carducci reporting tradition and Revelation
  quotation_kind: composite
  source_ids:
  - SRC-001
  - SRC-010
  original_language: Italian
  original_text: '— Mille, e non piú mille — aveva, secondo la tradizione, detto Gesú: dopo mille anni,
    leggevasi nell’Apocalipsi, Satana sarà disciolto.'
  translation: “A thousand, and no more than a thousand,” Jesus had said, according to tradition; after
    a thousand years, one read in Revelation, Satan would be released.
  locator: Discorso primo I; allusion Revelation 20:7
  verdict: composite
  source_replacement: eligible
  status: resolved
  research_note: Carducci words recovered; not authentic Jesus speech. Released is contextual meaning
    of dissolved/disciolto, not historical correction. Keep nested attribution.
- id: Q-003
  transcript:
  - U-00097–U-00107
  attribution: Carducci
  quotation_kind: direct
  source_ids:
  - SRC-001
  original_language: Italian
  original_text: E che stupore di gioia e che grido salí al cielo dalle turbe raccolte in gruppi silenziosi
    intorno a’ manieri feudali, accosciate e singhiozzanti nelle chiese tenebrose e ne’ chiostri, sparse
    con pallidi volti e sommessi mormorii per le piazze e alla campagna, quando il sole, eterno fonte
    di luce e di vita, si levò trionfale la mattina dell’anno mille!
  translation: And what astonished joy, what a cry rose to heaven from the crowds gathered in silent groups
    around the feudal castles, crouching and sobbing in the dark churches and cloisters, scattered with
    pale faces and hushed murmurs through the squares and countryside, when the sun, eternal source of
    light and life, rose triumphant on the morning of the year one thousand!
  locator: Discorso primo I
  verdict: confirmed
  source_replacement: eligible
  status: resolved
  research_note: Draft preserves lecture omission from sparse through campagna, no expansion; contextual
    excerpt.
- id: Q-004
  transcript:
  - U-00113–U-00126
  attribution: Lavallée, translated by Barbero
  quotation_kind: direct
  source_ids:
  - SRC-002
  - SRC-003
  original_language: French
  original_text: 'D’ailleurs la croyance en la fin du monde, croyance qui semblait justifiée par les pestes,
    les famines, les calamités de tout genre dont l’Europe était désolée, répandait une atonie universelle.
    Tout était glacé d’effroi à l’attente du jour fatal, toute entreprise avait cessé, tout mouvement
    était arrêté; il n’y avait plus ni d’espoir ni d’avenir. On redoublait de ferveur religieuse, on se
    pressait dans les couvents, on donnait ses biens à l’Église, et de toutes parts on entendait ce cri
    lugubre : « La fin du monde approche ! »'
  translation: 'Besides, belief in the end of the world, a belief seemingly justified by the plagues,
    famines, and calamities of every kind that devastated Europe, spread a universal torpor. Everything
    was frozen with terror awaiting the fatal day; every undertaking had ceased, all movement had stopped;
    there was no longer any hope or any future. Religious fervor redoubled; people crowded into monasteries,
    gave their property to the Church, and on every side the mournful cry was heard: “The end of the world
    is approaching!”'
  locator: 1863 p.249
  verdict: confirmed in substance
  source_replacement: eligible
  status: resolved
  research_note: 1844 not collated; draft contextual rendering introduced as rough translation; Odifreddi
    interruption outside quote.
