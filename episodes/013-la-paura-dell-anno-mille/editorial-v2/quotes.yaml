- id: Q-026
  transcript:
  - U-00462–U-00469
  attribution: Augustine on Gospel preached to all peoples
  quotation_kind: composite
  source_ids:
  - SRC-029
  - SRC-031
  - SRC-032
  original_language: Latin
  original_text: Et praedicabitur hoc Evangelium regni in universo orbe in testimonium omnibus gentibus,
    et tunc veniet finis. / Tunc veniet, quid est, nisi "ante non veniet"? Quanto post ergo veniat, incertum
    nobis est; ante tamen non esse venturum dubitare utique non debemus.
  translation: And this gospel of the kingdom will be proclaimed throughout the whole world as a testimony
    to all nations, and then the end will come. / What does “then it will come” mean except “it will not
    come before”? How long afterward it will come is unknown to us; but we certainly must not doubt that
    it will not come before.
  locator: Epistula 197§4 quotesMatthew 24:14 then comments;19912.46–49 supports unpreached peoples
  verdict: confirmed in substance
  source_replacement: eligible
  status: resolved
  research_note: Slash separates scripture quotation from Augustine commentary, not continuous words.
    Antichrist not in these clauses. Notnextyear is stronger lecture inference; proposal preserves no-date
    argument.
- id: Q-027
  transcript:
  - U-00484–U-00491
  attribution: Fulda annalist on Thiota
  quotation_kind: paraphrase
  source_ids:
  - SRC-014
  original_language: Latin
  original_text: Per idem tempus mulier quaedam de Alamanniae partibus nomine Thiota pseudoprophetissa
    Mogontiacum venit, quae Salomonis episcopi parrochiam suis vaticiniis non minime turbaverat. Nam certum
    consummationis seculi diem aliaque perplura Dei solius notitiae cognita quasi divinitus sibi revelata
    scire se fatebatur et eodem anno ultimum diem mundo imminere praedicabat.
  translation: Around the same time a certain woman from Alemannia named Thiota, a false prophetess, came
    to Mainz. Her predictions had greatly disturbed Bishop Salomon’s diocese. She claimed to know the
    precise day of the world’s end and many other things known to God alone, as though divinely revealed
    to her, and preached that the world’s last day was approaching in that very year.
  locator: 847 pp.36–37
  verdict: confirmed in substance
  source_replacement: eligible
  status: resolved
  research_note: Same year, not next; source correction proposed.
- id: Q-028
