- id: Q-035
  transcript:
  - U-00695–U-00704
  attribution: Bettinelli with Barbero’s gloss
  quotation_kind: composite
  source_ids:
  - SRC-019
  original_language: Italian
  original_text: Piccola cosa ne sembra, ed è perciò dagli storici appena accennata quell’opinion generale,
    che avea gli animi preoccupati della fine del mondo imminente. Eppur non è credibile quant’essa pregiudicasse
    insino all’ultimo giorno del secolo X., e quanto danno togliesse il non aspettato principio del mille.
  translation: That general belief which had filled people’s minds with the imminent end of the world
    seems a small matter to us, and historians therefore barely mention it. Yet it is hard to believe
    how much harm it did until the very last day of the tenth century, and how much harm the unexpected
    beginning of the year one thousand removed.
  locator: PartI chapter 2 opening
  verdict: composite
  source_replacement: eligible
