  research_note: First sentence paraphrased; second excerpt plus Barbero gloss how much good outside quotation;
    no expansion.
- id: Q-036
  transcript:
  - U-00705–U-00706
  attribution: Bettinelli
  quotation_kind: direct
  source_ids:
  - SRC-019
  original_language: Italian
  original_text: L’orror sempre presente d’una prossima desolazione universale, rinnovato da ogni accidente
    non solito della natura, o tenuto per minaccioso tolse ad ognuno speranze e pensieri intorno ad un
    avvenire, in cui già disperavan d’esistere neppur col nome, neppur ne’ figli, neppur nella memoria
    degli uomini destinati tutti a perire.
  translation: The ever-present horror of an approaching universal devastation, renewed by every unusual
    natural event or one regarded as threatening, robbed everyone of hopes and thoughts of a future in
    which they already despaired of existing even by name, even in their children, even in the memory
    of people all destined to perish.
  locator: PartI chapter 2
  verdict: confirmed
  source_replacement: eligible
  status: resolved
  research_note: Lecture omits rinnovato clause and stops at speranze; preserve selected words only, contextual
    excerpt.
