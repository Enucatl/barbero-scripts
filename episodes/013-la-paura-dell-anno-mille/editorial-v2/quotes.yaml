- id: Q-011
  transcript:
  - U-00232–U-00236
  attribution: Otto III Farfa diploma
  quotation_kind: paraphrase
  source_ids:
  - SRC-009
  original_language: Latin
  original_text: Unde deum omnipotentem precamur ut si aliquis papa aut imperator noster successor unquam
    memoratum monasterium alicui persone subiugaverit, nobiscum in Christi adventu, dum venerit iudicare
    seculum per ignem, rationem inde reddat et se deliquisse pro hac cautione recognoscat.
  translation: Therefore we pray to Almighty God that, if any pope or emperor, a successor of ours, ever
    subjects the aforesaid monastery to any person, he may render account for it alongside us at Christ’s
    coming, when he comes to judge the world by fire, and acknowledge that he has sinned against this
    guarantee.
  locator: D O III 331 p.760 lines 4–7
  verdict: confirmed in substance
  source_replacement: eligible
  status: resolved
  research_note: Source contains alongside us; draft contextual paraphrase; proposal can restore meaningful
    relation without adding fire imagery.
