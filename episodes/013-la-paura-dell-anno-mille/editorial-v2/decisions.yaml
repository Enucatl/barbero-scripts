    - U-00875–U-00881
    current_text: 'I think you can already see the implications. But Gouguenheim spells them out in his
      book. Those pages I have seen. I went and looked at them. What he''s saying, as I''m summarizing
      it, is this: the story we''ve always been told, that we owe our access to Greek philosophy and science
      to the Arabs, isn''t true. We Christians translated them ourselves, directly from Greek. We had
      no need of the Arabs.


      And, to make things even clearer, at the end of the book his argument, as I''m putting it here,
      is that Arabic is completely unsuited to discussing scientific subjects, that the Arabs don''t have
      the mentality of a scientific people, and that it was therefore absurd to imagine we owed them anything.
      We owe nothing to medieval Islamic culture.'
    current_text_sha256: 52a145b911fc7cd231b1b6a43a39c6ddd1244e9943bc87b5038a5f7ab2914d14
    proposed_text: 'I think you can already see the implications. But Gouguenheim spells them out in his
      book. Those pages I have seen. I went and looked at them. As I understand his argument, direct translation
      from Greek makes the Christian West far less dependent on Arabic learning than the familiar account
      suggests.


      He also puts great weight on differences between Greek and Arabic as obstacles to translating Greek
      thought. To my mind, this becomes a polemical argument about how much Europe owes medieval Islamic
      culture.'
