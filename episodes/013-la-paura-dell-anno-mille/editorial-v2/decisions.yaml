  current_text: 'After, obviously. Think of the history of Italian literature we learn at school in Italy.
    It all begins after 1000. Before that, nothing.


    So these early scholars, putting together their great surveys, find that the Middle Ages up to about
    1000 have left relatively little evidence. Not much seems to happen. Afterward, everything bursts
    into life. Provençal literature, French literature in the *langue d''oïl*, then Italian literature.
    The troubadours, all of it. The great cathedrals. A great civilization coming into being after the
    year 1000.'
  current_text_sha256: 7603276067976be20284b87d27cf6895ec1da979d526bdcd2ebaeddba2b7bdcd
  proposed_text: 'After, obviously. Think of the history of Italian literature taught in Italian schools.
    It all begins after 1000. Before that, nothing.


    So these early scholars, putting together their histories, find relatively little evidence from before
    the year 1000. Not much seems to happen. Afterward, everything bursts into life: French literature,
    then Italian literature. The great cathedrals. A whole civilization coming into being after the year
    1000.'
