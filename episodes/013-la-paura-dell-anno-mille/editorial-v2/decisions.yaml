      her. They come to her, bringing gifts, asking her to pray for them.


      <!-- Q-029 -->


      The bishop of Mainz gets a little annoyed. He summons her and questions her. And it emerges—or at
      least this is what she says—that a priest friend suggested the whole thing. You can put his advice
      like this: “Go around preaching that the world will end next year. Just see how many presents people
      bring us.”


      And that''s exactly what happens.


      <!-- Q-030 -->


      The bishop consults the other bishops. They decide she''s certainly not getting out of this without
      a good beating. They have her flogged in the public square. Then it''s, “Out of here. And don''t
      let us hear another word from you.”


      And that, you might say, puts an end to the millenarian movement in Mainz in 847.'
