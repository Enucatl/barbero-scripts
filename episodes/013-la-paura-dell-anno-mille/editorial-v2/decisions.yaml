  - U-00130–U-00240
  current_text: 'The abbot rents the land to the two brothers for a period of…


    Let me prepare you for this. Until fairly recently, sharecropping was common in the Italian countryside.
    On the face of it, the arrangement looks like an equal partnership. In practice, it heavily favors
    the landowner. The contract normally lasts one year. At the end of the harvest, at Martinmas, the
    tenant settles up, and if the owner wants to throw him out, he can. Think of Ermanno Olmi''s film
    *The Tree of Wooden Clogs*, which some of you may have seen.


    In the Middle Ages, things aren''t like that. There aren''t many hands to work the land. One of a
    landowner''s great problems is finding people who will stay. That''s especially true for monks, who
    have other things to think about besides constantly looking after their fields. If anything, you''d
    like to make the workers stay, if you can, rather than throw them out. So medieval leases tend to
    run for a long time.'
  current_text_sha256: 70d1674aaa4e45d27280b4f2c80df3e46e2ed0ce4c1cd43356806608a253714e
  proposed_text: Now, how long is this lease? Remember, in the Middle Ages, there aren't many people available
    to work the land. A landowner needs workers who'll stay. That's especially true for monks, who have
    other things to do besides looking after their fields. If anything, you'd like to make the workers
    stay, if you can, rather than throw them out. So medieval leases tend to run for a long time.
  reason: Remove the sharecropping comparison, Martinmas, and film reference as authorized. Keep the labor-shortage
    explanation, the monks’ incentive, and the setup for the twenty-nine-year term. The later crop shares,
    penalty, and inference remain unchanged.
