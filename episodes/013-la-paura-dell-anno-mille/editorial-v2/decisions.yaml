    proposed_text: 'The next name takes us into the Renaissance.


      <!-- Q-033; C-020 -->


      Take the annals transmitted under the name of Trithemius. Most of us, quite reasonably, have never
      heard of him, but he’s an important German humanist of the early sixteenth century.


      These annals repeat the omens associated with the year 1000—an earthquake, a comet, visions—and
      add that many people were frightened, fearing the arrival of the last day.


      That last part isn’t in Sigebert. Whether Trithemius himself added it is uncertain. But you can
      see how the assumption works: those poor people were living in the darkness of the Middle Ages.
      After seeing all those omens, of course they were frightened. How could they not be? And now that
      fear is there on the page.'
