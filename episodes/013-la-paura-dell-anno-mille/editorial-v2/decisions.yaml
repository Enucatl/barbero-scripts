  - id: ED-037
    kind: cut
    chapter_id: CH-001
    transcript: *id005
    current_text: 'Our subject this time is perhaps the least sensational of the three. When I started
      telling friends what I was planning to talk about, I''d say, “You know, the right of the first night,
      or the idea of a flat earth—it isn''t necessarily true that people in the Middle Ages…” And they
      looked quite surprised.


      The fears of the year 1000 are a little more out of fashion. Perhaps not everyone still believes
      in them. Even online, if you search for the fears or terrors of the year 1000, most of the sites
      you find talk about the *legend* of those fears. So perhaps I''m preaching to the converted. Still,
      I think it''s interesting to see how an image of the Middle Ages was put together, an image that
      turns out to be entirely legendary, entirely invented, and that learned people believed for a very
      long time. And did they ever believe it.'
    current_text_sha256: c5835c8d10ae4d0b19cf664fda88235ccfc1eb8c84ce0b919a871d491203d11d
    proposed_text: 'When I started telling friends what I was planning to talk about, I''d say, “You know,
      the right of the first night, or the idea of a flat earth—it isn''t necessarily true that people
      in the Middle Ages…” And they looked quite surprised.


      Today we''re looking at the terrors of the year 1000: the story of a world brought to a standstill
      because everyone thought it was about to end. How did that image of the Middle Ages take shape?
      And how did learned people come to believe an invented story for so long? Because they certainly
      believed it. And did they ever.'
    reason: Name and explain the subject immediately, then establish the puzzle of scholarly belief. Remove
      the least-sensational, unfashionable, internet, and preaching-to-the-converted apologies; preserve
      the friends anecdote and emphatic comic beat. This changes the opening emphasis under issue 2, not
