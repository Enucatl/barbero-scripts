    transcript:
    - U-00595–U-00606
    current_text: 'In that enlightened age, historians start appearing who *do* believe that people were
      terrified the world would end. Take Trithemius. Most of us, quite reasonably, have never heard of
      him, but he''s an important German humanist writing in the early sixteenth century.


      He too has read Sigebert of Gembloux. So he too writes in his chronicle that in the year 1000 there
      was an earthquake, a comet, visions—and that many people were frightened, fearing the arrival of
      the last day.


      He didn''t read that last part in Sigebert. But you can see how it works. He''s a humanist. It''s
      the Renaissance now. Those poor people back then were living in the darkness of the Middle Ages.
      After seeing all those prodigies, of course they were frightened. How could they not be? And Trithemius
      writes it down.'
    current_text_sha256: 75ebe5571cb667a37c5ac05e956218d0053a1244e0d0aeea2d19169c7531e344
    proposed_text: 'In that enlightened age, historians start appearing who do believe that people were
      terrified the world would end. Take the annals transmitted under the name of Trithemius. Most of
      us, quite reasonably, have never heard of him, but he’s an important German humanist of the early
      sixteenth century.


      These annals repeat the prodigies associated with the year 1000—an earthquake, a comet, visions—and
      add that many people were frightened, fearing the arrival of the last day.


      That last part isn’t in Sigebert. Whether Trithemius himself added it is uncertain. But you can
      see how the assumption works: those poor people were living in the darkness of the Middle Ages.
      After seeing all those prodigies, of course they were frightened. How could they not be? And now
      that fear is there on the page.'
    reason: Annales/Chronica distinction and possible interpolation prevent confident personal attribution.
      Preserve humanist frame and comic imagined assumption; state transmission uncertainty.
