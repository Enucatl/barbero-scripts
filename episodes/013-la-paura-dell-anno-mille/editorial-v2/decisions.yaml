    - U-00594–U-00606
    current_text: 'Then, at last, comes the Renaissance.


      <!-- Q-033; C-020 -->


      In that enlightened age, historians start appearing who *do* believe that people were terrified
      the world would end. Take Trithemius. Most of us, quite reasonably, have never heard of him, but
      he''s an important German humanist writing in the early sixteenth century.


      He too has read Sigebert of Gembloux. So he too writes in his chronicle that in the year 1000 there
      was an earthquake, a comet, visions—and that many people were frightened, fearing the arrival of
      the last day.


      He didn''t read that last part in Sigebert. But you can see how it works. He''s a humanist. It''s
      the Renaissance now. Those poor people back then were living in the darkness of the Middle Ages.
      After seeing all those omens, of course they were frightened. How could they not be? And Trithemius
      writes it down.'
