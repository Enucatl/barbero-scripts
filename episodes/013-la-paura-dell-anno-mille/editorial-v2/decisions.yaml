    current_text: 'And, as luck would have it, we have a papal bull dated December 31, 999. On that day,
      Pope Sylvester II confirms the privileges of a great German monastery, Fulda. The abbot has asked
      Rome to confirm various privileges, and the pope hands him this document, dated December 31, 999.
      In effect, he tells him:


      “I confirm all your monastery''s privileges, for you and your successors, on condition that every
      future abbot, once elected, comes to Rome to ask for confirmation of his election. What''s more,
      in exchange for these privileges, you monks of Fulda must make an annual payment of twelve denarii
      to Rome. Every year, from now on.”


      At least these two aren''t expecting the end of the world, apparently.'
    current_text_sha256: f483fecf4c52101c81d54cbf9bcab37f8118fe233bbd10ce5d340f3a574544b9
    proposed_text: 'And, as luck would have it, a papal privilege has come down to us dated December 31,
      999. Pope Sylvester II confirms the privileges of a great German monastery, Fulda, at its abbot’s
      request. In effect, he tells him:


      “I confirm your monastery’s privileges for you and your successors. And every future abbot must
      receive his consecration from Rome.”


      They’re making arrangements for the future, right on the threshold of the year 1000.'
