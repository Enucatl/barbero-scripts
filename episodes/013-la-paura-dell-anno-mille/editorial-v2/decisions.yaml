    transcript:
    - U-00489–U-00503
    current_text: 'She says she knows the date of the end of the world. And, as it happens, it''ll be
      next year. She claims to know this thing that nobody can know, the monk says, as though God had
      revealed it to her.


      <!-- Q-028 -->


      And the people—actually, the monk uses a revealing word: the “common people.” Because, in his view,
      only the poor fools at the bottom could believe such things. But there are plenty of them. Thiota
      goes around saying she knows the world will end next year, and many of these common people believe
      her. They come to her, bringing gifts, asking her to pray for them.


      <!-- Q-029 -->


      The bishop of Mainz gets a little annoyed. He summons her and questions her. And it emerges—or at
      least this is what she says—that a priest friend suggested the whole thing. You can put his advice
      like this: “Go around preaching that the world will end next year. Just see how many presents people
      bring us.”


      And that''s exactly what happens.


      <!-- Q-030 -->


      The bishop consults the other bishops. They decide she''s certainly not getting out of this without
      a good beating. They have her flogged in the public square. Then it''s, “Out of here. And don''t
      let us hear another word from you.”


      And that, you might say, puts an end to the millenarian movement in Mainz in 847.'
    current_text_sha256: 4e4f2fdec8c01a4b03a1197c49c2d99f318df5dcf2d1d9a97243c152e7b617e3
    proposed_text: 'She says she knows the date of the end of the world. And, as it happens, it’ll be
      that very year. She claims to know this thing that nobody can know, the monk says, as though God
      had revealed it to her.


      <!-- Q-028 -->


      And the people—the monk uses a revealing word, the “common people”—come to her frightened, bringing
      gifts and asking her to pray for them. But he has something even more shocking to report: some clerics
      follow her too, as though she were a teacher sent from heaven.


      <!-- Q-029 -->


      She is brought before the bishops and questioned. And it emerges—or at least this is the confession
      the annalist reports—that a priest suggested the whole thing, and she preached it for money. You
      can put the scheme like this: “Go around preaching that the world will end this year. Just see how
      many presents people bring us.”


      And the presents do arrive.


      <!-- Q-030 -->


      The bishops decide she’s certainly not getting out of this without a good beating. They have her
      publicly flogged and strip her of the right to preach. In effect: “That’s enough. We’re not hearing
      any more of this.”


      And that, according to the annalist, puts an end to Thiota’s preaching in 847.'
    reason: Same-year prophecy in all3references; clerics followed too. Keep common-people observation,
      gifts, comic scheme and coercive ending; confession remains reported, unspecifiedfriend/square/expulsion
      removed, institution response accurate.
