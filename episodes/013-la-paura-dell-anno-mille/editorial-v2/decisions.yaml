    transcript:
    - U-00566–U-00586
    current_text: 'Another seventy years go by. Around 1170, another chronicler, a Cistercian named Guillaume
      Godel, has also been reading the chroniclers of the year 1000 and the years that follow. He discovers
      that in 1010 there were visions, famine, eclipses. Quite enough to be going on with.


      Godel writes that all these prodigies happened in 1010, and that many people were afraid the world
      would end.


      That last part wasn''t in his sources. The people who lived through 1010 told him there had been
      an eclipse. But Guillaume Godel isn''t a fool. He knows what people think when they see an eclipse.
      So there we have the first writer to mention collective terror. Unfortunately for us, he puts it
      in 1010. Exasperating, but there it is.'
    current_text_sha256: a2e0bfcb9acb955760721e237e9b6457b522793b6e87d7b0993e244a069325eb
    proposed_text: 'Another seventy years go by. Around 1170, a chronicle traditionally attributed to
      Guillaume Godel takes things a step further. Its author has also been reading earlier accounts.
      Under 1010, the chronicle tells of alarming events and people fearing that the world will end.


      Now the fear itself has entered the story. We have to distinguish this later account from what people
      writing at the time actually said. The chronicler is writing more than a century and a half afterward.
      And, unfortunately for our familiar story, the entry is still under 1010. Exasperating, but there
      it is.'
    reason: Godel attribution insecure; full1010entry/sourcechain not collated and Roy links fear toJerusalem.
      Remove unsupported categorical source-invention mechanism within this example while preserving later-writing
      distance, emerging fear and1010payoff. This is a deliberate narrower account, not newly recovered
      Latin.
