  - id: ED-049
    kind: cut
    chapter_id: CH-010
    transcript: *id041
    current_text: 'Why is this interesting? Because I see a militant defense of Christian culture in Gouguenheim’s
      work. And the book that made him famous in France wasn’t the one about the terrors of the year 1000.


      <!-- C-026 -->


      It was a book published in 2008, called *Aristotle at Mont Saint-Michel*. You know Mont Saint-Michel,
      the famous abbey in Normandy, standing out in the sea, cut off from the mainland by the tide.


      <!-- Q-039 -->


      In that book, Gouguenheim makes a claim. And I say “claim” because the book caused furious arguments.
      Eminent scholars called it rubbish. Other eminent scholars said it was very interesting. I haven''t
      read the whole book yet, so I''m only telling you what I know about it in outline.


      Gouguenheim argues that, in the Middle Ages, Mont Saint-Michel was an important center for translating
      Aristotle directly from Greek into Latin.


      <!-- Q-040; C-027 -->


      I think you can already see the implications. But Gouguenheim spells them out in his book. Those
      pages I have seen. I went and looked at them. What he''s saying, as I''m summarizing it, is this:
      the story we''ve always been told, that we owe our access to Greek philosophy and science to the
      Arabs, isn''t true. We Christians translated them ourselves, directly from Greek. We had no need
      of the Arabs.


      And, to make things even clearer, at the end of the book his argument, as I''m putting it here,
      is that Arabic is completely unsuited to discussing scientific subjects, that the Arabs don''t have
      the mentality of a scientific people, and that it was therefore absurd to imagine we owed them anything.
      We owe nothing to medieval Islamic culture.


      You can see that this is just a tiny bit provocative. And it did indeed set off furious debates
      in France.


      <!-- Q-041; C-028 -->


      What strikes me is that the same scholar who writes *Aristotle at Mont Saint-Michel* had already
      written the earlier book to remind us, in effect: the terrors of the year 1000 never happened. The
      secularists have muddled our thinking again. There''s too much talk about medieval millenarianism.
      None of it is true.


      '
    current_text_sha256: 49d5ffe7a07c8dbcf732377d9a54d9b134bc0533deb92bf384e78e2f02eceac7
    proposed_text: 'Why does this interest me? Because I see a militant defense of Christian culture in
      Gouguenheim''s work.


      <!-- C-026 -->


      <!-- Q-039 -->


      <!-- Q-040; C-027 -->


      <!-- Q-041; C-028 -->


      '
