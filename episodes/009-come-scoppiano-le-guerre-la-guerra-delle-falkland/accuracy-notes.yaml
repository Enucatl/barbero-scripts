  claim_ids: [C-019]
  quotation_ids: [Q-014]
  source_ids: [SRC-007]
  category: factual-error
  original_assertion: Parliament voted in favor of sending the fleet.
  proposed_correction: In a recalled adjournment debate, the Commons gives the government’s decision to send the fleet nearly unanimous political backing, without holding a substantive authorization vote on the deployment.
  decision: retain-original
- id: N-007
  transcript: [U-00769–U-00784]
  claim_ids: [C-019]
  quotation_ids: []
  source_ids: [SRC-018]
  category: factual-error
  original_assertion: Polls showed 80 percent wanted the Falklands retaken and a majority immediately favored force.
  proposed_correction: Polls show strong opposition to transferring sovereignty to Argentina, while support for risking British service members’ lives starts below half in mid-April and rises above half as the campaign continues.
  decision: apply
- id: N-008
  transcript: [U-00892–U-00903]
  claim_ids: [C-022]
  quotation_ids: []
  source_ids: [SRC-014, SRC-015, SRC-016, SRC-022]
  category: factual-error
  original_assertion: The war killed 649 Argentines, 258 English people, and three Falkland civilians.
  proposed_correction: The war costs 649 Argentine lives and 255 British task-force lives, as well as the lives of three Falkland Island civilians.
  decision: apply
- id: N-009
  transcript: [U-00902–U-00915]
  claim_ids: [C-023]
  quotation_ids: []
  source_ids: [SRC-014, SRC-024]
  category: factual-error
  original_assertion: Galtieri resigned on 18 June, four days after the surrender, and the dictatorship then ended.
  proposed_correction: Galtieri resigns on June 17, three days after the surrender; another general takes over, but defeat accelerates the junta’s collapse and Argentina returns to elected civilian government in December 1983.
  decision: apply
