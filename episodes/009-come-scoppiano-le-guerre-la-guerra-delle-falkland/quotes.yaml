- id: Q-021
  barbero_utterances:
  - U-00940–U-00955
  barbero_timestamp: '60:04'
  attribution: Margaret Thatcher postwar speech
  quotation_kind: near-direct
  source_id: SRC-010
  original_language: en
  original_text: What really thrilled me, having spent so much of my lifetime in Parliament, and talking about things like
    inflation, Social Security benefits, housing problems, environmental problems and so on, is that when it really came to
    the test, what’s thrilled people wasn’t those things, what thrilled people was once again being able to serve a great
    cause, the cause of liberty.
  translation: What really thrilled me, having spent so much of my lifetime in Parliament, and talking about things like inflation,
    Social Security benefits, housing problems, environmental problems and so on, is that when it really came to the test,
    what’s thrilled people wasn’t those things, what thrilled people was once again being able to serve a great cause, the
    cause of liberty.
  locator: Scottish Conservative Party Conference, City Hall, Perth, 14 May 1982; unscripted remarks after Thatcher returned
    to the rostrum
  translation_notes: Exact transcript sentence. This was spoken during the war, not after victory; Argentine forces surrendered
    one month later.
  confidence: high
  status: resolved
  verdict: confirmed-in-substance
  source_replacement: eligible
  human_reviewed: true
  research_note: Barbero accurately conveys the sentence but misplaces it after the war. The primary transcript dates it 14
