- id: N-012
  transcript: [U-00478–U-00509]
  claim_ids: [C-019]
  quotation_ids: [Q-002]
  source_ids: [SRC-002, SRC-043, SRC-044, SRC-065]
  category: factual-error
  original_assertion: "In 1846 Senator Toombs of Georgia threatened secession if slaveholders were driven from Texas and New Mexico; the resulting compromise left New Mexico without slaves."
  proposed_correction: "During the Mexican-American War, the Wilmot Proviso of 1846 raised whether slavery would be excluded from territory acquired from Mexico. In December 1849 Representative Robert Toombs of Georgia declared: “I do not, then, hesitate to avow before this House and the country, and in the presence of the living God, that if by your legislation you seek to drive us from the territories of California and New Mexico, purchased by the common blood and treasure of the whole people, and to abolish slavery in this District, thereby attempting to fix a national degradation upon half the States of this Confederacy, I am for disunion; and if my physical courage be equal to the maintenance of my convictions of right and duty, I will devote all I am and all I have on earth to its consummation.” The Compromise of 1850 admitted California free and organized Utah and New Mexico without a statutory prohibition of slavery."
  decision: apply
