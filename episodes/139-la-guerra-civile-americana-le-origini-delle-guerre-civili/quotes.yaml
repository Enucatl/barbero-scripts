  source_id: SRC-015
  original_language: en
  original_text: 'I have no purpose, directly or indirectly, to interfere with the institution of slavery in the States where it exists. I believe I have no lawful right to do so, and I have no inclination to do so. [...] I hold, that in contemplation of universal law, and of the Constitution, the Union of these States is perpetual. [...] no State, upon its own mere motion, can lawfully get out of the Union. [...] I therefore consider that, in view of the Constitution and the laws, the Union is unbroken; and, to the extent of my ability, I shall take care [...] that the laws of the Union be faithfully executed in all the States. [...] Plainly, the central idea of secession, is the essence of anarchy. A majority, held in restraint by constitutional checks, and limitations [...] is the only true sovereign of a free people. Whoever rejects it, does, of necessity, fly to anarchy or to despotism.'
