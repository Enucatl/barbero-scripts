  original_language: en
  original_text: 'If all earthly power were given me, I should not know what to do, as to the existing institution. My first impulse would be to free all the slaves, and send them to Liberia,---to their own native land. But a moment’s reflection would convince me, that whatever of high hope, as I think there is, there may be in this, in the long run, its sudden execution is impossible. [...] What next? Free them, and make them politically and socially, our equals? My own feelings will not admit of this; and if mine would, we well know that those of the great mass of white people will not.'
