  original_text: "Ne vedessimo poi molti altri à quattro, à sei, od otto per volta incatenati, chi per il collo, chi per le mani, chi per i piedi, medicina salutare, che senza questa fuggirebbono tutti d'accordo."
  translation: "We then saw many others, four, six, or eight at a time, chained—some by the neck, some by the hands, some by the feet—a salutary medicine, for without it they would all flee together."
