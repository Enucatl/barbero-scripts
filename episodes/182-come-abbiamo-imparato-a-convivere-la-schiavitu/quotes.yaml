- id: Q-002
  barbero_utterances: [U-00187–U-00261]
  barbero_timestamp: "12:06"
  attribution: Cassius Longinus, as reported by Tacitus
  quotation_kind: near-direct
  source_id: SRC-001
  original_language: la
  original_text: "habes enim servos totidem, totidem inimicos ... omne magnum exemplum habet aliquid ex iniquo, quod contra singulos utilitate publica rependitur"
  translation: "For you have as many enemies as you have slaves ... Every great exemplary punishment contains an element of injustice toward individuals, which is compensated by the public advantage."
  locator: Tacitus, Annals 14.43–44
  translation_notes: These are two recoverable components of a much longer speech presented by Tacitus in indirect discourse. Barbero turns the full ancient narrative into modern direct speech; it is not a verbatim senatorial transcript.
  confidence: high
  status: resolved
  verdict: composite
  source_replacement: not-applicable
  research_note: Evidence tier 1 as literary historiography, not an official protocol. The core deterrence and exemplary-injustice arguments are confirmed; exact words cannot securely be assigned to Cassius Longinus beyond Tacitus's composition.
