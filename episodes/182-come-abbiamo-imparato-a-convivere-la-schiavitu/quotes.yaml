- id: Q-006
  barbero_utterances: [U-00454–U-00473]
  barbero_timestamp: "29:35"
  attribution: Dionigi Carli
  quotation_kind: near-direct
  source_id: SRC-002
  original_language: it
  original_text: "avevano posto il suo santissimo nome ad un pezzo di corda, che adoperavano per dar alli Mori ... se chiamate con l'istesso nome la sferza, con che gli flagellate, crederanno più tosto, che noi gli burliamo"
  translation: "They had given her most holy name to a piece of rope used to strike the Africans ... if you call the lash with which you flog them by the same name, they will sooner believe that we are mocking them."
  locator: Viaggio nel regno del Congo (Bologna, 1679), pp. 186–188
  translation_notes: Direct translation with modernized spelling. The same passage records a discussion of eating human flesh during the food crisis; Carli answers that God forbid a person be killed so another might live. Barbero reasonably interprets the threatened victims as the enslaved captives, but Carli's printed wording is less explicit.
  confidence: high
  status: resolved
  verdict: composite
  source_replacement: not-applicable
  research_note: Evidence tier 1. The whip-name passage is exact; the killing proposal is a contextual reconstruction from Carli's response, so the combined target is not eligible for exact replacement.
- id: Q-007
  barbero_utterances: [U-00537–U-00544]
  barbero_timestamp: "35:45"
  attribution: Chief Justice John Holt, Smith v Brown and Cooper
  quotation_kind: direct
  source_id: SRC-007
  original_language: en
  original_text: "As soon as a negro comes into England, he becomes free; one may be a villein in England, but not a slave."
  translation: "As soon as a negro comes into England, he becomes free; one may be a villein in England, but not a slave."
  locator: Smith v Brown and Cooper, 2 Salk. 666, 91 ER 566; attributed to Holt in reports of the 1701–1706 litigation
  translation_notes: Barbero closely follows the reported maxim but expands it with protection of person and property. Early reports were inconsistent, and this was not a general abolition statute.
  confidence: medium
  status: resolved
  verdict: confirmed-in-substance
  source_replacement: eligible
  research_note: Evidence tier 2 because the wording survives through law reports and later legal discussion, not a verbatim courtroom transcript. The maxim predates Somerset and should not be conflated with Mansfield's narrower 1772 holding.
