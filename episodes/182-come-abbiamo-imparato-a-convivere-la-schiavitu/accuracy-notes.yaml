- id: N-007
  transcript: [U-00921–U-00927]
  claim_ids: [C-012]
  quotation_ids: []
  source_ids: [SRC-004]
  category: misleading-compression
  original_assertion: A recently approved controversial law allowed enslavers to recover fugitives in free states throughout Harriet Jacobs's time in New York.
  proposed_correction: The Fugitive Slave Act of 1850, recently passed with the involvement of the South, created a federal enforcement system for the recapture of enslaved people in free states.
  decision: apply
  decision_note: The lecture compresses the 1793 and 1850 federal regimes.
- id: N-008
  transcript: [U-00961–U-00966]
  claim_ids: [C-013]
  quotation_ids: []
  source_ids: [SRC-011]
  category: material-uncertainty
  original_assertion: Today everyone takes it for granted that slavery is unacceptable.
  proposed_correction: Today slavery is universally prohibited in international law, even though forced labor, trafficking, and comparable forms of exploitation persist.
  decision: retain-original
  decision_note: The original is defensible as a statement about prevailing norms but overstates actual eradication and unanimity.
