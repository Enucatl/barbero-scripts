  translation: >-
    The queen, who had recently recovered from giving birth to Lady Blanche at Jaffa, arrived
    at Sidon by sea. When I heard she had arrived, I rose from before the king, went to meet
    her, and brought her to the castle. When I returned to the king, who was in his chapel, he
    asked whether the queen and the children were well, and I said they were. He said to me:
    “I know well that when you rose from before me, you went to meet the queen; that is why I
    had the sermon held for you.” I remind you of these things because I had already been around
    him for five years, yet I had never heard him speak of the queen or his children, either to
    me or to anyone else; and it was not good conduct, as it seems to me, to be aloof from one's
    wife and children.
