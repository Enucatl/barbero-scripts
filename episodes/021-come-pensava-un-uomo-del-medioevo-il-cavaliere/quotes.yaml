  attribution: "Louis IX to Jean de Joinville"
  source_id: SRC-002
  original_language: fro
  original_text: "Et lors me dist que il nous avoit appelez pour li confesser à moy de ce que à tort avoit deffendu maistre Robert encontre moy. « Mais, fist-il, je le vi si esbahi que il avoit bien mestier que je li aidasse. Et toutes voiz ne vous tenez pas à chose que je en deisse pour maistre Robert deffendre; car, aussi comme li seneschaus dist, vous vous devez bien vestir et nettement, pour ce que vos femmes vous en ameront miex, et vostre gent vous en priseront plus. Car, ce dit li saiges, on se doit assemer en robes et en armes en tel manière que li preudome de cest siècle ne dient que on en face trop, ne les joenes gens de cest siècle ne dient que on en face pou. »"
  translation: "Then he told me that he had called us so that he could confess to me that he had wrongly defended Master Robert against me. 'But,' he said, 'I saw him so bewildered that he badly needed my help. Still, do not attach importance to anything I said in Master Robert's defense, for, as the seneschal says, you ought to dress well and neatly, so that your wives will love you the more and your people will esteem you more. For, as the wise man says, one should adorn oneself in clothing and arms in such a way that the worthy men of this world do not say one does too much, nor the young people of this world say one does too little.'"
  locator: "section 38, chapter VI, pp. 15–16; private audience arranged at section 37, p. 15"
  translation_notes: "Direct translation from Natalis de Wailly's Old French edition. Louis does acknowledge that he defended Robert wrongly and says he intervened because Robert looked so bewildered that he needed help. Joinville presents this as Louis 'confessing' the wrong to him, not as the exact apology 'I must apologize,' though that is a fair modern description. The meeting is discreet but not literally one-to-one: Louis calls his son Philip and King Thibaut as well as Joinville, seats them very close at the door of his oratory so that others cannot hear, and then makes the admission. Most importantly, Barbero adds a class doctrine not spoken by Louis. Louis does not say that nobles should wear fur because their fathers and grandfathers did, nor that a newly rich commoner must not dress at their level. He endorses Joinville's right to dress well and neatly, saying wives will love such men more and their people will esteem them more, then recommends a mean in clothing and arms: not so much that worthy or sober men criticize the excess, and not so little that young people find it inadequate. The inherited-parental dress and Robert's low birth belong to Joinville's earlier retort, not to Louis's concluding rule."
