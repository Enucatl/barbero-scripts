    duel, et me pria que j'alasse vers li pour la reconforter. Et quant ge ving là, je trovai que
    elle plouroit, et je li dis que voir dit cil qui dit que l'on ne doit femme croire : « Car ce
    estoit la femme que vous plus haies qui est morte, et vous en menez tel duel! » Et elle me
    dist que ce n'estoit pas pour li que elle ploroit, mais pour la mesaise que li roys avoit dou
    duel que il menoit, et pour sa fille (qui puis fu royne de Navarre), qui estoit demeurée en la
    garde des homes.
  translation: >-
    At Sidon news came to the king that his mother had died. He grieved so deeply that for two
    days no one was able to speak to him. After that, he sent one of his chamber servants to fetch
    me. When I came before him in his chamber, where he was all alone, he saw me, stretched out his
    arms, and said: “Ah, Seneschal, I have lost my mother!” [...] My lady Marie of Vertus, a very
    good and holy woman, came to tell me that the queen was grieving deeply, and asked me to go to
    comfort her. When I arrived, I found her weeping, and I told her that whoever says one should
    not believe a woman speaks truly: “For the woman you hated most is dead, and yet you are
    grieving like this!” She told me that she was not weeping for Blanche, but because of the
    distress the king was suffering in his grief, and for her daughter—who later became queen of
    Navarre—who had been left in the custody of men.
  locator: "sections 603–605, chapter CXIX, pp. 254–255"
  translation_notes: >-
    Direct translation from Natalis de Wailly's Old French edition. Louis's exclamation and
    Margaret's explanation are explicit reported speech, while Joinville narrates the surrounding
    behavior. Joinville says no one could speak to Louis for two days; he does not say that he had
    never seen Louis so distressed. Louis summoned Joinville to his private chamber and reached
    out his arms rather than going out to meet him. Margaret says plainly that she is not crying
    for Blanche, whom Joinville calls the woman she hated most, but she gives two reasons for her
    tears: Louis's suffering and concern for her daughter Isabelle, later queen of Navarre, who had
    been left in men's custody. She does not say that she fears something will happen to Louis, that
    Blanche's death means nothing to her, or “good riddance.” Joinville places the receipt of the
    news at Sidon, but the earlier account by Louis's confessor Geoffrey of Beaulieu places it at
    Jaffa; de Wailly therefore flags Joinville's location as a chronological error. Blanche died in
    late November 1252 while Louis was on crusade in the Holy Land.
  confidence: high
