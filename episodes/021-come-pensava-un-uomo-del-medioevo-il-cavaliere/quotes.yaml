  status: resolved
  script_treatment: qualify
  research_note: "Confirmed in Joinville section 38, but composite in Barbero's telling. Evidence tier 1 for the transmitted first-person Old French account. Preserve Louis's admission that he defended Robert wrongly out of compassion for his embarrassment and his practical endorsement of dignified dress; remove the purported royal statement about inherited noble fur and parvenus, which transfers Joinville's preceding class insult into Louis's mouth and exaggerates the king's actual balanced rule."
- id: Q-022
  barbero_utterances: [U-00514–U-00531]
