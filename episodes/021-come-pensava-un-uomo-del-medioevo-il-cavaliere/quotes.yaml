  barbero_utterances: [U-00589–U-00598]
  barbero_timestamp: "46:08"
  attribution: "Jean de Joinville and six unnamed knights at the burial of Hugh of Landricourt"
  source_id: SRC-002
  original_language: fro
  original_text: "La vegile de quaresme-pernant, vi une merveille que je vous vueil raconter; car ce jour meismes, fu mis en terre mes sires Hues de Landricourt, qui estoit avec moy à baniere. Là où il estoit en bière en ma chapelle, six de mes chevaliers estoient apuié sus plusours saz pleins d'orge; et pour ce que il parloient haut en ma chapelle et que il faisoient noise au prestre, je lour alai dire que il se teussent, et lour dis que vilaine chose estoit de chevaliers et de gentiz homes qui parloient tandis que l'on chantoit la messe. Et il me commencierent à rire, et me distrent en riant que il li remarioient sa femme. Et je les enchoisonnai et lour dis que tiex paroles n'estoient ne bones ne bêles, et que tost avoient oublié lour compaingnon. Et Diex en fist tel vengance que l'endemain fu la grans bataille dou quaresme-prenant, dont il furent mort ou navrei à mort; par quoy il couvint leur femmes remarier toutes six."
  translation: "On the eve of Shrove Tuesday I saw a marvel that I wish to recount to you, for that same day Sir Hugh of Landricourt, who served under my banner, was buried. While he lay on his bier in my chapel, six of my knights were leaning on several sacks full of barley. Because they were talking loudly in my chapel and making noise that disturbed the priest, I went to tell them to be quiet, and told them it was a disgraceful thing for knights and gentlemen to talk while Mass was being sung. They began to laugh at me and told me, laughing, that they were arranging the remarriage of his wife. I reproached them and told them that such words were neither good nor proper, and that they had quickly forgotten their companion. God took such vengeance on them that the next day was the great battle of Shrove Tuesday, in which they were killed or mortally wounded; consequently all six of their wives had to remarry."
  locator: "sections 297–298, chapter LIX, pp. 124–125"
  translation_notes: "Direct translation from Natalis de Wailly's Old French edition. Joinville identifies the deceased as Hugh of Landricourt, a knight serving under his banner, and says Hugh was buried that day. He does not state here that Hugh had just been killed in combat. Hugh lies on a bier in Joinville's chapel while Mass is sung; the six knights are leaning on sacks of barley, talking loudly, and disturbing the priest. Joinville therefore first rebukes their irreverence during Mass. The knights then laugh and say 'il li remarioient sa femme,' most safely understood as arranging or discussing the remarriage of Hugh's wife. The text does not explicitly say they are competing over which of them will marry her, despite that colorful expansion in some later retellings. Joinville says their words are neither good nor proper and that they have forgotten their companion too quickly; he does not use Barbero's invented 'still warm' line. The punishment is more immediate than Barbero reports: all six are killed or mortally wounded in the great battle the next day, Shrove Tuesday, and Joinville explicitly interprets this as God's vengeance, after which all six of their own wives have to remarry. Barbero's statement that they die sometime before the crusade ends weakens and misdates the source's pointed symmetry."
