  research_note: "Confirmed in substance from Joinville sections 162–163, but Barbero's image is composite. Evidence tier 1 for Joinville's transmitted participant account; modern scholarship independently identifies the landing passage and notes Joinville's chronological fallibility. Preserve Louis wading ashore in water up to his armpits, fully armed and eager to charge, but remove the horse and 'Where are the Turks?' dialogue. Either omit the gilded helmet or explicitly relocate it to Joinville's later Mansurah portrait in section 228."
