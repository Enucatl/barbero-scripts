    mangoie, je et mi chevalier, à la clartei de l'uis. Or estoit l'uis devers le conte d'Eu ; et
    il qui moût estoit soutils, fist une petite bible qui getoit ens; et fesoit espier quant nous
    estiens assis au mangier; et dressoit sa bible dou lonc de nostre table, et la faisoit geter,
    et nous brisoit nos pos et nos voirres. Je m'estoie garniz de gelines et de chapons; et je ne
    sai qui li avoit donnei une joene ourse, laquel il lessoit aler à mes gelines; et en avoit plus
    tost tuei une douzainne que l'on ne venist illec; et la femme qui les gardoit batoit l'ourse
    de sa quenoille.
  translation: >-
    I will tell you about the games the count of Eu used to play on us. I had built a room where
    my knights and I ate by the light from the doorway. The doorway faced the count of Eu's
    quarters; and he, being very ingenious, made a small ballista that shot into the room. He had
    someone watch for when we were seated at our meal, then set his ballista lengthwise toward our
    table and had it fired, breaking our pots and glasses. I had stocked up on hens and capons, and
    I do not know who had given him a young bear, which he let loose among my hens; it had killed
    a dozen before anyone could get there, while the woman who looked after them beat the bear
    with her distaff.
  locator: "section 583, chapter CXIII, pp. 245–246"
  translation_notes: >-
    Direct translation from Natalis de Wailly's Old French edition. The “petite bible” is a small
    ballista or projectile engine, reasonably rendered as a miniature catapult for a general
    audience. Joinville does not identify its ammunition, so Barbero's stones are an unsupported
    detail. He says it broke “pos” (pots or drinking vessels) and “voirres” (glasses), not crystal
    goblets specifically. The meal was inside a purpose-built room lit through its doorway, whose
    opening faced the count's quarters—not outdoors at neighboring tables in front of tents. No
    white tablecloth appears in this anecdote. Joinville calls the count “very ingenious” and
    introduces the episode as games played on them, but does not explicitly call him delightful or
    narrate the prank “in ecstasy.” The immediately following young-bear prank confirms the comic,
    mischievous tone. De Wailly's note identifies the count as Jean, son of Alphonse, but later
    prosopographical work by Jacques Monfrin corrects him to Alphonse of Brienne (Alphonse of Acre),
    husband of Marie, countess of Eu, who joined Louis's force as a squire and was knighted there.
  confidence: high
  status: resolved
  script_treatment: qualify
  research_note: >-
    Confirmed in Joinville section 583. Evidence tier 1 for Joinville's participant recollection;
    SRC-005 resolves the count's identity against de Wailly's obsolete note. Preserve the ingenious
    miniature engine, deliberate timing, broken pots and glasses, and playful tone, optionally also
    the bear sequel; omit the stones, outdoor tent tables, white cloth, crystal, and exaggerated
    claim about Joinville's emotional delivery.
