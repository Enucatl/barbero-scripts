- id: Q-001
  barbero_utterances: [U-00023–U-00025]
  barbero_timestamp: "02:28"
  attribution: "Medieval chivalric ideal; closely paralleled by Ramon Llull"
  source_id: SRC-001
  original_language: ca
  original_text: "D'on, enaxí con totes aquestas usanses demunt dites pertanyen a cavayler quant al cors, enaxí justícia, saviesa, caritat, leyaltat, veritat, humilitat, fortitudo, sperança e spertesa, e les altres virtuts semblants a aquestas, pertanyen a cavayler quant a la ànima. [...] Offici de cavaller és mantenir vídues, òrfens, hòmens despoderats."
  translation: "Thus, just as all the practices mentioned above pertain to the knight in body, so justice, wisdom, charity, loyalty, truth, humility, fortitude, hope, skill, and the other similar virtues pertain to the knight in soul. [...] A knight's duty is to sustain widows, orphans, and powerless men."
  locator: "part II, sections 11 and 19; Soler edition, the first passage at p. 177, lines 95–105"
  translation_notes: "Direct translation from Llull's medieval Catalan. The ellipsis separates two passages. Barbero does not name Llull and is not quoting him verbatim: he summarizes a broad clerically shaped chivalric commonplace and loosely calls its vehicles 'romances.' Llull's didactic treatise, written c. 1274–1276 and close to Joinville's world, independently supplies both components—humility and protection of widows and orphans—but cannot be established as Barbero's specific source."
  confidence: high
  status: resolved
  script_treatment: paraphrase
  research_note: "Confirmed in substance as a medieval chivalric prescription, not as a recoverable quotation from one romance. Evidence tier 1 for Llull's wording (critical Catalan edition); the link between this particular work and Barbero's formulation remains inferential. Script should present the ideal as a commonplace and may use Llull as a representative witness, not attribute Barbero's sentence directly to him."
- id: Q-002
  barbero_utterances: [U-00072–U-00096]
  barbero_timestamp: "06:15"
  attribution: "Jean de Joinville"
  source_id: SRC-002
  original_language: fro
  original_text: "A une ylle venimes que on appelle la Lempiouse, là où nous preimes tout plein de connins; et trouvâmes un hermitaige ancien dedans les roches, et trouvâmes le courtil que li hermite qui y demeurèrent anciennement avoient fait: oliviers, figuiers, seps de vingne et autres arbres y avoit. Li rus de la fonteinne couroit parmi le courtil. Li roys et nous alames jusques au chief dou courtil, et trouvâmes un oratour, en la première voûte, blanchi de chaus, et une croiz vermeille de terre. En la seconde voûte entrâmes, et trouvâmes dous cors de gens mors, dont la chars estoit toute pourrie; les costes se tenoient encore toutes ensemble, et li os des mains estoient sur lour piz; et estoient couché contre orient, en la manière que l'on met les cors en terre. Au requeillir que nous feismes en notre nef, il nous failli un de nos mariniers; dont li maistres de la nef cuida que il fust là demourez pour estre hermite; et pour ce, Nicholas de Soisi, qui estoit maistres serjans le roy, lessa trois saz de becuiz sur la rive, pour ce que cil les trouvast et en vequist."
  translation: "We came to an island called Lampedusa, where we caught a great many rabbits. We found an ancient hermitage among the rocks and the garden made by the hermits who had once lived there: it contained olive trees, fig trees, grapevines, and other trees. A stream from the spring ran through the garden. The king and the rest of us went to the far end of the garden and found an oratory in the first vault, whitewashed with lime, with a red earthen cross. We entered the second vault and found the bodies of two dead people whose flesh had entirely decayed; their ribs still held together, the bones of their hands lay upon their chests, and they lay facing east, in the manner in which bodies are buried. When we reassembled aboard our ship, one of our sailors was missing. The shipmaster supposed that he had remained there to become a hermit; and so Nicholas of Soissons, the king's master sergeant, left three sacks of ship's biscuit on the shore, so that the man might find them and live on them."
  locator: "sections 638–639, chapter CXXVI, pp. 268–269"
  translation_notes: "Direct translation from the Old French text in Natalis de Wailly's edition; names and punctuation are normalized in English. Barbero follows the episode closely but makes several small narrative inferences: Joinville calls the remains two dead people, not explicitly the two former hermits; the shipmaster only supposed that the missing sailor had stayed to become a hermit; and Nicholas of Soissons, rather than an unnamed collective, left exactly three sacks (not crates) of biscuit. The bodies still had decayed flesh and articulated ribs, so 'two skeletons' is a simplification."
  confidence: high
  status: resolved
  script_treatment: qualify
  research_note: "Confirmed in Joinville's eyewitness memoir. Evidence tier 1: accessible Old French scholarly edition, with the same section numbering used by the modern Monfrin critical edition. The work was completed around 1309; its principal early witness, BnF fr. 13568, was produced c. 1330–1340. Preserve the scene while retaining Joinville's reported uncertainty about both the bodies' identity and the missing sailor's intention."
- id: Q-003
  barbero_utterances: [U-00102–U-00117]
  barbero_timestamp: "08:31"
  attribution: "Jean de Joinville, reporting the squire of Dragonet of Montauban"
  source_id: SRC-002
  original_language: fro
  original_text: "Une des galies le roy le queilli et l'aporta en nostre nef, là où il nous conta comment ce li estoit avenu. Je li demandai comment ce estoit que il ne metoit conseil en li garantir, ne par noer ne par autre manière. Il me respondi que il n'estoit nul mestier ne besoing que il meist conseil en li; car si tost comme il commença à cheoir, il se commenda à Nostre Dame de Vauvert, et elle le soustint par les espaules dès que il chei, jusques à tant que la galie le roy le requeilli. En l'onour de ce miracle, je l'ai fait peindre à Joinville en ma chapelle, et es verrières de Blehecourt."
  translation: "One of the king's galleys picked him up and brought him to our ship, where he told us how it had happened. I asked him why he had made no effort to save himself, either by swimming or in any other way. He answered that there was no need for him to make any effort, because, as soon as he began to fall, he commended himself to Our Lady of Vauvert, and she supported him by the shoulders from the moment he fell until the king's galley picked him up. In honor of this miracle, I had it painted in my chapel at Joinville and in the windows at Blécourt."
  locator: "sections 650–651, chapter CXXIX, pp. 273–274"
  translation_notes: "Direct translation from the Old French text in Natalis de Wailly's edition. Barbero preserves the episode's point but alters details: the man was a squire belonging to Dragonet of Montauban, not a sailor; he fell while trying to cover an opening in a ship about a league ahead; a royal galley recovered him and brought him to the king's ship. Joinville saw the motionless figure from a distance and questioned him after the rescue, but does not claim to have seen the fall. Most importantly, the squire says he commended himself to Our Lady of Vauvert and that she supported his shoulders; he does not say that the Virgin visibly appeared. Joinville says he commissioned representations at both sites, not that either artwork survived."
  confidence: high
  status: resolved
  script_treatment: qualify
  research_note: "Confirmed in Joinville's account and corroborated by modern scholarship citing section 651. Evidence tier 1 for the Old French text and Joinville's statement that he commissioned the images. Preserve Joinville's miracle claim as reported belief, correct the rescued man's status to squire, and do not add a visible apparition absent from the source."
- id: Q-004
  barbero_utterances: [U-00120–U-00145]
  barbero_timestamp: "10:19"
  attribution: "Louis IX, as reported by Jean de Joinville, recounting an anecdote set at Cluny"
  source_id: SRC-002
  original_language: fro
  original_text: "Il me conta que il ot une grant desputaison de clers et de Juis ou moustier de Clygni. Là ot un chevalier à qui li abbes avoit donnei le pain leens pour Dieu; et requist à l'abbei que il li lessast dire la première parole, et on li otria à peinne. Et lors il se leva et s'apuia sur sa croce, et dist que l'on li feist venir le plus grant clerc et le plus grant maistre des Juis; et si firent-il. Et li fist une demande qui fu teix: «Maistre, fist li chevaliers, je vous demant se vous créez que la Vierge Marie, qui Dieu porta en ses flans et en ses bras, enfantast vierge, et que elle soit mère de Dieu.» Et li Juis respondi que de tout ce ne creoit-il riens. Et li chevaliers li respondi que moût avoit fait que fous, quant il ne la creoit ne ne l'amoit, et estoit entrez en son moustier et en sa maison. «Et vraiement, fist li chevaliers, vous le comparrez.» Et lors il hauça sa potence, et feri le Juif lès l'oye, et le porta par terre. Et li Juif tournèrent en fuie, et emportèrent lour maistre tout blecié: et ainsi demeura la desputaisons."
  translation: "He told me that there was a great disputation between clerics and Jews at the monastery of Cluny. There was a knight there to whom the abbot had given bread in the house for God's sake. He asked the abbot to let him speak first, and permission was granted only reluctantly. Then he rose, leaned on his staff, and asked them to bring him the greatest scholar and foremost master among the Jews, which they did. He asked him this question: 'Master,' said the knight, 'I ask whether you believe that the Virgin Mary, who bore God in her womb and in her arms, gave birth as a virgin and is the mother of God.' The Jew replied that he believed none of it. The knight answered that he had acted like a great fool by entering her monastery and her house when he neither believed in her nor loved her. 'And truly,' said the knight, 'you will pay for it.' Then he raised his crutch, struck the Jew beside the ear, and knocked him to the ground. The Jews fled and carried away their master badly wounded; and that was the end of the disputation."
  locator: "sections 51–53, chapter X, pp. 22–23; quoted episode principally sections 51–52"
  translation_notes: "Direct translation from the Old French in Natalis de Wailly's edition. The opening pronoun refers to Louis IX: the king told Joinville a story about a disputation at Cluny. Joinville does not say that he himself had recently heard it while visiting Cluny, nor does he identify a witness, date, Jewish scholar, or cleric. The knight is maintained charitably by the abbey and leans on a staff or crutch, but the Old French does not explicitly call him old. His reply is not the mild 'you are doing very wrong': he calls the Jewish scholar a fool for entering Mary's house and says 'you will pay for it' before striking him beside the ear and knocking him down. The abbot then calls the act foolish; the knight answers that convening the disputation was the greater folly."
  confidence: high
  status: resolved
  script_treatment: qualify
  research_note: "Confirmed as an anecdote in Joinville's text, but only as a story Louis IX told Joinville, not an independently documented Cluny event or Joinville eyewitness account. Evidence tier 1 for Joinville's wording and transmission; evidence tier 3 for the underlying event. Preserve the double-reported framing and the violence without presenting the scene as a documented public disputation."
- id: Q-005
  barbero_utterances: [U-00145–U-00148]
  barbero_timestamp: "12:34"
  attribution: "Louis IX, as reported by Jean de Joinville"
  source_id: SRC-002
  original_language: fro
  original_text: "«Aussi vous di-je, fist li roys, que nulz, se il n'est très-bons clers, ne doit desputer à aus; mais li hom lays, quant il ot mesdire de la loy crestienne, ne doit pas desfendre la loy crestienne, ne mais de l'espée, de quoy il doit donner parmi le ventre dedens, tant comme elle y puet entrer.»"
  translation: "'And so I tell you,' said the king, 'that no one should dispute with them unless he is a very learned cleric. But when a layman hears the Christian faith spoken ill of, he should defend the Christian faith only with his sword, which he should drive into the offender's belly as far as it can go.'"
  locator: "section 53, chapter X, p. 23"
  translation_notes: "Direct translation from the Old French in Natalis de Wailly's edition. 'Aus' ('them') refers specifically to the Jews in Louis's Cluny anecdote, rather than generically to all unbelievers. Louis is already the teller of the anecdote; Joinville does not describe a later discussion in which the two men explicitly agree that the knight acted well. Barbero accurately gives the distinction between learned clerics and laypeople, but supplies an explanatory rationale about Christians being confused that the preceding knight, not Louis, states in the source. Barbero also greatly softens the violent conclusion: Louis does not merely say that laypeople should draw their swords, but that they should drive one into the belly as far as it will go."
  confidence: high
  status: resolved
  script_treatment: preserve
  research_note: "Confirmed as Louis IX's direct speech in Joinville's memoir, immediately after the Cluny anecdote. Evidence tier 1 for Joinville's transmitted wording; it remains a recollected saying written down decades after Louis's death, not a contemporary royal act or stenographic record. Preserve the reported-speech frame and do not sanitize the sentence, since the precise violence is material to Barbero's argument."
- id: Q-006
  barbero_utterances: [U-00158–U-00192]
  barbero_timestamp: "13:51"
  attribution: "Jean de Joinville, an unnamed emir, and the papal legate"
  source_id: SRC-002
  original_language: fro
  original_text: "Tandis que nous mangiens, il fist venir un bourgois de Paris devant nous. Quant li bourgois fu venus, il me dist: «Sire, que faites-vous? — Que faiz-je donc?» feiz-je. — «En non Dieu, fist-il, vous mangiez char au vendredi!» Quant j'oï ce, je boutai m'escuele arieres. Et il demanda à mon Sarrazin pourquoy je avoie ce faist, et il li dist; et li amiraus li respondi que jà Diex ne m'en sauroit mal grei, puisque je ne l'avoie fait à escient. Et sachiez que cette response me fist li legas, quant nous fumes hors de prison; et pour ce ne lessai-je pas que je ne jeûnasse touz les vendredis de quaresme après, en pain et en yaue: dont li legas se courrouça moût forment à moy, pour ce que il n'avoit demourei avec le roy de riches homes que moy."
  translation: "While we were eating, he had a citizen of Paris brought before us. When the citizen arrived, he said to me, 'My lord, what are you doing?' 'Why, what am I doing?' I said. 'In God's name,' he said, 'you are eating meat on a Friday!' When I heard this, I pushed my bowl away. The admiral asked my Saracen why I had done that, and he told him; the admiral replied that God would not hold it against me, since I had not done it knowingly. And you should know that the legate gave me the same answer once we were out of prison. Yet that did not stop me from fasting afterward on bread and water every Friday in Lent. The legate became very angry with me about this, because I was the only great lord who had remained with the king."
  locator: "sections 326–328, chapter LXV, pp. 135–136; quoted exchange principally sections 327–328"
  translation_notes: "Direct translation from the Old French in Natalis de Wailly's edition. The Muslim official is the 'great admiral of the galleys,' who had summoned Joinville and asked about his supposed kinship to Frederick II; the source does not stage a freely offered luncheon invitation or extended cheerful genealogical conversation. A Parisian bourgeois notices the violation. Communication with the admiral passes through the helper Joinville calls 'my Saracen.' Both the admiral and, later, the papal legate say only that God will not hold an unknowing act against him. Joinville does not say he disbelieved them or explicitly describe purification. His voluntary penance is every Friday in Lent thereafter, not every Friday without qualification, and the legate angrily objects because Joinville is the only great lord remaining with the king, implying concern for his fitness and health."
  confidence: high
  status: resolved
  script_treatment: qualify
  research_note: "Confirmed in Joinville's first-person captivity narrative. Evidence tier 1 for the transmitted Old French account. Preserve the striking agreement between the Muslim admiral and papal legate, but qualify Barbero's dramatized dialogue and state the penance precisely as bread and water on every Friday of Lent thereafter."
- id: Q-007
  barbero_utterances: [U-00198–U-00210]
  barbero_timestamp: "16:51"
  attribution: "Jean de Joinville"
  source_id: SRC-002
  original_language: fro
  original_text: "Li bons cuens de Soissons [...] se moquoit à moy et me disoit: «Seneschaus, lessons huer ceste chiennaille; que par la Quoife Dieu! (ainsi comme il juroit) encore en parlerons-nous, entre vous et moi, de ceste journée es chambres des dames.» [...] Je fu bien vint-dous ans en sa compaignie, que onques Dieu ne li oy jurer, ne sa mère, ne ses sains; et quant il vouloit aucune chose affermer, il disoit: «Vraiement il fu ainsi», ou: «Vraiement il est ainsi.» Onques ne ly oy nommer le dyable, se ce ne fu en aucun livre là où il l'afferoit à nommer, ou en la vie des sains de quoi li livres parloit. Et c'est grans honte au royaume de France et au roy quant il le souffre, que à peinne puet l'on parler que on ne die: «Que dyables y ait part!» [...] En l'ostel de Joinville, qui dit tel parole, il doit la bufe ou la paumelle, et y est cis mauvais languaiges presque touz abatus."
  translation: "The good Count of Soissons [...] joked with me and said: 'Seneschal, let this rabble howl; for, by God's cap!' (that was how he swore) 'you and I will yet speak of this day's events in the ladies' chambers.' [...] I was in [Louis's] company for fully twenty-two years, and never once heard him swear by God, God's mother, or God's saints. When he wished to affirm something, he said: 'Truly, it was so,' or: 'Truly, it is so.' I never heard him name the devil unless it was in a book where the name had to be spoken, or in the life of the saint about whom the book was written. It is a great shame to the kingdom of France and to the king that he tolerates this, for scarcely can anyone speak without saying: 'May the devil have a part in it!' [...] In Joinville's household, whoever says such a thing owes a cuff or a slap, and there this bad form of speech has been almost entirely stamped out."
  locator: "section 242, chapter XLIX, pp. 101–102 ('Quoife Dieu'); sections 686–687, chapter CXXXVIII, pp. 290–291 (Louis's speech and Joinville household rule)"
  translation_notes: "Direct translation from distinct passages in the Old French Wailly edition. Barbero correctly reports the idiosyncratic oath 'by God's cap' and Joinville's contrast between widespread speech habits and Louis's restraint. The examples 'by God's head' and 'by God's wounds' are genuine medieval oath types but are not examples Joinville identifies in these passages; 'Tête-Dieu' is first attested later in the fourteenth century. Joinville does not say Louis never mentioned God: he says he never heard Louis swear by God, Mary, or the saints, and that Louis used 'truly' to affirm statements. Likewise, the household sanction is not an unspecified pledge or penance: 'la bufe ou la paumelle' means a cuff or slap. Joinville explicitly condemns casual invocation of the devil; the surrounding chapter also condemns dishonorable oaths involving God or Mary."
  confidence: high
  status: resolved
  script_treatment: qualify
  research_note: "Composite but confirmed in substance from three Joinville passages. Evidence tier 1 for Joinville's wording; general oath examples require separate linguistic evidence and should not be attributed to Joinville. Preserve 'by God's cap,' Louis's twenty-two-year abstention from oaths, the devil formula, and the concrete household punishment, while correcting Barbero's conflations."
- id: Q-008
  barbero_utterances: [U-00211–U-00235]
  barbero_timestamp: "18:00"
  attribution: "Jean de Joinville and the papal legate"
  source_id: SRC-002
  original_language: fro
  original_text: "Li autres chevaliers qui m'avoit prise la place devant, sailli sus touz effraez, et li dist tout haut : « Vous estes trop hardis quant vous parlés de chose que je face. » Et il sailli sus et le prist par les cheveus. Et jo sailli sus et le feri dou poing entre les dous espaules, et il le lessa; et je li dis : « Or hors de mon hostel; car (si m'aïst Diex !) avec moy ne serez-vous jamais. » [...] Et je respondi que je ne l'i remenroie pas, se li legas ne me absoloit de mon sairement. Au légat en alerent et li contèrent le fait; et li legas lour respondi que il n'avoit pooir de moy absoudre, pour ce que li sairemens estoit raisonnables; car li chevaliers l'avoit moût bien deservi. Et ces choses vous moustré-je, pour ce que vous vous gardés de faire sairement que il ne couviengne faire par raison; car, ce dit li Saiges : « Qui volentiers jure, volentiers se parjure. »"
  translation: "The other knight, who had chosen my site the day before, sprang up in a fury and said loudly: 'You are very bold to speak about something I do.' He sprang up and seized him by the hair. I sprang up, struck him with my fist between the shoulder blades, and he let go. I told him: 'Out of my household now; for, so help me God, you will never be with me again.' [...] I answered that I would not take him back unless the legate absolved me from my oath. They went to the legate and told him what had happened. The legate replied that he had no power to absolve me, because the oath was reasonable: the knight had thoroughly deserved it. I show you these things so that you guard against making an oath that reason requires you to carry out; for, as the Wise Man says, 'He who swears readily perjures himself readily.'"
  locator: "sections 567–568, chapter CX, pp. 238–239"
  translation_notes: "Direct translation from the Old French in Natalis de Wailly's edition; the ellipsis omits the knight's departure and Giles le Brun's initial plea but does not join separate episodes. Barbero preserves the episode's logic while modernizing it. Joinville's oath is literally that the offender will never again be 'with me' in his household, not that he will never enter Joinville's house. Joinville himself punches the offender between the shoulder blades to make him release the other knight. The intermediary is specifically Giles le Brun, constable of France: the knight departs in great distress and is described as repentant, but the source does not explicitly say that he leaves crying or personally returns to beg. The legate's ruling is stronger than a general reluctance to dispense oaths: he says he has no power to absolve Joinville because this oath is reasonable and the knight has deserved the punishment. Joinville explicitly draws the moral and quotes a proverb; the text does not separately narrate the knight's permanent exclusion afterward."
  confidence: high
  status: resolved
  script_treatment: qualify
  research_note: "Confirmed in Joinville's first-person account. Evidence tier 1 for the transmitted Old French text, though this remains a memoir composed decades later rather than a contemporaneous judicial record. Preserve the oath's exact household meaning, the named intervention of Giles le Brun, and the legate's legal-religious reasoning rather than reducing the scene to a generic warning to mind one's words."
- id: Q-009
  barbero_utterances: [U-00246–U-00253]
  barbero_timestamp: "20:29"
  attribution: "Jean de Joinville, describing a belief he attributes to Bedouins"
  source_id: SRC-002
  original_language: fro
  original_text: "Lour créance est teix, que nus ne puet morir que à son jour, et pour ce ne se veulent-il armer; et quant il maudient lour enfans, si lour dient : « Ainsi soies-tu maudis, comme li Frans qui s'arme pour poour de mort ! » [...] J'ai veu en cest pais, puis que je reving d'outre mer, aucuns desloiaus crestiens qui tenoient la loy des Beduyns, et disoient que nulz ne pouoit morir qu'à son jour; et lour créance est si desloiaus, qu'il vaut autant dire comme Diex n'ait pouoir de nous aidier. Car il seroient fol cil qui serviroient Dieu, se nous ne cuidiens que il eust pooir de nous eslongier nos vies et de nous garder de mal et de mescheance; et en li devons-nous croire, que il est poissans de toutes choses faire. [...] Li autres poins si est teix, que il croient que nulz ne puet mourir que jusques au jour que il li est jugié; et ce ne doit nulz croire, car Diex a pooir d'alongier nos vies et d'acourcir. Et en cesti point croient li Beduin; et pour ce ne se weulent armer quant il vont es batailles, car il cuideroient faire contre le commandemant de lour loy."
  translation: "Their belief is that no one can die except on his appointed day, and for that reason they will not wear armor; and when they curse their children, they say: 'May you be accursed like the Frank who arms himself for fear of death!' [...] Since returning from overseas, I have seen in this country some disloyal Christians who held to the Bedouins' law and said that no one could die except on his appointed day. Their belief is so faithless that it amounts to saying that God has no power to help us. For those who served God would be fools if we did not believe that he had the power to lengthen our lives and preserve us from harm and misfortune; and we must believe in him, for he has the power to do all things. [...] Another tenet is that they believe no one can die before the day appointed to him. No one should believe this, because God has the power to lengthen and shorten our lives. The Bedouins believe this tenet, and for that reason they will not wear armor when they go into battle, because they would think that they were acting against the commandment of their law."
  locator: "sections 251 and 253, chapter LI, pp. 106–107; repeated at section 461, chapter XC, p. 193"
  translation_notes: "Direct translation from three closely related passages in Natalis de Wailly's Old French edition; the ellipses mark Joinville's repetition of the claim in distinct sections. Barbero accurately captures Joinville's attribution of a fixed day of death to Bedouins and his Christian objection that this would deny God's power to help or prolong life. The image of each person carrying his death 'written on his forehead' does not occur in Joinville and should be treated as Barbero's explanatory embellishment. Joinville does not say that named Bedouins personally explained the doctrine to him; he presents it in his own ethnographic description and later says that he had encountered Christians in France who adopted what he calls the Bedouins' law. His text says an appointed or adjudged day, not necessarily a calendar date revealed in advance. The claim describes Joinville's medieval representation and should not be generalized into an uncomplicated statement of Muslim theology or universal Bedouin belief."
  confidence: high
  status: resolved
  script_treatment: qualify
  research_note: "Confirmed in substance and stated three times by Joinville. Evidence tier 1 for Joinville's wording in the accessible Old French scholarly edition; evidence tier 2 scholarship independently identifies sections 249–253 and 461 as his representation of Bedouin fatalism. Preserve Joinville's theological reaction, omit or identify the forehead image as Barbero's metaphor, and frame the belief explicitly as Joinville's attribution rather than an established description of all Bedouins or Muslims."
- id: Q-010
  barbero_utterances: [U-00254–U-00262]
  barbero_timestamp: "21:13"
  attribution: "Jean de Joinville"
  source_id: SRC-002
  original_language: fro
  original_text: "J'ai veu en cest pais, puis que je reving d'outre mer, aucuns desloiaus crestiens qui tenoient la loy des Beduyns, et disoient que nulz ne pouoit morir qu'à son jour; et lour créance est si desloiaus, qu'il vaut autant dire comme Diex n'ait pouoir de nous aidier. Car il seroient fol cil qui serviroient Dieu, se nous ne cuidiens que il eust pooir de nous eslongier nos vies et de nous garder de mal et de mescheance; et en li devons-nous croire, que il est poissans de toutes choses faire."
  translation: "Since returning from overseas, I have seen in this country some disloyal Christians who held to the Bedouins' law and said that no one could die except on his appointed day. Their belief is so faithless that it amounts to saying that God has no power to help us. For those who served God would be fools if we did not believe that he had the power to lengthen our lives and preserve us from harm and misfortune; and we must believe in him, for he has the power to do all things."
  locator: "section 253, chapter LI, pp. 106–107"
  translation_notes: "Direct translation from Natalis de Wailly's Old French edition. Barbero's central sentence follows Joinville very closely: Joinville really does say that those who serve God would be fools unless they believed God could prolong their lives and protect them from harm and misfortune. The source presents this as a declarative conditional argument, not a rhetorical question, and speaks of protection from harm rather than specifically of aid on a battlefield. Barbero's 'it is for that reason that we serve him' sharpens the logical implication but is defensible as an explanation of the conditional. His description of a 'contract with God' is an illuminating modern interpretation, not Joinville's word or an explicit contractual formulation in this passage. Joinville concludes more broadly that one must believe in God because God can do all things."
  confidence: high
  status: resolved
  script_treatment: preserve
  research_note: "Confirmed almost verbatim in Joinville section 253. Evidence tier 1 for the Old French text, independently quoted and discussed in scholarship on Joinville's representation of Bedouin fatalism. Preserve the striking foolish-to-serve-God argument and its practical benefits; clearly identify the 'contract' label as Barbero's interpretation rather than medieval source language."
- id: Q-011
  barbero_utterances: [U-00270–U-00283]
  barbero_timestamp: "22:07"
  attribution: "Jean de Joinville"
  source_id: SRC-002
  original_language: fro
  original_text: "Cis abbes de Cheminon si me donna m'escharpe et mon bourdon : et lors je me parti de Joinville, sans rentrer ou chastel jusques à ma revenue, à pié, deschaus et en langes; et ainsi alai à Blehecourt et à Saint-Urbain, et autres cors sains qui là sont. Et endementieres que je aloie à Blehecourt et à Saint-Urbain, je ne voz onques retourner mes yex vers Joinville, pour ce que li cuers ne me attendrisist dou biau chastel que je lessoie et de mes dous enfans."
  translation: "The abbot of Cheminon gave me my pilgrim's scrip and staff; then I departed from Joinville, without re-entering the castle until my return, on foot, barefoot, and dressed in wool. In this way I went to Blécourt and Saint-Urbain, and to the other holy relics that are there. While I was going to Blécourt and Saint-Urbain, I never once wished to turn my eyes back toward Joinville, for fear that my heart would soften at the thought of the fine castle I was leaving and of my two children."
  locator: "section 122, chapter XXVII, p. 53"
  translation_notes: "Direct translation from Natalis de Wailly's Old French edition. Barbero follows the departure scene closely: the abbot of Cheminon gives Joinville the pilgrim's scrip and staff; Joinville leaves on foot and barefoot, visits Blécourt, Saint-Urbain, and other local holy relics, and deliberately does not look back toward Joinville. Joinville says he feared becoming tender-hearted over his fine castle and his two children; he does not mention his wife in this sentence. Nor does he simply say that he made a circuit of nearby churches: the text names two destinations and 'other holy relics.' 'En langes' indicates woolen clothing, not by itself a fully specified pilgrim costume. Joinville separately describes the crusading pilgrimage as six years in Louis IX's company, so Barbero's six-year framing is supported, although it is not part of the quoted departure sentence."
  confidence: high
  status: resolved
  script_treatment: preserve
  research_note: "Confirmed directly in Joinville section 122 and consistently quoted in scholarship on crusading departure and pilgrimage. Evidence tier 1 for Joinville's transmitted wording; the account was written decades after the departure rather than recorded in 1248. Preserve the scene and its emotional restraint, while naming the two children rather than adding his wife to Joinville's explicit list."
- id: Q-012
  barbero_utterances: [U-00292–U-00307]
  barbero_timestamp: "23:38"
  attribution: "Jean de Joinville, reporting his cellarer and the company"
  source_id: SRC-002
  original_language: fro
  original_text: "Ne tarda gueres que nous veismes venir quatre galies dou soudanc, là où il avoit bien mil homes. Lors j'appelai mes chevaliers et ma gent, et lour demandai que il vouloient que nous feissiens, ou de nous rendre aus galies le soudanc, ou de nous rendre à cens qui estoient à terre. Nous acordames tuit que nous amiens miex que nous nous rendissiens aus galies le soudanc, pour ce que il nous tenroient touz ensemble, que ce que nous nous rendissiens à cens qui estoient à terre, pour ce que il nous esparpilleroient et venderoient aus Beduyns. Lors dist uns miens celeriers, qui estoit nés de Doulevens : « Sire, je ne m'acort pas à cest consoil. » Je li demandai auquel il s'acordoit, et il me dist : « Je m'acort que nous nous lessons touz tuer; si nous en irons tuit en paradis. » Mais nous ne le creumes pas."
  translation: "It was not long before we saw four of the sultan's galleys approaching, carrying fully a thousand men. I called my knights and my people and asked what they wished us to do: surrender to the sultan's galleys or surrender to those on shore. We all agreed that we preferred to surrender to the sultan's galleys, because they would keep us together, rather than to those on shore, who would scatter us and sell us to the Bedouins. Then one of my cellarers, who came from Doullens, said: 'My lord, I do not agree with this counsel.' I asked what counsel he favored, and he told me: 'I favor letting ourselves all be killed; then we shall all go to paradise.' But we did not believe him."
  locator: "sections 318–319, chapter LXIII, p. 132"
  translation_notes: "Direct translation from Natalis de Wailly's Old French edition. The core anecdote and its dry conclusion are genuine. The dissenter is specifically one of Joinville's cellarers, a household officer from Doullens, rather than a knight. He does not raise his hand in the text. Four sultanic galleys carrying about a thousand men are approaching Joinville's vessel, but the decision facing the company is not initially surrender versus resistance: everyone has agreed that surrender is unavoidable and is choosing between the sultan's galleys, which may keep them together, and the forces on shore, which may scatter them and sell them to Bedouins. The cellarer alone proposes that they instead let themselves be killed so that all will go to paradise. 'Mais nous ne le creumes pas' literally means 'But we did not believe him'; in context, Barbero's 'we did not listen to him' correctly conveys that they rejected his advice. The source says paradise, not explicitly 'straight to paradise.'"
  confidence: high
  status: resolved
  script_treatment: preserve
  research_note: "Confirmed directly in Joinville sections 318–319 and quoted consistently in scholarship on crusading martyrdom. Evidence tier 1 for Joinville's transmitted wording; the scene remains a memoir recollection rather than a contemporary shipboard record. Preserve the lone cellarer's proposal and Joinville's terse rejection, while retaining the practical reason the rest preferred surrender to the galleys."
- id: Q-013
  barbero_utterances: [U-00310–U-00334]
  barbero_timestamp: "25:17"
  attribution: "Louis IX, Philippe de Nemours, and Jean de Joinville"
  source_id: SRC-002
  original_language: fro
  original_text: "Lors dist mes sires Phelipes de Nemoes au roy que on avoit forcontei aus Sarrazins une balance de dix mille livres. Et li roys se courouça trop fort, et dist que il vouloit que on lour rendist les dix mille livres, pour ce que il lour avoit couvent à paier les dous cens mille livres, avant que il partisist dou flum. Et lors je passai mon signour Phelipe sus le pié, et dis au roy qu'il ne le creust pas, car il ne disoit pas voir; car li Sarrazin estoient li plus saige conteour qui fussent ou monde. Et mes sires Phelippes dist que je disoie voir, car il ne le disoit que par moquerie. Et li roys dist que maie encontre eust teix moquerie; « Et vous commant, dist li roys à mon signour Phelippe, sur la foy que me devez comme mes hom que vous estes, que se les dix milles livres ne sont paies, que vous les facez paier sans nulle faute. » Moût de gens avoient louei au roy que il se traisist en sa nef, qui l'atendoit en mer, pour li oster des mains aus Sarrazins. Onques li roys ne vont nullui croire; ainçois disoit que il ne partiroit dou flum, aussi comme il l'avoit couvent, tant que il lour eust paie dous cens mille livres."
  translation: "Then Sir Philippe de Nemours told the king that the Saracens had been undercounted by one balance-load of ten thousand livres. The king became extremely angry and said that he wished the ten thousand livres to be returned to them, because he had promised to pay them two hundred thousand livres before leaving the river. I then trod on Sir Philippe's foot and told the king not to believe him, because what he said was untrue: the Saracens were the most skillful counters in the world. Sir Philippe said that I spoke the truth, because he had said it only as a joke. The king said, 'May misfortune befall such a joke. And I command you, Sir Philippe, by the fealty you owe me as my man, that if the ten thousand livres have not been paid, you are to have them paid without fail.' Many people had advised the king to withdraw to his ship waiting at sea, to remove himself from the Saracens' hands. The king would listen to no one; instead, he said that he would not leave the river, just as he had promised, until he had paid them two hundred thousand livres."
  locator: "sections 386–388, chapter LXXVI, pp. 161–162; payment mechanics at sections 378 and 380–385, pp. 157–161"
  translation_notes: "Direct translation from Natalis de Wailly's Old French edition. Barbero reproduces the comic exchange with unusual fidelity: Philippe de Nemours claims a ten-thousand-livre undercount, Louis becomes angry, Joinville treads on Philippe's foot and invokes the Saracens' skill at counting, Philippe retreats to the claim that he was joking, and Louis orders him on his fealty to ensure payment. Louis does not merely say that the joke was stupid: he curses such a joke. Nor does he say that he personally will go and inspect the accounts; he charges Philippe to make good any shortfall and refuses to leave the river until the installment is paid. The financial framing needs qualification. Two hundred thousand livres was the immediate installment due before Louis left the river, not the whole negotiated ransom: Joinville earlier gives four hundred thousand livres for the prisoners after the sultan's reduction, with Damietta exchanged for the king's person. The money was weighed in balance-loads worth ten thousand livres over Saturday and Sunday; the royal party was initially thirty thousand livres short and obtained the balance from funds held aboard a Templar vessel. The source does not say Philippe arrives cheerfully or that everyone else celebrates the supposed trick."
  confidence: high
  status: resolved
  script_treatment: qualify
  research_note: "Confirmed directly in Joinville sections 386–388, with payment context in sections 378 and 380–385. Evidence tier 1 for Joinville's transmitted eyewitness account; scholarship on Templar finance independently uses the same passage and immediate 200,000-livre installment. Preserve the dialogue and Louis's insistence on honoring his promise, but correct the episode's total-ransom framing and do not invent an inspection by Louis himself."
- id: Q-014
  barbero_utterances: [U-00342–U-00361]
  barbero_timestamp: "27:43"
  attribution: "Jean de Joinville to Louis IX"
  source_id: SRC-002
  original_language: fro
  original_text: "Par nos journées, venimes ou sablon d'Acre, là où li roys et li os nous lojames. Illec au lieu vint à moy uns grans peuples de la Grant Hermenie qui aloit en pelerinaige en Jérusalem, par grant treu rendant aus Sarrazins qui les conduisoient. A un latimier qui savoit lour languaige et le nostre, il me firent prier que je lour monstrasse le saint roy. Je alai au roy là où il se seoit en un paveillon, apuiez à l'estache dou paveillon; et seoit ou sablon, sans tapiz et sans nulle autre chose desouz li. Je li dis : « Sire, il a là hors un grant peuple de la Grant Hermenie qui vont en Jérusalem, et me proient, sire, que je lour face moustrer le saint roy; mais je ne bé jà à baisier vos os. » Et il rist moût clerement, et me dist que je les alasse querre; et si fis-je. Et quant il orent veu le roy, il le commandèrent à Dieu, et li roys aus."
  translation: "In the course of our marches we came to the sands of Acre, where the king and the army encamped. There a large company from Greater Armenia came to me on pilgrimage to Jerusalem, paying a heavy tribute to the Saracens who were conducting them. Through an interpreter who knew their language and ours, they asked me to show them the holy king. I went to the king, who was sitting in a pavilion, leaning against its pole; he sat on the sand without a carpet or anything else beneath him. I said to him: 'My lord, outside there is a large company from Greater Armenia going to Jerusalem, and they ask me to show them the holy king; but I have no intention of kissing your bones just yet.' He laughed very openly and told me to go and fetch them, which I did. When they had seen the king, they commended him to God, and the king did the same for them."
  locator: "sections 565–566, chapter CX, pp. 237–238"
  translation_notes: "Direct translation from Natalis de Wailly's Old French edition. Barbero's account is close to the source, including the bare sand beneath Louis, the request to see the 'holy king,' Joinville's remark about kissing his bones, and Louis's clear laughter. The pilgrims are described as a large company from Greater Armenia traveling to Jerusalem. They address Joinville through an interpreter and pay a heavy tribute to the Saracens conducting them; Joinville does not explicitly frame the moment as a formal truce or say merely that they traveled with Saracen permission. The scene occurs on the sands of Acre while Louis's army is marching from Jaffa toward Sidon, not in an unspecified static crusader camp. 'Je ne bé jà' gives the joke its important temporal force: Joinville has no intention of kissing Louis's bones yet. Louis laughs and orders him to bring the pilgrims, who see the king and exchange commendations to God with him."
  confidence: high
  status: resolved
  script_treatment: preserve
  research_note: "Confirmed verbatim in Joinville sections 565–566 and repeatedly discussed in scholarship as evidence of Joinville's affectionate resistance to treating his living friend as a relic. Evidence tier 1 for the transmitted Old French eyewitness account. Preserve the joke and Louis's laughter; retain 'yet,' which carries the relic-veneration implication without requiring it to be overexplained."
- id: Q-015
  barbero_utterances: [U-00373–U-00397]
  barbero_timestamp: "29:58"
  attribution: "Jean de Joinville"
  source_id: SRC-002
  original_language: fro
  original_text: "Pour ce que je n'en vouloie porter nulz deniers à tort, je alai lessier à Metz en Lorreinne grant foison de ma terre en gaige. Et sachiez que, au jour que je parti de nostre pais pour aler en la Terre sainte, je ne tenoie pas mil livrées de terre; car ma dame ma mere vivoit encore : et si y alai, moy disiesme de chevaliers et moy tiers de bannières. Et ces choses vous ramantoif-je, pour ce que se Diex ne m'eust aidié, qui onques ne me failli, je l'eusse souffert à peinne par si lonc temps comme par l'espace de six ans que je demourai en Terre sainte. [...] Je, qui n'avoie pas mil livrées de terre, me charjai, quant j'alai outre mer, de moy disiesme de chevaliers et de dous chevaliers banieres portans; et m'avint ainsi que, quant je arivai en Cypre, il ne me fu demourei de remenant que douze vins livres de tournois, ma nef paie; dont aucun de mes chevaliers me mandèrent que se je ne me pourveoie de deniers, que il me lairoient. Et Diex, qui onques ne me failli, me pourveut en tel manière que li roys, qui estoit à Nichocie, m'envoia querre et me retint, et me mist huit cens livres en mes cofres; et lors oz-je plus de deniers que il ne me couvenoit."
  translation: "Because I did not wish to carry away any money wrongfully, I went and mortgaged a large amount of my land at Metz in Lorraine. You should know that on the day I left our country for the Holy Land I did not hold land worth a thousand livres a year, because my lady mother was still alive; and I went as one of ten knights and one of three bannerets. I remind you of these things because, if God had not helped me—he who never failed me—I could scarcely have endured for so long as the six years I remained in the Holy Land. [...] I, who did not have land worth a thousand livres a year, took responsibility when I went overseas for a company of ten knights including myself, with two other knights bearing banners. When I arrived in Cyprus, after paying for my ship, I had only two hundred and forty livres tournois left. Some of my knights sent word that unless I found money, they would leave me. God, who never failed me, then provided for me in this way: the king, who was at Nicosia, sent for me, retained me in his service, and put eight hundred livres in my coffers; and then I had more money than I needed."
  locator: "section 112, chapter XXV, p. 49; repeated and expanded at section 136, chapter XXIX, p. 58"
  translation_notes: "Direct translation from two related passages in Natalis de Wailly's Old French edition. Barbero correctly identifies the episode as evidence that a crusading lord had to finance and retain a mounted company and could in turn enter royal paid service. The numerical details need precision. Joinville says his landed estate then yielded less than one thousand livres annually; a 'livrée de terre' is an income valuation, not simply cash he says he earned. He departs with a company of ten knights including himself—not ten knights in addition to himself—and there are three bannerets in the company, Joinville plus two others. He says he mortgaged much of his land, reached Cyprus with only 240 livres tournois after paying for the ship, and faced desertion by some knights unless he found funds. Louis summoned and 'retained' him and placed 800 livres in his coffers. Joinville does not give a total figure for what it originally cost to hire the nine other knights, nor do these passages themselves document Barbero's broader 'nine times out of ten,' universal-contract, or end-of-unpaid-feudal-service claims. The 800 livres may safely be described as royal paid retention or support, but the surviving sentence does not set out a full written contract."
  confidence: high
  status: resolved
  script_treatment: qualify
  research_note: "Composite but confirmed in substance from Joinville sections 112 and 136. Evidence tier 1 for the Old French figures and wording; modern military scholarship independently reads the episode as evidence of the financial strain of maintaining a knightly retinue and royal subsidization. Preserve the under-1,000 income, ten-knight company, 240 livres remaining, threat of departure, and 800-livre royal retention, while omitting the nonexistent total hiring cost and reserving broad claims about paid service for the claims ledger."
- id: Q-016
  barbero_utterances: [U-00399–U-00419]
  barbero_timestamp: "31:39"
  attribution: "Jean de Joinville to Louis IX"
  source_id: SRC-002
  original_language: fro
  original_text: "Tandis que li roys fermoit Cezaire, j'alai en sa héberge pour le veoir. Maintenant que il me vit entrer en sa chambre, là où il parloit au légat, il se leva et me trait d'une part, et me dist : « Vous savez, fist li roys, que je ne vous reting que jusques à Pasques; si vous pri que vous me dites que je vous donrai pour estre avecques moy de Pasques en un an. » Et je li dis que je ne vouloie que il me donnast plus de ses deniers que ce que il m'avoit donnei; mais je vouloie faire un autre marchié à li. « Pour ce, fis-je, que vous vous courouciés quant l'on vous requiert aucune chose, si vueil-je que vous m'aies convenant, que se je vous requier aucune chose toute ceste année, que vous ne vous courouciés pas; et se vous me refusés, je ne me couroucerai pas. » Quant il oy ce, si commença à rire moût clerement, et me dist que il me retenoit par tel convenant; et me prist par la main, et me mena par devers le légat et vers son consoil, et lour recorda le marchié que nous aviens fait; et en furent mout lié, pour ce que je estoie li plus riches qui fust en l'ost."
  translation: "While the king was fortifying Caesarea, I went to his quarters to see him. As soon as he saw me enter his chamber, where he was speaking with the legate, he rose, drew me aside, and said: 'You know,' said the king, 'that I retained you only until Easter; so I ask you to tell me what I should give you to remain with me from Easter for one year.' I told him that I did not wish him to give me any more of his money than he had given me before, but that I wished to make a different bargain with him. 'Because,' I said, 'you become angry whenever someone asks you for something, I want you to agree that if I ask you for anything during this whole year, you will not become angry; and if you refuse me, I will not become angry either.' When he heard this, he began to laugh very openly and told me that he retained me on that condition. He took me by the hand, led me to the legate and his council, and recounted to them the bargain we had made. They were very pleased, because I was the richest man in the army."
  locator: "sections 499–500, chapter XCVIII, pp. 210–211"
  translation_notes: "Direct translation from Natalis de Wailly's Old French edition. Barbero preserves the delightful anger bargain and the king's laughter, but materially changes its financial terms and duration. The renewed engagement runs from Easter for one full year, not six months. Joinville does not offer to serve unpaid: he says he wants no more money than Louis had given him under the previous engagement, while adding a different nonfinancial condition. That condition is reciprocal and narrower than 'never become angry with me': Louis must not become angry when Joinville asks for something during the year, and Joinville promises not to become angry if Louis refuses. Louis initiates the renewal and asks what he should pay; the text does not say he is penniless or warns Joinville not to ask too much. Louis laughs, accepts, takes Joinville by the hand, and tells the legate and council. Their pleasure is explicitly explained by Joinville's being the richest man in the army, not by a recorded judgment that he has proved himself no merchant."
  confidence: high
  status: resolved
  script_treatment: qualify
  research_note: "Confirmed as a genuine bargain in Joinville sections 499–500, but Barbero's six-month unpaid-service version is contradicted by the source. Evidence tier 1 for the Old French text and evidence tier 2 for scholarship quoting it as a renewed paid engagement. Preserve the humor, reciprocal anger clause, laughter, and public retelling; correct the term to one year and retain the previous level of pay."
- id: Q-017
  barbero_utterances: [U-00426–U-00438]
  barbero_timestamp: "34:02"
  attribution: "Louis IX, as reported by Jean de Joinville"
  source_id: SRC-002
  original_language: fro
  original_text: "Lors dist li roys : « Signour, j'ai oy vostre avis et l'avis de ma gent; or vous redirai-je le mien, qui est teix, que se je descent de la nef, que il a céans tiex cinc cens persones et plus qui demorront en l'ille de Cypre, pour la poour dou péril de lour cors (car il n'i a celi qui autant n'aint sa vie comme je faiz la mienne), et qui jamais, par avanture, en lour païz ne renterront. Dont j'aim miex mon cors et ma femme et mes enfants mettre en la main Dieu, que je feisse tel doumaige à si grant peuple comme il a céans. »"
  translation: "Then the king said: 'Lords, I have heard your advice and the advice of my people; now I will tell you mine. If I leave the ship, there are five hundred people or more aboard who, fearing danger to their lives—for there is not one among them who does not love his life as much as I love mine—will remain on the island of Cyprus, and who may perhaps never return to their own countries. Therefore I would rather place my own person, my wife, and my children in God's hands than inflict such harm on so great a number of people as are aboard.'"
  locator: "section 628, chapter CXXIII, p. 264; context sections 618–629, pp. 260–265"
  translation_notes: "Direct translation from Natalis de Wailly's Old French edition. The central line is genuine, including Louis's frank statement that he loves his own life as much as the other passengers love theirs. Barbero substantially generalizes the setting, however. This is one specific event on the 1254 return voyage from the Holy Land: Louis's ship struck a sandbank near Cyprus and suffered serious damage, and the shipmasters advised Louis, his wife, and their children to transfer to another vessel. Louis did not ask whether the entire expedition could be brought home; he reasoned that if he abandoned the damaged ship, more than five hundred people aboard might likewise refuse to sail in it, become stranded on Cyprus, and perhaps never reach their countries. His concern is therefore immediately for the passengers on this vessel, not in the quoted passage for everyone in the army, though the following section underscores the plight of poorer travelers unable to pay for another passage. Louis explicitly chooses to place himself, his wife, and his children in God's hands rather than cause that harm."
  confidence: high
  status: resolved
  script_treatment: qualify
  research_note: "Confirmed verbatim in Joinville section 628. Evidence tier 1 for Joinville's transmitted Old French eyewitness account. Preserve the memorable comparison between Louis's love of his life and everyone else's, but restore the concrete 1254 shipboard setting near Cyprus, the five hundred-plus passengers, and the inclusion of his wife and children; do not recast it as a general refusal to abandon a collapsing crusade."
- id: Q-018
  barbero_utterances: [U-00439–U-00448]
  barbero_timestamp: "34:56"
  attribution: "Louis IX and Jean de Joinville"
  source_id: SRC-002
  original_language: fro
  original_text: "« Or vous demant-je, fist-il, lequel vous ameries miex, ou que vous fussiés mesiaus, ou que vous eussiés fait un pechié mortel? » Et je, qui onques ne li menti, li respondi que je en ameroie miex avoir fait trente que estre mesiaus. Et quant li frère s'en furent parti, il m'appela tout seul, et me fist seoir à ses piez et me dist : « Comment me deistes-vous hier ce? » Et je li diz que encore li disoie-je. Et il me dist : « Vous déistes comme hastis musarz; car vous devez savoir que nulle si laide mezelerie n'est comme d'estre en pechié mortel, pour ce que l'ame qui est en pechié mortel est semblable au dyable : par quoy nulle si laide meselerie ne puet estre. Et bien est voirs que quant li hom meurt, il est guéris de la meselerie dou cors; mais quant li hom qui a fait le pechié mortel meurt, il ne sait pas ne n'est certeins que il ait eu en sa vie tel repentance que Diex li ait pardonnei : par quoy grant poour doit avoir que celle mezelerie li dure tant comme Diex yert en paradis. Si vous pri, fist-il, tant comme je puis, que vous metés votre cuer à ce, pour l'amour de Dieu et de moy, que vous amissiez miex que touz meschiez avenist au cors, de mezelerie et de toute maladie, que ce que li pechiés mortex venist à l'ame de vous. »"
  translation: "'Now I ask you,' he said, 'which would you rather: that you were a leper, or that you had committed a mortal sin?' And I, who never lied to him, answered that I would rather have committed thirty than be a leper. When the friars had left, he called me aside alone, made me sit at his feet, and said: 'Why did you say that to me yesterday?' I told him that I still said the same. He said: 'You spoke like a rash fool, for you should know that there is no leprosy so hideous as being in mortal sin, because the soul that is in mortal sin resembles the Devil; therefore no leprosy can be so hideous. It is true that when a man dies he is cured of the leprosy of the body. But when a man who has committed a mortal sin dies, he does not know and cannot be certain that in his lifetime he repented in such a way that God pardoned him; therefore he should greatly fear that this leprosy will last as long as God is in paradise. So I beg you as earnestly as I can, for love of God and of me, to set your heart on preferring every bodily misfortune—leprosy and every other illness—to mortal sin entering your soul.'"
  locator: "sections 27–28, chapter IV, pp. 10–11; introductory exchange at section 26, p. 10"
  translation_notes: "Direct translation from Natalis de Wailly's Old French edition. Barbero accurately preserves Louis's choice between being a leper and having committed one mortal sin, Joinville's emphatic preference for thirty mortal sins, and the memorable rebuke. The answer is immediate, but the admonition is not: the exchange begins before two friars whom Louis has summoned, and only after they leave does Louis call Joinville aside. Louis's words 'Comment me deistes-vous hier ce?' indicate that the private correction occurs the next day. Joinville does not capitulate immediately; when challenged he repeats that he still holds the same view. Louis calls him a 'hastis musarz,' approximately a rash or thoughtless fool, then argues that bodily leprosy ends at death whereas mortal sin may remain unforgiven and imperil the soul eternally. The memoir gives no date or place for this conversation, so it should not be assigned specifically to the crusade merely because other famous dialogues occurred overseas."
  confidence: high
  status: resolved
  script_treatment: preserve
  research_note: "Confirmed verbatim in Joinville sections 27–28, with the number thirty explicit. Evidence tier 1 for Joinville's transmitted Old French first-person account, independently quoted and analyzed in modern scholarship on medieval leprosy and penitential imagery. Preserve the comic force and ensuing lecture; if expanding the scene, note the friars, the delayed private rebuke, and Joinville's stubborn repetition of his answer."
- id: Q-019
  barbero_utterances: [U-00449–U-00458]
  barbero_timestamp: "35:34"
  attribution: "Louis IX and Jean de Joinville"
  source_id: SRC-002
  original_language: fro
  original_text: "Il me demanda se je lavoie les piez aus povres le jour dou grant jeudi : « Sire, dis-je, en maleur! les piez de ces vilains ne laverai-je jà. — Vraiement, fist-il, ce fu mal dit; car vous ne devez mie avoir en desdaing ce que Diex fist pour nostre enseignement. Si vous pri-je, pour l'amour de Dieu premier, et pour l'amour de moy, que vous les acoustumez à laver. »"
  translation: "He asked me whether I washed the feet of the poor on Maundy Thursday. 'My lord,' I said, 'God forbid! I will never wash the feet of those common people.' 'Truly,' he said, 'that was badly said, for you must not disdain what God did for our instruction. So I ask you, first for the love of God and then for love of me, to accustom yourself to washing them.'"
  locator: "section 29, chapter IV, pp. 11–12"
  translation_notes: "Direct translation from Natalis de Wailly's Old French edition. The core exchange is genuine and explicitly concerns washing poor people's feet on 'grant jeudi,' Maundy or Holy Thursday, in imitation of Christ's exemplary act. Barbero accurately conveys Joinville's blunt class contempt and Louis's disapproval, but dramatizes the wording. Louis asks whether Joinville washes the poor's feet; Joinville does not first watch the king perform the rite in this passage, nor does Louis deliver Barbero's conversational preamble about what a beautiful thing it is. Joinville says 'en maleur!', an emphatic refusal best rendered 'God forbid!' or 'certainly not,' rather than swearing 'by the faith I owe God.' His 'ces vilains' contrasts the aristocratic speaker with low-status common people and here refers back to the poor; 'those peasants' is possible as rhetorical English but is more socially specific than the Old French requires. Louis says Joinville spoke badly, explains that he must not disdain what God did for human instruction, and asks him to make a habit of washing their feet. The text records no response or compliance from Joinville."
