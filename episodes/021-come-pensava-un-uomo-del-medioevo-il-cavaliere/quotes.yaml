  original_text: "Quant li roys oy dire que l'enseigne Saint-Denis estoit à terre, il en ala grant pas par mi son vessel, ne onques pour le légat qui estoit avec li, ne la vout lessier, et sailli en la mer, dont il fu en yaue jusques aus esseles. Et ala l'escu au col, et le heaume en la teste, et le glaive en la main, jusques à sa gent qui estoient sur la rive de la mer. Quant il vint à terre et il choisi les Sarrazins, il demanda quex gent c'estoient; et on li dist que c'estoient Sarrazin; et il mist le glaive desous s'esselle et l'escu devant li, et eust couru sus aus Sarrazins, se sui preudome, qui estoient avec li, li eussent souffert. [...] Mais onques si bel armei ne vi; car il paroit desur toute sa gent dès les espaules en amont, un heaume dorei en son chief, une espée d'Alemaingne en sa main."
  translation: "When the king heard that the standard of Saint-Denis was ashore, he strode rapidly through his vessel and would not stop for the legate who was with him. He leapt into the sea, where the water came up to his armpits, and went with his shield at his neck, his helmet on his head, and his lance in his hand until he reached his men on the seashore. When he came ashore and saw the Saracens, he asked what people they were. He was told they were Saracens; he lowered the lance beneath his armpit, put his shield before him, and would have charged the Saracens if the worthy men with him had allowed it. [...] Never did I see so fine an armed man, for he stood out above all his people from the shoulders upward, with a gilded helmet on his head and a German sword in his hand."
  locator: "landing at sections 162–163, chapter XXXV, pp. 68–69; summary at sections 7–8, chapter II, p. 3; gilded helmet in a later battle at section 228, chapter XLVII, pp. 95–96"
  translation_notes: "Direct translation from Natalis de Wailly's Old French edition. The landing scene is genuine and even more physically vivid than Barbero's version: Louis jumps into water reaching his armpits while fully armed, with shield, helmet, and lance, then prepares to charge the Saracens until his companions prevent him. But Barbero combines details from distinct moments. Louis is on foot during the landing, not mounted; Joinville says the king and the army mount only later, after the Saracens abandon Damietta and a Te Deum is sung. The standard of Saint-Denis and other troops are already ashore when Louis leaps, although Joinville's introductory summary calls him 'one of the first' to land. Louis asks what people he sees, not 'Where are the Turks?' The helmet at Damietta is not described as gilded. Joinville's famous gilded-helmet portrait occurs months later during the fighting at Mansurah, when Louis arrives mounted with his battle division and carries a German sword. The Old French 'glaive' in the landing passage means a lance, as shown when Louis couches it under his armpit. Joinville participated in the landing and frames it as one of four occasions on which Louis risked his body to spare his people, making this a first-person crusade narrative, though the work was composed decades later and its detailed calendar contains known errors."
