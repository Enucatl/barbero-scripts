  source_id: SRC-002
  original_language: fro
  original_text: "Là me vint querre maistres Roberz de Sorbon, et me prist par le cor de mon mantel, et me mena au roy; et tuit li autre chevalier vindrent après nous. Lors demandai-je à maistre Robert : « Maistre Roberz, que me voulez vous? » Et me dist : « Je vous veil demander se li roys se seoit en cest prael, et vous vous allez seoir sur son banc plus haut que li, se on vous en deveroit bien blasmer. » Et je li diz que oil. Et il me dist : « Dont faites vous bien à blasmer, quant vous estes plus noblement vestus que li roys; car vous vous vestez de vair et de vert, ce que li roys ne fait pas. » Et je li diz : « Maistre Roberz, sauve vostre grâce, je ne faiz mie à blasmer se je me vest de vert et de vair; car cest abit me lessa mes pères et ma mère. Mais vous faites à blâmer; car vous estes fiz de vilain et de vilainne, et avez lessié l'abit vostre père et vostre mère, et estes vestus de plus riche camelin que li roys n'est. » Et lors je pris le pan de son seurcot et dou seurcot le roy, et li diz : « Or esgardez se je di voir. » Et lors li roys emprist à deffendre maistre Robert de paroles, de tout son pooir."
  translation: "Master Robert de Sorbon came to fetch me there, took me by the hem of my cloak, and led me to the king; all the other knights followed us. I asked Master Robert, 'Master Robert, what do you want with me?' He said: 'I want to ask you this: if the king were sitting in this meadow and you went and sat on his bench higher than he, should you rightly be blamed for it?' I said yes. He said: 'Then you are indeed to blame when you are more nobly dressed than the king, for you dress in vair fur and green cloth, which the king does not.' I said: 'Master Robert, saving your grace, I am not to blame if I dress in green and vair, for my father and mother left me this mode of dress. But you are to blame, for you are the son of a villein man and a villein woman, and you have abandoned the dress of your father and mother and are dressed in richer camelin cloth than the king.' Then I took the hem of his surcoat and the hem of the king's and said to him: 'Now see whether I am telling the truth.' The king then began to defend Master Robert verbally with all his might."
  locator: "sections 35–36, chapter VI, pp. 14–15"
  translation_notes: "Direct translation from Natalis de Wailly's Old French edition. The scene occurs at Corbeil during Pentecost, after dinner, with eighty knights present; Louis is in the small meadow below the chapel speaking with the count of Brittany. Robert takes Joinville by the hem of his cloak and leads him to the king, while the knights follow. Before criticizing the clothes, Robert constructs an analogy: just as Joinville would be blameworthy for sitting higher than the king on the same bench, he is blameworthy for dressing more nobly. The named materials are vair—a prestigious squirrel fur, not ermine—and green cloth. Joinville says that his father and mother 'left' him this habit or mode of dress. That may invoke inherited aristocratic status and its proper clothing rather than identify the garment itself as a literal bequest, so Barbero's 'this garment was left to me as an inheritance by my father' is too narrow and omits his mother. Joinville calls Robert the son of both a 'vilain' and a 'vilainne,' says he abandoned his parents' dress, and physically compares Robert's richer camelin surcoat with the king's. Here the social insult means low-born or non-noble parentage; it need not establish that Robert's father was specifically an agricultural peasant. Louis does intervene and vigorously defends Robert, but Joinville reports no formal pronouncement ending the dispute."
