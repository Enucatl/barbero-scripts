  attribution: "Henry I of Champagne to Artaud de Nogent, as reported by Jean de Joinville"
  source_id: SRC-002
  original_language: fro
  original_text: "Ertaus de Nogent fu li bourgois dou monde que li cuens creoit plus; et fu si riches que il fist le chastel de Nogent-l'Ertaut de ses deniers. [...] Aus piez des degrez vint au devant de li uns povres chevaliers, qui s'agenoilla devant li, et li dist ainsi : « Sire, je vous pri pour Dieu que vous me donnés dou vostre, par quoy je puisse marier mes dous filles, que vous veez ci. » Ertaus, qui aloit dariere li, dist au povre chevalier : « Sire chevaliers, vous ne faites pas que courtois de demander à mon signour; car il a tant donnei que il n'a mais que donner. » Li larges cuens se tourna devers Ertaut, et li dist : « Sire vilains, vous ne dites mie voir, de ce que vous dites que je n'ai mais que donner : si, ai vous-meismes. — Et tenez, sire chevaliers, car je le vous doing, et si le vous garantirai. » Li chevaliers ne fu pas esbahiz, ainçois le prist par la chape, et li dist que il ne le lairoit jusques à tant que il averoit finei à li. Et avant que il li eschapast, ot Ertaus finei à li de cinq cens livres."
  translation: "Artaud de Nogent was the burgess in all the world whom the count trusted most, and he was so rich that he built the castle of Nogent-l'Artaud with his own money. [...] At the foot of the steps a poor knight came before him, knelt, and said: 'My lord, I beg you for God's sake to give me something of yours with which I may marry my two daughters, whom you see here.' Artaud, who was walking behind him, said to the poor knight: 'Sir knight, you are behaving discourteously by asking my lord, for he has given so much that he has nothing left to give.' The generous count turned toward Artaud and said: 'Sir villein, what you say—that I have nothing left to give—is not true. I still have you yourself. Here, sir knight: I give him to you, and I will guarantee him to you.' The knight was not taken aback; instead he seized Artaud by the cloak and said he would not release him until Artaud had settled with him. Before Artaud escaped him, he had settled with the knight for five hundred livres."
  locator: "sections 89–91, chapter XX, pp. 39–40"
  translation_notes: "Direct translation from Natalis de Wailly's Old French edition. The count is Henry I of Champagne, called Henry the Liberal or the Generous, who ruled from 1152 to 1181. The burgess's name in Joinville is Ertaus or Ertaut, conventionally modernized as Artaud de Nogent, not Érard. Joinville calls him the count's most trusted burgess and rich enough to build Nogent-l'Artaud castle with his own money. The scene is set at Troyes on Pentecost as Henry descends from his hall to hear Mass at Saint-Étienne. The poor knight kneels and asks for a gift to marry his two daughters, who are present. Artaud calls the request discourteous and says the count has nothing left. Henry calls him 'sire vilains,' gives Artaud himself to the knight, and promises to guarantee the gift. Contrary to Barbero's physical staging, the count does not grab or throw Artaud: the knight promptly seizes him by his cloak and refuses release until Artaud settles for five hundred livres. Joinville does not say that news then circulates through France or that knights rejoice; he introduces the tale as proof of Henry's worldly generosity. Because Joinville was born around 1224, more than forty years after Henry died, he could not have witnessed it. Parallel thirteenth-century exemplary versions in Jacques de Vitry and Stephen of Bourbon confirm that a story of this type circulated, while their variant details show that this is anecdotal tradition rather than a verbatim record of twelfth-century speech."
  confidence: high
  status: resolved
  script_treatment: qualify
  research_note: "Confirmed as an anecdote in Joinville sections 89–91, with corroborating but variant medieval transmissions. Evidence tier 1 for what Joinville's Old French text says and evidence tier 2 for the underlying event as a widely transmitted exemplary story. Correct Érard to Artaud, identify Henry the Liberal and the Troyes Pentecost setting, retain the two daughters and five-hundred-livre settlement, and make the poor knight—not the count—seize Artaud. Do not present Joinville as an eyewitness or the reported dialogue as stenographic speech."
- id: Q-023
  barbero_utterances: [U-00533–U-00549]
  barbero_timestamp: "41:49"
  attribution: "Le Goulu, a royal sergeant, as reported by Jean de Joinville"
  source_id: SRC-002
  original_language: fro
  original_text: "Li tiers jugemens que je vi rendre à Cezaire si fu teix, que uns serjans le roy, qui avoit à non le Goulu, mist main à un chevalier de ma bataille. Je m'en alai pleindre au roy. Li roys me dist que je m'en pooie bien souffrir, ce li sembloit; que il ne l'avoit fait que bouter. Et je li dis que je ne m'en soufferroie jà; et se il ne m'en fesoit droit, je lairoie son servise, puisque sui serjant boutoient les chevaliers. Il me fist faire droit, et li drois fu teix, selonc les usaiges dou pais, que li serjans vint en ma herberge deschaus, en chemise et en braies, sanz pluz, une espée toute nue en sa main, et s'agenoilla devant le chevalier, print l'espée par la pointe et tendi le plommel au chevalier, et li dist : « Sire, je vous ament ce que je mis main à vous; et vous ai aportée ceste espée pour ce que vous me copez le poing, se il vous plait. » Et je priai au chevalier que il li pardonaast son maltalent; et si fist-il."
  translation: "The third judgment that I saw given at Caesarea was this. One of the king's sergeants, named Le Goulu, laid hands on a knight of my company. I went to complain to the king. The king told me that, in his view, I could well let the matter pass, since the sergeant had only shoved him. I said I would not let it pass, and that if the king did not give me justice I would leave his service, since his sergeants were shoving knights. He had justice done for me, and the judgment, according to the customs of the country, was this: the sergeant came to my quarters barefoot, wearing only his shirt and breeches, with a bare sword in his hand. He knelt before the knight, took the sword by its point, offered the pommel to the knight, and said: 'My lord, I make amends to you for laying hands on you, and I have brought you this sword so that you may cut off my fist, if it pleases you.' I asked the knight to forgive his resentment against the sergeant, and he did so."
  locator: "sections 509–510, chapter XCIX, pp. 213–214; Caesarea judgment sequence introduced at section 505, p. 212"
  translation_notes: "Direct translation from Natalis de Wailly's Old French edition. Joinville says he personally witnessed this judgment at Caesarea while Louis was staying there. The royal sergeant is named Le Goulu. He 'laid hands' on a knight in Joinville's contingent; Louis initially minimizes the act as only a shove, but Joinville threatens to leave royal service if no justice is done. The text calls the resulting procedure a judgment 'according to the customs of the country,' meaning the local Caesarea or eastern setting; it should not be universalized as an ordinary rule throughout medieval Europe. The sergeant comes to Joinville's quarters barefoot and wearing only a shirt and braies or under-breeches. He does not extend his hand for cutting. He carries a bare sword, kneels, grips it by the point, and offers the pommel to the knight so that the knight may cut off his fist if he wishes. His formula makes amends for laying hands on the knight; it is not Barbero's generalized plea for pardon. Joinville then personally asks his knight to forgive the sergeant's hostility or offense, and the knight agrees. The source neither says that the custom was never enforced nor reports a crowd repeatedly urging pardon. Its structure plainly creates an opportunity for mercy, but Joinville does not explain whether mutilation was a regularly executed penalty or a formal symbolic threat."
  confidence: high
  status: resolved
  script_treatment: qualify
  research_note: "Confirmed verbatim in Joinville sections 509–510 and analyzed in scholarship as one of the local judgments he witnessed at Caesarea. Evidence tier 1 for Joinville's transmitted eyewitness account of the proceeding. Preserve the status conflict, Joinville's threat to resign, the barefoot and minimally clothed penitent, the naked sword, and the pardon; name Le Goulu, make him offer the sword rather than his hand, and avoid claiming either a universal medieval law or a documented rule that the threatened mutilation was never carried out."
