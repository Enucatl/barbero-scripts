  script_treatment: qualify
  research_note: "Confirmed verbatim in Joinville sections 297–298 and discussed in scholarship on crusading widowhood and remarriage. Evidence tier 1 for Joinville's transmitted participant account and his own providential interpretation. Preserve the chapel, funeral Mass, laughter, remarriage joke, rebuke, and reversal involving the six wives; name Hugh of Landricourt and correct the deaths to the next day's battle, while omitting the unsupported recent combat death, formal vigil, still-warm corpse, and any claim that the men were choosing which one would marry the widow."
