- id: C-001
  claim: "Jean de Joinville was a castle-owning lord who exercised public authority and served as seneschal of Champagne."
  transcript: [U-00008–U-00022]
  centrality: central
  supporting_sources:
    - source_id: SRC-002
      locator: "dedication, sections 1–2, pp. 1–2; section 735, pp. 305–306"
      note: "Joinville styles himself lord of Joinville and seneschal of Champagne; his refusal of the 1270 expedition explicitly presents protection of his people as a lordly duty."
    - source_id: SRC-006
      locator: "discussion of the Joinville family and hereditary seneschalship, pp. 24–25"
      note: "Places the family castle and hereditary office within the lordship and institutions of Champagne."
  conflicting_sources:
    - source_id: SRC-002
      locator: "dedication, section 1, p. 1"
      note: "The title is seneschal of Champagne, attached to its count, not royal administrator or regional representative of the king of France."
  status: resolved
  script_treatment: correct
  research_note: "Evidence tier 1 for Joinville's own titles and lordly responsibility, tier 3 for the office's institutional history. Preserve him as a castle-owning lord exercising seigneurial authority and as hereditary seneschal of the county of Champagne. Remove the claim that this made him the French king's local representative; avoid multiplying castles or specifying taxes without separate evidence."
- id: C-002
  claim: "Louis IX led two crusades; Joinville joined the expedition beginning in 1248 but not the later expedition in which Louis died."
  transcript: [U-00036–U-00043]
  centrality: supporting
  supporting_sources:
    - source_id: SRC-002
      locator: "sections 5, 734–738, pp. 2–3 and 306–307"
      note: "Joinville says he spent six years with Louis on crusade, records that Louis took the cross again, explains his own refusal, and reports Louis's fatal illness before Tunis."
    - source_id: SRC-007
      locator: "Introduction and chapters 2–5 on Louis IX's Egyptian expedition of 1248–1254 and Tunis expedition of 1270"
      note: "Modern crusade scholarship confirms the chronology, destinations, and Joinville's relationship to the first expedition."
  conflicting_sources: []
  status: resolved
  script_treatment: clarify
  research_note: "Evidence tiers 1 and 3. Preserve the two expeditions: Joinville left on the crusade begun in 1248, remained through the Egyptian defeat and Louis's four years in the Latin East, and returned in 1254. He refused Louis's 1270 expedition to Tunis, where Louis died on 25 August. Say 'in 1270,' not the vague 'in the Seventy'; conventional crusade numbering can be omitted."
- id: C-003
  claim: "In old age after Louis IX's canonization, Joinville wrote a commissioned life of the king that functions substantially as his own crusade memoir."
  transcript: [U-00044–U-00055]
  centrality: central
  supporting_sources:
    - source_id: SRC-002
      locator: "dedication, sections 1–6, pp. 1–3"
      note: "Joinville says Jeanne of Navarre asked him for a book of Louis's holy words and good deeds, dedicates the completed work to her son Louis, and divides it between pious government and deeds of arms."
    - source_id: SRC-008
      locator: "JONAS work notice 1839, dating, description, and manuscript witnesses"
      note: "Institutional manuscript record dates the work from Louis's 1297 canonization to completion in 1309 and describes it as direct, highly personal testimony written for Jeanne of Navarre."
    - source_id: SRC-009
      locator: "pp. 1825–1852, especially discussion of the 1309 completion, commission, structure, and manuscript tradition"
      note: "Scholarly assessment treats the work as a many-sided life whose unusually extensive crusade narrative is grounded in Joinville's personal memories."
  conflicting_sources: []
  status: resolved
  script_treatment: clarify
  research_note: "Evidence tiers 1–3. Louis was canonized in 1297. Jeanne of Navarre commissioned the book before her death in 1305; Joinville completed and dedicated it in October 1309 to her son Louis, future Louis X. It is formally a book of the saint's words and deeds, but its long central crusade narrative is intensely autobiographical. Composition in layers remains debated, and the presentation manuscript is lost; avoid saying Joinville simply decided on his own to write a memoir."
- id: C-004
  claim: "Louis IX attended several masses and divine offices daily, while Joinville ordinarily attended one daily mass."
  transcript: [U-00063–U-00070]
  centrality: supporting
  supporting_sources:
    - source_id: SRC-002
      locator: "section 54, chapter XI, pp. 23–24; section 501, p. 211"
      note: "Joinville gives Louis a daily sequence of sung hours, an unsung requiem mass, the sung mass of the day or saint, the office of the dead, vespers, and compline; overseas, Joinville's chaplains arranged his own mass around dawn before he went to the king."
  conflicting_sources: []
  status: resolved
  script_treatment: qualify
  research_note: "Evidence tier 1, but from Joinville's saintly portrait rather than an administrative schedule. Preserve Louis's unusually intensive daily devotions. Joinville also presents daily mass as his normal crusading routine, but this proves the practice in his organized overseas household, not that every ordinary knight everywhere necessarily heard exactly one mass every day."
- id: C-005
  claim: "Joinville's returning fleet stopped at Lampedusa and encountered a deserted hermitage where a sailor chose to remain."
  transcript: [U-00072–U-00096]
  centrality: sampled-incidental
  supporting_sources:
    - source_id: SRC-002
      locator: "sections 638–639, chapter CXXVI, pp. 268–269"
      note: "Joinville explicitly names Lempiouse, describes the rock-cut hermitage, cultivated garden, spring, oratory, two decayed bodies, a missing mariner, and three sacks of ship's biscuit left ashore."
    - source_id: SRC-010
      locator: "pp. 285–295, discussion of the return voyage and Lampedusa hermitage episode"
      note: "Scholarly analysis identifies the episode within the Acre-to-Hyères return voyage and examines its eremitic and providential framing."
  conflicting_sources:
    - source_id: SRC-002
      locator: "sections 638–639, pp. 268–269"
      note: "The captain only supposed the missing mariner had stayed to become a hermit; Joinville does not establish his intention, identify the two bodies as hermits, or call them bare skeletons."
  status: resolved
  script_treatment: qualify
  research_note: "Evidence tier 1 for Joinville's report and tier 3 for context. Preserve the Lampedusa stop on the return from the eastern Mediterranean, but keep the source's uncertainty: a mariner was missing when they re-embarked, the shipmaster guessed he had remained as a hermit, and Nicholas of Soissons left three sacks of biscuit. The island contained an apparently abandoned old hermitage, not proof that the whole island was empty."
- id: C-006
  claim: "Joinville had the sailor's rescue by the Virgin depicted in his chapel at Joinville and in church windows at Blécourt."
  transcript: [U-00115–U-00117]
  centrality: supporting
  supporting_sources:
    - source_id: SRC-002
      locator: "sections 650–651, chapter CXXIX, pp. 273–274"
      note: "After recounting the rescue of Dragonet of Montauban's squire, Joinville says he had the miracle depicted in his chapel at Joinville and in the windows at Blécourt."
    - source_id: SRC-010
      locator: "pp. 285–295, treatment of the maritime miracle and its commissioned representations"
      note: "Scholarly discussion confirms the two commemorative representations as part of Joinville's shaping of the miracle narrative."
  conflicting_sources:
    - source_id: SRC-002
      locator: "section 651, p. 274"
      note: "The rescued man was a squire, not a sailor; the text says Joinville had the scene 'painted' in his chapel and in the glazing at Blécourt, but does not securely establish a surviving fresco in a village church."
  status: resolved
  script_treatment: correct
  research_note: "Evidence tier 1 for the commission and tier 3 for interpretation. Say Joinville commissioned depictions of the squire's rescue in his chapel at Joinville and in stained-glass windows at Blécourt. Do not assert that either survives, that the first was necessarily a fresco, or that the rescued person was one of the sailors."
- id: C-007
  claim: "Public theological disputations between Christian clerics and rabbis formed part of medieval clerical culture, and Joinville locates one such story at Cluny."
  transcript: [U-00120–U-00131]
  centrality: supporting
  supporting_sources:
    - source_id: SRC-002
      locator: "sections 51–53, chapter X, pp. 21–23"
      note: "Joinville says Louis told him of a major disputation between clerics and Jews at the monastery of Cluny; the story ends in a knight assaulting the leading Jewish scholar and Louis warning laymen not to debate theology."
    - source_id: SRC-011
      locator: "pp. 148–150 on Louis IX, Christian missionizing, and the Cluny anecdote; pp. 227–229 on disputation and polemic"
      note: "Places Joinville's story within the increasingly coercive thirteenth-century culture of Christian-Jewish disputation and anti-Jewish missionizing."
  conflicting_sources:
    - source_id: SRC-002
      locator: "sections 51–53, pp. 21–23"
      note: "Joinville did not witness or locate the event chronologically: he explicitly presents it as a story Louis told him, and its lesson is hostile to lay disputation rather than a neutral public exchange."
  status: resolved
  script_treatment: qualify
  research_note: "Evidence tier 1 for Joinville's reported anecdote and tier 3 for its cultural setting. Preserve that formally staged Christian-Jewish disputations belonged to thirteenth-century clerical and royal polemic. Label the Cluny scene as a story Louis told Joinville, not as independently verified proceedings; its violence and coercive Christian framing are essential context."
- id: C-008
  claim: "Friday and Lenten fasting rules were experienced as strongly binding by thirteenth-century lay Christians such as Joinville."
  transcript: [U-00150–U-00157]
  centrality: supporting
  supporting_sources:
    - source_id: SRC-002
      locator: "sections 327–328, pp. 136–137"
      note: "Joinville stops eating when reminded that the food is meat and the day Friday; although both the emir and papal legate excuse the unintentional breach, he thereafter fasts on bread and water every Friday in Lent."
    - source_id: SRC-012
      locator: "pp. 327–340, especially the analysis of fasting among the religious practices expected of thirteenth-century laity"
      note: "Confession manuals show high clerical expectations for lay fasting while also revealing that observance was not uniform or always correct."
  conflicting_sources:
    - source_id: SRC-002
      locator: "section 328, p. 137"
      note: "The legate was angry at Joinville's severe compensatory bread-and-water fast because he was the only important lay lord remaining with Louis, so that penance was personal rigor rather than the ordinary required rule."
  status: resolved
  script_treatment: clarify
  research_note: "Evidence tiers 1 and 3. Preserve how binding Friday abstinence felt to Joinville. Distinguish abstinence from meat from fasting: his bread-and-water fast on later Lenten Fridays was self-imposed compensation, not the baseline rule, and the legate considered it imprudent in the circumstances."
- id: C-009
  claim: "After the crusaders' defeat, high-status captives could receive courteous treatment and be held for ransom while vulnerable ordinary prisoners faced much greater danger."
  transcript: [U-00159–U-00170]
  centrality: supporting
  supporting_sources:
    - source_id: SRC-002
      locator: "sections 318–330, pp. 132–137; sections 351–380, pp. 146–159"
      note: "Joinville records selection by presumed rank, compassionate treatment and medical help, the killing of sick captives unable to walk, threats against elite prisoners, and negotiations for Louis's release and ransom."
    - source_id: SRC-013
      locator: "chapter V, 'The First Phase of the Crusade: Victory and Disaster in Egypt,' pp. 63–124, especially the captivity and ransom documents"
      note: "A multilingual scholarly source collection corroborates the defeat, mass captivity, differential treatment, and political-ransom negotiations."
  conflicting_sources:
    - source_id: SRC-002
      locator: "sections 320–330 and 351–354, pp. 133–137 and 146–148"
      note: "Rank improved a captive's value but did not guarantee courtesy: Joinville was repeatedly threatened with death, and the imprisoned nobles were threatened during negotiations."
  status: resolved
  script_treatment: qualify
  research_note: "Evidence tiers 1 and 3. The April 1250 defeat and retreat from al-Mansurah ended in capture by Egyptian forces amid the Ayyubid-to-Mamluk transition, not simply 'the Turks.' Preserve the stark hierarchy: valuable elite captives had better prospects of protection and ransom, while sick and low-value prisoners were acutely vulnerable. Replace 'always treated courteously' with a probabilistic formulation."
- id: C-010
  claim: "Joinville considered himself related to Emperor Frederick II and discussed that connection with a Muslim emir."
  transcript: [U-00171–U-00175]
  centrality: sampled-incidental
  supporting_sources:
    - source_id: SRC-002
      locator: "sections 326–328, pp. 135–137"
      note: "The chief admiral of the galleys asks whether Joinville is related to Frederick II; Joinville answers that he understood his mother to be the emperor's first cousin, after which the admiral says he values him the more."
  conflicting_sources:
    - source_id: SRC-002
      locator: "section 326, p. 136"
      note: "The cautious wording 'I understood' reports Joinville's belief, not a demonstrated pedigree; the conversation is a direct question from his captor, not a cheerful comparison of family trees and mutual acquaintances."
  status: resolved
  script_treatment: qualify
  research_note: "Evidence tier 1 for what Joinville claimed. Frederick II was still alive during Joinville's capture in April 1250 and was prestigious to his captors. Preserve the encounter as Joinville's reported understanding that his mother, Béatrice d'Auxonne, was Frederick's first cousin; no reliable pedigree located establishes that exact degree, so do not state the kinship as independently proven or identify the unnamed chief admiral more precisely."
- id: C-011
  claim: "A layman's oath invoking God could bind him permanently, and the papal legate would not necessarily dispense him from it."
  transcript: [U-00198–U-00235]
  centrality: central
  supporting_sources:
    - source_id: SRC-002
      locator: "sections 567–568, chapter CX, pp. 238–239"
      note: "Joinville swears by God's aid that the offending knight will never again belong to his household; the legate refuses absolution because the oath is reasonable and the knight deserved the punishment."
    - source_id: SRC-014
      locator: "Summa theologiae II–II, question 89, articles 1, 3, 7, and 9"
      note: "A near-contemporary systematic account defines invocation of God as an oath, binds a lawful promissory oath, rejects sinful promises, and permits dispensation where the matter becomes harmful or otherwise unsuitable."
  conflicting_sources:
    - source_id: SRC-014
      locator: "II–II, q. 89, arts. 7 and 9"
      note: "Medieval theology did not make every spoken oath permanently immutable: lawfulness, possibility, harm, authority, release by a beneficiary, and dispensation all mattered."
  status: resolved
  script_treatment: qualify
  research_note: "Evidence tier 1 for both the episode and a contemporary theological framework. Preserve the legate's refusal in this case, including his stated reason that the oath was reasonable. Do not generalize it into inability to dispense any oath or say that merely uttering 'so help me God' always bound a person forever; Joinville himself presents the story as a warning against swearing rashly."
- id: C-012
  claim: "Joinville's reasoning presents service to God as justified in part by expectations of practical protection and longer life."
  transcript: [U-00245–U-00262]
  centrality: central
  supporting_sources:
    - source_id: SRC-002
      locator: "section 461, chapter XC, p. 193; compare sections 73–75, pp. 32–33"
      note: "Joinville rejects a fixed death date because God has power to lengthen or shorten lives; elsewhere he narrates divine protection and answered prayers as active causes in worldly events."
  conflicting_sources:
    - source_id: SRC-002
      locator: "section 461, p. 193"
      note: "The passage does not say that Christians serve God in exchange for longer life, nor does Joinville call the relationship a contract; those are Barbero's interpretive conclusions."
  status: resolved
  script_treatment: correct
  research_note: "Evidence tier 1. Preserve Joinville's concrete expectation that providence can alter danger and lifespan. Recast the supposed 'contract with God' as Barbero's interpretive gloss: Joinville argues for divine freedom against fatalism, but the cited text does not explicitly reduce service to God to a bargain for practical protection."
- id: C-013
  claim: "Joinville attributed to Bedouins a fatalistic belief that each person's date of death was predetermined."
  transcript: [U-00246–U-00253]
  centrality: supporting
  supporting_sources:
    - source_id: SRC-002
      locator: "sections 249–252 and 461, pp. 106–108 and 193"
      note: "Joinville twice attributes to Bedouins the belief that nobody can die before or after the assigned day and connects it to fighting without defensive armor."
    - source_id: SRC-015
      locator: "pp. 137–150, especially analysis of sections 249–252 and 461"
      note: "Literary-historical analysis confirms Joinville's attribution, compares the similar account in Jacques de Vitry, and treats it as an effort to connect an exoticized people's supposed belief and custom."
  conflicting_sources:
    - source_id: SRC-015
      locator: "pp. 143–146, comparison with Jacques de Vitry's varying Bedouin groups and descriptions"
      note: "The report belongs to a Latin-Christian ethnographic and literary tradition whose classifications of Bedouins, Muslims, and the 'law of Ali' are inaccurate and internally unstable."
  status: resolved
  script_treatment: qualify
  research_note: "Evidence tiers 1 and 3 for what Joinville wrote, not for a universal historical Bedouin or Muslim doctrine. Preserve the attribution as Joinville's report and his link between predestination and armor. Remove the unsupported image of a death date written on the forehead, and avoid presenting his account as proof of a single timeless 'Muslim fatalism.'"
