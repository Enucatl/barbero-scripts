- id: C-007
  claim: "Public theological disputations between Christian clerics and rabbis formed part of medieval clerical culture, and Joinville locates one such story at Cluny."
  transcript: [U-00120–U-00131]
  centrality: supporting
  supporting_sources:
    - source_id: SRC-002
      locator: "sections 51–53, chapter X, pp. 21–23"
      note: "Joinville says Louis told him of a major disputation between clerics and Jews at the monastery of Cluny; the story ends in a knight assaulting the leading Jewish scholar and Louis warning laymen not to debate theology."
    - source_id: SRC-011
      locator: "pp. 148–150 on Louis IX, Christian missionizing, and the Cluny anecdote; pp. 227–229 on disputation and polemic"
      note: "Places Joinville's story within the increasingly coercive thirteenth-century culture of Christian-Jewish disputation and anti-Jewish missionizing."
  conflicting_sources:
    - source_id: SRC-002
      locator: "sections 51–53, pp. 21–23"
