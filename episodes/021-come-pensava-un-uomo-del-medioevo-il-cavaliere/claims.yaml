  status: resolved
  script_treatment: qualify
  research_note: "Evidence tier 1 for Joinville's reported anecdote and tier 3 for its cultural setting. Preserve that formally staged Christian-Jewish disputations belonged to thirteenth-century clerical and royal polemic. Label the Cluny scene as a story Louis told Joinville, not as independently verified proceedings; its violence and coercive Christian framing are essential context."
- id: C-008
  claim: "Friday and Lenten fasting rules were experienced as strongly binding by thirteenth-century lay Christians such as Joinville."
  transcript: [U-00150–U-00157]
  centrality: supporting
  supporting_sources:
    - source_id: SRC-002
      locator: "sections 327–328, pp. 136–137"
      note: "Joinville stops eating when reminded that the food is meat and the day Friday; although both the emir and papal legate excuse the unintentional breach, he thereafter fasts on bread and water every Friday in Lent."
    - source_id: SRC-012
      locator: "pp. 327–340, especially the analysis of fasting among the religious practices expected of thirteenth-century laity"
      note: "Confession manuals show high clerical expectations for lay fasting while also revealing that observance was not uniform or always correct."
  conflicting_sources:
    - source_id: SRC-002
      locator: "section 328, p. 137"
      note: "The legate was angry at Joinville's severe compensatory bread-and-water fast because he was the only important lay lord remaining with Louis, so that penance was personal rigor rather than the ordinary required rule."
  status: resolved
  script_treatment: clarify
  research_note: "Evidence tiers 1 and 3. Preserve how binding Friday abstinence felt to Joinville. Distinguish abstinence from meat from fasting: his bread-and-water fast on later Lenten Fridays was self-imposed compensation, not the baseline rule, and the legate considered it imprudent in the circumstances."
- id: C-009
  claim: "After the crusaders' defeat, high-status captives could receive courteous treatment and be held for ransom while vulnerable ordinary prisoners faced much greater danger."
