- id: C-032
  claim: "Medieval aristocratic adults openly played board games, dice, blind man's buff, and hide-and-seek, often gambling on games."
  transcript: [U-00650–U-00658]
  centrality: sampled-incidental
  supporting_sources: [SRC-002, SRC-027, SRC-028]
  conflicting_sources: [SRC-002]
  status: resolved
  script_treatment: qualify
  research_note: >-
    Joinville §405 (pp. 169–170) gives unusually concrete evidence for elite adult
    gaming: Louis's brother Charles of Anjou was playing tables with Walter of
    Nemours, dice and board were in use, and Walter swept a large sum of money from
    the board when Louis angrily threw the gaming equipment into the sea. Tables is
    safest rendered as a backgammon-family game, not as modern backgammon or
    draughts. Lapina confirms that money or property commonly accompanied medieval
    dice, chess, and other gaming across social and confessional boundaries. The
    evidence also complicates any suggestion that Louis simply tolerated the custom:
    Joinville depicts him condemning it, and §702 records his prohibition of dice for
    royal officers and of dice manufacture. Courtly adult blind man's buff is
    documented, especially in later-medieval evidence surveyed by Figg, but the exact
    claim about aristocratic hide-and-seek was not securely established. Preserve the
    lively general point about adults playing and gambling, use tables/dice as the
    firm thirteenth-century example, and omit or explicitly qualify hide-and-seek and
    any implication that games were invariably played for money.
