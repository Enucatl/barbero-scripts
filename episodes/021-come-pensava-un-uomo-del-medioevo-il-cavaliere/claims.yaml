  script_treatment: clarify
  research_note: "Evidence tier 1. Preserve the vivid departure ritual: after receiving scrip and staff, Joinville walked barefoot in a pilgrim's shirt to Blécourt, Saint-Urbain, and other holy places, then avoided looking back at his castle and two children. His own prologue calls his time with Louis overseas six years, a rounded description of the 1248–1254 absence."
- id: C-015
  claim: "When Saracen galleys surrounded Joinville's vessel, he and his company chose surrender over an isolated proposal to seek martyrdom."
  transcript: [U-00292–U-00307]
  centrality: central
  supporting_sources:
    - source_id: SRC-002
      locator: "sections 317–320, pp. 132–133"
      note: "During the disastrous Nile retreat, four enemy galleys approached Joinville's vessel; his company agreed to surrender to them rather than be scattered and sold ashore, rejecting one cellarer's proposal that they let themselves be killed and go to paradise."
    - source_id: SRC-013
      locator: "chapter V, pp. 63–124, documents on the defeat, retreat, and captivity in April 1250"
      note: "The source collection places Joinville's surrender within the collapse of the crusader army after al-Mansurah."
  conflicting_sources:
    - source_id: SRC-002
      locator: "sections 318–320, pp. 132–133"
      note: "The company chose capture by the galleys because it offered better odds than capture ashore, not from an abstract rejection of martyrdom; the lone dissenter is described as a cellarer from Doulevant."
