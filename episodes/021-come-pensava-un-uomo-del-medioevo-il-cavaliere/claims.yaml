  centrality: supporting
  supporting_sources:
    - source_id: SRC-002
      locator: "sections 318–330, pp. 132–137; sections 351–380, pp. 146–159"
      note: "Joinville records selection by presumed rank, compassionate treatment and medical help, the killing of sick captives unable to walk, threats against elite prisoners, and negotiations for Louis's release and ransom."
