- id: C-010
  claim: "Joinville considered himself related to Emperor Frederick II and discussed that connection with a Muslim emir."
  transcript: [U-00171–U-00175]
  centrality: sampled-incidental
  supporting_sources:
    - source_id: SRC-002
      locator: "sections 326–328, pp. 135–137"
      note: "The chief admiral of the galleys asks whether Joinville is related to Frederick II; Joinville answers that he understood his mother to be the emperor's first cousin, after which the admiral says he values him the more."
  conflicting_sources:
    - source_id: SRC-002
      locator: "section 326, p. 136"
      note: "The cautious wording 'I understood' reports Joinville's belief, not a demonstrated pedigree; the conversation is a direct question from his captor, not a cheerful comparison of family trees and mutual acquaintances."
  status: resolved
  script_treatment: qualify
  research_note: "Evidence tier 1 for what Joinville claimed. Frederick II was still alive during Joinville's capture in April 1250 and was prestigious to his captors. Preserve the encounter as Joinville's reported understanding that his mother, Béatrice d'Auxonne, was Frederick's first cousin; no reliable pedigree located establishes that exact degree, so do not state the kinship as independently proven or identify the unnamed chief admiral more precisely."
- id: C-011
  claim: "A layman's oath invoking God could bind him permanently, and the papal legate would not necessarily dispense him from it."
  transcript: [U-00198–U-00235]
  centrality: central
  supporting_sources:
    - source_id: SRC-002
      locator: "sections 567–568, chapter CX, pp. 238–239"
      note: "Joinville swears by God's aid that the offending knight will never again belong to his household; the legate refuses absolution because the oath is reasonable and the knight deserved the punishment."
    - source_id: SRC-014
      locator: "Summa theologiae II–II, question 89, articles 1, 3, 7, and 9"
      note: "A near-contemporary systematic account defines invocation of God as an oath, binds a lawful promissory oath, rejects sinful promises, and permits dispensation where the matter becomes harmful or otherwise unsuitable."
  conflicting_sources:
    - source_id: SRC-014
      locator: "II–II, q. 89, arts. 7 and 9"
      note: "Medieval theology did not make every spoken oath permanently immutable: lawfulness, possibility, harm, authority, release by a beneficiary, and dispensation all mattered."
  status: resolved
  script_treatment: qualify
  research_note: "Evidence tier 1 for both the episode and a contemporary theological framework. Preserve the legate's refusal in this case, including his stated reason that the oath was reasonable. Do not generalize it into inability to dispense any oath or say that merely uttering 'so help me God' always bound a person forever; Joinville himself presents the story as a warning against swearing rashly."
- id: C-012
  claim: "Joinville's reasoning presents service to God as justified in part by expectations of practical protection and longer life."
  transcript: [U-00245–U-00262]
  centrality: central
  supporting_sources:
    - source_id: SRC-002
      locator: "section 461, chapter XC, p. 193; compare sections 73–75, pp. 32–33"
      note: "Joinville rejects a fixed death date because God has power to lengthen or shorten lives; elsewhere he narrates divine protection and answered prayers as active causes in worldly events."
