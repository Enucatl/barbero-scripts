      locator: "pp. 327–340, especially the analysis of fasting among the religious practices expected of thirteenth-century laity"
      note: "Confession manuals show high clerical expectations for lay fasting while also revealing that observance was not uniform or always correct."
  conflicting_sources:
    - source_id: SRC-002
      locator: "section 328, p. 137"
