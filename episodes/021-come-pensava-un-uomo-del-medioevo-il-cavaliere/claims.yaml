  script_treatment: qualify
  research_note: "Evidence tiers 1 and 3. Joinville supplies unusually concrete proof that prolonged overseas service was negotiated and paid: Louis retained men for money, and Joinville both contracted with the king and paid knights beneath his banner. Recast 'nobody serves for free anymore' as an oral exaggeration. In the thirteenth century pay was fundamental to sustaining such an expedition, but feudal, household, chivalric, and religious bonds still operated."
