  script_treatment: qualify
  research_note: "Evidence tiers 1 and 3. Preserve the sharp exchange and their pragmatic surrender, but locate it on the Nile during the April 1250 retreat. Four galleys approached; the group preferred staying together as captives to being dispersed and sold ashore. Present the martyrdom proposal as one man's view, not proof of a general opposition between rational knights and religious fanatics."
