- id: C-018
  claim: "By Joinville's time, extended knightly service—especially overseas crusading service—was normally contracted and paid rather than rendered without compensation under feudal obligation."
  transcript: [U-00373–U-00397]
  centrality: central
  supporting_sources:
    - source_id: SRC-002
      locator: "sections 412 and 437–441, pp. 172 and 182–184; sections 575–576, pp. 241–243"
      note: "Joinville records wages owed to him, Louis's effort to retain knights for specified sums, Joinville's own 2,000-livre contract and subcontracts, and royal sergeants dependent on the king's pay."
    - source_id: SRC-016
      locator: "chapters 4–6 and 10 on armies, cavalry, warfare and authority, and crusading warfare"
      note: "A general military history shows that paid service, tenure, lordship, household ties, obligation, and crusading commitment coexisted rather than forming a simple feudal-to-mercenary succession."
  conflicting_sources:
    - source_id: SRC-016
      locator: "chapters 4–6 and 10"
      note: "The evidence does not support saying that unpaid service had disappeared or that nine knights out of ten universally demanded wages; legal obligation and social or devotional motives remained important alongside contracts."
