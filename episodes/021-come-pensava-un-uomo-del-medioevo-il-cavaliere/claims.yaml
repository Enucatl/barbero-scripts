- id: C-034
  claim: "Robert of Artois overtook the Templar vanguard, prompting a competitive advance that broke the planned order and ended with Robert and most Templars killed."
  transcript: [U-00676–U-00693]
  centrality: central
  supporting_sources: [SRC-002, SRC-013]
  conflicting_sources: [SRC-013]
  status: resolved
  script_treatment: qualify
  research_note: >-
    Joinville §§218–219 (pp. 91–92) confirms the planned order at Mansurah on 8
    February 1250: the Templars were to form the vanguard and Robert of Artois's
    division was to follow. Robert's men passed them while pursuing the fleeing
    enemy. The Templars protested that their agreed precedence had been insulted;
    after Foucaut du Merle, holding Robert's bridle and described as deaf, shouted to
    attack, they followed pell-mell rather than suffer the dishonour of remaining
    behind. The force became trapped in Mansurah's narrow streets. Robert, Raoul of
    Coucy, and roughly three hundred knights were killed; Joinville says the Temple
    lost 280 armed mounted men. Contemporary narratives differ over responsibility
    and often blame Robert more directly for ignoring counsel, whereas Joinville
    partly displaces blame onto Foucaut and the honour competition. Say that most of
    this Templar contingent was destroyed, not most members of the Templar order.
- id: C-035
  claim: "Chivalric competition and Robert of Artois's premature charge were major causes of the crusade's military failure."
  transcript: [U-00688–U-00693]
  centrality: central
  supporting_sources: [SRC-002, SRC-013, SRC-017]
  conflicting_sources: [SRC-013, SRC-017]
  status: resolved
  script_treatment: qualify
  research_note: >-
    Joinville's sequence makes honour competition operationally causal: the Templars
    followed Robert's premature pursuit because letting him precede them would be a
    disgrace, and the resulting destruction was a grave tactical loss. It was a
    major contributor, but not a sufficient explanation for the crusade's eventual
    failure. Louis's main force continued fighting after the vanguard disaster;
    subsequent stalemate before Mansurah, Egyptian interdiction of the supply line,
    hunger, disease and dysentery, and the failed April withdrawal led to the army's
    collapse and Louis's capture. Preserve the charge as the clearest dramatic
    example of chivalric competition harming command, while describing it as one
    major tactical cause rather than the single cause of the entire campaign's
    defeat. Source narratives also moralize pride and recklessness, so their blame
    language should not substitute for the wider operational explanation.
- id: C-036
  claim: "During a retreat, Joinville and the count of Soissons held a bridge or causeway together while the crusader force withdrew."
  transcript: [U-00699–U-00725]
  centrality: central
  supporting_sources: [SRC-002, SRC-013]
  conflicting_sources: [SRC-002]
  status: resolved
  script_treatment: correct
  research_note: >-
    Joinville §§236–243 (pp. 99–103; see Q-031) places the scene during the battle of
    Mansurah on 8 February 1250, not during the army's April retreat toward Damietta.
    He and John, count of Soissons, agreed to hold a small bridge over a stream so the
    Turks could not strike King Louis in front and rear while formations were passing
    or repositioning. They were not literally alone: Pierre de Noville initially
    stood on Joinville's left, two royal sergeants fought before them, and the
    constable eventually brought royal crossbowmen whose arrival drove the attackers
    off. Joinville reports clods, darts or bolts, and Greek fire, as well as wounds to
    himself and his horse. Keep Soissons's memorable ladies'-chambers speech, but call
    the feature a small bridge, frame the action as protecting the king's rear during
    the battle, and avoid presenting it as two solitary knights holding a causeway
    while the whole crusader army retreated.
