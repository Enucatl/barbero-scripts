  locator: "TNA FO 371/2159, paper 34734, Crowe minute of 30 July 1914 on Goschen to Grey, telegram no. 102, Berlin, 29 July 1914; printed in BD XI, document 293, pp. 185–186, at p. 186"
  translation_notes: >-
