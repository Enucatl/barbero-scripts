- id: Q-022
  barbero_utterances: [U-00844–U-00852]
  barbero_timestamp: "56:30"
  attribution: "Kaiser Wilhelm II, marginal annotations"
  source_id: SRC-422
  corroborating_sources: [SRC-423]
  original_language: German
  original_text: >-
    aha! Der gemeine Täuscher!! Gemeiner Hundsfott! Mit solchen Hallunken mache ich nie ein
    Flottenabkommen! Das gemeine Krämergesindel hat uns mit Diners und Reden zu täuschen versucht.
    Aber er hütet sich das Wort auszusprechen, sondern droht uns statt dessen! Gemeiner Hundsfott!
    England allein trägt die Verantwortung für Krieg und Frieden nicht wir mehr! Das muß auch
    öffentlich klargestellt werden.
  translation: >-
    Aha! The vile deceiver! Vile blackguard! I will never make a naval agreement with such
    scoundrels! The vile shopkeeper rabble tried to deceive us with dinners and speeches. But he
    avoids saying the word and threatens us instead! Vile blackguard! England alone bears
    responsibility for war and peace, no longer we! That must also be made clear publicly.
  locator: "Die Deutschen Dokumente zum Kriegsausbruch 1914, 2nd ed., vol. II, document 368, pp. 86–89; Lichnowsky telegram no. 178, London, 29 July 1914; annotations dated 30 July 1914, 1 p.m."
  translation_notes: >-
    Direct translation of distinct marginal and concluding annotations printed with Lichnowsky's
    telegram. They do not form one continuous passage in the source. Barbero combines “der gemeine
    Täuscher” and “Gemeiner Hundsfott” into his description of Grey, summarizes “Hallunken” and
    “Krämergesindel” as English villains, and changes “responsibility for war and peace” into
    responsibility for a world war.
  confidence: high
  status: resolved
  script_treatment: qualify
  research_note: >-
    Evidence tier 1. Lichnowsky reported Grey's warning earlier on 29 July that Britain might not
    remain aloof if Germany and France entered the conflict. Wilhelm read the deciphered telegram
    on 30 July and treated Grey's warning as a threat intended to detach Germany from Austria.
    Document 368 is not Britain's reply to Bethmann Hollweg's later neutrality proposal, which is
    printed separately as document 373. Cite the secure published identifier rather than supplying
    an unchecked modern Politisches Archiv shelfmark, and present Barbero's wording as a dramatic
    composite paraphrase rather than a direct quotation.
- id: Q-023
  barbero_utterances: [U-00880–U-00889]
  barbero_timestamp: "59:50"
  attribution: "Theobald von Bethmann Hollweg, Prussian Ministry of State"
  source_id: SRC-422
  corroborating_sources: [SRC-424, SRC-425]
  original_language: German
  original_text: >-
    Der Herr Ministerpräsident betonte zum Schluß, daß alle Regierungen — einschließlich Rußlands —
    und die große Mehrheit der Völker an sich friedfertig seien, aber es sei die Direktion verloren
    und der Stein ins Rollen geraten. Als Politiker gäbe er jedoch, solange seine Demarche in Wien
    noch nicht abgeschlagen sei, die Hoffnungen und Bemühungen auf Erhaltung des Friedens noch
    nicht auf.
  translation: >-
    In conclusion, the Minister-President emphasized that all governments—including Russia's—and
    the great majority of the peoples were peaceably disposed in themselves, but that direction
    had been lost and the stone had started rolling. As a politician, however, so long as his
    démarche in Vienna had not yet been rejected, he had not abandoned his hopes and efforts to
    preserve peace.
  locator: "Die Deutschen Dokumente zum Kriegsausbruch 1914, vol. II, document 456, pp. 175–180, quotation at p. 178; protocol of the Royal Prussian State Ministry, Berlin, 30 July 1914"
  translation_notes: >-
    Direct translation of the official protocol's indirect-speech report, not a stenographic direct
    quotation. “Friedfertig” means peaceably disposed; “die Direktion verloren” means that
    direction or control had been lost. Barbero preserves the rolling-stone image but omits the
    lost-direction clause and Bethmann's immediately stated continuing effort to preserve peace.
  confidence: high
  status: resolved
  script_treatment: qualify
  research_note: >-
    Evidence tier 1 with archival and scholarly corroboration. The speaker is Theobald von Bethmann
    Hollweg in his Prussian capacity as Minister-President and president of the State Ministry,
    although he was simultaneously Imperial Chancellor. The setting was the Royal Prussian State
    Ministry, not an imperial cabinet or Kronrat. Attribute the formulation as Bethmann's words
    reported by the official protocol rather than placing an unqualified direct quotation in his
    mouth.
