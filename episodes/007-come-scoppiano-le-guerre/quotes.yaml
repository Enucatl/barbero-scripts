  source_id: SRC-401
  original_language: de
  original_text: "Entstände aber ein europäischer Krieg dadurch, daß Österreich gegen Serbien vorginge, und Rußland, durch die öffentliche Meinung gezwungen, und um nicht abermals eine Demütigung wie 1909 zu erleben, in Galizien einmarschiere, was uns zur Hilfsleistung veranlassen würde, so sei die Beteiligung Frankreichs unausbleiblich und die weiteren Folgen absehbar."
  translation: "But if a European war arose because Austria moved against Serbia, and Russia—compelled by public opinion and wishing not to suffer another humiliation like that of 1909—marched into Galicia, which would oblige us to give assistance, France's participation would be unavoidable and the further consequences foreseeable."
  locator: "Meine Londoner Mission, chapter 'Vorgeschichte des Krieges', account of Grey's warning of 4 December 1912"
  translation_notes: "Direct translation of Lichnowsky's German retrospective account of Grey's remarks; it is not a verbatim English transcript. Barbero closely compresses this reported scenario."
  confidence: medium
  status: resolved
  research_note: "The date, participants, and escalation sequence are established in Lichnowsky's published account; quote only as Lichnowsky's report of Grey, not as Grey's exact words."
