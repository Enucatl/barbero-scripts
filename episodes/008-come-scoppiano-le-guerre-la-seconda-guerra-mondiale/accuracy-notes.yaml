  - SRC-557
  - SRC-191
  - SRC-192
  - SRC-193
  category: disputed
  original_assertion: Britain and France guaranteed aid to Poland if attacked.
  proposed_correction: 'Evidence tier 1. On 31 March Chamberlain told the Commons that Britain—with France in the same position—would immediately lend all support in its power if action clearly threatened Polish independence and Poland considered it vital to resist (SRC-555–556). This was an interim unilateral assurance, not yet a signed Anglo-Polish alliance and not a promise against literally any attack. The reciprocal Anglo-Polish Agreement of Mutual Assistance was signed on 25 August; its public text applied to aggression by a European power (SRC-557). France already had alliance commitments to Poland and publicly associated itself with the March declaration. Barbero also overgeneralizes opinion: Déat''s ''Mourir pour Dantzig?'' was influential but French polling in July found a large majority willing to resist a German seizure by force (SRC-190, SRC-193). Preserve the guarantee, specify its conditional wording and stages, and avoid treating one headline as uniform British-French opinion.'
  decision: retain-original
- id: N-018
  transcript:
  - U-00490–U-00521
  claim_ids:
  - C-021
  quotation_ids: []
  source_ids:
  - SRC-558
  - SRC-559
  - SRC-581
  category: disputed
  original_assertion: Delay and mistrust undermined Anglo-French-Soviet negotiations.
  proposed_correction: 'Evidence tiers 1–2. Multi-archival scholarship confirms serious Soviet alliance proposals from 17 April, British reluctance and slow handling, greater French receptiveness, mutual suspicions, disputes over guarantees and the definition of indirect aggression, the weak authority and slow travel of the August military mission, and the unresolved transit problem (SRC-558). Responsibility was nevertheless shared: Poland and Romania feared Soviet entry, Soviet aims and reliability were distrusted, and Stalin retained alternatives. The neat rule that Moscow always replied next day while London and Paris waited weeks should be presented as an illustrative pattern only unless individual telegram intervals are cited. Most importantly, scholarship rejects treating Ambassador Merekalov''s 17 April meeting as the start of continuous secret Soviet–German political negotiations parallel to the Western talks (SRC-559). Economic contacts revived unevenly and became a political channel
    only later; the decisive turn accelerated in August. A contemporary French account assigned much late-stage delay to Poland''s refusal of Soviet transit (SRC-581). Preserve delay and mistrust; qualify Barbero''s inference about Stalin''s private decision and replace the seamless two-table summer with a phased, contested chronology.'
  decision: retain-original
- id: N-019
  transcript:
  - U-00533–U-00557
  claim_ids:
  - C-022
  quotation_ids: []
  source_ids:
  - SRC-561
  category: disputed
  original_assertion: Italian wars depleted resources and obstructed modern rearmament.
  proposed_correction: 'Evidence tier 2. Rodogno''s Oxford Handbook synthesis states that the Ethiopian and Spanish wars heavily affected the military budget and depleted matériel and armament reserves that Italian industry could not readily replace, obstructing development and modernization (SRC-561, pp. 247–248). It also identifies independent causes: industrial and raw-material limitations, technological and doctrinal conservatism, neglect of medium tanks and radar, resistance to all-metal monoplane fighters, inadequate training, administrative fragmentation, and Mussolini''s command system. Thus Barbero''s causal core is sound, including rapid obsolescence, but ''completely without resources,'' ''not a penny,'' and Italy as the only country unable to modernize are rhetorical overstatements. Italy continued very high military expenditure and introduced modern designs, but too slowly, in insufficient numbers, and without coherent preparation. Preserve depletion and unreadiness; describe
    severe scarcity and structural failure rather than literal insolvency or a purely budgetary explanation.'
  decision: retain-original
- id: N-020
  transcript:
  - U-00529–U-00532
  claim_ids:
  - C-023
  quotation_ids: []
  source_ids:
  - SRC-210
  - SRC-561
  - SRC-562
  category: disputed
  original_assertion: Germany had assured Italy that no immediate war was planned.
  proposed_correction: 'Evidence tiers 1–2. Ciano''s diary entry for 21–23 May 1939 records Ribbentrop repeating Germany''s intention and interest in securing a long period of peace—''at least three years'' (SRC-210, digital p. 489). This directly supports Barbero''s statement as an assurance received during the Pact of Steel visit. It was not a binding German promise in the treaty: article 3 imposed automatic assistance if either ally entered war, and no clause prohibited war before 1943; Rodogno characterizes Ribbentrop''s response to Italian unreadiness as vague reassurance (SRC-561). Contemporary diplomatic evidence also shows reports of a three-year understanding while warning that its precise formal status was uncertain (SRC-562). Preserve the sense of Italian reliance and subsequent alarm, but say Ribbentrop repeatedly assured Ciano orally, not that the Nazis furnished a treaty guarantee.'
  decision: retain-original
