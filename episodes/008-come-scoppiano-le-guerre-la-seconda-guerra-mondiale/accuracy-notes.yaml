  proposed_correction: Tier 1 correspondence and Ciano evidence plus tier 2 scholarship establish Italian non-belligerency and opportunistic discussion of possible gains. Use 'non-belligerency,' the Fascist government's chosen status, rather than neutrality; do not imply a settled annexation program or imminent intervention on 1 September.
  decision: retain-original
