  category: disputed
  original_assertion: Poland took Czechoslovak territory and expected anti-Soviet cooperation with Hitler.
  proposed_correction: Evidence tiers 1–2. The PISM documentary edition confirms that Poland delivered an ultimatum on 30 September 1938 and occupied Zaolzie (about 900 km²) on 2 October (SRC-151). It was opportunistic participation in Czechoslovakia's dismemberment, although Poland was not a Munich signatory and the disputed territory had a Polish majority. Ribbentrop's memorandum says Beck admitted aspirations toward Soviet Ukraine and the Black Sea (SRC-150), but the Polish record has Ribbentrop propose Ukrainian compensation and Beck resist alignment (SRC-151); a contemporary US telegram likewise reports Beck minimizing Hitler's Ukrainian interest (SRC-153). Recent archival scholarship distinguishes Polish eastern ambitions from willingness to join an anti-Soviet German alliance (SRC-152). Poland after Piłsudski was authoritarian, nationalist, military-influenced, and intensely anti-communist, but 'governed by colonels' is shorthand, not a complete constitutional description. Preserve
    Zaolzie and the dangerous illusion of workable relations with Germany; do not say Poland expected anti-Soviet cooperation as settled policy, and correct Beck's late-January meeting to Warsaw with Ribbentrop rather than Berlin with Hitler.
  decision: retain-original
- id: N-013
  transcript:
  - U-00393–U-00402
  claim_ids:
  - C-016
  quotation_ids: []
  source_ids:
  - SRC-510
  - SRC-151
  - SRC-551
  category: disputed
  original_assertion: Munich's territorial losses destabilized the remainder of Czechoslovakia.
  proposed_correction: 'Evidence tiers 1–2. Munich transferred the Sudeten areas on a rapid timetable without Czechoslovak participation in the decision (SRC-510); Poland then took Zaolzie and the First Vienna Award transferred southern Slovak and Ruthenian territory to Hungary (SRC-151). The ceded frontier included much of the purpose-built defensive system, materially worsening the rump state''s strategic position, although fortifications were incomplete and scholarship disputes claims that they made pre-Munich Czechoslovakia impregnable (SRC-551). Territorial loss, refugee flows, Slovak autonomism under German pressure, Hungarian revisionism, political radicalization, and constitutional restructuring all destabilized the Second Republic. Qualify Barbero''s ''lost the bulk of its industries'': major industrial districts and economic assets were lost, but important armament production, including Škoda, remained in the Czech lands and was captured in March 1939. Present cumulative strategic,
    economic, and political crippling, not industrial disappearance or spontaneous Slovak separatism alone.'
  decision: retain-original
- id: N-014
  transcript:
