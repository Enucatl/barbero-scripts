  - SRC-552
  category: disputed
  original_assertion: Hitler coerced Hácha before occupying Czechoslovakia.
  proposed_correction: Evidence tier 1. Hewel's official minutes show Hitler telling President Emil Hácha after 1 a.m. on 15 March that German troops would enter at 6 a.m. and resistance would be crushed (SRC-160). The signed declaration placed the Czech people and country in Hitler's hands; it did not literally say Hácha had requested German intervention (SRC-161). Göring, not Hitler, threatened Prague with air attack, as both the IMT judgment and French Ambassador Coulondre's same-day report attest (SRC-162, SRC-552). Contemporary reporting describes Hácha collapsing and receiving medical attention, but the consulted primary records do not establish a medically diagnosed heart attack or that doctors deliberately kept him awake. German forces occupied Bohemia and Moravia on 15 March; Slovakia had declared independence under German pressure on 14 March, so 'invaded Czechoslovakia' is serviceable shorthand but obscures the staged dissolution. Preserve coercion and occupation; attribute the
    bombing threat to Göring and describe collapse/injections rather than assert an infarction.
  decision: apply
