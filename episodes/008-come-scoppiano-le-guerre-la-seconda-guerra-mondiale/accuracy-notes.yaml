  category: disputed
  original_assertion: Germany demanded Danzig and escalated pressure after Polish refusal.
  proposed_correction: 'Evidence tiers 1–2. German proposals sought Danzig''s incorporation into the Reich plus an extraterritorial road and railway across the Corridor, paired with an extended non-aggression declaration and frontier guarantee; Hitler publicly recast Poland''s refusal as incomprehensible on 28 April and renounced the 1934 declaration (SRC-180–182). The demand was not first presented on 26 March: Ribbentrop raised it in October 1938, Hitler renewed it with Beck in January, and Germany intensified pressure in March; Warsaw''s formal 26 March reply rejected unilateral alteration while leaving negotiation open (SRC-182). Nazi control of the Free City''s government and paramilitary mobilization did escalate intimidation and incidents, but ''daily shootings'' and sole German responsibility for every frontier incident are not established by the consulted evidence. Preserve the engineered pressure and reversal of Hitler''s friendship rhetoric; correct the longer chronology and distinguish
    German public claims from the actual proposal and Polish response.'
  decision: retain-original
- id: N-017
  transcript:
  - U-00466–U-00489
  claim_ids:
  - C-020
  quotation_ids: []
  source_ids:
