- {id: C-001, claim: "The Versailles settlement created destabilizing German and minority grievances.", transcript: [U-00008–U-00073], centrality: central, supporting_sources: [SRC-002, SRC-003, SRC-011, SRC-012, SRC-500, SRC-501], conflicting_sources: [SRC-500], status: resolved, script_treatment: qualify, research_note: "Tier 1 treaty text and Nazi program establish concrete revisionist grievances; tier 2 scholarship supports the minority problem and traces the 'mutilated victory' grievance's transmission as political myth, but treats Versailles's overall harshness and causal weight as contested. Preserve grievance as a destabilizing factor, not a sufficient cause of war."}
- {id: C-002, claim: "Hitler rose to power in 1933 with revision of Versailles central to his appeal.", transcript: [U-00074–U-00085], centrality: supporting, supporting_sources: [SRC-011, SRC-502, SRC-503], conflicting_sources: [SRC-502], status: resolved, script_treatment: qualify, research_note: "Tier 1 Nazi program and Hitler's February 1933 policy statement make Versailles revision central. Tier 2 USHMM evidence corrects any electoral shorthand: the Nazis never won a pre-seizure majority and Hitler was appointed after elite bargaining."}
- {id: C-003, claim: "War resulted from Western and Hitlerian reciprocal miscalculation.", transcript: [U-00086–U-00103], centrality: central, supporting_sources: [SRC-504, SRC-505], conflicting_sources: [SRC-060, SRC-504], status: resolved, script_treatment: qualify, research_note: "Tier 2 historiography supports failed deterrence and reciprocal expectation errors, but disputes a symmetrical or exhaustive explanation: Hitler's expansionist aims and initiative matter, while appeasement also reflected strategic weakness and efforts to gain time."}
- {id: C-004, claim: "Western anti-Bolshevism made Nazi Germany appear strategically useful.", transcript: [U-00137–U-00168], centrality: central, supporting_sources: [SRC-020, SRC-021, SRC-022, SRC-041, SRC-042, SRC-100, SRC-101], conflicting_sources: [SRC-040], status: resolved, script_treatment: qualify, research_note: "Tier 1 diplomatic records and tier 2 scholarship show this attitude among influential British and French elites; retrospective wartime circulation of the exact Stalin variant is separately attested. Do not generalize it to 'the West': contemporaries also denounced accommodation and elite opinion was divided."}
- {id: C-005, claim: "Hitler exploited and deliberately created diplomatic opportunities.", transcript: [U-00169–U-00181], centrality: central, supporting_sources: [SRC-503, SRC-506, SRC-509], conflicting_sources: [SRC-060, SRC-504], status: resolved, script_treatment: qualify, research_note: "Tier 1 documents show deliberate pressure and controlled destabilization in Austria and Czechoslovakia. The planning-versus-opportunism debate remains real: avoid implying a fixed operational timetable for every step."}
- {id: C-006, claim: "Hitler directed Austrian Nazi destabilization before annexation.", transcript: [U-00182–U-00194], centrality: central, supporting_sources: [SRC-506, SRC-507], conflicting_sources: [], status: resolved, script_treatment: preserve, research_note: "Tier 1 Nuremberg telephone records document Berlin's coordination, coercion, and fabrication of an Austrian invitation; the Austrian government chronology corroborates Nazi street seizures and military threat."}
- {id: C-007, claim: "Seventy percent of German military vehicles broke down en route to Vienna.", transcript: [U-00195–U-00198], centrality: sampled-incidental, supporting_sources: [], conflicting_sources: [SRC-508], status: resolved, script_treatment: correct, research_note: "Tier 1 published participant memoir reports about 30 percent of the tanks broke down. The transcript's 70 percent appears to reverse the proportions; say roughly 30 percent of tanks, not 70 percent of all military vehicles. The figure rests on Guderian's retrospective account rather than a located contemporary maintenance return."}
- {id: C-008, claim: "The Austrian plebiscite returned 99 percent approval amid foreign acquiescence.", transcript: [U-00199–U-00211], centrality: supporting, supporting_sources: [SRC-506, SRC-070, SRC-071, SRC-080, SRC-081, SRC-082], conflicting_sources: [SRC-510], status: resolved, script_treatment: qualify, research_note: "The official total was 99.73 percent, but voting followed occupation and coercive propaganda and excluded Jews and known opponents. Foreign powers did not intervene, yet France and Britain protested; use 'non-intervention' rather than implying universal approval."}
- {id: C-009, claim: "Hitler directed Sudeten Nazi destabilization and propaganda.", transcript: [U-00212–U-00228], centrality: central, supporting_sources: [SRC-090, SRC-091, SRC-092, SRC-093, SRC-509], conflicting_sources: [SRC-093], status: resolved, script_treatment: qualify, research_note: "Tier 1 German diplomatic evidence establishes Reich direction and support of Henlein's party; contemporary press and analysis establish the propaganda campaign. FRUS reporting contradicts some German terror allegations, so present those atrocity stories as propaganda rather than fact."}
- {id: C-010, claim: "Britain and France pressed Prague to concede to German demands.", transcript: [U-00229–U-00233], centrality: central, supporting_sources: [SRC-511, SRC-130], conflicting_sources: [], status: resolved, script_treatment: preserve, research_note: "Tier 1 FRUS and Hansard records explicitly document the joint Anglo-French transfer proposal and the urgent pressure on Prague to accept it."}
- {id: C-011, claim: "The USSR proposed collective guarantees for Czechoslovakia but was disregarded.", transcript: [U-00234–U-00253], centrality: supporting, supporting_sources: [SRC-100, SRC-101, SRC-513], conflicting_sources: [SRC-102, SRC-513], status: resolved, script_treatment: qualify, research_note: "Tier 1 Litvinov statement offered jointly decided collective action, while British records and Taylor's synthesis show deep discounting of Soviet capacity. This was not an unconditional unilateral guarantee: Soviet treaty aid depended on French action and practical transit and military arrangements remained unresolved."}
- {id: C-012, claim: "Munich excluded Czechoslovakia and transferred the Sudetenland to Germany.", transcript: [U-00257–U-00310], centrality: central, supporting_sources: [SRC-514], conflicting_sources: [], status: resolved, script_treatment: preserve, research_note: "Tier 1 agreement text names Germany, Britain, France, and Italy as signatories and orders Czech evacuation followed by German occupation; Czechoslovakia was not a negotiating signatory, although it was assigned a place on the implementation commission."}
- {id: C-013, claim: "Chamberlain and Daladier sincerely prioritized peace because of First World War trauma.", transcript: [U-00288–U-00296], centrality: supporting, supporting_sources: [SRC-111, SRC-120, SRC-121, SRC-122, SRC-123, SRC-515], conflicting_sources: [SRC-505, SRC-515], status: resolved, script_treatment: qualify, research_note: "Primary declarations and tier 2 public-opinion scholarship support sincere peace aims and the Great War's shadow. Motives were not reducible to trauma: military unreadiness, rearmament, alliance limits, imperial commitments, and domestic opinion also constrained policy; Chamberlain and Daladier were not identical cases."}
- {id: C-014, claim: "Appeasement contributed to the war it intended to prevent.", transcript: [U-00338–U-00351], centrality: central, supporting_sources: [SRC-112, SRC-505, SRC-516], conflicting_sources: [SRC-505, SRC-516], status: resolved, script_treatment: qualify, research_note: "Tier 2 scholarship supports the argument that concessions weakened Czechoslovakia and failed to deter Hitler. It also credits appeasement with buying rearmament time under severe constraints. Present contribution, not monocausal inevitability or the claim that resistance in 1938 certainly would have prevented war."}
- id: C-015
  claim: "Poland took Czechoslovak territory and expected anti-Soviet cooperation with Hitler."
  transcript: [U-00359–U-00392]
  centrality: supporting
  supporting_sources: [SRC-141, SRC-150, SRC-151]
  conflicting_sources: [SRC-151, SRC-152, SRC-153]
  status: resolved
  script_treatment: qualify
  research_note: "Evidence tiers 1–2. The PISM documentary edition confirms that Poland delivered an ultimatum on 30 September 1938 and occupied Zaolzie (about 900 km²) on 2 October (SRC-151). It was opportunistic participation in Czechoslovakia's dismemberment, although Poland was not a Munich signatory and the disputed territory had a Polish majority. Ribbentrop's memorandum says Beck admitted aspirations toward Soviet Ukraine and the Black Sea (SRC-150), but the Polish record has Ribbentrop propose Ukrainian compensation and Beck resist alignment (SRC-151); a contemporary US telegram likewise reports Beck minimizing Hitler's Ukrainian interest (SRC-153). Recent archival scholarship distinguishes Polish eastern ambitions from willingness to join an anti-Soviet German alliance (SRC-152). Poland after Piłsudski was authoritarian, nationalist, military-influenced, and intensely anti-communist, but 'governed by colonels' is shorthand, not a complete constitutional description. Preserve Zaolzie and the dangerous illusion of workable relations with Germany; do not say Poland expected anti-Soviet cooperation as settled policy, and correct Beck's late-January meeting to Warsaw with Ribbentrop rather than Berlin with Hitler."
- id: C-016
  claim: "Munich's territorial losses destabilized the remainder of Czechoslovakia."
  transcript: [U-00393–U-00402]
  centrality: supporting
  supporting_sources: [SRC-510, SRC-151, SRC-551]
  conflicting_sources: [SRC-551]
  status: resolved
  script_treatment: qualify
  research_note: "Evidence tiers 1–2. Munich transferred the Sudeten areas on a rapid timetable without Czechoslovak participation in the decision (SRC-510); Poland then took Zaolzie and the First Vienna Award transferred southern Slovak and Ruthenian territory to Hungary (SRC-151). The ceded frontier included much of the purpose-built defensive system, materially worsening the rump state's strategic position, although fortifications were incomplete and scholarship disputes claims that they made pre-Munich Czechoslovakia impregnable (SRC-551). Territorial loss, refugee flows, Slovak autonomism under German pressure, Hungarian revisionism, political radicalization, and constitutional restructuring all destabilized the Second Republic. Qualify Barbero's 'lost the bulk of its industries': major industrial districts and economic assets were lost, but important armament production, including Škoda, remained in the Czech lands and was captured in March 1939. Present cumulative strategic, economic, and political crippling, not industrial disappearance or spontaneous Slovak separatism alone."
- id: C-017
  claim: "Hitler coerced Hácha before occupying Czechoslovakia."
  transcript: [U-00403–U-00422]
  centrality: central
  supporting_sources: [SRC-160, SRC-161, SRC-162, SRC-552]
  conflicting_sources: [SRC-160, SRC-161, SRC-552]
  status: resolved
  script_treatment: qualify
  research_note: "Evidence tier 1. Hewel's official minutes show Hitler telling President Emil Hácha after 1 a.m. on 15 March that German troops would enter at 6 a.m. and resistance would be crushed (SRC-160). The signed declaration placed the Czech people and country in Hitler's hands; it did not literally say Hácha had requested German intervention (SRC-161). Göring, not Hitler, threatened Prague with air attack, as both the IMT judgment and French Ambassador Coulondre's same-day report attest (SRC-162, SRC-552). Contemporary reporting describes Hácha collapsing and receiving medical attention, but the consulted primary records do not establish a medically diagnosed heart attack or that doctors deliberately kept him awake. German forces occupied Bohemia and Moravia on 15 March; Slovakia had declared independence under German pressure on 14 March, so 'invaded Czechoslovakia' is serviceable shorthand but obscures the staged dissolution. Preserve coercion and occupation; attribute the bombing threat to Göring and describe collapse/injections rather than assert an infarction."
- id: C-018
  claim: "The occupation caused Chamberlain to reassess Hitler's assurances."
  transcript: [U-00423–U-00443]
  centrality: central
  supporting_sources: [SRC-131, SRC-132, SRC-170, SRC-553]
  conflicting_sources: [SRC-553, SRC-515]
  status: resolved
  script_treatment: qualify
  research_note: "Evidence tiers 1–2. In Birmingham on 17 March—not in the Commons—Chamberlain publicly asked what reliance could be placed on further German assurances and whether Hitler sought world domination by force (SRC-170). Cabinet scholarship treats Prague as a major turning point leading toward the Polish guarantee, while noting a real historiographical dispute over abrupt rupture versus continuity with post-Munich containment and rearmament (SRC-553). Public opinion had also hardened before Prague, so the occupation was not the sole origin of reassessment (SRC-515). Replace Barbero's speculative psychology ('he hopes they tell him no') with the documented public challenge. Preserve the causal turning point, correct the venue, and avoid implying that every element of appeasement or negotiation ended on 17 March."
- id: C-019
  claim: "Germany demanded Danzig and escalated pressure after Polish refusal."
  transcript: [U-00444–U-00465]
  centrality: central
  supporting_sources: [SRC-180, SRC-181, SRC-182]
  conflicting_sources: [SRC-180, SRC-182]
  status: resolved
  script_treatment: qualify
  research_note: "Evidence tiers 1–2. German proposals sought Danzig's incorporation into the Reich plus an extraterritorial road and railway across the Corridor, paired with an extended non-aggression declaration and frontier guarantee; Hitler publicly recast Poland's refusal as incomprehensible on 28 April and renounced the 1934 declaration (SRC-180–182). The demand was not first presented on 26 March: Ribbentrop raised it in October 1938, Hitler renewed it with Beck in January, and Germany intensified pressure in March; Warsaw's formal 26 March reply rejected unilateral alteration while leaving negotiation open (SRC-182). Nazi control of the Free City's government and paramilitary mobilization did escalate intimidation and incidents, but 'daily shootings' and sole German responsibility for every frontier incident are not established by the consulted evidence. Preserve the engineered pressure and reversal of Hitler's friendship rhetoric; correct the longer chronology and distinguish German public claims from the actual proposal and Polish response."
- id: C-020
  claim: "Britain and France guaranteed aid to Poland if attacked."
  transcript: [U-00466–U-00489]
  centrality: central
  supporting_sources: [SRC-555, SRC-556, SRC-557]
  conflicting_sources: [SRC-191, SRC-192, SRC-193, SRC-555, SRC-557]
  status: resolved
  script_treatment: qualify
  research_note: "Evidence tier 1. On 31 March Chamberlain told the Commons that Britain—with France in the same position—would immediately lend all support in its power if action clearly threatened Polish independence and Poland considered it vital to resist (SRC-555–556). This was an interim unilateral assurance, not yet a signed Anglo-Polish alliance and not a promise against literally any attack. The reciprocal Anglo-Polish Agreement of Mutual Assistance was signed on 25 August; its public text applied to aggression by a European power (SRC-557). France already had alliance commitments to Poland and publicly associated itself with the March declaration. Barbero also overgeneralizes opinion: Déat's 'Mourir pour Dantzig?' was influential but French polling in July found a large majority willing to resist a German seizure by force (SRC-190, SRC-193). Preserve the guarantee, specify its conditional wording and stages, and avoid treating one headline as uniform British-French opinion."
- id: C-021
  claim: "Delay and mistrust undermined Anglo-French-Soviet negotiations."
  transcript: [U-00490–U-00521]
  centrality: central
  supporting_sources: [SRC-558, SRC-559]
  conflicting_sources: [SRC-558, SRC-559, SRC-581]
  status: resolved
  script_treatment: qualify
  research_note: "Evidence tiers 1–2. Multi-archival scholarship confirms serious Soviet alliance proposals from 17 April, British reluctance and slow handling, greater French receptiveness, mutual suspicions, disputes over guarantees and the definition of indirect aggression, the weak authority and slow travel of the August military mission, and the unresolved transit problem (SRC-558). Responsibility was nevertheless shared: Poland and Romania feared Soviet entry, Soviet aims and reliability were distrusted, and Stalin retained alternatives. The neat rule that Moscow always replied next day while London and Paris waited weeks should be presented as an illustrative pattern only unless individual telegram intervals are cited. Most importantly, scholarship rejects treating Ambassador Merekalov's 17 April meeting as the start of continuous secret Soviet–German political negotiations parallel to the Western talks (SRC-559). Economic contacts revived unevenly and became a political channel only later; the decisive turn accelerated in August. A contemporary French account assigned much late-stage delay to Poland's refusal of Soviet transit (SRC-581). Preserve delay and mistrust; qualify Barbero's inference about Stalin's private decision and replace the seamless two-table summer with a phased, contested chronology."
- id: C-022
  claim: "Italian wars depleted resources and obstructed modern rearmament."
  transcript: [U-00533–U-00557]
  centrality: supporting
  supporting_sources: [SRC-561]
  conflicting_sources: [SRC-561]
  status: resolved
  script_treatment: qualify
  research_note: "Evidence tier 2. Rodogno's Oxford Handbook synthesis states that the Ethiopian and Spanish wars heavily affected the military budget and depleted matériel and armament reserves that Italian industry could not readily replace, obstructing development and modernization (SRC-561, pp. 247–248). It also identifies independent causes: industrial and raw-material limitations, technological and doctrinal conservatism, neglect of medium tanks and radar, resistance to all-metal monoplane fighters, inadequate training, administrative fragmentation, and Mussolini's command system. Thus Barbero's causal core is sound, including rapid obsolescence, but 'completely without resources,' 'not a penny,' and Italy as the only country unable to modernize are rhetorical overstatements. Italy continued very high military expenditure and introduced modern designs, but too slowly, in insufficient numbers, and without coherent preparation. Preserve depletion and unreadiness; describe severe scarcity and structural failure rather than literal insolvency or a purely budgetary explanation."
- id: C-023
  claim: "Germany had assured Italy that no immediate war was planned."
  transcript: [U-00529–U-00532]
  centrality: supporting
  supporting_sources: [SRC-210, SRC-561, SRC-562]
  conflicting_sources: [SRC-561, SRC-562]
  status: resolved
  script_treatment: qualify
  research_note: "Evidence tiers 1–2. Ciano's diary entry for 21–23 May 1939 records Ribbentrop repeating Germany's intention and interest in securing a long period of peace—'at least three years' (SRC-210, digital p. 489). This directly supports Barbero's statement as an assurance received during the Pact of Steel visit. It was not a binding German promise in the treaty: article 3 imposed automatic assistance if either ally entered war, and no clause prohibited war before 1943; Rodogno characterizes Ribbentrop's response to Italian unreadiness as vague reassurance (SRC-561). Contemporary diplomatic evidence also shows reports of a three-year understanding while warning that its precise formal status was uncertain (SRC-562). Preserve the sense of Italian reliance and subsequent alarm, but say Ribbentrop repeatedly assured Ciano orally, not that the Nazis furnished a treaty guarantee."
- {id: C-024, claim: "Ribbentrop told Ciano war was decided and expected Western nonintervention.", transcript: [U-00561–U-00588], centrality: central, supporting_sources: [SRC-221, SRC-222, SRC-230, SRC-231, SRC-240], conflicting_sources: [SRC-223, SRC-230], status: resolved, script_treatment: qualify, research_note: "Tier 1 Ciano diary, its Nuremberg transmission, and German minutes establish German determination to attack Poland and Hitler's expectation that Britain and France would shrink from general war. Ribbentrop later denied the exact 'we want war' wording, and Ciano's wager narrative is a 1943 prison introduction absent from the contemporaneous diary; preserve the substance, not a verbatim exchange or wager. SRC-230 appears on both sides because its same-day diary entry supports the decision-for-war substance while its separate 1943 introduction exposes the wager's later transmission."}
- {id: C-025, claim: "The Anglo-French Moscow delegates lacked authority to sign.", transcript: [U-00603–U-00619], centrality: supporting, supporting_sources: [SRC-580], conflicting_sources: [SRC-580], status: resolved, script_treatment: correct, research_note: "Tier 2 archival scholarship confirms that Drax initially could negotiate but not sign and that Voroshilov displayed full powers. The blanket claim is inaccurate: Doumenc produced authority from Daladier to conclude a military convention, although it was not a conventional head-of-state plenipotentiary credential and he still depended on Paris. Distinguish the French and British mandates."}
- {id: C-026, claim: "Hitler's operational timetable required attack by late August.", transcript: [U-00628–U-00641], centrality: supporting, supporting_sources: [SRC-222, SRC-231], conflicting_sources: [], status: resolved, script_treatment: qualify, research_note: "Tier 1 German minutes record Hitler's argument that operations had to finish by mid-October because autumn weather would impede air and mechanized forces, with roughly six weeks required. This supports an intended late-August opening, but it was Hitler's planning rationale and estimate, not an independently demonstrated physical impossibility of attacking later."}
- {id: C-027, claim: "Polish refusal of Soviet transit blocked a tripartite military agreement.", transcript: [U-00648–U-00675, U-00719–U-00729], centrality: central, supporting_sources: [SRC-251, SRC-252, SRC-280, SRC-282, SRC-580, SRC-581, SRC-582], conflicting_sources: [SRC-283, SRC-580, SRC-582], status: resolved, script_treatment: qualify, research_note: "Tier 1 diplomatic reporting and tier 2 archival scholarship identify Polish refusal of Red Army passage as the immediate impasse in the military talks; later reports of the Polish liberty/soul maxim illustrate the fear behind refusal, while their unstable attribution requires caution. Do not make transit the sole cause: British-French delay and limited mandates, Polish fear of Soviet occupation, Soviet bargaining, and the parallel German option all mattered; Soviet officials also used transit as their public explanation after signing with Germany."}
- {id: C-028, claim: "Germany received an unambiguous British warning that Poland would be aided.", transcript: [U-00679–U-00689], centrality: central, supporting_sources: [SRC-260], conflicting_sources: [], status: resolved, script_treatment: preserve, research_note: "Tier 1 Henderson telegram records his 15 August warning to Weizsäcker that Britain would fulfill its obligations to Poland and that Germany should have no doubt about British determination. The meeting and clarity of the warning are directly documented."}
- {id: C-029, claim: "Soviet distrust and security needs drove the Nazi-Soviet pact.", transcript: [U-00766–U-00796], centrality: central, supporting_sources: [SRC-581, SRC-583], conflicting_sources: [SRC-583, SRC-585], status: resolved, script_treatment: qualify, research_note: "Tier 1 reporting and tier 2 post-Soviet archival scholarship support distrust of Anglo-French intentions and the desire to avoid immediate isolation or war. The motive was multi-causal: the German offer also promised neutrality in a German-Western war and territorial spheres in eastern Europe. Avoid 'absolute need' or the unsupported claim that Stalin already intended not to honor the pact."}
- {id: C-030, claim: "The Soviet-Japanese war influenced Stalin's pact calculation.", transcript: [U-00797–U-00819], centrality: supporting, supporting_sources: [SRC-291, SRC-292, SRC-584, SRC-586], conflicting_sources: [SRC-585, SRC-586], status: resolved, script_treatment: qualify, research_note: "Tier 2 specialist analysis based on Sorge reporting supports an influence of Nomonhan/Khalkhin Gol on Soviet foreign-policy calculation; primary German and Russian documentary witnesses establish Stalin's acceptance of Ribbentrop on 21 August, one day after the decisive Soviet offensive began. Direct evidence for Barbero's specific one-front causal formulation is limited. The conflict was undeclared but not wholly unknown, and the transcript's 70,000 casualties is not a secure total: Soviet archival statistics give 25,655 Soviet losses while official Soviet estimates of Japanese losses were heavily disputed."}
- {id: C-031, claim: "Hitler linked war timing to the continued leadership of himself and Mussolini.", transcript: [U-00842–U-00860], centrality: supporting, supporting_sources: [SRC-310], conflicting_sources: [], status: resolved, script_treatment: qualify, research_note: "Tier 1 Nuremberg document PS-798 explicitly lists Hitler's and Mussolini's continued existence among the favorable personal factors for acting. Preserve with source caution: no stenographic record survives and PS-798 is one of several differing versions of the 22 August commanders' address."}
- {id: C-032, claim: "The secret Nazi-Soviet protocol provided for Poland's partition.", transcript: [U-00875–U-00880], centrality: central, supporting_sources: [SRC-585], conflicting_sources: [SRC-585], status: resolved, script_treatment: qualify, research_note: "Tier 1 protocol text assigns German and Soviet spheres in Polish territory along the Narew-Vistula-San line, establishing partition in substance. It did not yet prescribe the final September occupation line or categorically abolish Poland: it left the desirability and borders of any independent Polish state to later political developments."}
- {id: C-033, claim: "Hitler postponed the 26 August attack after Mussolini disclosed unreadiness.", transcript: [U-00897–U-00907], centrality: central, supporting_sources: [SRC-350, SRC-351, SRC-610], conflicting_sources: [SRC-610], status: resolved, script_treatment: qualify, research_note: "Tier 1 correspondence establishes Mussolini's warning and the immediate-supply condition; the attack set for 26 August was then postponed. Do not make Italy the sole cause: the newly signed Anglo-Polish alliance was at least as important and the IMT judgment frames the delay as another attempt to detach Britain from Poland."}
- {id: C-034, claim: "Italy's supply list was intentionally impossible and equated to 17,000 trains.", transcript: [U-00908–U-00932], centrality: supporting, supporting_sources: [SRC-210, SRC-350, SRC-360], conflicting_sources: [SRC-360], status: resolved, script_treatment: qualify, research_note: "Tier 1 Italian diplomatic documents verify the enormous quantities and the confusion over whether delivery was required immediately; Ciano's same-day diary explicitly gives the 17,000-train calculation. The official list totals about 16.5 million tonnes, whereas Ciano's printed 170-million-tonne total is a tenfold error. Preserve the train figure as Ciano's contemporary estimate, not an independently audited logistical conversion. The sources support an evasive purpose but do not by themselves prove a formally agreed plan to make compliance impossible; present intent as contextual inference and make the nominal twelve-month horizon clear."}
- {id: C-035, claim: "Germany's worker request began a larger trajectory of Italian labor in Germany.", transcript: [U-00933–U-00942], centrality: supporting, supporting_sources: [SRC-370, SRC-611, SRC-612], conflicting_sources: [SRC-611, SRC-612], status: resolved, script_treatment: correct, research_note: "Tier 1 Hitler correspondence verifies the request for workers, but organized Italian labor migration to Germany had already begun in 1938 and tens of thousands went in both 1938 and 1939. Recast this as expansion of an existing flow; distinguish initially recruited civilians from increasingly coercive recruitment and the separate mass forced labor of Italian military internees after 1943. Avoid 'millions': the documented civilian flow was roughly 500,000 over 1938–1943."}
- {id: C-036, claim: "European governments prepared civilians for aerial and gas attack.", transcript: [U-00943–U-00971], centrality: sampled-incidental, supporting_sources: [SRC-613, SRC-614], conflicting_sources: [], status: resolved, script_treatment: qualify, research_note: "Tier 1 institutional collections verify widespread shelter marking, civilian gas-mask distribution, evacuation planning, and other passive-air-defense measures before September 1939. Preserve the continental montage only selectively: the broad claim is secure, but the specific Vincennes-zoo evacuation, suspension of French trains, and individual Italian restrictions were not independently established in this pass."}
- {id: C-037, claim: "Germany's deadline and withholding of terms obstructed genuine negotiation.", transcript: [U-00972–U-01014], centrality: central, supporting_sources: [SRC-381, SRC-382, SRC-390, SRC-391, SRC-401, SRC-402, SRC-410, SRC-411], conflicting_sources: [SRC-411], status: resolved, script_treatment: preserve, research_note: "Tier 1 British and German-facing records establish the one-day plenipotentiary demand, Britain's immediate objection that it was unreasonable, British efforts to secure direct talks and Polish restraint, Ribbentrop's rapid oral reading, and his refusal to hand over the proposals. Schmidt confirms the refusal but qualifies Henderson's description of the meeting's performance; preserve the obstruction finding without relying on every detail of Henderson's hostile characterization."}
- {id: C-038, claim: "Hitler signed the attack order before Poland's belated diplomatic approach.", transcript: [U-01015–U-01027], centrality: central, supporting_sources: [SRC-420, SRC-421, SRC-610, SRC-615], conflicting_sources: [], status: resolved, script_treatment: preserve, research_note: "Tier 1 final directive dated 31 August and Polish diplomatic reporting establish that the attack decision preceded Lipski's 6:30 p.m. meeting with Ribbentrop. The surviving order is timed 12:40 p.m.; preserve that time only with the facsimile locator, and distinguish Poland's early-afternoon instruction from Lipski's evening approach."}
- {id: C-039, claim: "German security services staged Gleiwitz as a Polish attack pretext.", transcript: [U-01028–U-01062], centrality: central, supporting_sources: [SRC-430, SRC-431, SRC-432], conflicting_sources: [SRC-431], status: resolved, script_treatment: correct, research_note: "Tier 1 Naujocks affidavit and tier 2 critical reconstruction establish an SD false-flag seizure and Polish-language broadcast. Correct the embellishments: the best reconstruction has five or six attackers in civilian clothes at Gleiwitz, not twelve men in Polish uniforms; Polish uniforms pertain to related border fabrications. The 'Grandmother died' code appears in Naujocks's later interview, not his 1945 affidavit, and the precise identity and dress of the deposited victim remain less secure."}
- {id: C-040, claim: "Halifax acted on incomplete information while invasion began.", transcript: [U-01063–U-01095], centrality: supporting, supporting_sources: [SRC-420, SRC-440, SRC-441, SRC-442], conflicting_sources: [], status: resolved, script_treatment: qualify, research_note: "Tier 1 telegrams establish the lag: Halifax's Warsaw instruction was sent at 12:50 a.m.; Kennard decoded it at 4 a.m. and later replied that Lipski had already met Ribbentrop at 6:30 p.m. on 31 August and that invasion made execution useless. Avoid mind-reading that Halifax still believed Germany sincere; say his mediation instruction lacked the latest outcome and was overtaken by events."}
- {id: C-041, claim: "Britain and France declared war two days after Germany invaded Poland.", transcript: [U-01096–U-01098], centrality: supporting, supporting_sources: [SRC-616, SRC-617, SRC-619], conflicting_sources: [], status: resolved, script_treatment: preserve, research_note: "Tier 1 parliamentary records and contemporary reporting verify invasion on 1 September and both declarations on 3 September: Britain's ultimatum expired at 11 a.m. and France's at 5 p.m. Preserve the two-day interval while noting it contained ultimatums and continued diplomatic exchanges, not simple inaction."}
- {id: C-042, claim: "Italian leaders stayed out while considering possible territorial gains.", transcript: [U-01099–U-01102], centrality: supporting, supporting_sources: [SRC-300, SRC-370, SRC-450, SRC-618], conflicting_sources: [], status: resolved, script_treatment: qualify, research_note: "Tier 1 correspondence and Ciano evidence plus tier 2 scholarship establish Italian non-belligerency and opportunistic discussion of possible gains. Use 'non-belligerency,' the Fascist government's chosen status, rather than neutrality; do not imply a settled annexation program or imminent intervention on 1 September."}
