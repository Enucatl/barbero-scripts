- id: Q-046
  barbero_utterances:
  - U-01099–U-01102
  barbero_timestamp: '66:43'
  attribution: Galeazzo Ciano diary, reporting Benito Mussolini
  source_id: SRC-210
  original_language: it
  original_text: '13 agosto: ''Le reazioni del Duce sono di varia natura. Dapprima mi dà ragione. Poi dice che l''onore lo obbliga a marciare con la Germania. Infine afferma che vuole la sua parte di bottino in Croazia e in Dalmazia.'' 15 agosto: ''Poiché, a suo avviso, è ancora possibile – se pure difficile – che le democrazie abbozzino. In tal caso non ci conviene esserci urtati con la Germania, poiché anche noi dobbiamo prendere la nostra parte di bottino. Bisogna quindi trovare una soluzione che permetta: a) se le democrazie attaccano, di sganciarci “onorevolmente” dai tedeschi; b) se le democrazie incassano, di cogliere l''occasione per saldare, una volta per tutte, i conti con Belgrado.'''
  translation: '13 August: ''The Duce''s reactions are varied. At first he agrees with me. Then he says that honor obliges him to march with Germany. Finally he states that he wants his share of the spoils in Croatia and Dalmatia.'' 15 August: ''For in his view it is still possible—though difficult—that the democracies will back down. In that case it would not suit us to have clashed with Germany, since we too must take our share of the spoils. We must therefore find a solution that allows us: (a) if the democracies attack, to disengage ourselves “honorably” from the Germans; (b) if the democracies swallow it, to seize the opportunity to settle accounts with Belgrade once and for all.'''
  locator: Ciano, Diario 1937–1943, entries for 13 August 1939, digital p. 542, and 15 August 1939, digital pp. 543–544, Renzo De Felice ed., 3rd BUR ed. (1996), Liber Liber electronic edition (SRC-210). The 13 August formulation and its Croatia/Dalmatia context are independently quoted and discussed by Monzali, pp. 356–357, especially p. 357 and note 37 (SRC-450).
  translation_notes: Direct English translation. The 13 August entry has 'la sua parte' (his share), while the 15 August entry has 'la nostra parte' (our share), the form closest to Barbero's paraphrase. 'Abbozzino' is rendered contextually as 'back down' and 'incassano' as 'swallow it.' Barbero omits the specified targets—Croatia, Dalmatia, and ultimately Belgrade—and relocates the mid-August conditional calculation to the situation after the invasion of Poland.
  confidence: high
  status: resolved
  research_note: 'Verdict: the ''share of the spoils'' wording is confirmed, but Barbero compresses two mid-August diary entries and shifts their setting. Evidence tier 1: Ciano''s dated private diary in the De Felice edition (SRC-210); Monzali''s archival history independently confirms the 13 August phrase and its Adriatic context (SRC-450). Speaker/date/setting/document type: on 13 August 1939, after returning from his meetings with the German leadership and reporting to Mussolini, Ciano recorded Mussolini''s changing reaction and desire for spoils in Croatia and Dalmatia. On 15 August he recorded the related conditional calculation: Italy should be able to disengage if Britain and France fought, but profit against Belgrade if they backed down. Transmission: a participant''s confidential diary attributing words to Mussolini, not a stenographic transcript and not Ciano voicing a settled Italian policy on 1 September. Barbero preserves the opportunistic theme and the 15 August phrase ''nostra
    parte di bottino,'' but the cited diary evidence does not support placing it after Hitler accepted Italian nonparticipation in the war. Qualify the script by dating the thought to 13–15 August and retaining its explicit Balkan targets; it describes conditional prewar maneuvering, not simply Italy waiting after the invasion to collect unspecified gains.'
  quotation_kind: direct
  verdict: confirmed
  source_replacement: eligible
