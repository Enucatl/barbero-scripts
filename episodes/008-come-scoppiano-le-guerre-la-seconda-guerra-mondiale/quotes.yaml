  translation_notes: Direct translation of D’Annunzio’s Italian. Barbero uses only the later compact label, ‘la vittoria mutilata,’ rather than quoting the original sentence. The original addresses personified Victory in the future tense (‘non sarai mutilata’) and appeared before the armistice and before the Paris Peace Conference. The phrase was soon detached from the poem and became a postwar political slogan alleging that Italy’s sacrifices had not received adequate territorial compensation.
