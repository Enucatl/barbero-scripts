  attribution: Theodor Cardinal Innitzer and the other five Austrian diocesan bishops, Solemn Declaration of 18 March 1938
  source_id: SRC-070
  original_language: de
  original_text: Wir sind auch der Überzeugung, daß durch das Wirken der nationalsozialistischen Bewegung die Gefahr des alles zerstörenden gottlosen Bolschewismus abgewehrt wurde. Die Bischöfe begleiten dieses Wirken für die Zukunft mit ihren besten Segenswünschen und werden auch die Gläubigen in diesem Sinne ermahnen. Am Tage der Volksabstimmung ist es für uns Bischöfe selbstverständliche nationale Pflicht, uns als Deutsche zum Deutschen Reich zu bekennen, und wir erwarten auch von allen gläubigen Christen, daß sie wissen, was sie ihrem Volke schuldig sind.
  translation: We are also convinced that the work of the National Socialist movement has warded off the danger of utterly destructive, godless Bolshevism. The bishops accompany this work into the future with their best blessings and will also exhort the faithful in this spirit. On the day of the plebiscite it is for us bishops a self-evident national duty, as Germans, to declare ourselves for the German Reich, and we also expect all faithful Christians to know what they owe their people.
  locator: ‘Feierliche Erklärung,’ Vienna, 18 March 1938, reproduced in the Austrian Bishops' Conference commemorative study, pp. 17–20; facsimile and English transcription of the Nazi propaganda poster in USHMM Experiencing History
  translation_notes: 'Direct translation of the relevant German clauses. Barbero correctly condenses the bishops'' endorsement of the new order, their anti-Bolshevik justification, their blessing, and their instruction to the faithful to support union with the Reich. The document does not say that Catholics must ‘thank the Lord,’ and it frames their obligation as voting for the Reich and knowing what they owe their people, not simply obeying the new government. Innitzer did not issue this passage alone: six Austrian bishops signed it. His separate covering letter said they acted voluntarily and without coercion and ended with a handwritten ‘und Heil Hitler!’; the three texts were later combined on a mass propaganda poster.'
  confidence: high
  status: resolved
  research_note: 'Verdict: confirmed in substance. Evidence tier 1: USHMM displays and transcribes the surviving propaganda poster containing the signed declaration, preface, and Innitzer covering letter; the Austrian Bishops'' Conference study prints the German documents and reconstructs their drafting and transmission. The signed declaration is contemporary, but was negotiated under acute Nazi pressure: two bishops had recently been detained, Gauleiter Bürckel rejected their amended draft, and his emissary said further alteration was impossible. The bishops nonetheless signed it and arranged church proclamation, while the regime''s nationwide poster use and Innitzer''s separate handwritten Hitler salute went beyond what the other bishops anticipated. Qualify Barbero''s wording and attribute the declaration collectively. Supporting source: SRC-071.'
  quotation_kind: near-direct
  verdict: confirmed-in-substance
