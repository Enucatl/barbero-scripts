  research_note: 'Verdict: composite—the list and its major figures are exact, while the transmission anecdote needs correction. Evidence tier 1: the official Italian diplomatic series prints Mussolini''s 26 August letter as document 293, Hitler''s reply as document 298, and Attolico''s corrective telegram as document 299 (SRC-360); Ciano''s contemporaneous diary entry (SRC-210) independently records the meeting, the instruction against ‘criminal optimism,’ Attolico''s demand for immediate delivery, and the 17,000-train estimate. Speaker/date/setting/document type: Mussolini''s formal letter to Hitler, drafted after the 10 a.m. Palazzo Venezia meeting and telephoned by Ciano to Attolico at 12:10 for immediate delivery; Ciano''s diary is a same-day first-person account, not a transcript of Attolico and Ribbentrop. Provenance and transmission: the official letter expressly frames the raw-material quantities as requirements for twelve months and reserves ‘immediato’ for 150 anti-aircraft batteries.
    Hitler''s reply says Attolico, citing oral instructions, made immediate pre-hostilities delivery a decisive condition; Attolico''s 3:35 p.m. telegram then calls it an equivoco and says he corrected it. Ciano adds that Attolico later claimed the mistake was deliberate. No primary text located records Ribbentrop asking ‘by when’ or Attolico improvising the one-word reply ‘subito.’ The official quantities total 16,534,620 tonnes, consistent with the familiar rounded ‘almost 17 million’; Ciano''s printed 170 million is a tenfold numerical error, although his 17,000-train estimate is explicit. Preserve the list and train figure, but attribute the latter to Ciano, replace the improvised-dialogue version with the documented sequence, and make the twelve-month horizon clear. The nickname ‘lista del molibdeno’ is later usage, not the document''s title.'
