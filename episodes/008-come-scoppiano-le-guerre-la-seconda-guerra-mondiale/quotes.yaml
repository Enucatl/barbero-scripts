  original_text: In quest'ora storica desidero esprimere a Vostra Maestà la mia profonda soddisfazione che i nostri due popoli siano legati l'uno all'altro da una infrangibile amicizia e comunanza di destini.
  translation: In this historic hour I wish to express to Your Majesty my profound satisfaction that our two peoples are bound to one another by an unbreakable friendship and community of destiny.
  locator: L'Avvenire d'Italia, 23 May 1939, p. 6, telegram from Adolf Hitler to Victor Emmanuel III sent for the signing of the Pact of Friendship and Alliance; same issue, p. 1, headlines and reports on the pact
  translation_notes: Direct translation of the Italian newspaper text, itself an Italian rendering of Hitler's telegram. The exact formula 'amicizia indefettibile fra i nostri due popoli' was not located. The contemporaneous paper instead prints the very close 'i nostri due popoli ... [legati] da una infrangibile amicizia e comunanza di destini.' Its coverage also calls the solidarity 'incrollabile,' the union 'indissolubile' and 'inscindibile,' and reports enthusiastic press comment. Barbero therefore appears to substitute the synonymous, characteristically Fascist adjective 'indefettibile' for attested propaganda wording rather than quote a recoverable headline verbatim.
