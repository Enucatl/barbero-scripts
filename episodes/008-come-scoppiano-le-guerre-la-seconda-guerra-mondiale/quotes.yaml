  status: resolved
  research_note: 'Verdict: composite, with the substance confirmed. Evidence tier 1: three documents published contemporaneously by the British Foreign Office in Cmd. 6106 preserve Henderson''s same-evening telegrams and the official translation of Hitler''s written reply. Speaker/date/setting: Sir Nevile Henderson reporting to Foreign Secretary Lord Halifax after his 7:15 p.m. meeting with Hitler and Ribbentrop at the Reich Chancellery, Berlin, Tuesday 29 August 1939; Hitler''s formal note was handed to Henderson at that meeting. Document type/transmission: confidential diplomatic telegrams received in London at 9:15 and 10:25 p.m., plus an official translated German note, all published in the September 1939 British War Blue Book. Barbero combines Henderson document 80''s characterization and reported speech with documents 78–79''s plenipotentiary deadline. He also softens the ultimatum-like written demand into willingness to negotiate and mistranslates ''far less reasonable'' as ''non
    era simpatico.'' Preserve the stormy-interview language and friendship/vital-interests contrast, but translate ''reasonable'' accurately and explicitly characterize the next-day full-powers demand as a separate written condition that Henderson challenged as sounding like an ultimatum.'
