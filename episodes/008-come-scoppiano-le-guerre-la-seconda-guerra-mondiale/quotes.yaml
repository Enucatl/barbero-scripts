  attribution: Neville Chamberlain
  source_id: SRC-170
  original_language: en
  original_text: Does not the question inevitably arise in our minds, if it is so easy to discover good reasons for ignoring assurances so solemnly and so repeatedly given, what reliance can be placed upon any other assurances that come from the same source? [...] Is this the end of an old adventure, or is it the beginning of a new? Is this the last attack upon a small State, or is it to be followed by others? Is this, in fact, a step in the direction of an attempt to dominate the world by force?
  translation: Does not the question inevitably arise in our minds, if it is so easy to discover good reasons for ignoring assurances so solemnly and so repeatedly given, what reliance can be placed upon any other assurances that come from the same source? [...] Is this the end of an old adventure, or is it the beginning of a new? Is this the last attack upon a small State, or is it to be followed by others? Is this, in fact, a step in the direction of an attempt to dominate the world by force?
  locator: Speech at Birmingham, 17 March 1939; British War Blue Book, Cmd. 6106, Miscellaneous No. 9 (1939), document no. 9, paragraphs beginning 'Does not the question inevitably arise' and 'But the events which have taken place this week'; Yale Avalon transcription lines 45 and 48–50
  translation_notes: 'Direct translation from the official English publication. Barbero translates the key wording closely, with minor simplification: ''assurances'' becomes ''garanzie,'' ''any other assurances'' becomes ''altre garanzie,'' and ''come from the same source'' becomes ''ci verranno dalla stessa parte.'' He omits Chamberlain''s intervening discussion of the Rhineland, Anschluss, and Sudetenland and also omits the first question, ''Is this the end of an old adventure, or is it the beginning of a new?'' Most importantly, the speech was not delivered in the House of Commons: Chamberlain spoke that evening in Birmingham to a hall audience and radio listeners. In the speech itself he distinguishes this address from the Commons debate held two days earlier, on Wednesday 15 March.'
  confidence: high
  status: resolved
  research_note: 'Verdict: confirmed in substance. Evidence tier 1: the text was published by the British Government as document 9 in Cmd. 6106, and Yale''s Avalon Project supplies a complete documentary transcription. Speaker/date/setting: Prime Minister Neville Chamberlain, Birmingham, evening of 17 March 1939, in a public address heard both in the hall and by broadcast listeners; not the House of Commons. Document type and transmission: public political speech, contemporaneously broadcast and later reproduced in the official 1939 British War Blue Book. Barbero accurately translates two passages from the same speech but telescopes non-contiguous paragraphs and misidentifies the venue; the speech itself explicitly says the Commons debate occurred on 15 March. Preserve the quotation but correct the setting to Birmingham and mark the ellipsis between the two passages.'
