  research_note: 'Verdict: confirmed in substance. Evidence tier 1: GHDI, a German Historical Institute documentary project, transcribes the German passage and identifies its source as the contemporaneous printed speech edition; the Harvard Nuremberg Trials Project preserves the one-page English evidentiary extract with date, authorship, evidence code, exhibit number, and IMT locator. Speaker/date/setting: Adolf Hitler, addressing the Reichstag publicly on 30 January 1939, the fifth anniversary week of the German-Polish non-aggression declaration and sixth anniversary of the Nazi seizure of power. Document type: public Reichstag address, subsequently printed; transmission is direct and independently entered into the IMT record. Barbero''s wording is not verbatim because it drops the limiting time clause and changes tense, but its attribution and meaning are sound. Preserve the point while restoring the complete sentence or signaling that the Italian is a compressed paraphrase.'
