- id: Q-013
  barbero_utterances: [U-00318–U-00337]
  barbero_timestamp: "19:22"
  attribution: "Neville Chamberlain, at Heston Aerodrome and 10 Downing Street"
  source_id: SRC-120
  original_language: en
  original_text: "The settlement of the Czechoslovakian problem, which has now been achieved, is, in my view, only the prelude to a larger settlement in which all Europe may find peace. [...] We regard the agreement signed last night and the Anglo-German naval agreement as symbolic of the desire of our two peoples never to go to war with one another again. [...] My good friends, this is the second time in our history that there has come back from Germany to Downing Street peace with honour. I believe it is peace for our time. [...] And now I recommend you to go home and sleep quietly in your beds."
  translation: "La sistemazione del problema cecoslovacco che è stata ora raggiunta è, a mio avviso, soltanto il preludio a una sistemazione più ampia in cui tutta l’Europa possa trovare pace. [...] Consideriamo l’accordo firmato ieri sera e l’accordo navale anglo-tedesco simboli del desiderio dei nostri due popoli di non farsi mai più guerra. [...] Miei cari amici, questa è la seconda volta nella nostra storia che dalla Germania torna a Downing Street una pace con onore. Credo che sia pace per il nostro tempo. [...] E ora vi consiglio di andare a casa e dormire tranquilli nei vostri letti."
  locator: "Heston Aerodrome broadcast, 30 September 1938, BBC recording at 6:51–8:28; later remarks from a first-floor window at 10 Downing Street, after Chamberlain's audience with George VI"
  translation_notes: "Direct translation of excerpts joined with explicit ellipses. Barbero closely follows the wording but silently combines two appearances. At Heston, Chamberlain spoke of the wider European settlement, displayed the paper, and read the Anglo-German declaration. The phrase 'peace with honour,' the exact 'peace for our time' (not the often-repeated 'peace in our time'), and the advice to sleep quietly came later at 10 Downing Street. The paper was not the four-power Munich Agreement signed during the night: it was a separate bilateral declaration signed by Hitler and Chamberlain on the morning of 30 September. Barbero also modernizes the Downing Street syntax into 'the British prime minister returned from Germany.'"
  confidence: high
  status: resolved
  script_treatment: qualify
  research_note: "Verdict: composite. Evidence tier 1: the surviving BBC broadcast recording documents Chamberlain's Heston words and the full bilateral declaration; the declaration text is independently reproduced by German History in Documents and Images. Evidence tier 2: the UK government's prime-minister history gives the exact Downing Street formulation, while USHMM explicitly distinguishes the Heston arrival from the later speech at the prime minister's residence. Speaker/date: Neville Chamberlain, 30 September 1938. Settings: Heston Aerodrome after his return from Munich, then a first-floor window at 10 Downing Street after visiting Buckingham Palace. Document types: live broadcast remarks, reading of a signed diplomatic declaration, and later impromptu public remarks. Transmission: newsreels, anthologies, and popular memory routinely collapse the two scenes; some also alter 'for our time' to 'in our time.' Barbero preserves the substance and much exact language but repeats that collapse and calls the displayed bilateral declaration the treaty signed the previous night. Qualify by separating the locations and documents. Supporting sources: SRC-121, SRC-122, SRC-123."
- id: Q-014
  barbero_utterances: [U-00352–U-00358]
  barbero_timestamp: "21:36"
  attribution: "Adolf Hitler, privately reported by Neville Chamberlain and independently repeated by Hitler in a public speech"
  source_id: SRC-130
  original_language: en
  original_text: "In the first place he repeated to me with great earnestness what he had said already at Berchtesgaden, namely, that this was the last of his territorial ambitions in Europe and that he had no wish to include in the Reich people of other races than Germans."
  translation: "Anzitutto mi ripeté con grande serietà ciò che aveva già detto a Berchtesgaden, cioè che questa era l'ultima delle sue ambizioni territoriali in Europa e che non desiderava includere nel Reich persone di razze diverse da quella tedesca."
  locator: "Neville Chamberlain, House of Commons statement, 28 September 1938, HC Deb vol. 339, cols. 21–22; report of his private farewell conversation with Hitler at Godesberg during the night of 22–23 September"
  translation_notes: "Direct translation of Chamberlain's English report, not a recovered German transcript of the private conversation. Barbero reproduces the core wording closely but places it ‘at Munich.’ Chamberlain said Hitler had first made the assurance at Berchtesgaden on 15 September and repeated it privately at Godesberg on 23 September, before the Munich conference. Hitler independently said publicly at the Berlin Sportpalast on 26 September: ‘Es ist die letzte territoriale Forderung, die ich in Europa zu stellen habe’ (‘It is the last territorial demand I have to make in Europe’)."
  confidence: high
  status: resolved
  script_treatment: qualify
  research_note: "Verdict: confirmed in substance but mislocated. Evidence tier 1: the verbatim Hansard record preserves Chamberlain's 28 September first-person report only days after the private Godesberg exchange; Hitler's recorded 26 September Sportpalast speech independently confirms the central assurance in German. No verbatim German protocol of the private exchange was located, so Chamberlain's English remains indirect testimony. The assurance was made before Munich, not during it; the Munich agreement and 30 September Anglo-German declaration were separate documents and do not contain this sentence. Qualify the setting and preserve as ‘Hitler told Chamberlain, and then declared publicly,’ rather than ‘at Munich.’ Supporting sources: SRC-131 and SRC-132."
- id: Q-015
  barbero_utterances: [U-00376–U-00383]
  barbero_timestamp: "22:56"
  attribution: "Adolf Hitler"
  source_id: SRC-140
  original_language: de
  original_text: "Auch in den unruhigen Monaten des vergangenen Jahres war die deutsch-polnische Freundschaft eine der beruhigenden Erscheinungen des europäischen politischen Lebens."
  translation: "Anche nei mesi inquieti dell'anno passato, l'amicizia tedesco-polacca fu uno dei fenomeni rassicuranti della vita politica europea."
  locator: "Speech before the first 'Greater German Reichstag,' 30 January 1939; GHDI transcription, paragraph beginning 'In diesen Tagen jährt sich zum fünftenmal'; original printed edition Rede des Führers und Reichskanzlers Adolf Hitler vor dem Reichstag am 30. Januar 1939 (Berlin: M. Müller & Sohn, 1939), pp. 5–63; independently preserved in IMT evidence TC-73 no. 57, Prosecution Exhibit 37, IMT p. 991 (SRC-141)"
  translation_notes: "Direct translation from the German text. Barbero reproduces the core proposition accurately but compresses it: he omits 'Auch in den unruhigen Monaten des vergangenen Jahres' ('also during the troubled months of the previous year'), renders 'deutsch-polnische Freundschaft' as friendship 'fra Germania e Polonia,' substitutes 'fattori' for 'Erscheinungen' ('phenomena/features'), and shifts the original past tense to the present. The official IMT English rendering likewise reads: 'During the troubled months of the past year, the friendship between Germany and Poland has been one of the most reassuring factors in the political life of Europe.'"
  confidence: high
  status: resolved
  script_treatment: qualify
  research_note: "Verdict: confirmed in substance. Evidence tier 1: GHDI, a German Historical Institute documentary project, transcribes the German passage and identifies its source as the contemporaneous printed speech edition; the Harvard Nuremberg Trials Project preserves the one-page English evidentiary extract with date, authorship, evidence code, exhibit number, and IMT locator. Speaker/date/setting: Adolf Hitler, addressing the Reichstag publicly on 30 January 1939, the fifth anniversary week of the German-Polish non-aggression declaration and sixth anniversary of the Nazi seizure of power. Document type: public Reichstag address, subsequently printed; transmission is direct and independently entered into the IMT record. Barbero's wording is not verbatim because it drops the limiting time clause and changes tense, but its attribution and meaning are sound. Preserve the point while restoring the complete sentence or signaling that the Italian is a compressed paraphrase."
