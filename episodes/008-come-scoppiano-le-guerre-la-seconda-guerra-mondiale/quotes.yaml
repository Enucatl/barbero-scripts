  original_language: en
  original_text: In the first place he repeated to me with great earnestness what he had said already at Berchtesgaden, namely, that this was the last of his territorial ambitions in Europe and that he had no wish to include in the Reich people of other races than Germans.
  translation: In the first place he repeated to me with great earnestness what he had said already at Berchtesgaden, namely, that this was the last of his territorial ambitions in Europe and that he had no wish to include in the Reich people of other races than Germans.
  locator: Neville Chamberlain, House of Commons statement, 28 September 1938, HC Deb vol. 339, cols. 21–22; report of his private farewell conversation with Hitler at Godesberg during the night of 22–23 September
  translation_notes: 'Direct translation of Chamberlain''s English report, not a recovered German transcript of the private conversation. Barbero reproduces the core wording closely but places it ‘at Munich.’ Chamberlain said Hitler had first made the assurance at Berchtesgaden on 15 September and repeated it privately at Godesberg on 23 September, before the Munich conference. Hitler independently said publicly at the Berlin Sportpalast on 26 September: ‘Es ist die letzte territoriale Forderung, die ich in Europa zu stellen habe’ (‘It is the last territorial demand I have to make in Europe’).'
  confidence: high
  status: resolved
  research_note: 'Verdict: confirmed in substance but mislocated. Evidence tier 1: the verbatim Hansard record preserves Chamberlain''s 28 September first-person report only days after the private Godesberg exchange; Hitler''s recorded 26 September Sportpalast speech independently confirms the central assurance in German. No verbatim German protocol of the private exchange was located, so Chamberlain''s English remains indirect testimony. The assurance was made before Munich, not during it; the Munich agreement and 30 September Anglo-German declaration were separate documents and do not contain this sentence. Qualify the setting and preserve as ‘Hitler told Chamberlain, and then declared publicly,’ rather than ‘at Munich.’ Supporting sources: SRC-131 and SRC-132.'
