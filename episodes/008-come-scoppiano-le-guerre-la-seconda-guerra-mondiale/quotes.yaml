  original_text: Herr von Ribbentrop's reply was to produce a lengthy document which he read out in German aloud at top speed. Imagining that he would eventually hand it to me I did not attempt to follow too closely the sixteen or more articles which it contained. [...] When I asked Herr von Ribbentrop for text of these proposals in accordance with undertaking in the German reply of yesterday, he asserted that it was now too late as Polish representative had not arrived in Berlin by midnight. [...] In the most violent terms Herr von Ribbentrop said that he would never ask the Ambassador to visit him. He hinted that if Polish Ambassador asked him for interview it might be different. [...] We parted on that note, but I must tell you that Herr von Ribbentrop's whole demeanour during an unpleasant interview was aping Herr Hitler at his worst.
  translation: Herr von Ribbentrop's reply was to produce a lengthy document which he read out in German aloud at top speed. Imagining that he would eventually hand it to me I did not attempt to follow too closely the sixteen or more articles which it contained. [...] When I asked Herr von Ribbentrop for text of these proposals in accordance with undertaking in the German reply of yesterday, he asserted that it was now too late as Polish representative had not arrived in Berlin by midnight. [...] In the most violent terms Herr von Ribbentrop said that he would never ask the Ambassador to visit him. He hinted that if Polish Ambassador asked him for interview it might be different. [...] We parted on that note, but I must tell you that Herr von Ribbentrop's whole demeanour during an unpleasant interview was aping Herr Hitler at his worst.
