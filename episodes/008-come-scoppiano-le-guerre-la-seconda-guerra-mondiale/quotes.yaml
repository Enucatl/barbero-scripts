  original_text: 'Ho riunito stamani i Capi di Stato Maggiore dell''Esercito, della Marina, dell''Aviazione, presenti il Ministro Ciano e quello delle Comunicazioni ed ecco il minimo che occorre alle Forze Armate italiane per sostenere una guerra di dodici mesi oltre a quello che abbiamo: Carbone per il gas e la siderurgia 6 milioni di tonnellate; Acciaio 2 milioni; Oli minerali 7 milioni; Legno 1 milione; Rame 150 mila tonnellate; Nitrato di sodio 220 mila; Sali potassici 70 mila; Colofonia 25 mila; Gomma 22 mila; Toluolo 18 mila; Essenza trementina 6 mila; Piombo 10 mila; Stagno 7 mila; Nikelio 5 mila; Molibdeno 600 tonnellate; Tungsteno 600; Zirconio 20; Titanio 400.'
  translation: 'This morning I assembled the Chiefs of Staff of the Army, Navy, and Air Force, with Minister Ciano and the Minister of Communications present, and here is the minimum the Italian Armed Forces require, in addition to what we have, to sustain a twelve-month war: 6 million tonnes of coal for gas and steelmaking; 2 million of steel; 7 million of mineral oils; 1 million of timber; 150,000 tonnes of copper; 220,000 of sodium nitrate; 70,000 of potassium salts; 25,000 of rosin; 22,000 of rubber; 18,000 of toluene; 6,000 of turpentine; 10,000 of lead; 7,000 of tin; 5,000 of nickel; 600 tonnes of molybdenum; 600 of tungsten; 20 of zirconium; and 400 of titanium.'
  locator: I Documenti diplomatici italiani, eighth series, vol. XIII, document 293, Rome, 26 August 1939, printed pp. 318–319; complete raw-material list and the following request for the immediate dispatch of 150 90-mm anti-aircraft batteries. Compare Ciano, Diario 1937–1943 (SRC-210), entry for 26 August 1939.
  translation_notes: Direct English translation of Mussolini's Italian letter. Ditto marks in the printed table have been expanded as tonnes, and punctuation has been normalized. The document says the raw materials are what Italy needs for a twelve-month war; only the separate anti-aircraft-battery request is explicitly immediate. Hitler's reply records Attolico's oral instruction that everything was required before hostilities, and Attolico's ensuing telegram calls this an equivoco; Ciano's same-day diary adds that Attolico later claimed he had made the error deliberately to discourage the Germans. Ciano also gives 17,000 trains, but prints an arithmetically impossible total of 170 million tonnes; the listed quantities sum to about 16.53 million tonnes. Barbero's scene in which Ribbentrop asks the deadline and Attolico improvises ‘subito’ is a later dramatized version, not dialogue preserved in these primary texts.
