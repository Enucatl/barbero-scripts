  original_text: Rückkehr der tschechischen Soldateska nach Graslitz. Der Terror begleitet sie. [...] Mit den Tschechen kehrt auch wieder der Terror zurück.
  translation: Return of the Czech soldiery to Graslitz. Terror accompanies them. [...] With the Czechs, terror returns as well.
  locator: Eibenstocker Tageblatt, 23 September 1938, p. 1, DNB dispatch from Klingenthal dated 22 September; the same page explicitly attributes a neighboring report to the Völkischer Beobachter
  translation_notes: 'Direct translation of a representative German headline and its opening sentence. ''Soldateska'' is deliberately contemptuous (''soldataglia''), while ''Terror'' is the paper''s allegation, not an independently established description. Barbero''s arrests, beatings, and torture do not reproduce this item verbatim: they condense the campaign''s recurring atrocity vocabulary. Kaltenborn''s contemporary Berlin broadcast supplies other representative translated headlines—''Czech Terror ... Grows Worse from Day to Day'' and ''New Czech Murders of Germans''—but does not identify every newspaper by title.'
