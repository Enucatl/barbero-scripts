  original_text: 'Ribbentrop przyjął mnie o 18 minut 30. Instrukcję wykonałem. Ribbentrop zapytał, czy mam pełnomocnictwo do traktowania. Odpowiedziałem, że nie: Ribbentrop zapytał, czy jestem poinformowany, że na sugestie Londynu rząd niemiecki wyraził zgodę bezpośredniego z nami traktowania z upełnomocnionym delegatem, który miał wczoraj przybyć. Odpowiedziałem, że informacje moje są tylko pośrednie. Ribbentrop na zakończenie powtórzył, iż myślał, że będę upoważniony do traktowania. Zakomunikuje moje wystąpienie kanclerzowi.'
  translation: Ribbentrop received me at 6:30 p.m. I carried out my instructions. Ribbentrop asked whether I had authority to negotiate. I replied that I did not. Ribbentrop asked whether I had been informed that, at London's suggestion, the German government had agreed to negotiate directly with us through a fully empowered delegate who was to have arrived yesterday. I replied that my information was only indirect. In conclusion, Ribbentrop repeated that he had thought I would be authorized to negotiate. He would communicate my démarche to the Chancellor.
  locator: 'Polskie Dokumenty Dyplomatyczne 1939: styczeń–sierpień, document 523, cipher telegram no. 246 from Lipski to the Polish Ministry of Foreign Affairs, Berlin, 31 August 1939, received 10:30 p.m., pp. 859–860 (PDF pp. 927–928); archival source IPMS, MSZ A.11.49/N/8. Compare the official English translation in TC-73 no. 112, IMT exhibit GB-72 (SRC-421).'
  translation_notes: Direct English translation from Lipski's Polish cipher telegram. ‘Pełnomocnictwo do traktowania’ means authority/full powers to negotiate; ‘wystąpienie’ is best rendered here as démarche or representation, not a speech. Barbero accurately gives Ribbentrop's question and Lipski's negative answer, but invents the categorical ending ‘then we have nothing to discuss’ and an immediate dismissal. Lipski instead records further questions and Ribbentrop's closing statement that he would report the démarche to Hitler. The meeting occurred at 6:30 p.m., not at 1 p.m.; 1 p.m. was when Lipski requested the interview, and at 3 p.m. State Secretary Weizsäcker telephoned to ask whether he sought it as a special plenipotentiary or as ambassador.
  confidence: high
  status: resolved
  research_note: 'Verdict: composite. Evidence tier 1: the Polish Institute of International Affairs publishes the original Polish cipher telegram from Lipski''s report as document 523 (SRC-420), with its archival shelfmark; the English translation entered at Nuremberg as TC-73 no. 112/GB-72 independently preserves the same account (SRC-421). Speaker/date/setting/document type: Polish ambassador Józef Lipski reporting confidentially to his Foreign Ministry after his 6:30 p.m. meeting with German foreign minister Joachim von Ribbentrop in Berlin on 31 August 1939; the cable was received in Warsaw at 10:30 p.m. It is a near-contemporaneous participant report, not a stenographic protocol. A German Foreign Office record by interpreter Paul Schmidt likewise says Ribbentrop asked twice whether Lipski was authorized to negotiate and Lipski said no, corroborating the core exchange. Barbero correctly sequences the meeting after Hitler''s midday war directive and correctly states that Lipski lacked
    full powers, but compresses three distinct moments: Lipski requested an interview at 1 p.m.; Weizsäcker queried his status at 3 p.m.; Ribbentrop received him at 6:30 p.m. Most importantly, the documented meeting did not end with ‘we have nothing to say to each other.’ Ribbentrop restated the prior demand for a plenipotentiary, asked again about authority, and said he would report Lipski''s démarche to Hitler. Preserve the full-powers question and answer, qualify the time, and replace the invented dismissal with the attested closing. The precise 12:40 p.m. time attached to Hitler''s attack order belongs to the separate chronology/claim research rather than Lipski''s telegram.'
