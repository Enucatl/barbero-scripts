  research_note: 'Verdict: composite. Evidence tier 1: the surviving BBC broadcast recording documents Chamberlain''s Heston words and the full bilateral declaration; the declaration text is independently reproduced by German History in Documents and Images. Evidence tier 2: the UK government''s prime-minister history gives the exact Downing Street formulation, while USHMM explicitly distinguishes the Heston arrival from the later speech at the prime minister''s residence. Speaker/date: Neville Chamberlain, 30 September 1938. Settings: Heston Aerodrome after his return from Munich, then a first-floor window at 10 Downing Street after visiting Buckingham Palace. Document types: live broadcast remarks, reading of a signed diplomatic declaration, and later impromptu public remarks. Transmission: newsreels, anthologies, and popular memory routinely collapse the two scenes; some also alter ''for our time'' to ''in our time.'' Barbero preserves the substance and much exact language but repeats
