  status: resolved
  research_note: 'Verdict: composite. Evidence tier 1: a digitized 23 September German newspaper preserves DNB and Völkischer Beobachter material presenting Czech military action as ''terror''; Kaltenborn''s 19 September broadcast records multiple typical Berlin and Hamburg headlines about a ''bloody regime,'' murders, poison gas, extortion, plundering, and worsening Czech terror. A U.S. Embassy telegram from Berlin had already reported on 28 April that the German press was building the crisis ''day by day'' around the supposedly unbearable plight of the Sudeten Germans. Counter-evidence in a 28 September U.S. legation telegram from Prague states that German press and radio alleged a reign of terror while quiet generally prevailed, and attributes the principal border disorder to Reich-supported Sudeten German militants; Kaltenborn''s correspondents likewise reported restraint by Czech forces. Evidence tier 2: Louis-Jaray''s contemporary 1938 analysis treats the press activity as an organized
    propaganda campaign for annexation. Author/speaker: no single author; newspaper and DNB editorial/news voices under Nazi press control. Date/setting: a sustained campaign from spring 1938, sharply intensified during the September crisis. Document type: headlines and news reports, not a speech or one quotation. Transmission: Barbero synthesizes several characteristic allegations into invented representative sentences. Preserve the historical point only while labeling the claims as Nazi propaganda rather than verified treatment of Sudeten Germans. Supporting sources: SRC-090, SRC-092, SRC-093.'
