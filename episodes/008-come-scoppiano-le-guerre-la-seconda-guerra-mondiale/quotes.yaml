  original_text: «Ebbene, Ribbentrop,» gli chiesi passeggiando nel giardino al suo fianco, «che cosa volete? Il Corridoio o Danzica?» «Ormai non più», e mi sbarrò addosso quei suoi freddi occhi da Museo Grévin, «vogliamo la guerra.»
  translation: ‘Well, Ribbentrop,’ I asked him as we walked side by side in the garden, ‘what do you want? The Corridor or Danzig?’ ‘Not anymore,’ and he fixed me with those cold Musée Grévin eyes of his, ‘we want war.’
  locator: Ciano, Diario 1937–1943, Introduzione, digital pp. 9–10 (PDF pp. 9–10), account of the 11 August 1939 meeting at Ribbentrop's Fuschl residence near Salzburg. Compare the contemporaneous diary entry for 11 August, digital p. 539, which records the substance—‘La volontà del combattimento è implacabile’—but not this dialogue.
