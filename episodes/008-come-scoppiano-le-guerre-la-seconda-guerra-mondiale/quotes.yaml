  original_text: My own personality and that of Mussolini. Essentially it depends on me, my existence, because of my political activities. Furthermore the fact that probably no one will ever again have the confidence of the whole German people as I do. There will probably never again be a man in the future with more authority than I have. My existence is therefore a factor of great value. But I can be eliminated at any time by a criminal or an idiot. The second personal factor is the Duce. His existence is also decisive. If something happens to him, Italy's loyalty to the alliance will no longer be certain. [...] The Duce is the man with the strongest nerves in Italy.
