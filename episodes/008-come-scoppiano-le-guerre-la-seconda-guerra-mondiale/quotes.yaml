  attribution: Adolf Hitler / coerced Czechoslovak declaration
  source_id: SRC-161
  original_language: en
  original_text: The President of the Czecho-Slovak State declared that, in order to serve this end and to reach a final pacification, he confidently placed the fate of the Czech people and of their country in the hands of the Fuehrer of the German Reich.
  translation: The President of the Czecho-Slovak State declared that, in order to serve this end and to reach a final pacification, he confidently placed the fate of the Czech people and of their country in the hands of the Fuehrer of the German Reich.
  locator: TC-49, complete one-page agreement, paragraphs 1–3, signed in Berlin on 15 March 1939; IMT p. 944. The preceding conference is documented separately in PS-2798 (SRC-160), especially the 1:15–2:15 a.m. minutes stating that Hitler had ordered the invasion for 6 a.m. and that resistance would be broken with all available means.
  translation_notes: 'Direct translation of the official English evidentiary text; the German original was not transcribed in the consulted record. Barbero''s ''paper saying that he had requested the intervention'' is a compressed characterization, not the document''s wording: the declaration says Hácha placed his country''s fate in Hitler''s hands and does not literally request German intervention. The Prague-bombing threat was made by Göring, not Hitler, and is absent from the signed declaration and Hewel minutes; Göring admitted the threat at the IMT (SRC-162). Contemporary diplomatic reporting describes Hácha in total collapse and sustained by injections, but does not establish a diagnosed heart attack or that doctors deliberately kept him awake.'
  confidence: high
  status: resolved
  research_note: 'Verdict: composite, confirmed in substance. Evidence tier 1: TC-49 preserves the signed declaration; PS-2798 is Hewel''s contemporaneous official record of the meeting and records Hitler''s irrevocable invasion order, the 6 a.m. deadline, and the threat to crush resistance. The IMT judgment independently states that Göring threatened to bomb Prague if Hácha did not submit and notes that Göring admitted it in testimony (SRC-162). Transmission limitation: the signed declaration is coercive capitulation language but not a literal request for intervention; the bombing threat belongs to Göring during the wider overnight coercion, not to Hitler''s recorded words. The claim that Hácha had a heart attack and was kept awake is less secure than the contemporary report of collapse and injections. Preserve the coercion narrative, but attribute the air threat to Göring, quote the declaration accurately, and describe Hácha as collapsing rather than assert a medically verified heart attack.'
