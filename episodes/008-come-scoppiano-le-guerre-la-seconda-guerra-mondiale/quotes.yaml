  barbero_timestamp: '34:33'
  attribution: Joachim von Ribbentrop as retrospectively reported by Galeazzo Ciano
  source_id: SRC-230
  original_language: it
  original_text: 'Facevano un errore fondamentale di calcolo: erano certi che Francia e Inghilterra avrebbero assistito inerti allo sgozzamento della Polonia. Su questo argomento Ribbentrop volle, durante uno di quei lugubri pasti che prendevamo all''Osterreichof di Salisburgo, fare con me una scommessa. Io avrei dovuto dargli un quadro italiano nel caso di una neutralità anglo-francese, lui una collezione di armi antiche nel caso di un intervento. Erano molti i testimoni presenti e, anche non troppo tempo fa, parlavamo della cosa con l''Ambasciatore von Mackensen. Ribbentrop, invece, ha preferito dimenticare quella scommessa e non ne ha mai pagato lo scotto.'
  translation: 'They were making a fundamental error of calculation: they were certain that France and England would stand idly by while Poland was slaughtered. On this subject Ribbentrop wanted, during one of those gloomy meals we took at the Oesterreichischer Hof in Salzburg, to make a wager with me. I was to give him an Italian painting in the event of Anglo-French neutrality; he was to give me a collection of antique weapons in the event of intervention. Many witnesses were present, and not very long ago we were speaking about it with Ambassador von Mackensen. Ribbentrop, however, preferred to forget that wager and never paid his debt.'
  locator: Ciano, Diario 1937–1943, introduction signed in cell 27 of Verona prison on 23 December 1943; Renzo De Felice ed., 3rd BUR ed. (1996), pp. 10–11 in the Liber Liber electronic transcription; compare the contemporaneous 11–13 August 1939 diary entries at pp. 539–540 and the German minutes of 12 August, document 1871-PS (SRC-231)
  translation_notes: 'Direct translation of Ciano''s Italian. Barbero correctly conveys the wager''s stakes and rationale but dramatizes it as direct dialogue. Ciano narrates rather than quotes Ribbentrop. The source says only ''un quadro italiano,'' not specifically a fine Renaissance painting, and ''una collezione di armi antiche,'' not explicitly German weapons. Ciano states that the wager occurred during a meal at the Oesterreichischer Hof in Salzburg and that witnesses were present. Crucially, this story is absent from his 11–13 August 1939 daily entries: it appears in the retrospective introduction written on 23 December 1943, shortly before his execution.'
  confidence: high
  status: resolved
  research_note: 'Verdict: confirmed in substance. Evidence tier 1 for Ciano''s own retrospective testimony in the critical edition of his diary; tier 1 corroboration for the meeting and the strategic disagreement from the German minutes of Hitler''s 12 August conference with Ciano. Speaker/event/date/setting: Ciano attributes the wager to Ribbentrop during one of their meals at Salzburg''s Oesterreichischer Hof amid the 11–13 August 1939 talks. Document type and transmission: not a stenographic record or contemporaneous diary entry, but a first-person recollection added as the diary''s introduction in Verona prison on 23 December 1943; edited by Renzo De Felice and transcribed by Liber Liber from the 1996 BUR edition. The contemporaneous 11 August entry records Ribbentrop''s determination to fight and the tense, silent meal but not the wager. German minutes independently record Ciano warning that Britain and France would intervene and Hitler asserting they would shrink from general war,
