  original_text: Mourir pour Dantzig ?
  translation: Die for Danzig?
  locator: 'L’Œuvre, 4 May 1939, p. 1, headline above Marcel Déat''s signed editorial; Gallica ark:/12148/bpt6k4621343w/f1. The article closes: ‘Combattre aux côtés de nos amis Polonais [...] Mais mourir pour Dantzig non !’ (transcription in SRC-191).'
  translation_notes: 'Literal translation of the French infinitive headline. Barbero reproduces the headline accurately, but pluralizes its provenance into unspecified newspaper headlines in Britain and France. The located origin is one named French front-page editorial by Marcel Déat in L’Œuvre. Its conclusion did not reject every possible war: Déat said France could courageously fight beside Poland in common defense of territories, possessions, and liberties, but not specifically die for Danzig. No British newspaper origin for this wording was located.'
