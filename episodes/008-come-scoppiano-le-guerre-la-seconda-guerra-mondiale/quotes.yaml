  locator: Corriere della Sera, afternoon edition, Friday 1 September 1939, p. 1; archive object CP_1939/CP_19390901_L, page file CORSERA_POM_19390901_L_NAZ_NUL_01_00_D; banner and two subheads across the top, with final phrase in the deck beneath ‘Il testo del documento’
