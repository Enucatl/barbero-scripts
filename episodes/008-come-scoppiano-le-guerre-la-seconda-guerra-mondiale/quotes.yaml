  locator: 'British War Blue Book, Cmd. 6106: document 85, Halifax to Kennard, Foreign Office, 30 August 1939, 5:30 p.m., items 1–4 and closing paragraph (SRC-401); document 90, Halifax to Kennard, sent 30 August and acted upon early 31 August, paragraphs 3 and 5 (SRC-402); document 91, Henderson to Halifax, Berlin, 30 August, received 31 August at 2:45 a.m., paragraphs 1–2 (SRC-400)'
  translation_notes: 'Direct Italian translations of three contemporary British telegrams. Barbero accurately captures the British effort to discourage Polish provocation and Ribbentrop''s ‘verflucht little effect’ retort, though ‘mildly retorted’ is better rendered ‘replicai con moderazione’ than simply ‘gli ho replicato.’ He substitutes anti-German newspaper articles for Halifax''s specific ‘inflammatory radio propaganda.’ More importantly, Britain did not instruct Poland to send an immediate plenipotentiary to Berlin: document 90 expressly identifies that same-day German demand as objectionable, while urging direct discussions without delay once their method and arrangements were agreed.'
