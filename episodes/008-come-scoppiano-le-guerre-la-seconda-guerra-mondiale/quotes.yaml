  research_note: 'Verdict: confirmed, with transparent compression. Evidence tier 1: the Corriere historical archive preserves a high-resolution scan of the complete front page (SRC-460). Publication/date/setting/document type: unsigned front-page banner and subheads plus the deck to a Berlin commentary in the Milan afternoon edition of Friday 1 September 1939, directed by Aldo Borelli. Transmission: contemporary printed propaganda, not a later recollection. The page still frames the crisis as the ‘last day of peace,’ praises supposedly moderate German terms, and assigns responsibility to Warsaw and London. Preserve Barbero''s closing illustration, while marking the quotation as a composite of separate front-page elements and retaining ‘Danzica ed il Corridoio’ if quoting the first subhead in full.'
