  attribution: Alfred Naujocks's account of Reinhard Heydrich's Gleiwitz order
  source_id: SRC-430
  original_language: German; official English translation quoted for the affidavit
  original_text: 'Later reported code phrase: ‘Großmutter gestorben.’ Naujocks''s 1945 affidavit: ‘I was directed to go to Gleiwitz with five or six other SD-men and wait there until I received a code word from Heydrich indicating that the attack should take place. [...] At noon of the 31st August I received by telephone from Heydrich the code word for the attack which was to take place at 8 o''clock that evening. [...] We seized the radio station as ordered, broadcast a speech of three to four minutes over an emergency transmitter, fired some pistol shots and left.’'
  translation: 'Later reported code phrase: ‘Großmutter gestorben.’ Naujocks''s 1945 affidavit: ‘I was directed to go to Gleiwitz with five or six other SD-men and wait there until I received a code word from Heydrich indicating that the attack should take place. [...] At noon of the 31st August I received by telephone from Heydrich the code word for the attack which was to take place at 8 o''clock that evening. [...] We seized the radio station as ordered, broadcast a speech of three to four minutes over an emergency transmitter, fired some pistol shots and left.’'
  locator: Nuremberg document PS-2751, Exhibit USA-482, affidavit signed at Nuremberg 20 November 1945, paragraphs 2–6, IMT vol. XXXI, pp. 389–391; exact phrase ‘Großmutter gestorben’ in Naujocks's retrospective interview, Der Spiegel 46/1963, pp. 71–77 (SRC-432); source criticism and reconstruction in Runzheimer, VfZ 10/4 (1962), pp. 412–415 (SRC-431)
  translation_notes: Direct Italian translation of the official English affidavit and of the later German code phrase. Barbero accurately identifies the staged SD seizure, Polish-language broadcast, pistol shots, and planted unconscious victim. But PS-2751 says five or six other SD men, not twelve. Its twelve or thirteen condemned prisoners and Polish uniforms concern a separate planned border incident discussed by Müller and Mehlhorn; the Gleiwitz victim was explicitly in civilian clothes. Runzheimer's reconstruction from station personnel likewise finds five civilian-clothed attackers. The affidavit preserves only ‘the code word’; the exact ‘Großmutter gestorben’ wording is documented in Naujocks's later interview and should be attributed as retrospective testimony.
  confidence: medium
  status: resolved
  research_note: 'Verdict: composite, partly inaccurate. Evidence tier 2 overall: the core staging rests chiefly on participant Alfred Naujocks''s sworn 1945 affidavit, corroborated in important operational respects by station-personnel evidence analyzed by Runzheimer, but no contemporary operational order survives. The exact code phrase is a later recollection printed in 1963, not wording contained in PS-2751. Speaker/date/setting/document type: Naujocks says Heydrich ordered the simulation around 10 August 1939, kept his group waiting at Gleiwitz for fourteen days, and telephoned the release code at noon on 31 August for an 8 p.m. action; PS-2751 is a postwar sworn statement signed 20 November 1945. The group then seized the station, broadcast briefly in Polish, fired shots, and withdrew. Barbero folds personnel, uniforms, and victims from another border scheme into Gleiwitz. Preserve the false-flag account and qualify the code phrase as Naujocks''s later wording; correct the group to
    six or seven total, civilian disguise, and one unconscious civilian-clothed ‘canned good.’'
