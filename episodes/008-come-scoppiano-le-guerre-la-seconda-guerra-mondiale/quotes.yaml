  research_note: 'Verdict: confirmed in substance, not exact wording. Evidence tier 1: Ciano''s dated diary entry, reproduced in the complete Italian edition edited by Renzo De Felice and digitized by Liber Liber (SRC-210). Speaker/date/setting/document type: Galeazzo Ciano, private political diary entry dated 4 August 1939, written while Italian officials were receiving conflicting reports about Germany''s intentions toward Poland. Provenance and transmission: the consulted electronic text derives from the third 1996 BUR edition; Liber Liber identifies its editor, print source, digitizer, reviewer, publication date, and standard reliability level. The passage is a same-day first-person note rather than later dialogue or a stenographic record. Barbero correctly links the thought to Ciano''s decision to seek a meeting with Ribbentrop, but substitutes a synonym and truncates the second sentence. Preserve the point, restore the complete wording, and date it precisely to 4 August.'
