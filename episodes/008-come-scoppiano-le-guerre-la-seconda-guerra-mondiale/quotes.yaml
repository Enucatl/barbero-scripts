  translation_notes: 'The Italian is a direct translation of the full sentence as reproduced in scholarship. Barbero gives ‘la Russia va considerata fuori dalla politica europea,’ closely following the shortened form quoted by A. J. P. Taylor (‘The Soviet Union must be counted out of European politics’). He omits Chilston''s temporal and functional qualifications: ‘for the time being’ and only as to exercising decisive influence. Barbero also says ‘Russia,’ while the report says ‘The Soviet Union.’'
  confidence: high
  status: resolved
  research_note: 'Verdict: confirmed. Evidence tier 1 for the official DBFP documentary edition of Chilston''s confidential 19 April 1938 dispatch; evidence tier 2 for Louise Grace Shaw''s archival study, which reproduces the qualified wording and locates the report as document 262 in the later BDFA reprint, and for Taylor''s influential shortened quotation. Shaw''s displayed transcription contains an ellipsis immediately after ‘must,’ retained explicitly above rather than silently supplying the omitted word or words. The dispatch assessed that the Red Army could defend Soviet territory but was not capable of carrying war into enemy territory, and that Moscow was unlikely to fight merely to fulfill treaty obligations over Czechoslovakia. It was an ambassadorial assessment, not an instruction or settled public doctrine, although Taylor states that the Foreign Office accepted the view. Preserve only with the qualifications restored and identify Chilston and the secret-report setting. Supporting
