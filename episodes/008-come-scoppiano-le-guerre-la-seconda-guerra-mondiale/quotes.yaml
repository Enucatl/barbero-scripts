  original_text: SCOCCA L'ORA DECISIVA / Le proposte di Hitler per Danzica ed il Corridoio leali ragionevoli ed eseguibilissime lasciate stoltamente cadere da Varsavia e da Londra / Inghilterra e compagni inchiodati alle loro tremende responsabilità / La pubblicazione di questa pagina di storia conferma la conscia saggezza e la moderazione tedesca di fronte alla cieca intransigenza delle altre parti in conflitto
