- id: Q-001
  barbero_utterances: [U-00016–U-00024]
  barbero_timestamp: "01:01"
  attribution: "Gabriele D’Annunzio; subsequently an Italian nationalist and Fascist political slogan"
  source_id: SRC-001
  original_language: it
  original_text: "Vittoria nostra, non sarai mutilata. Nessuno può frangerti i ginocchi né tarparti le penne. Dove corri? dove sali?"
  translation: "Our victory, you will not be mutilated. No one can break your knees or clip your wings. Where are you running? Where are you rising?"
  locator: "D’Annunzio, La preghiera di Sernaglia, verset 63; first published under the title Vittoria nostra, non sarai mutilata in Corriere della Sera, 24 October 1918"
  translation_notes: "Direct translation of D’Annunzio’s Italian. Barbero uses only the later compact label, ‘la vittoria mutilata,’ rather than quoting the original sentence. The original addresses personified Victory in the future tense (‘non sarai mutilata’) and appeared before the armistice and before the Paris Peace Conference. The phrase was soon detached from the poem and became a postwar political slogan alleging that Italy’s sacrifices had not received adequate territorial compensation."
  confidence: high
  status: resolved
  script_treatment: qualify
  research_note: "Verdict: confirmed in substance. Evidence tier 1 for the recoverable primary text in D’Annunzio’s collected Canti della guerra latina; tier 2 for publication history and political transmission documented by the Fondazione Il Vittoriale degli Italiani’s Enciclopedia Dannunziana and Marco Cuzzi’s University of Milan essay (SRC-002–SRC-003). Speaker/author: Gabriele D’Annunzio. Date and setting: published in Corriere della Sera on 24 October 1918, the first anniversary of Caporetto and the opening day of the Vittorio Veneto offensive. Document type: rhythmic prose/poem, not a speech or post-Paris retrospective statement. Transmission: first newspaper title and line; later retitled La preghiera di Sernaglia in Il libro ascetico della giovane Italia, then included in Canti della guerra latina and the 1984 Meridiani critical collection. Preserve the familiar phrase but qualify it as a nationalist myth/slogan and avoid implying it was coined only after the 1919 settlement."
- id: Q-002
  barbero_utterances: [U-00043–U-00085]
  barbero_timestamp: "02:33"
  attribution: "German nationalist and NSDAP revisionist discourse (composite, not a single speaker or document)"
  source_id: SRC-010
  original_language: de
  original_text: "Danzig bleibt deutsch! [...] Wir fordern die Gleichberechtigung des deutschen Volkes gegenüber den anderen Nationen, Aufhebung der Friedensverträge von Versailles und St. Germain."
  translation: "Danzig remains German! [...] We demand equal rights for the German people in relation to the other nations, and the annulment of the peace treaties of Versailles and Saint-Germain."
  locator: "Pfälzer Bote für Stadt und Land, no. 30, 6 February 1933, p. 4 (digital image 330), report 'Danzig bleibt deutsch'; NSDAP 25-point program, point 2, proclaimed in Munich, 24 February 1920 (GHDI document 4625)"
  translation_notes: "Direct translation of two separately attested German texts. Barbero modernizes 'Danzig bleibt deutsch' as the repeated 'Danzica è tedesca' and expands it with 'non ce l'hanno data', 'è una vergogna', and 'bisognerà tornarci su un giorno'; those additions are rhetorical reconstruction, not words found in the located slogan. His 'dobbiamo rivedere il trattato di Versailles' is milder than the NSDAP program's demand for Aufhebung, annulment. The Treaty of Versailles itself made Danzig a Free City rather than Polish territory, while removing it from German sovereignty."
  confidence: high
  status: resolved
  script_treatment: qualify
  research_note: "Verdict: composite, confirmed in substance. Evidence tier 1: a contemporaneous digitized newspaper reports the February 1933 Danzig campaign, prints 'Danzig bleibt deutsch', calls Heimkehr zum Reich its watchword, and describes the Versailles arrangement as injustice; GHDI provides a scholarly documentary transcription of the original 1920 NSDAP program and its edition history. The Yale Avalon transcription of Versailles articles 100, 102, and 105 independently establishes the legal setting. The newspaper attestation is from 1933, not immediately after 1919, and no exact source was located for Barbero's full dramatic monologue or the variant 'Danzig ist deutsch'. Preserve the argument, but label or paraphrase it as representative revisionist rhetoric rather than a verbatim quotation. Supporting records: SRC-011 and SRC-012."
- id: Q-003
  barbero_utterances: [U-00111–U-00132]
  barbero_timestamp: "06:43"
  attribution: "Lord Halifax (Edward Wood), Lord President of the Council"
  source_id: SRC-020
  original_language: en
  original_text: "I said that there were no doubt other questions arising out of the Versailles settlement which seemed to us capable of causing trouble if they were mishandled, e.g. Danzig, Austria, Czechoslovakia. On all these matters we were not necessarily concerned to stand for the status quo as today, but we were concerned to avoid such treatment of them as would be likely to cause trouble. If reasonable settlements could be reached with the free assent and goodwill of those primarily concerned we certainly had no desire to block."
  translation: "Dissi che vi erano senza dubbio altre questioni sorte dalla sistemazione di Versailles che ci sembravano capaci di causare problemi se fossero state gestite male, per esempio Danzica, l'Austria e la Cecoslovacchia. Su tutte queste questioni non eravamo necessariamente interessati a difendere lo status quo odierno, ma ci premeva evitare che fossero trattate in un modo tale da poter causare problemi. Se si fossero potute raggiungere soluzioni ragionevoli con il libero assenso e la buona volontà dei diretti interessati, certamente non avevamo alcun desiderio di ostacolarle."
  locator: "Documents on British Foreign Policy, 1919–1939, Second Series, vol. XIX, document 336, p. 540, Halifax's record of his conversation with Hitler at the Berghof, 19 November 1937; compare DGFP, Series D, vol. I, document 31, pp. 55–67, especially p. 67 (SRC-022)"
  translation_notes: "Direct translation of Halifax's English first-person record. Barbero accurately compresses the acceptance of possible peaceful revisions concerning Danzig, Austria, and Czechoslovakia. His wording about changes 'with time' and 'in a peaceful manner' more closely follows Paul Schmidt's German interpreter record, whose published English translation says that alterations would probably occur sooner or later and should come through 'peaceful evolution' without 'far-reaching disturbances.' Barbero says Berlin, but the Hitler meeting took place at the Berghof near Berchtesgaden; and Halifax was Lord President of the Council, not Foreign Secretary, in November 1937. Poland is Barbero's geographic gloss on the Danzig question."
  confidence: high
  status: resolved
  script_treatment: qualify
  research_note: "Verdict: confirmed in substance. Evidence tier 1: two near-contemporary official records survive—Halifax's own first-person account, published in DBFP, and interpreter Paul Schmidt's German record, published in DGFP; Halifax's 29 November report to the French ministers independently restates that Britain would not rigidly uphold the status quo and required freely reached adjustments without dangerous consequences (SRC-021). Speaker: Halifax; date and setting: 19 November 1937, private confidential conversation with Hitler at the Berghof near Berchtesgaden, with Konstantin von Neurath and interpreter Paul Schmidt present. Document type/transmission: diplomatic notes reconstructed from notes made during or shortly after the meeting, not a verbatim transcript. The two records differ in phrasing and emphasis, and Halifax later disclosed that his notes and Schmidt's notes were distinct; no formal pledge or agreement resulted. Preserve the substantive point, but correct Halifax's office and the location and avoid quotation marks around Barbero's synthesized wording."
- id: Q-004
  barbero_utterances: [U-00133–U-00157]
  barbero_timestamp: "07:42"
  attribution: "Edward Wood, 3rd Viscount Halifax, as recorded by German Foreign Ministry interpreter Paul Schmidt"
  source_id: SRC-022
  original_language: de
  original_text: "Trotz dieser Schwierigkeiten wären er (Lord Halifax) und andere Mitglieder der englischen Regierung davon durchdrungen, daß der Führer nicht nur in Deutschland selbst Großes geleistet habe, sondern daß er auch durch die Vernichtung des Kommunismus im eigenen Lande diesem den Weg nach Westeuropa versperrt habe und daß daher mit Recht Deutschland als Bollwerk des Westens gegen den Bolschewismus angesehen werden könne."
  translation: "Despite these difficulties, he (Lord Halifax) and other members of the British Government were convinced that the Führer had not only accomplished much within Germany itself, but that by destroying communism in his own country he had also blocked its path to Western Europe, and that Germany could therefore rightly be regarded as the bulwark of the West against Bolshevism."
  locator: "Documents on German Foreign Policy, 1918–1945, Series D, vol. I, doc. 31, pp. 55–67, at p. 55; Paul Schmidt’s memorandum of the Halifax–Hitler conversation at Obersalzberg, 19 November 1937"
  translation_notes: "Direct translation of the German interpreter record. Barbero accurately compresses a longer sentence, but changes ‘Bollwerk des Westens’ (bulwark of the West) to ‘baluardo dell’Europa’ (bulwark of Europe). His remarks about ‘Herr Hitler’ draw on the diplomatic register rather than the same quoted sentence: Halifax’s report to French ministers repeatedly calls him ‘Herr Hitler,’ while also explaining that Halifax’s own notes and Schmidt’s interpreter notes sometimes differed. ‘Herr’ is an ordinary German honorific retained in English diplomatic prose, not evidence by itself of approval."
  confidence: high
  status: resolved
  script_treatment: qualify
  research_note: "Verdict: composite, confirmed in substance. Evidence tier 1: a contemporaneous German Foreign Ministry memorandum by official interpreter Paul Schmidt, published as DGFP D/I doc. 31 (SRC-022), directly records the anti-Bolshevik compliment. Halifax’s own later confidential account to French ministers, preserved through the British Embassy and published in FRUS 1937, vol. I, doc. 110 (SRC-021), corroborates the meeting and repeatedly uses ‘Herr Hitler,’ but does not reproduce the bulwark sentence and warns that his own notes and the interpreter’s notes were distinct; Schmidt’s notes were unofficial, though seen by Foreign Minister von Neurath before being sent to Halifax. Date and setting: private conversation with Hitler and von Neurath at the Berghof/Obersalzberg near Berchtesgaden, 19 November 1937. Document type and transmission: near-contemporary interpreter memorandum captured with the German Foreign Ministry files and published after the war by the Allied documentary edition, not a verbatim audio transcript. Qualify the wording to ‘bulwark of the West’ and avoid treating routine ‘Herr Hitler’ usage as an independent policy judgment. No additional source record was added because the necessary documents were already registered as SRC-021 and SRC-022; reserved IDs SRC-030–SRC-039 remain unused rather than duplicating sources."
- id: Q-005
  barbero_utterances: [U-00160–U-00168]
  barbero_timestamp: "09:05"
  attribution: "Emmanuel Mounier's characterization of a fraction of the French bourgeoisie; later variant attributed retrospectively to French defeatists"
  source_id: SRC-040
  original_language: fr
  original_text: "On ne comprendra rien au comportement de cette fraction de la bourgeoisie française, si on ne l'entend pas murmurer à mi-voix : ‘Hitler plutôt que Blum.’"
  translation: "Nothing about the conduct of this fraction of the French bourgeoisie can be understood unless one hears it murmuring under its breath: ‘Hitler rather than Blum.’"
  locator: "Emmanuel Mounier, ‘Lendemains d'une trahison,’ Esprit, no. 73, 1 October 1938, pp. 1–15, quoted passage p. 14; archival issue catalogued by JSTOR"
  translation_notes: "Direct translation of Mounier's French. Barbero substitutes Stalin for Blum and calls the expression a slogan of the French ruling classes. Mounier instead presents ‘Hitler plutôt que Blum’ as his own diagnostic rendering of what a fraction of the bourgeoisie murmured, not as a documented public slogan or a quotation from a named industrialist, general, or cleric. A 1943 France-Amérique article retrospectively prints the exact variant ‘Plutôt Hitler que Staline !’ and attributes it to French defeatists in 1939, but this wartime polemic does not establish a specific prewar speaker or organized slogan campaign."
  confidence: high
  status: resolved
  script_treatment: qualify
  research_note: "Verdict: confirmed in substance, with altered wording and overbroad attribution. Evidence tier 1 for Mounier's contemporary published characterization in Esprit; evidence tier 2 for Johann Chapoutot's modern scholarly synthesis that identifies economic, financial, intellectual, diplomatic, and military elites attracted by Nazi anti-communism; evidence tier 3 for the exact Stalin variant in a 23 May 1943 exile-period newspaper, because it is retrospective and polemical. The best-attested contemporary formula is ‘Hitler plutôt que Blum,’ and Mounier limits it to ‘cette fraction’ of the French bourgeoisie. Qualify rather than quote Barbero's Italian as a verbatim slogan, and avoid generalizing to the whole French ruling class. Supporting records: SRC-041 and SRC-042."
- id: Q-006
  barbero_utterances: [U-00173–U-00176]
  barbero_timestamp: "10:00"
  attribution: "Larry Lipton (played by Woody Allen), Manhattan Murder Mystery; screenplay by Woody Allen and Marshall Brickman"
  source_id: SRC-050
  original_language: en
  original_text: "I can't listen to that much Wagner, you know? I start to get the urge to conquer Poland."
  translation: "Non posso ascoltare tutto quel Wagner, sai? Comincia a venirmi voglia di conquistare la Polonia."
  locator: "Manhattan Murder Mystery (TriStar Pictures, 1993), Larry Lipton speaking to Carol Lipton after the opera, approximately 00:10:51; dialogue also appears in the undated screenplay draft (SRC-051)"
  translation_notes: "Direct translation of the English film dialogue. Barbero preserves the joke's Wagner–Poland association but freely recasts the setup as 'Quando sento Wagner, non so perché' ('When I hear Wagner, I don't know why') and changes 'conquer Poland' to 'invade Poland.' The line belongs to the fictional character Larry Lipton, performed by Allen; because Allen co-wrote the screenplay, calling it a Woody Allen line is broadly defensible but is less precise than attributing it to the character and film."
  confidence: high
  status: resolved
  script_treatment: preserve
  research_note: "Verdict: confirmed in substance. Evidence tier 1: the released English-language film supplies the performed wording and context; AFI independently documents the 18 August 1993 release, Larry Lipton casting, screenplay credits, production company, running time, and copyright registration. Evidence tier 2: the accessible undated screenplay draft reproduces the same sentence but is not identified as a final shooting script. Speaker and setting: Larry Lipton, played by Woody Allen, speaking to his wife Carol after attending a Wagner opera in New York. Document type/transmission: scripted and performed film dialogue, subsequently detached from its character context and widely circulated as a personal Woody Allen aphorism. Preserve the joke; if quoted exactly, use the film wording and identify Manhattan Murder Mystery."
