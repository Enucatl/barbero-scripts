  source_id: SRC-180
  original_language: de
  original_text: Dies ist, wie ich schon einmal betonte, vielleicht das schwerste aller Probleme Deutschlands. [...] Ich sah nun in der friedlichen Lösung dieser Frage einen weiteren Beitrag für eine endgültige europäische Entspannung. [...] Die polnische Regierung hat dieses mein Angebot abgelehnt. [...] Ich habe diese mir unverständliche Haltung der polnischen Regierung aufrichtig bedauert.
  translation: This is, as I have emphasized before, perhaps the most difficult of all Germany’s problems. [...] I saw the peaceful resolution of this question as a further contribution to a lasting relaxation of tensions in Europe. [...] The Polish government rejected this offer of mine. [...] I sincerely regretted this attitude of the Polish government, which I could not understand.
  locator: Reichstag speech, Berlin, 28 April 1939. German text in the 29 April Kattowitzer Zeitung, issue 116, speech section; the parallel English evidentiary extract is TC-72 no. 13, Prosecution Exhibit 43, IMT p. 1001 (SRC-180). The first sentence occurs in Hitler's discussion of the territorial arrangement giving Poland access to the sea; the later three excerpts occur in the ensuing discussion of Danzig and his proposal to Poland.
  translation_notes: Direct Italian translation of the contemporaneously printed German text, with explicit ellipses for substantial intervening passages. Barbero closely renders the three Danzig-related sentences, although 'doloroso' is freer than 'schwerste' (most difficult/gravest). More importantly, his introduction makes the first sentence refer specifically to Danzig, whereas in the speech it concludes Hitler's broader discussion of the Versailles territorial arrangement, the Corridor, and access to East Prussia. Hitler then separately calls Danzig the remaining open question. His 'offer' was a propagandistic self-description, not a neutral characterization.
  confidence: high
  status: resolved
  research_note: 'Verdict: confirmed in substance, with a scope error in the opening sentence. Evidence tier 1: a contemporaneous German newspaper prints the speech text (SRC-181), while the Harvard Nuremberg Trials Project preserves the official English prosecution extract, TC-72 no. 13 (SRC-180). Speaker/date/setting/document type: Adolf Hitler, public Reichstag address in Berlin, 28 April 1939, answering Roosevelt and declaring the 1934 German–Polish non-aggression declaration no longer binding. Transmission: Barbero combines non-contiguous passages from the same speech; the peaceful-solution, rejection, and regret formulations are close translations, but the ''most difficult problem'' sentence originally refers to the wider Polish-access/Corridor settlement rather than Danzig alone. Historical limitation: Hitler presents German demands as an exceptionally generous peace offer and Poland''s refusal as incomprehensible. IPN''s contextual account notes the demands, Poland''s refusal, Hitler''s
    use of the British guarantee as a pretext, and German war preparations already under way in early April (SRC-182). Preserve the quotation, mark the ellipses, correct the first sentence''s scope, and identify the account as Hitler''s public justification rather than an objective description.'
