  source_id: SRC-150
  original_language: en
  original_text: M. Beck made no secret of the fact that Poland had aspirations directed toward the Soviet Ukraine and a connection with the Black Sea; but at the same time he called attention to the supposed dangers to Poland that in the Polish view would arise from a treaty with Germany directed against the Soviet Union.
  translation: M. Beck made no secret of the fact that Poland had aspirations directed toward the Soviet Ukraine and a connection with the Black Sea; but at the same time he called attention to the supposed dangers to Poland that in the Polish view would arise from a treaty with Germany directed against the Soviet Union.
  locator: Ribbentrop memorandum of 1 February 1939 on his Warsaw conversations of 26 January; Documents on German Foreign Policy, 1918–1945, Series D, vol. V, document 126, pp. 167–168, quotation at p. 168
  translation_notes: 'Direct Italian translation of the official postwar English edition of Ribbentrop''s German memorandum; it is an indirect attribution, not a verbatim Polish transcript. Barbero preserves the striking ''made no secret'' phrase but changes the scene: Beck spoke with Ribbentrop in Warsaw on 26 January, not with Hitler in Berlin. Beck''s actual meeting with Hitler occurred at Berchtesgaden on 5 January and its Polish record has Hitler, not Beck, raise Ukraine. Barbero also omits the same sentence''s crucial qualification that Beck warned against an anti-Soviet treaty with Germany.'
  confidence: high
  status: resolved
  research_note: 'Verdict: composite. Evidence tier 1: Ribbentrop''s memorandum, published from captured German Foreign Ministry records in DGFP Series D, vol. V, reports Beck''s aspirations toward Soviet Ukraine and the Black Sea, but also his warning against an anti-Soviet German treaty. A Polish Foreign Ministry first draft made just after the 26 January talks gives a materially different emphasis: Ribbentrop offered Ukrainian compensation, Beck replied that he would not know what to do with it, and he accepted only possible consultation if fundamental eastern changes occurred. A 10 January U.S. diplomatic telegram independently reports Beck saying German interest in Ukraine was exaggerated. Evidence tier 2: recent archival scholarship concludes that Polish eastern ambitions existed, while stressing Poland''s refusal of an anti-Soviet alliance. Speaker/date/setting: Beck as represented by Ribbentrop, Warsaw, 26 January 1939; document written 1 February. Document type: retrospective diplomatic
    memorandum, not a stenographic protocol. Transmission: Barbero merges it with Beck''s separate 5 January Berchtesgaden meeting with Hitler and turns conflicting indirect records into a single confident scene. Qualify the attribution, correct the setting and interlocutor, and retain Beck''s stated warning. Supporting sources: SRC-151, SRC-152, SRC-153.'
