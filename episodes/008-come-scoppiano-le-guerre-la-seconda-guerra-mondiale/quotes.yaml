  translation_notes: 'Direct Italian translation of Henderson''s contemporaneous English telegram. Barbero follows the sequence and much of the language closely: the lengthy German document read ''at top speed''; Henderson''s assumption that he would receive it and consequent failure to follow closely; Ribbentrop''s claim that the text was obsolete because no Polish representative had arrived by midnight; his refusal to summon the Polish ambassador but hint that an interview requested by the ambassador might be treated differently; and the final ''aping Herr Hitler at his worst.'' Barbero intensifies ''an unpleasant interview'' to ''estremamente sgradevole'' and converts Henderson''s indirect reported speech into dramatic dialogue. Henderson did not say he scarcely listened at all; he recorded the main points of six proposals despite declining to guarantee complete accuracy.'
