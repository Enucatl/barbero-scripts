  confidence: high
  status: resolved
  research_note: 'Verdict: confirmed in substance, with a transmission correction. Evidence tier 1 for Ciano''s authorship and surviving text: the complete Italian Diario edition reproduces both the retrospective introduction and the dated 11 August entry; the diary was admitted at the IMT as PS-2987/USA-166 and the prosecution read this passage on 8 January 1946 (SRC-221). Speaker/date/setting: Ribbentrop to Ciano, 11 August 1939, while walking in the garden at Fuschl before dining; document type: Ciano''s late-1943 first-person recollection prefacing his diary, not a stenographic record or same-day quotation. Corroboration: the actual 11 August diary entry says German determination to fight was implacable and that Ribbentrop rejected any solution avoiding conflict; the IMT also preserved the 12 August Hitler–Ciano conference record documenting the decision to attack Poland (SRC-222). Ribbentrop denied saying ‘we want war’ in his IMT testimony (SRC-223), so retain Ciano''s attribution rather
