  translation_notes: "Direct translation of two separately attested German texts. Barbero modernizes 'Danzig bleibt deutsch' as the repeated 'Danzica è tedesca' and expands it with 'non ce l'hanno data', 'è una vergogna', and 'bisognerà tornarci su un giorno'; those additions are rhetorical reconstruction, not words found in the located slogan. His 'dobbiamo rivedere il trattato di Versailles' is milder than the NSDAP program's demand for Aufhebung, annulment. The Treaty of Versailles itself made Danzig a Free City rather than Polish territory, while removing it from German sovereignty."
