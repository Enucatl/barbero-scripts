  original_text: 'Halifax: ''Atmosphere may be improved if strict instructions are given or confirmed by Polish Government [...] (4) To stop inflammatory radio propaganda.'' ''The point that seemed to call for immediate comment was the German demand that a Polish representative should present himself at Berlin to-day. [...] His Majesty''s Government hope that, provided method and general arrangement for discussions can be satisfactorily agreed, Polish Government will be prepared to do so without delay.'' Henderson: ''I informed Herr von Ribbentrop to-night of the advice given to the Polish Government [...]. Herr von Ribbentrop replied that His Majesty''s Government''s advice had had cursed (‘verflucht’) little effect. I mildly retorted that I was surprised to hear such language from a Minister for Foreign Affairs.'''
