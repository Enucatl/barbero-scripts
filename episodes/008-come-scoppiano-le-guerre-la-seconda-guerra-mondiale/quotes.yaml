  original_language: de
  original_text: Auch in den unruhigen Monaten des vergangenen Jahres war die deutsch-polnische Freundschaft eine der beruhigenden Erscheinungen des europäischen politischen Lebens.
  translation: Even during the troubled months of the past year, German-Polish friendship was one of the reassuring features of European political life.
  locator: 'Speech before the first ''Greater German Reichstag,'' 30 January 1939; GHDI transcription, paragraph beginning ''In diesen Tagen jährt sich zum fünftenmal''; original printed edition Rede des Führers und Reichskanzlers Adolf Hitler vor dem Reichstag am 30. Januar 1939 (Berlin: M. Müller & Sohn, 1939), pp. 5–63; independently preserved in IMT evidence TC-73 no. 57, Prosecution Exhibit 37, IMT p. 991 (SRC-141)'
  translation_notes: 'Direct translation from the German text. Barbero reproduces the core proposition accurately but compresses it: he omits ''Auch in den unruhigen Monaten des vergangenen Jahres'' (''also during the troubled months of the previous year''), renders ''deutsch-polnische Freundschaft'' as friendship ''fra Germania e Polonia,'' substitutes ''fattori'' for ''Erscheinungen'' (''phenomena/features''), and shifts the original past tense to the present. The official IMT English rendering likewise reads: ''During the troubled months of the past year, the friendship between Germany and Poland has been one of the most reassuring factors in the political life of Europe.'''
