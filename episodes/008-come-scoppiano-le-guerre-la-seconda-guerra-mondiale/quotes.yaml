  source_id: SRC-210
  original_language: it
  original_text: Comincio a pensare all'opportunità di un mio incontro con Ribbentrop. È venuto il momento di saper veramente come stanno le cose. Il giuoco è troppo grosso per attenderne inerti gli sviluppi.
  translation: I am beginning to consider the advisability of meeting Ribbentrop. The time has come to find out what the situation really is. The stakes are too high for us to wait passively for developments.
