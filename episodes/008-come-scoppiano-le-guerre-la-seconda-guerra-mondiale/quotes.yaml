  original_language: de / ru (authoritative documentary English translations quoted)
  original_text: 'Hitler: ''I accept the draft of the non-aggression pact that your Foreign Minister, Herr Molotov, delivered but consider it urgently necessary to clarify the questions connected with it as soon as possible. [...] I therefore again propose that you receive my Foreign Minister on Tuesday, August 22, but at the latest on Wednesday, August 23.'' Stalin: ''I thank you for the letter. I hope that the German-Soviet non-aggression pact will mark a decided turn for the better in the political relations between our countries. [...] The Soviet Government has authorized me to inform you that it agrees to Herr von Ribbentrop''s arriving in Moscow on August 23.'''
  translation: 'Hitler: ''I accept the draft of the non-aggression pact that your Foreign Minister, Herr Molotov, delivered but consider it urgently necessary to clarify the questions connected with it as soon as possible. [...] I therefore again propose that you receive my Foreign Minister on Tuesday, August 22, but at the latest on Wednesday, August 23.'' Stalin: ''I thank you for the letter. I hope that the German-Soviet non-aggression pact will mark a decided turn for the better in the political relations between our countries. [...] The Soviet Government has authorized me to inform you that it agrees to Herr von Ribbentrop''s arriving in Moscow on August 23.'''
  locator: 'Hitler message: German Foreign Office telegram no. 189, Berlin, 20 August 1939, 4:35 p.m., Yale Nazi-Soviet Relations document ns044 (SRC-290). Delivery: Schulenburg telegram no. 197, Moscow, 21 August, 5:30 p.m., recording delivery to Molotov at 3 p.m. Stalin reply: Schulenburg telegram no. 200, Moscow, 21 August, 7:30 p.m., Yale document ns048 (SRC-291); Russian archival locator AVP SSSR, fond 0745, opis 14, papka 32, delo 3, list 65; God krizisa, doc. 583 (SRC-292)'
  translation_notes: Direct Italian translation of the authoritative English documentary edition, checked against the published Russian text of Stalin's reply. Barbero accurately compresses Hitler's acceptance and request to advance Ribbentrop's visit from the Soviet-proposed 26–27 August to 22 or 23 August, and Stalin's acceptance of 23 August. Hitler's text is a formal six-point message and does not simply say 'I'm glad you agreed to see Ribbentrop'; it welcomes the trade agreement, accepts the Soviet draft, discusses a supplementary protocol, invokes the German-Polish crisis, and asks for an early answer. Stalin does not say 'facciamo prima' or explicitly 'firmiamo' on the 23rd, though he welcomes the pact and accepts Ribbentrop's arrival that day.
  confidence: high
  status: resolved
  research_note: 'Verdict: confirmed in substance. Evidence tier 1: the 1948 United States Department of State documentary edition Nazi-Soviet Relations reproduces captured German Foreign Office telegrams for Hitler''s message, its delivery, and Stalin''s reply; a Russian documentary edition supplies Stalin''s Russian text and Soviet archive locator. Speaker/date/setting/transmission: Hitler''s personal message to Stalin was authorized in Berlin on Sunday 20 August 1939, reached Moscow after midnight, and was handed by Ambassador Friedrich-Werner von der Schulenburg to Molotov with a translation at 3 p.m. on Monday 21 August; Molotov delivered Stalin''s reply at 5 p.m., and the embassy transmitted its full text at 7:30 p.m. These were formal written messages relayed diplomatically, not direct real-time telegrams between the two men. Barbero''s dates and essential exchange are correct. The broader assertion that this was the first message ever sent to Stalin by a Western head of government
    was not established by these documents and should be separately sourced or omitted. Preserve the exchange while quoting or closely paraphrasing the formal wording and clarifying the two-stage dates.'
