  barbero_timestamp: '64:44'
  attribution: Viscount Halifax and Sir Howard Kennard, British ambassador in Warsaw
  source_id: SRC-440
  original_language: en
  original_text: 'Halifax: ''I do not see why the Polish Government should feel difficulty about authorising Polish Ambassador to accept a document from the German Government, and I earnestly hope that they may be able to modify their instructions to him in this respect. [...] On the other hand, a refusal by them to receive proposals would be gravely misunderstood by outside opinion. [...] I should have thought that the Polish Ambassador could surely be instructed to receive and transmit a document [...]. If negotiations are initiated, His Majesty''s Government will at all times be ready, if desired, to lend any assistance in their power to achieve a just settlement. [...] Please speak to M. Beck immediately in the above sense.'' Kennard: ''Your telegram of 1st September was decyphered at 4 a. m. to-day. M. Lipski had already called on the German Foreign Minister at 6:30 p. m. yesterday. In view of this fact, which was followed by German invasion of Poland at dawn to-day, it was clearly
    useless for me to take the action suggested.'''
  translation: 'Halifax: ''I do not see why the Polish Government should feel difficulty about authorising Polish Ambassador to accept a document from the German Government, and I earnestly hope that they may be able to modify their instructions to him in this respect. [...] On the other hand, a refusal by them to receive proposals would be gravely misunderstood by outside opinion. [...] I should have thought that the Polish Ambassador could surely be instructed to receive and transmit a document [...]. If negotiations are initiated, His Majesty''s Government will at all times be ready, if desired, to lend any assistance in their power to achieve a just settlement. [...] Please speak to M. Beck immediately in the above sense.'' Kennard: ''Your telegram of 1st September was decyphered at 4 a. m. to-day. M. Lipski had already called on the German Foreign Minister at 6:30 p. m. yesterday. In view of this fact, which was followed by German invasion of Poland at dawn to-day, it was clearly useless
    for me to take the action suggested.'''
  locator: 'British War Blue Book, Cmd. 6106, Miscellaneous No. 9 (1939): document 100, Halifax to Kennard, Foreign Office, 1 September 1939, 12:50 a.m., paragraphs 3–5 and 8 (SRC-440); document 101, Kennard to Halifax, Warsaw, 1 September, dated 7:43 p.m. and received 2 a.m. on 2 September, complete two-paragraph telegram (SRC-441). Separate Berlin instruction: document 99, Halifax to Henderson, 31 August, 11 p.m. (SRC-442).'
  translation_notes: 'Direct Italian translation of the two official English telegrams. Barbero reproduces the decisive phrases and times very closely: Halifax''s difficulty understanding the Polish refusal to receive a document; the warning that refusal would be gravely misunderstood by outside opinion; British willingness to assist; Kennard''s 4 a.m. decipherment; Lipski''s 6:30 p.m. visit the previous day; the German invasion at dawn; and the conclusion that action was clearly useless. He changes ''outside opinion'' to generic public opinion and ''receive and transmit a document'' to ''accept this German-government document.'' Halifax did not simply order that Lipski ''go to Ribbentrop immediately'': he asked Kennard to speak to Foreign Minister Beck immediately so that Lipski''s instructions might be modified. Nor was one identical telegram sent to Berlin and Warsaw: Halifax''s 11 p.m. Berlin message separately asked Henderson to notify Germany of Polish efforts and propose a Danzig
    modus vivendi.'
  confidence: high
  status: resolved
  research_note: 'Verdict: composite, but the quoted substance and chronology are confirmed. Evidence tier 1: the British Foreign Office published Halifax''s Warsaw instruction and Kennard''s reply as documents 100–101 in Cmd. 6106 (SRC-440–441), with the distinct Berlin instruction as document 99 (SRC-442). Speakers/date/setting/document type: Foreign Secretary Viscount Halifax telegraphed Ambassador Sir Howard Kennard in Warsaw from London at 12:50 a.m. British time on Friday 1 September 1939; it was deciphered in Warsaw at 4 a.m. Kennard''s reply was dated 7:43 p.m. that day and received in London at 2 a.m. on 2 September. The embedded chronology refers to Polish ambassador Józef Lipski''s meeting with Ribbentrop at 6:30 p.m. on 31 August and Germany''s invasion at dawn on 1 September. Transmission: confidential diplomatic telegrams, officially published in September 1939. Barbero accurately dramatizes the cruel obsolescence of Halifax''s instruction but conflates the separate Berlin/Warsaw
    messages, overstates the directive to Lipski, and says Kennard replied ''that evening'' without noting its receipt only on 2 September. Preserve the exact exchange and timing, while distinguishing recipients and wording; the characterization of Halifax''s telegram as uniquely ''insulso'' is Barbero''s judgment, not source language.'
