  original_text: Se la Germania attacca la Polonia e gli Alleati di questa contrattaccano la Germania, Vi prospetto l'opportunità di non assumere io l'iniziativa di operazioni belliche date le attuali condizioni della preparazione militare italiana ripetutamente e tempestivamente segnalate a Voi, Führer, e a von Ribbentrop. Il nostro intervento può tuttavia essere immediato se la Germania ci darà subito i mezzi bellici e le materie prime per sostenere l'urto che i franco-inglesi dirigeranno prevalentemente contro di noi. Nei nostri incontri la guerra era prevista dopo il 1942, e a quell'epoca sarei stato pronto per terra per mare e per aria, secondo i piani concordati.
  translation: If Germany attacks Poland and Poland's allies counterattack Germany, I put before you the advisability of my not taking the initiative in military operations, given the present condition of Italian military preparations, which has repeatedly and promptly been made known to you, Führer, and to von Ribbentrop. Our intervention can nevertheless be immediate if Germany immediately gives us the war materiel and raw materials needed to withstand the blow that the French and British will direct mainly against us. In our meetings war had been envisaged for after 1942, and by then I would have been ready on land, at sea, and in the air, according to the agreed plans.
