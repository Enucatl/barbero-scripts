  original_text: There was here no concrete plan, no directive for German policy in 1937 and 1938. Or if there were a directive, it was to wait upon events. [...] Hitler did not make plans—for world conquest or for anything else. He assumed that others would provide opportunities, and that he would seize them. [...] His foreign policy was a different matter. He aimed to make Germany the dominant Power in Europe and maybe, more remotely, in the world. Other Powers have pursued similar aims, and still do.
  translation: There was here no concrete plan, no directive for German policy in 1937 and 1938. Or if there were a directive, it was to wait upon events. [...] Hitler did not make plans—for world conquest or for anything else. He assumed that others would provide opportunities, and that he would seize them. [...] His foreign policy was a different matter. He aimed to make Germany the dominant Power in Europe and maybe, more remotely, in the world. Other Powers have pursued similar aims, and still do.
  locator: Taylor, The Origins of the Second World War, chap. 6, pp. 91–92 in the accessible text (discussion of the Hossbach memorandum); ‘Second Thoughts’ (1963), pp. 199–200 in that witness, corresponding to pp. xxvii–xxviii of the 1996 Simon & Schuster reprint
  translation_notes: Direct translation of three passages joined with explicit ellipses. Barbero gives a fair interpretive synthesis, not a quotation. His ‘voleva delle cose normali’ compresses Taylor’s narrower comparative claim that other great powers pursued domination and defended interests by force; Taylor did not call Hitler’s regime or crimes normal. ‘Aspettava le occasioni’ closely tracks ‘wait upon events’ and ‘others would provide opportunities, and ... he would seize them.’ Taylor’s sharpest moral/foreign-policy distinction comes from the 1963 ‘Second Thoughts’ foreword added after the controversial 1961 first edition, while the opportunity argument already appears in the original narrative.
  confidence: high
  status: resolved
  research_note: 'Verdict: confirmed in substance. Evidence tier 1: Taylor’s published English text, with the main-book argument and his authorial 1963 clarification both recoverable in full (SRC-060). Author/date/document: A. J. P. Taylor; historical monograph first published by Hamish Hamilton in 1961; ‘Second Thoughts’ written in 1963 and carried in later editions, including Penguin 1964. Taylor argued against treating the Hossbach memorandum as a detailed blueprint and portrayed Hitler as exploiting opportunities, but he explicitly assigned Hitler the greatest responsibility for unparalleled domestic and wartime evil. Barbero accurately captures the opportunism thesis but dramatizes and merges passages from the original book and later foreword. Qualify the summary so ‘normal’ refers only to the comparative logic of great-power foreign policy, not to Hitler’s crimes or the Nazi regime. Limitation: the accessible full-text witness is an unofficial digital transcription whose pagination
    differs from standard editions; quotations should cite the named print-edition pagination when used publicly.'
