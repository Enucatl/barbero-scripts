  original_text: I said that there were no doubt other questions arising out of the Versailles settlement which seemed to us capable of causing trouble if they were mishandled, e.g. Danzig, Austria, Czechoslovakia. On all these matters we were not necessarily concerned to stand for the status quo as today, but we were concerned to avoid such treatment of them as would be likely to cause trouble. If reasonable settlements could be reached with the free assent and goodwill of those primarily concerned we certainly had no desire to block.
  translation: I said that there were no doubt other questions arising out of the Versailles settlement which seemed to us capable of causing trouble if they were mishandled, e.g. Danzig, Austria, Czechoslovakia. On all these matters we were not necessarily concerned to stand for the status quo as today, but we were concerned to avoid such treatment of them as would be likely to cause trouble. If reasonable settlements could be reached with the free assent and goodwill of those primarily concerned we certainly had no desire to block.
  locator: Documents on British Foreign Policy, 1919–1939, Second Series, vol. XIX, document 336, p. 540, Halifax's record of his conversation with Hitler at the Berghof, 19 November 1937; compare DGFP, Series D, vol. I, document 31, pp. 55–67, especially p. 67 (SRC-022)
  translation_notes: Direct translation of Halifax's English first-person record. Barbero accurately compresses the acceptance of possible peaceful revisions concerning Danzig, Austria, and Czechoslovakia. His wording about changes 'with time' and 'in a peaceful manner' more closely follows Paul Schmidt's German interpreter record, whose published English translation says that alterations would probably occur sooner or later and should come through 'peaceful evolution' without 'far-reaching disturbances.' Barbero says Berlin, but the Hitler meeting took place at the Berghof near Berchtesgaden; and Halifax was Lord President of the Council, not Foreign Secretary, in November 1937. Poland is Barbero's geographic gloss on the Danzig question.
  confidence: high
  status: resolved
  research_note: 'Verdict: confirmed in substance. Evidence tier 1: two near-contemporary official records survive—Halifax''s own first-person account, published in DBFP, and interpreter Paul Schmidt''s German record, published in DGFP; Halifax''s 29 November report to the French ministers independently restates that Britain would not rigidly uphold the status quo and required freely reached adjustments without dangerous consequences (SRC-021). Speaker: Halifax; date and setting: 19 November 1937, private confidential conversation with Hitler at the Berghof near Berchtesgaden, with Konstantin von Neurath and interpreter Paul Schmidt present. Document type/transmission: diplomatic notes reconstructed from notes made during or shortly after the meeting, not a verbatim transcript. The two records differ in phrasing and emphasis, and Halifax later disclosed that his notes and Schmidt''s notes were distinct; no formal pledge or agreement resulted. Preserve the substantive point, but correct Halifax''s
    office and the location and avoid quotation marks around Barbero''s synthesized wording.'
