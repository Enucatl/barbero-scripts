  original_text: 'Henderson: ''Interview this evening was of a stormy character and Herr Hitler far less reasonable than yesterday. [...] He kept saying that he wanted British friendship more than anything in the world, but he could not sacrifice Germany''s vital interests therefor.'' Henderson''s accompanying report: ''German Government, note adds, counts on arrival of such plenipotentiary to-morrow, Wednesday, 30th August. [...] I remarked that this phrase sounded like an ultimatum.'' Hitler''s written reply: ''The German Government, accordingly, in these circumstances agree to accept the British Government''s offer of their good offices in securing the despatch to Berlin of a Polish Emissary with full powers. They count on the arrival of this Emissary on Wednesday, the 30th August, 1939.'''
  translation: 'Henderson: ''Interview this evening was of a stormy character and Herr Hitler far less reasonable than yesterday. [...] He kept saying that he wanted British friendship more than anything in the world, but he could not sacrifice Germany''s vital interests therefor.'' Henderson''s accompanying report: ''German Government, note adds, counts on arrival of such plenipotentiary to-morrow, Wednesday, 30th August. [...] I remarked that this phrase sounded like an ultimatum.'' Hitler''s written reply: ''The German Government, accordingly, in these circumstances agree to accept the British Government''s offer of their good offices in securing the despatch to Berlin of a Polish Emissary with full powers. They count on the arrival of this Emissary on Wednesday, the 30th August, 1939.'''
  locator: 'British War Blue Book, Cmd. 6106, Miscellaneous No. 9 (1939): document 80, Henderson to Halifax, Berlin, 29 August, received 10:25 p.m., paragraphs 1–2 (mood, friendship, vital interests; SRC-380); document 79, received 9:15 p.m., paragraphs 3–5 (deadline, ultimatum objection, equal treatment; SRC-381); document 78, Hitler''s reply handed to Henderson during the evening of 29 August, final two paragraphs (Polish emissary with full powers due 30 August; SRC-382).'
  translation_notes: 'Direct Italian translation of the official English documents. Barbero follows Henderson''s wording closely for the ''stormy'' interview and Hitler''s repeated contrast between British friendship and German vital interests. ''Hitler questa sera non era simpatico'' is not a faithful rendering of ''Herr Hitler far less reasonable than yesterday'': the latter means ''molto meno ragionevole,'' not ''not likeable.'' The emissary-with-full-powers deadline belongs to Hitler''s written German reply and Henderson''s separate summary telegram, not to the paragraph describing Hitler''s mood. Barbero paraphrases ''counts on arrival ... Wednesday, 30th August'' as a conditional offer to negotiate if Britain guarantees Polish willingness; the documents instead record a demand that Henderson himself called ultimatum-like.'
