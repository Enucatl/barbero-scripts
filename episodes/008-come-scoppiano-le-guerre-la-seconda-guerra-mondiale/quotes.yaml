  translation: "Despite these difficulties, he (Lord Halifax) and other members of the British Government were convinced that the Führer had not only accomplished much within Germany itself, but that by destroying communism in his own country he had also blocked its path to Western Europe, and that Germany could therefore rightly be regarded as the bulwark of the West against Bolshevism."
