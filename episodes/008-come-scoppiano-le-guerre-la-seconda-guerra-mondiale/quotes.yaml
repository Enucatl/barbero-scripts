  original_language: en
  original_text: The settlement of the Czechoslovakian problem, which has now been achieved, is, in my view, only the prelude to a larger settlement in which all Europe may find peace. [...] We regard the agreement signed last night and the Anglo-German naval agreement as symbolic of the desire of our two peoples never to go to war with one another again. [...] My good friends, this is the second time in our history that there has come back from Germany to Downing Street peace with honour. I believe it is peace for our time. [...] And now I recommend you to go home and sleep quietly in your beds.
  translation: The settlement of the Czechoslovakian problem, which has now been achieved, is, in my view, only the prelude to a larger settlement in which all Europe may find peace. [...] We regard the agreement signed last night and the Anglo-German naval agreement as symbolic of the desire of our two peoples never to go to war with one another again. [...] My good friends, this is the second time in our history that there has come back from Germany to Downing Street peace with honour. I believe it is peace for our time. [...] And now I recommend you to go home and sleep quietly in your beds.
  locator: Heston Aerodrome broadcast, 30 September 1938, BBC recording at 6:51–8:28; later remarks from a first-floor window at 10 Downing Street, after Chamberlain's audience with George VI
  translation_notes: 'Direct translation of excerpts joined with explicit ellipses. Barbero closely follows the wording but silently combines two appearances. At Heston, Chamberlain spoke of the wider European settlement, displayed the paper, and read the Anglo-German declaration. The phrase ''peace with honour,'' the exact ''peace for our time'' (not the often-repeated ''peace in our time''), and the advice to sleep quietly came later at 10 Downing Street. The paper was not the four-power Munich Agreement signed during the night: it was a separate bilateral declaration signed by Hitler and Chamberlain on the morning of 30 September. Barbero also modernizes the Downing Street syntax into ''the British prime minister returned from Germany.'''
  confidence: high
