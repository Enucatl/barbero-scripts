- id: C-029
  claim: Royalist parliamentarians and peers were on average younger than parliamentarian supporters.
  transcript:
  - U-01120–U-01140
  centrality: sampled-incidental
  supporting_sources:
  - SRC-040
  - SRC-046
  conflicting_sources: []
  status: resolved
  research_note: >-
    Brunton and Pennington’s prosopographical work, together with regional university-matriculation evidence, supports a
    younger average age among Royalist than Parliamentarian MPs; one contemporary analysis estimates the difference at about
    ten years. The evidence is strongest for parliamentary and military samples, not every peer or every supporter, and age is
    a correlation rather than proof that youthful political experience caused Royalism. Retain with that scope limitation.
  treatment: retain-with-qualification
