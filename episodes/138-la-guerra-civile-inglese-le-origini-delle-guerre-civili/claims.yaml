- id: C-018
  claim: The English Revolution was bourgeois chiefly because it defended private property rather than seeking social equality.
  transcript:
  - U-00650–U-00658
  centrality: central
  supporting_sources:
  - SRC-014
  - SRC-016
  - SRC-039
  conflicting_sources: []
  status: resolved
  research_note: >-
    The claim expresses the classic Marxist/social interpretation associated with Hill and related historians: the revolution
    transferred political power toward propertied interests and protected property, while radical egalitarian programmes were
    defeated. Revisionist and post-revisionist historians dispute the idea of a unified bourgeois class or a chiefly economic
    cause, and Levellers and Diggers did articulate competing egalitarian or communal programmes. Present this as a
    historiographical interpretation, not settled fact.
  treatment: retain-with-qualification
