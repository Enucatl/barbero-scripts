- id: C-006
  claim: Henrietta Maria’s Catholicism and court culture intensified country hostility to the crown.
  transcript:
  - U-00151–U-00179
  centrality: central
  supporting_sources:
  - SRC-031
  - SRC-032
  conflicting_sources: []
  status: resolved
  research_note: >-
    Henrietta Maria’s Catholicism, French identity, household, and court patronage were repeatedly used in anti-popish and
    anti-court polemic and could intensify distrust of the crown. Recent scholarship cautions that anti-Catholicism was not
    uniformly a powerful collective force throughout the 1630s; its political use sharpened during the crisis of 1640–42.
  treatment: retain-with-qualification
- id: C-007
  claim: The established Church of England combined Protestant doctrine with episcopal hierarchy and authoritarian discipline.
  transcript:
  - U-00180–U-00203
  centrality: central
  supporting_sources:
  - SRC-009
  - SRC-041
  conflicting_sources: []
  status: resolved
  research_note: >-
    The Church of England was Protestant, episcopally governed, and established under royal supremacy. Laudian policy in the
    1630s emphasized uniformity, ceremonial worship, altarwise communion, and disciplinary enforcement. “Authoritarian” is an
    interpretive description of that enforcement, not a neutral institutional label.
  treatment: retain-with-qualification
- id: C-008
  claim: Puritan dissent joined lay Bible reading and anti-episcopacy to religious intolerance and hostility toward recreation.
  transcript:
  - U-00204–U-00244
  centrality: central
  supporting_sources:
  - SRC-041
  - SRC-042
  conflicting_sources: []
  status: resolved
  research_note: >-
    Puritan currents emphasized Scripture, preaching, anti-popery, and opposition to episcopal control; important strands also
    promoted sabbatarian discipline and opposed theatre and other recreation. Puritanism was internally diverse, however, and
    many conforming “godly” Protestants used the Prayer Book, so the claim should not describe every Puritan as equally
    intolerant or anti-recreational.
  treatment: retain-with-qualification
- id: C-009
  claim: Laud’s conformity campaign imposed ceremonial changes and punished dissenting clergy.
  transcript:
  - U-00247–U-00332
  centrality: central
  supporting_sources:
  - SRC-009
  conflicting_sources: []
  status: resolved
  research_note: UK Parliament confirms that religious innovations and the 1637 Scottish Prayer Book built opposition.
  treatment: retain
- id: C-010
  claim: Laudian persecution drove a substantial Puritan migration to New England.
  transcript:
  - U-00333–U-00341
  centrality: supporting
  supporting_sources:
  - SRC-038
  - SRC-041
  conflicting_sources: []
  status: resolved
  research_note: >-
    The 1630s Great Migration to New England was substantial, commonly estimated at roughly 15,000–20,000 people (with
    lower estimates in some demographic studies). Laudian conformity pressure and the ejection or silencing of ministers were
    important motives, but migration began before the harshest phase and also reflected commercial, familial, and religious
    community motives. “Driven” should therefore be qualified rather than treated as a single-cause explanation.
  treatment: retain-with-qualification
- id: C-011
  claim: William Prynne was twice pilloried and mutilated for polemical publications while imprisoned.
  transcript:
  - U-00371–U-00419
  centrality: supporting
  supporting_sources:
  - SRC-033
  conflicting_sources: []
  status: resolved
  research_note: >-
    Gardiner’s Camden Society edition documents Prynne’s Star Chamber proceedings in 1634 and 1637. He was imprisoned,
    fined, pilloried and mutilated in the first case, then sentenced again in 1637 with the remaining ear stumps removed and
    his cheeks branded. “Twice pilloried and mutilated” is substantially accurate, though the two sentences differed in the
    precise injuries and dates.
  treatment: retain
- id: C-012
  claim: English Catholic priests faced capital statutes that Charles enforced leniently.
  transcript:
  - U-00427–U-00443
  centrality: supporting
  supporting_sources:
  - SRC-034
  conflicting_sources: []
  status: resolved
  research_note: >-
    The 1585 statute made the presence of seminary priests and Jesuits in England a capital treason offence. Charles I
    largely suspended executions under it during 1625–40, amounting to a contested quasi-toleration, but capital enforcement
    resumed during the parliamentary crisis and early civil war. The claim is sound only with this chronology and with
    “leniently” understood as selective non-enforcement, not repeal of the statutes.
  treatment: retain-with-qualification
