- id: C-025
  claim: Strafford proposed using an Irish army to reduce “this kingdom,” an ambiguity used against him.
  transcript:
  - U-00872–U-00937
  centrality: central
  supporting_sources:
  - SRC-035
  - SRC-036
  conflicting_sources: []
  status: resolved
  research_note: >-
    Parliamentary testimony and the subsequent attainder record Strafford’s reported advice that the King had an army in
    Ireland with which he might “reduce this kingdom.” The wording was genuinely ambiguous between Scotland and England;
    opponents presented it as a plan to subdue England, while Strafford’s defence placed it in the Scottish war. The claim
    should retain the ambiguity and avoid asserting his intent as proved.
  treatment: retain-with-qualification
- id: C-026
  claim: The 1640 election produced unusually strong popular mobilization and a small court party.
  transcript:
  - U-00951–U-00980
  centrality: supporting
  supporting_sources:
  - SRC-037
  - SRC-040
  conflicting_sources: []
  status: resolved
  research_note: >-
    The 1640 elections were unusually contested and politically organized after the Personal Rule: opposition leaders
    canvassed constituencies, petitions and popular demonstrations fed directly into parliamentary politics, and very few of
    the King’s ministers were returned. The exact “eleven percent” court-party calculation and the generalization from
    artisans and shopkeepers require a defined dataset; retain the broader mobilization claim with a statistical caveat.
  treatment: retain-with-qualification
- id: C-027
  claim: Strafford was condemned by attainder after the treason case faltered, and Charles assented despite promising his
    safety.
  transcript:
  - U-01034–U-01064
  centrality: central
  supporting_sources:
  - SRC-035
  - SRC-036
  conflicting_sources: []
  status: resolved
  research_note: >-
    Strafford’s impeachment failed after his defence before the Lords, so Parliament adopted a bill of attainder declaring him
    guilty without a further trial. Charles eventually granted royal assent under intense political and personal pressure.
    His earlier assurance of protection to Strafford is reported in the surrounding contemporary narrative but is not itself
    contained in the attainder; describe it as an assurance or promise, not as a legally binding guarantee.
  treatment: retain-with-qualification
