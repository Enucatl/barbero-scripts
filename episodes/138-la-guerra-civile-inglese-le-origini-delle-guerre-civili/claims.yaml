- id: C-003
  claim: England remained outside the Thirty Years’ War in 1637 and celebrated peace in an Inns of Court masque.
  transcript:
  - U-00060–U-00077
  centrality: supporting
  supporting_sources:
  - SRC-017
  - SRC-029
  conflicting_sources: []
  status: resolved
  research_note: >-
    England was not a formal belligerent in the Thirty Years’ War in 1637, although English and Scottish subjects served
    abroad and the crown had earlier pursued continental interventions. The Inns of Court masque was The Triumph of Peace,
    performed at Whitehall on 3 February 1634 (1633/4 Old Style), not 1637. Retain the neutrality and peace imagery only
    with the date corrected and without calling England the only major country uninvolved.
  treatment: accuracy-note
- id: C-004
  claim: English court etiquette and royal-touching ritual isolated Charles from ordinary subjects.
  transcript:
  - U-00082–U-00104
  centrality: sampled-incidental
  supporting_sources:
  - SRC-030
  - SRC-014
  conflicting_sources: []
  status: resolved
  research_note: >-
    Court ceremonial and access rules made ordinary contact with Charles rare and highly mediated by courtiers. The royal
    touch for scrofula was nevertheless a public ritual that brought subjects into direct contact with the monarch, so
    “isolated” should be understood as socially and institutionally separated, not literally unseen except twice yearly.
  treatment: retain-with-qualification
