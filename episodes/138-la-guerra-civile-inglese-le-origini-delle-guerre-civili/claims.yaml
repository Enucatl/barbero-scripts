- id: C-021
  claim: Covenanter coercion caused elite fear that religious rebellion could become social revolution.
  transcript:
  - U-00762–U-00793
  centrality: supporting
  supporting_sources:
  - SRC-022
  - SRC-034
  - SRC-044
  conflicting_sources: []
  status: resolved
  research_note: >-
    The Covenanter movement mobilized broad support, created an alternative governing structure, and pursued a coercive
    programme of religious uniformity and a “godly society.” Contemporary and later observers could therefore fear that
    resistance might escape elite control and become social disorder. The precise extent of elite fear of social revolution is
    interpretive and varied by faction; retain the claim with that qualification rather than as a documented consensus.
  treatment: retain-with-qualification
