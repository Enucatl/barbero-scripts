- id: Q-011
  barbero_utterances:
  - U-00682–U-00685
  barbero_timestamp: '45:58'
  attribution: Unnamed Scottish nobleman (anecdotal tradition)
  quotation_kind: near-direct
  source_id: SRC-017
  original_language: en
  original_text: If I have lain with never so many whores, I’ll never lie with the whore of Babylon.
  translation: If I have lain with never so many whores, I’ll never lie with the whore of Babylon.
  locator: The King's Peace, p. 118; independently transcribed by Pigden, p. 214 and n. 22
  translation_notes: English wording as transmitted by Wedgwood and quoted by Pigden. Barbero closely translates it, changing
    the conditional “If I have lain with never so many” into a declarative past statement.
  confidence: medium
  status: resolved
  verdict: confirmed-in-substance
  source_replacement: eligible
  research_note: >-
    C. V. Wedgwood presents this as the remark of an unnamed Scottish nobleman who opposed the Anglican Book of Common Prayer;
    Charles R. Pigden reproduces the exact sentence and cites Wedgwood, p. 118. No contemporary record or speaker identification
    was recovered. The punchline predates the Scottish crisis: the anonymous character sketch “A Precisian,” published among
    the additions to Sir Thomas Overbury's Characters by 1615, says that a hypocritical Puritan can “lie with any whore save
    the whore of Babylon.” A 1638 anti-Covenanter satire likewise says its targets reject no whore “except the whore of Babylone.”
    The nobleman's saying is therefore best treated as an anecdotal adaptation of a circulating satirical formula, not a
    recoverable verbatim utterance.
