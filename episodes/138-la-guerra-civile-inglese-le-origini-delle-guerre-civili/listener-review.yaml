    chapter_id: CH-013
    current_text: |-
      He lets Parliament know that if this continues—and here I
      quote—“... at last the common people (who in the mean time must be flattered, and to whom
      license must be given in all their wild humours, how contrary soever to established law, or
      their own real good) discover this arcanum imperii, that all this was done by them, but not
      for them, grow weary of journey-work, and set up for themselves, call parity and independence
      liberty, devour that estate which had devoured the rest; destroy all rights and properties,
      all distinctions of families and merit; and by this means this splendid and excellently
      distinguished form of government end in a dark equal chaos of confusion, and the long line of
      our many noble ancestors in a Jack Cade, or a Wat Tyler.”
    current_text_sha256: 9ab69b72cf80cae36146238e800df48cd0b45154cc5a6ac2f822310d21f22ac7
  proposed_text: >-
    He warns Parliament that once common people realize the reforms were done by them but not for
    them, they may “set up for themselves, call parity and independence liberty” destroy “all rights and properties, all distinctions of families and merit” and reduce
    government to “a dark equal chaos of confusion.”
  reason: Shorten Q-017 while preserving its fear that popular mobilization will destroy property and hierarchy.
  preserves:
  - fear of popular revolution
  - exact surviving source words
