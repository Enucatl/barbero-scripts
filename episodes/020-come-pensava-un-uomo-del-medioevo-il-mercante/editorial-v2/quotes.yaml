- id: Q-023
  transcript:
  - U-00434–U-00450
  attribution: Dino Compagni on the route debate before Campaldino
  quotation_kind: composite
  source_ids:
  - SRC-001
  - SRC-002
  original_language: Italian
  original_text: 'Dicitori vi furono assai; le pallottole segrete si dierono: vinsesi d''andare per Casentino. Ma
    con tutto fusse più dubbiosa e pericolosa via, il meglio ne seguì. […] ove, se avessono trovati i nimici, arebbono
    ricevuto assai danno: ma non volle Dio.'
  translation: 'There were many speakers; the secret ballots were cast: the decision was to go through the Casentino.
    But although it was a more uncertain and dangerous route, the best outcome followed. […] Had they encountered
    the enemy there, they would have suffered great harm; but God did not will it.'
  locator: I.9 first paragraph https://www.intratext.com/IXT/ITA1139/_PA.HTM; I.10 opening https://www.intratext.com/IXT/ITA1139/_PB.HTM
  verdict: confirmed in substance
  source_replacement: eligible
  status: resolved
  research_note: 'Intended treatment: maintain discussion/paraphrase/quotation alternation. Source specifies captains
    and war governors, not all citizens; secret ball ballots, not explicitly white and black beans; and no all-day
