- id: SRC-001
  title: Cronica delle cose occorrenti ne' tempi suoi
  author: Dino Compagni
  date: early fourteenth century; electronic edition 2007
  url: https://www.intratext.com/IXT/ITA1139/
  edition: IntraText, from Liber Liber electronic transcription; credits identify Gino Luzzatto introduction and
    notes, Einaudi, Turin, 1968
  locator: Proemio; I.1–27; II.1–36; III.1–42; individual chapter URLs in each Q record
  accessed: '2026-10-02'
  evidence_type: Primary medieval narrative in electronic Italian transcription
  limitations: Not an autograph or new critical collation. Electronic text has visible transcription defects and
    historical dates that must not be silently adopted. Modern chapter summaries are editorial, not Compagni's words.
    Print edition attribution comes from site's credits, not independent inspection of the 1968 volume.
- id: SRC-002
  title: Cronica delle cose occorrenti ne' tempi suoi
  author: Dino Compagni; introductory essay by Atto Vannucci
  date: 1860 edition
  url: https://it.wikisource.org/wiki/Indice:Compagni_-_Cronica,_1860.djvu
  edition: 'Milano: M. Guigoni, 1860; Wikisource transcription of scan'
  locator: Proemio and three books; print pp. 27, 28–70, 71–118, 119–182
  accessed: '2026-10-02'
  evidence_type: Primary medieval text in nineteenth-century edition
  limitations: Index and Proemio/three book pages opened; selected corresponding passages consulted, especially
    book I. Wikisource labels transcription complete but not proofread. Not full facsimile collation. Spelling/readings
    differ from QSRC-001, and its I.4 contains an evident 1283/1282 inconsistency.
  related_urls:
  - https://it.wikisource.org/wiki/Cronica_delle_cose_occorrenti_ne%27_tempi_suoi/Cronaca_di_Dino_Compagni/Libro_I
  - https://it.wikisource.org/wiki/Cronica_delle_cose_occorrenti_ne%27_tempi_suoi/Cronaca_di_Dino_Compagni/Libro_II
  - https://it.wikisource.org/wiki/Cronica_delle_cose_occorrenti_ne%27_tempi_suoi/Cronaca_di_Dino_Compagni/Libro_III
- id: SRC-003
  title: COMPAGNI, Dino
  author: Girolamo Arnaldi
  date: '1982'
  url: https://www.treccani.it/enciclopedia/dino-compagni_(Dizionario-Biografico)/
  edition: Dizionario Biografico degli Italiani, volume 27
  locator: Biographical entry; opening family and education paragraphs; political career and discussion of II.13;
    post-priorate year of protection with blood-crime exception
  accessed: '2026-10-02'
  evidence_type: Scholarly biographical interpretation
  limitations: Used for contextual caution, not to replace primary wording; no modern translated passages used.
    Secondary synthesis; cited archival records not independently inspected. Birth dating differs across reference
    works. Do not reproduce the entry's apparent five-children/six-names inconsistency. SR-001 independently rechecked
    the bounded one-year protection; do not infer indefinite immunity.
- id: SRC-004
  title: Cronica delle cose occorrenti ne' tempi suoi
  author: Dino Compagni
  date: 1310–1312, approximately
  url: https://www.andreaconti.it/libri/Compagni-Cronica%20delle%20cose.html
  edition: Complete online transcription with Del Lungo chapter divisions/headings; underlying printed edition not
    established on opened page
  locator: Book.chapter notation used throughout this report
  accessed: '2026-10-02'
  evidence_type: primary text in a modern web transcription
  limitations: Private host, encoding blemishes, edition metadata uncertain. Chapter headings are editorial, not
    Compagni's own words. Relevant passages cross-checked with CSRC-002–004.
- id: SRC-005
  title: 'Antologia delle fonti bassomedievali, XV.5: Il caso di Firenze/3, Magnati e Popolani'
  author: Stefano Gasparri, Andrea Di Salvo, Fiorella Simoni, editors; primary texts by Giovanni Villani, Dino Compagni,
    Comune di Firenze
  date: '2002'
  url: https://www.rm.unina.it/didattica/fonti/anto_bme/cap_XV/XV_5_stampa.htm
  edition: Reti Medievali teaching anthology
  locator: 'A: Villani VIII.79; B–D: Compagni I.4–5, I.10–11; E: Ordinamenti di Giustizia 1,5–6,8–9,12,22; F: Compagni
    I.20'
  accessed: '2026-10-02'
  evidence_type: university-hosted primary-source anthology with scholarly introduction
  limitations: Selected extracts, some normalized/translated wording; not a complete statute edition. Distinguish
    primary extracts from the modern introductory synthesis.
- id: SRC-006
  title: 'Les pratiques institutionnelles de la République Florentine: Du regime del Popolo de 1282 à la réforme
    électorale de 1328'
  author: Piero Gualtieri; French translation Yves Sintomer
  date: '2014'
  url: https://shs.cairn.info/revue-francaise-de-science-politique-2014-6-page-1109?lang=fr
  edition: Revue française de science politique 64/6, pp. 1109–1121; DOI 10.3917/rfsp.646.1109
  locator: Opening on 1328; sections on priorate and changing selection; notes 3,7,20,27
  accessed: '2026-10-02'
  evidence_type: peer-reviewed institutional-history research
  limitations: French HTML opened successfully; English HTML/PDF returned 403 on open. English search extraction
    was read but French opened article is the cited retrieval. Earlier positive sortition examples in note 27 concern
    replacements in 1324, not all councils in 1290.
- id: SRC-007
  title: Compagni, Dino
  author: Aldo Vallone
  date: '1970'
  url: https://www.treccani.it/enciclopedia/dino-compagni_(Enciclopedia-Dantesca)/
  edition: Enciclopedia Dantesca
  locator: Opening biography; priorates 1289 and 1301; gonfalonierate 1293; composition paragraph
  accessed: '2026-10-02'
  evidence_type: scholarly reference entry
  limitations: Older than Arnaldi; conflicting birth and early guild-membership dating. Use office chronology and
    explicit White affiliation, not its birth estimate as settled.
- id: SRC-008
  title: Uberti
  author: Arnaldo D'Addario
  date: '1970'
  url: https://www.treccani.it/enciclopedia/uberti_(Enciclopedia-Dantesca)/
  edition: Enciclopedia Dantesca
  locator: 1266–1268 crisis and diaspora paragraphs; Lapo di Azzolino safe-conduct paragraph
  accessed: '2026-10-02'
  evidence_type: scholarly family history
  limitations: Dates the safe-conduct visit 1303, whereas Cronica III.4 places departure June 8, 1304. Some family
    remained in Florence; a single exile date for every Uberti is misleading.
- id: SRC-009
  title: 'Una città, un fonte: il Battistero di Firenze e i suoi registri'
  author: Lorenzo Fabbri
  date: '2014'
  url: https://battesimi.duomo.firenze.it/api/assets/Registri%20battesimi.pdf
  edition: Mucchi, September 2014; excerpt hosted by Opera di Santa Maria del Fiore
  locator: Printed pp. 17–18, PDF pages 2–3; especially p.18 opening on the single urban/suburban font
  accessed: '2026-10-02'
  evidence_type: archival scholarship hosted by the custodian institution
  limitations: The single-font norm is not proof that literally every resident, including migrants and emergency
    baptisms, was baptized there.
- id: SRC-010
  title: FIESCHI, Luca
  author: Thérèse Boespflug
  date: '1997'
  url: https://www.treccani.it/enciclopedia/luca-fieschi_(Dizionario-Biografico)/
  edition: Dizionario Biografico degli Italiani, volume 47
  locator: 'Henry VII itinerary paragraphs: March 1312 voyage, Rome coronation, forty-day Florence siege, death
    August 24, 1313'
  accessed: '2026-10-02'
  evidence_type: scholarly biography with documentary references
  limitations: Supports Henry's actions and failure to take Florence; not evidence for Compagni's personal response.
