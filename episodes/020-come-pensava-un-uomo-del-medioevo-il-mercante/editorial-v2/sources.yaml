- id: SRC-018
  title: Interdict
  author: Auguste Boudinhon
  date: '1910'
  url: https://www.newadvent.org/cathen/08073a.htm
  edition: 'The Catholic Encyclopedia, volume 8. New York: Robert Appleton Company; New Advent transcription.'
  locator: General definition; General Local Interdict discussion and medieval examples/mitigations
  accessed: '2026-10-02'
  evidence_type: Retrospective historical canon-law reference article
  limitations: Full article retrieved by root and independently opened by coordinator. Used only for a limited medieval
    territorial-interdict glossary. Its later rules and specific 1909 case do not establish Florence circa 1300
    practice; no Florence-specific decree retrieved. Exceptions prevent claiming an absolute end to all worship.
- id: SRC-019
  title: Interdict
  author: Unsigned article; Encyclopaedia Britannica editors
  date: '1911'
  url: https://en.wikisource.org/wiki/1911_Encyclop%C3%A6dia_Britannica/Interdict
  edition: Encyclopaedia Britannica, eleventh edition; Wikisource transcription
  locator: Ecclesiastical interdict definition, exceptions, medieval development and local/personal distinction
  accessed: '2026-10-02'
  evidence_type: Retrospective historical encyclopedia article
  limitations: Full article retrieved by root and independently opened by coordinator. Supports only the broad medieval
    restriction of public worship with exceptions. No independent facsimile collation or Florence-specific decree
    verification; not a basis to import all later canon-law rules.
