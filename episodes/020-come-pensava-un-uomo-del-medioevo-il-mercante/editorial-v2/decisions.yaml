- id: ED-006
  kind: fact
  chapter_id: CH-003
  transcript:
  - U-00235–U-00242
  current_text: 'People like Dino don''t have a sword at their side. Merchants work and make money. They don''t
    carry swords, they don''t ride around on horseback, and they don''t have anything like as many relatives
    as the nobles.


    Throughout his chronicle, Dino never mentions a relative of his own. For the nobles, family is everything.
    Relatives appear constantly; everything revolves around kinship. Dino has no relatives. He''s made his
    own way. He''s a self-made man, like so many of these Florentine popolani, the people outside the nobility.'
  current_text_sha256: a6d0bfbefa33c1bcd7e2c31fcefd9c13cfe651aa5e34718e60fb0b550d0140ea
  proposed_text: 'People like Dino build their lives around work and trade, rather than the sword. Their standing
    doesn''t rest on riding through the city with a great armed clan behind them.


    For the nobles, family is everything. Relatives appear constantly in Dino''s account; everything revolves
    around kinship. Dino has relatives too, but his own political story centers on the individual merchant
    making his way. In that sense he''s a self-made man, like so many of these Florentine popolani, the people
    outside the nobility.'
  reason: Keep the contrast in social and political power while removing literal merchant noncombatancy and
    absence of relatives. Arnaldi documents relatives/business partners; Dino explicitly mentions children
    in Q-038.
