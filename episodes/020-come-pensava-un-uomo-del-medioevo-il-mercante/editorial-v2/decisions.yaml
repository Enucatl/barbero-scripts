      at public expense.


      Now, making someone a knight costs a fortune. There must be great celebrations, public banquets, gifts.
      Horses and armor have to be bought. The expense is enormous.


      That is one reason knights enjoy such prestige: there are relatively few of them. You need a great deal
      of money to become a knight.


      The commune decides to spend public money knighting this enormously wealthy party leader''s two sons
      and showering them with gifts. People grumble, but they can''t do anything about it. They have to settle
      for making fun of them.


      Someone works out that the money spent knighting these two privileged sons is roughly equivalent to the
      taxes paid by the poor women working in the spinning workshops. Women who go hungry, who take bread out
      of their own mouths to pay the tax.


      So people call them “the knights of the spinning workshop.”


      A rather thin consolation, though. The people in government do whatever they like with public money.'
