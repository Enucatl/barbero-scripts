  - U-00208–U-00217
  current_text: 'Dino gives us an extraordinary example from Arezzo. Remember the bishop who knows more about
    war than the Church? At one point a political problem arises. The bishop betrays his side, betrays his
    family. He tries to make a deal with the Florentines while his friends and relatives want war against Florence.


    People in Arezzo are rather annoyed that the bishop is negotiating with the enemy. So, Dino tells us, as
    though it were perfectly ordinary, they decide to have him killed.'
  current_text_sha256: 4c12762a251ac74708711250a7009b7fe6f1001bf5ac737f666c39aede79c35a
  proposed_text: 'Dino gives us an extraordinary example from Arezzo. Remember the bishop who knows more about
    war than the Church? He becomes involved in negotiations with Florence. He worries that a separate deal
    would make him a traitor. So he urges his own side to make peace with Florence—and to protect his fortress.
    Otherwise, he warns, he''ll come to terms himself.


    This infuriates the men whose plans he is disrupting. So, Dino tells us, as though it were perfectly ordinary,
    they plan to have him killed.'
  reason: The source narrates negotiations followed by the bishop’s scruple about betrayal and an appeal that
    angers the Aretines. The lecture flattens this into completed betrayal and anger at negotiation alone.
    Keep the murder-plan/kinship scene, but preserve the documented sequence rather than a falsely simple motive.
    LR-014 makes the appeal and ultimatum concrete, following I.8; this is narrative paraphrase, not recovered
    verbatim speech.
