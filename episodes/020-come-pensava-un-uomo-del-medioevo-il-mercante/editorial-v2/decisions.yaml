      Horses and armor have to be bought. The expense is enormous.


      That is one reason knights enjoy such prestige: there are relatively few of them. You need a great deal
      of money to become a knight.


      People grumble, but they can''t do anything about it. They have to settle for making fun of these privileged
      young men.


      Dino says the money given to them is taken from poor women earning their living at the spinning wheel.
      So people call them “the knights of the spinning wheel.”


      A rather thin consolation, though. Those in power can still make the poor pay for the honors of the rich.'
    reason: Keep Rosso’s supported identity, the lavish-knighting explanation and social injustice. Correct
