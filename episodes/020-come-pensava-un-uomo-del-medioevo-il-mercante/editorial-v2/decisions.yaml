    Elsewhere, nobles confront the guild leaders: “We are the men who won the victory at Campaldino, and you
    have removed us from the offices and honors of our city.”'
  reason: Recover two bounded excerpts with separate speakers/settings; do not merge Berto’s meeting and unnamed
    nobles’ later confrontation into a single historic speech. The contextual draft already separates quote
    paragraphs, but this proposal makes documentary boundaries explicit.
