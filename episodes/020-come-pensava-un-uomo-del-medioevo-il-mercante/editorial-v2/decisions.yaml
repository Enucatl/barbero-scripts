  transcript:
  - U-00048–U-00051
  current_text: 'He''s a merchant; he doesn''t know Latin. He''s unlike Fra Salimbene, whom we met in the previous
    episode. Salimbene knows Latin perfectly, thinks in Latin, can write in Latin. Dino writes in Italian.
    He can read and write just as he can keep accounts: a merchant, a businessman, has to know how to keep
    his books. But he doesn''t know Latin—or knows very little. He writes in Italian, in Tuscan.'
  current_text_sha256: 67fb687b97160c18988c5ac23ccb9ca26e879996ea7085292013c64d07672370
  proposed_text: 'He''s a merchant, writing in the language of his city. Fra Salimbene, whom we met in the
    previous episode, knows Latin perfectly, thinks in Latin, can write in Latin. Dino writes in Italian. He
    can read and write just as he can keep accounts: a merchant, a businessman, has to know how to keep his
    books. For this book, he chooses Italian, Tuscan.'
  reason: Remove the unverified claim of little/no Latin while retaining the vernacular contrast, Salimbene
    comparison and bookkeeping explanation. Arnaldi indicates rhetorical education; writing vernacular does
    not establish inability.
