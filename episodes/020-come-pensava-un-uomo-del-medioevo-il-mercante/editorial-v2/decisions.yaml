  proposed_text: 'They want it partly because wartime raises the value of their military skills. Dino draws
    a sharp contrast between that martial world and the merchant''s preference for business and peace.


    In peacetime a merchant may be richer than a nobleman, or better at administration. But military command
    is supposed to belong to men experienced in war. Dino even criticizes two priors for going on campaign:
    in his view, that isn''t their job.'
  reason: Focus the source-supported distinction on military command and the priors’ office; avoid claiming
    merchants never fought or always stayed home. Preserves the merchant/knight tension but changes its literal
    scope.
