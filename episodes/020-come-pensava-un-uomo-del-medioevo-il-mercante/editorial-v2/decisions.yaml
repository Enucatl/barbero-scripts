  - U-00270–U-00282
  current_text: 'Dino describes one brief truce when something almost unheard-of happens. The sides reach an
    agreement and let the exiled Ghibellines back into Florence. It won''t last. A few months later they quarrel
    and throw them out again.


    But for that moment the exiles are back. For the first time, the Uberti are seen riding into Florence with
    their shields and their coat of arms. And Dino describes people running to kiss that coat of arms: old
    Ghibellines, men and women.


    The Uberti have been exiled from the city for fifty years.'
  current_text_sha256: 700a19c7cdf1d471527c8812f85924ea02a9de8f02e8bddfc46ebedabfd8e997
  proposed_text: 'Dino describes one attempt at peace when a delegation of exiles is allowed back into Florence.
    Among them is an Uberti.


    Old Ghibellines, men and women, rush to kiss the family''s coat of arms. After decades of exile, that name
    still commands this extraordinary loyalty.


    But the peace talks fail, and the delegates leave again.'
  reason: Distinguish the protected delegation from a general restoration lasting months. Avoid unsupported
    fifty-year arithmetic and retain the coat-of-arms scene. Primary 1304/secondary 1303 date disagreement
    need not burden narration.
