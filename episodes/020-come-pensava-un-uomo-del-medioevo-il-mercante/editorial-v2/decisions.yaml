  - U-00713–U-00725
  current_text: 'You may have noticed something completely absent from this account of medieval Florentine
    politics. I haven''t said anything about religion.


    We think of medieval people, rightly, as living in a deeply religious society. Christian faith matters,
    and matters a great deal. Certainly it does, in each person''s inner life.


    But in the politics of these Italian communes, religion counts for nothing. The struggle is so ferocious,
    so ruthless, and power is so completely the only prize, that religion counts for nothing.'
  current_text_sha256: d371f5135cefb5491ba6cbe445421c35b21777d53e457007286e6cce4d3ae62e
  proposed_text: 'We have seen popes, cardinals, and sacred oaths. But what power does religious faith have
    to restrain this struggle?


    We think of medieval people, rightly, as living in a deeply religious society. Christian faith matters,
    and matters a great deal. Certainly it does, in each person''s inner life.


    But in this struggle for power, religious faith does very little to restrain what people are willing to
    do. The conflict is so ferocious, so ruthless, that the pursuit of power sweeps those restraints aside.'
  reason: Narrow the interpretive claim to religion’s failure as a moral restraint in this struggle. Preserve
    the central contrast without suggesting literal absence of religious actors/institutions from communal
    politics. This is a consequential interpretive choice, not a neutral grammar repair. LR-011 extends the
    same interpretive choice to the absolute opening, retaining the intervening inward-faith paragraph. Consider
    with ED-034/035; the softer moral-restraint argument replaces the lecture’s sweeping rhetoric only if approved.
