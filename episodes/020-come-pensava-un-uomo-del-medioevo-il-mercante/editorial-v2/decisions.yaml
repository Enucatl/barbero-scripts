  transcript:
  - U-00549–U-00565
  current_text: 'A great faction leader dies: Messer Rosso della Tosa, one of the richest and most influential
    men in Florence. The commune decides to reward his family for his great services. It has his sons knighted
    at public expense.


    Now, making someone a knight costs a fortune. There must be great celebrations, public banquets, gifts.
    Horses and armor have to be bought. The expense is enormous.


    That is one reason knights enjoy such prestige: there are relatively few of them. You need a great deal
    of money to become a knight.


    The commune decides to spend public money knighting this enormously wealthy party leader''s two sons and
    showering them with gifts. People grumble, but they can''t do anything about it. They have to settle for
    making fun of them.


    Someone works out that the money spent knighting these two privileged sons is roughly equivalent to the
    taxes paid by the poor women working in the spinning workshops. Women who go hungry, who take bread out
    of their own mouths to pay the tax.


    So people call them “the knights of the spinning workshop.”


    A rather thin consolation, though. The people in government do whatever they like with public money.'
  current_text_sha256: 450d1053119cc959ad13220f6285e6c52fbba2b2951e7a798e3d7f0e05451a2f
  proposed_text: 'A great faction leader dies: Messer Rosso della Tosa, one of the richest and most influential
    men in Florence. His party has his two sons knighted, together with a young relative, and showers them
    with money.


    Now, making someone a knight costs a fortune. There must be great celebrations, public banquets, gifts.
    Horses and armor have to be bought. The expense is enormous.


    That is one reason knights enjoy such prestige: there are relatively few of them. You need a great deal
    of money to become a knight.


    People grumble, but they can''t do anything about it. They have to settle for making fun of these privileged
    young men.


    Dino says the money given to them is taken from poor women earning their living at the spinning wheel.
    So people call them “the knights of the spinning wheel.”


    A rather thin consolation, though. Those in power can still make the poor pay for the honors of the rich.'
  reason: Keep Rosso’s supported identity, the lavish-knighting explanation and social injustice. Correct Party/commune,
    include the third recipient, remove an invented numerical tax equivalence and unverified hunger/factory
    frame, and recover the spinning-wheel image. The nickname is a short direct source rendering within a paraphrase;
    no long chronicle passage is imported. SR-002 extends the correction through the conclusion so the specific
