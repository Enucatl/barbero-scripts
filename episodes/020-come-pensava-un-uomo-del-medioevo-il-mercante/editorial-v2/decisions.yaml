- id: ED-014
  kind: fact
  chapter_id: CH-006
  transcript:
  - U-00381–U-00392
  current_text: 'First, nobles cannot hold government office. In all the countless commissions, subcommissions,
    and councils that govern Florence, a nobleman cannot serve.


    Second, if a nobleman attacks a member of the popolo, if he draws his sword, he must be punished. And not
    just him: his relatives too. They are responsible for one another.


    There must also be an armed force. Find the money in the budget; establish a body of police serving the
    popolo. When a nobleman is accused of violence, they go in, arrest everyone, tear down the... raze their
    houses to the ground. That''s how it''s done. Then the nobles will know their place.


    And they establish this system.'
  current_text_sha256: 924df1271ade881a0d41d0a9e1f28de26f85415a3c9daf278896c05cda69257d
  proposed_text: 'First, the magnates—the powerful families targeted by these laws—are excluded from the city''s
    leading offices and their governing councils.


    Second, the law makes members of a kinship group answerable for one another when a magnate attacks someone
    of the popolo.


    There must also be an armed force. Find the money in the budget; establish a force serving the popolo that
    can actually enforce the law against powerful men. The penalties can reach their property too: even their
    houses can be razed to the ground. That''s how far the government is prepared to go to put the magnates
    in their place.


    And they establish this system.'
  reason: Specify the exclusions and liability supported by chronicle/statute extracts; avoid treating all
    noble birth, every office and automatic arrest/destruction after mere allegation as one universal procedure.
    Retain armed enforcement and demolished houses. LR-012 replaces premature technical titles with leading
    offices and their associated councils; this does not extend the exclusion to all offices.
