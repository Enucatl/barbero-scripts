    transcript:
    - U-00417–U-00426
    current_text: 'Dino is a man of the merchants and the guilds, frequently appointed as one of the priors.
      How does the politics he''s called upon to manage actually work? What happens in practice?


      It''s all assemblies. Everything is done collectively, because citizens feel that politics belongs to
      them.


      Decisions are made in innumerable councils, and anyone can be appointed. Some councils are even chosen
      by lot. They put all the citizens'' names into a large sack and draw them out. Anyone can come to power.
      It''s a very advanced experiment in democracy—and we''re in the late thirteenth century.'
    current_text_sha256: ba60946abdba0d77b7578570c15da3103f576da2a5d047a4a0f7852fc5db8f15
    proposed_text: 'Dino is a man of the merchants and the guilds. He serves twice as a prior, as well as holding
      other offices. How does the politics he''s called upon to manage actually work? What happens in practice?


      It''s all assemblies. Everything is done collectively, because citizens feel that politics belongs to
      them.


      Decisions are made in innumerable councils. Eligible citizens are drawn into the business of government.
      It is a remarkably broad experiment in participation for the late thirteenth century—though it certainly
      doesn''t include everyone.'
    reason: Correct frequent priorates to two documented terms and remove the unsupported all-citizen sack
      lottery for this period. Regular purse/scrutiny system dates to 1328; do not replace it with a universal
      claim that no earlier lot was ever used. Preserve assemblies and unusual breadth of participation.
