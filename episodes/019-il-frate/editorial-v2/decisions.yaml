    current_text: 'King Louis is such a man. He sets out from northern France to embark for the crusade
      at Aigues-Mortes in Provence. He crosses the whole kingdom on foot. Not on horseback. On foot, carrying
      a pilgrim’s staff and bag.


      Because going on crusade means, first of all, going on pilgrimage. Going to Jerusalem.


      So the king of France spends months walking across his kingdom dressed as a pilgrim. He stops in
      towns, stops at the friars’ houses, eats with them, discusses things with them, talks to them. Salimbene
      meets him several times on this journey.


      <!-- research: C-025; Q-061 -->


      On one occasion, Salimbene is coming out of Sens to meet the king. As the king arrives, the bishop
      of Sens sends him a present.


      What do you give a king?


      This is a simple age, in which ordinary, concrete, everyday things matter. The bishop sends the
      king a huge live pike, in a tub full of water.


      A gift fit for a king.


      Salimbene says the French like pike. Evidently he doesn’t. He’s from Parma, not Mantua. But the
      French like it.


      The fish is in the sort of vessel used for washing babies when you take off their swaddling clothes.
      The thing the Tuscans call a bigoncia.


      Salimbene is very interested in language too. He is always noting how people use words.


      So the king is given a pike, and it is a gift fit for a king.


      <!-- research: Q-062; Q-063 -->


      Then the king enters the Franciscan friary and speaks to the brothers. He tells them he hasn’t come
      to ask for money. He is paying for the crusade himself. All he asks is their prayers.


      “All the French friars were crying,” Salimbene says.


      He is Italian, so naturally he’s a little less involved. Particularly in the matter of not being
      asked for money. But all the French are crying.


      Then they go to dinner with the king.


      <!-- research: C-026; Q-064 -->


      Let me see if I can find the menu. This is what they eat. Many decades later, Salimbene still remembers
      what they had that day with the king.


      People’s idea of a meal is quite different from ours. Their tastes are different. In particular,
      they don’t have our notion of a sequence in which you begin with savory dishes and move on to sweet
      ones. They are quite happy to mix different things together.


      It is a meatless day, so they eat fish.


      “A magnificent dinner,” Salimbene says, “worthy of a great king.” Yet, as you’ll see, it is no rich
      glutton’s feast. It is worthy of a great king who is also a great saint.


      “First that day, we ate cherries. Then they brought white bread, the whitest bread, and wine. Then
      fresh fava beans cooked in milk. Then fish and crayfish, and eel meatballs. Then rice with almond
      milk and powdered cinnamon. Then grilled eels with an excellent sauce. Savory tarts. Fresh curds.
      Fruit.”


      A great dinner. But compared with other dinners Salimbene describes, it suits a king’s magnificence
      without contradicting the humility of a saint who is walking to his point of embarkation.'
