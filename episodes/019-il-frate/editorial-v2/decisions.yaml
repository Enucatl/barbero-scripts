  current_text: 'One day people tell Salimbene that a new prophet has appeared. Who is he? A poor man
    from Parma, Salimbene’s own city. A weaver.


    He has begun making prophecies, and the things he says seem to come true. Eventually he retires to
    Fontevivo, a Cistercian monastery outside Parma. The Cistercians take him in.


    “I’ve heard so much about this man,” Salimbene says. “He spends all day shut in his room, writing.”


    An artisan, you understand. A working man. A weaver, predicting the future.


    Salimbene hears these stories, and eventually he can’t stand it any longer. He has to meet the man.


    <!-- research: Q-008; Q-009; Q-010 -->


    He sets out for Fontevivo. When he arrives, he finds a friend there, another Franciscan, who is a
    physician. He’s staying with the Cistercians, a different religious order, because they need a doctor.'
  current_text_sha256: b99601df2feea2df010b24f0b1e8d0978522ce112bccd54c93cb18616398e8d4
  proposed_text: 'Salimbene hears more about a prophet whose writings he already knows. Who is he? A poor
    weaver, originally from Verona, now living in Parma, Salimbene’s own city.


    He has begun making prophecies, and the things he says seem to come true. Eventually he retires to
    Fontevivo, a Cistercian monastery outside Parma. The Cistercians take him in.


    “I’ve heard so much about this man,” Salimbene says. “He spends all day shut in his room, writing.”


    An artisan, you understand. A working man. A weaver, predicting the future.


    Salimbene hears these stories, and eventually he can’t stand it any longer. He has to find out more.


    <!-- research: Q-008; Q-009; Q-010 -->


    He sets out for Fontevivo. When he arrives, he finds a friend there, a physician who entered the Franciscans
    with him, later left, and has now become a Cistercian.'
  reason: Correct origin/prior acquaintance and physician’s religious affiliation, retaining the visit,
    anticipation, manuscript-circulation digression and ensuing erasure dialogue. Based on located old
    Italian translation; no invented original Latin wording.
