  current_text: 'He is in Pisa. He belongs to the friary there, and he describes going down a particular
    street, keeping to one side because on the other side stands the lodging house of the merchants from
    Parma.


    “I wanted to avoid meeting anyone from Parma. I was too ashamed to face people who knew me.”


    But his luck runs out. He meets someone from Parma anyway.


    “A man came up to me whom I didn’t know. But he knew me.” Salimbene comes from an important family.


    The man grabs him by his habit.


    “You wretched boy! What are you doing here? Look at the state you’ve got yourself into. Your father’s
    house is full of servants who have more than enough to eat. And here you are, begging, taking bread
    away from people poorer than you.”


    He goes on. Salimbene reports it word for word.


    “You ought to be in Parma, riding around on horseback, showing yourself off in tournaments, delighting
    the people who come to watch.” Because that is what noble knights do. “You ought to be admired by
    the ladies and handing out money to the minstrels. That’s what you should be doing. Not going barefoot
    from door to door, begging.”


    Salimbene pushes him away. Sends him off angrily. Quotes a few biblical passages at him.


    But then he says, “That evening, back at the friary, I began to think about it. If I have to go on
    like this for another fifty years. Begging.”


    That time, he really does wonder whether he has made a terrible mistake with his life.


    <!-- research: Q-043 -->


    Fortunately, another dream comes that night.


    He dreams that he is begging in Pisa. A little farther along the same street, the child Jesus is also
    going out with a bag to beg. And the Virgin is there with a bag, begging too.'
