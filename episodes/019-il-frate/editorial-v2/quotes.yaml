  original_text: Lectis igitur imperialibus litteris statim scripsit frater Helyas fratribus de conventu Fanensi,
    ubi habitabam, quod, si de voluntate mea procedebat, me sine mora per obedientiam redderent patri meo,
    alioquin, si cum patre meo ire nolebam, me karum custodirent sicut pupillam oculi sui.
  translation: So, after reading the imperial letter, Brother Elias immediately wrote to the friars of the
    convent at Fano, where I was living, that, if it was my wish, they were under obedience to return me to
    my father without delay; otherwise, if I did not wish to go with my father, they were to cherish and guard
    me like the pupil of their eye.
