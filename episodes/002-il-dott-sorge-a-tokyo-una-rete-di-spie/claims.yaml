- id: C-017
  claim: Sorge and Ozaki gave Moscow intelligence that assisted Soviet preparation for the 1939 Khalkhin Gol conflict, after which Japan's northern faction lost influence.
  transcript:
  - U-00726–U-00770
  centrality: central
  supporting_sources:
  - SRC-003
  - SRC-011
  conflicting_sources: []
  status: resolved
  research_note: The ring reported Japanese military information, but the Soviet victory resulted from many operational factors. The Japanese defeat affected later strategy; it did not by itself settle the 1941 choice.
- id: C-018
  claim: Sorge warned Moscow of Operation Barbarossa at least a month in advance, but Stalin refused to believe the warning.
  transcript:
  - U-00771–U-00786
  centrality: central
  supporting_sources:
  - SRC-001
  - SRC-003
  - SRC-007
  conflicting_sources: []
  status: resolved
  research_note: Documentary reports confirm repeated and sometimes specific warnings, including a 30 May report placing invasion in the latter half of June. Sorge was one among more than one hundred warning streams and Moscow judged parts of his reporting doubtful.
- id: C-019
  claim: Sorge's report that Japan would strike south enabled Stalin to transfer Far Eastern forces that helped save Moscow in December 1941.
  transcript:
  - U-00795–U-00814
  centrality: central
  supporting_sources:
  - SRC-001
  - SRC-002
  conflicting_sources:
  - SRC-003
  status: resolved
  research_note: Traditional accounts credit the September report with freeing Far Eastern formations. NIDS's source-based reassessment finds no proof of causal effect and no grand-scale relocation before winter; Soviet transfers had multiple intelligence and force-planning inputs.
