- id: Q-007
  barbero_utterances:
  - U-00513–U-00522
  barbero_timestamp: '34:54'
  attribution: Cadamosto, López de Gómara, and Montaigne on Tenerife and Cuba
  quotation_kind: composite
  source_id: SRC-020
  original_language:
  original_text:
  translation: |-
    Cadamosto, translated by G. R. Crone: Their women are not held in common: but it is lawful for each to take as many as he wishes. They do not marry virgins, unless they have first lain one night with the lord, which is held to be a great honour.

    Montaigne, translated by Jacob Zeitlin: And in another place, if it is a merchant who marries, all the merchants invited to the wedding go to bed with the bride before him; and the greater their number, the greater is her honour and her reputation for strength and capacity; and if an officer marry, it is the same; the same if it is a nobleman, and so of all others except labourers or men of mean condition, for then it is the lord's privilege; and yet a severe loyalty during marriage is strictly enjoined.
  locator: >-
    Cadamosto, The Voyages of Cadamosto, chapters VII–VIII, printed pp. 11–14, especially p. 13; Boureau, The Lord's First Night, chapter 1, printed pp. 21–23 and notes 30 and 33 at p. 245
  translation_notes: >-
    The two English excerpts have explicit source boundaries. The first is G. R. Crone's translation of Cadamosto; the second is Jacob Zeitlin's translation of Montaigne as quoted by Lydia G. Cochrane's English Boureau. Boureau traces Montaigne's addition to Gómara's Cuban account through Martin Fumée's French translation. No original Italian, French, or Spanish wording was recovered.
  confidence: high
  status: resolved
  verdict: composite
  source_replacement: not-applicable
  human_reviewed: true
  research_note: >-
    Cadamosto reports the alleged custom in his description of Tenerife, but explicitly bases his knowledge on reports circulating through the Christian-controlled islands and captives; he says he personally visited Gomera and El Hierro and passed Palma, not Tenerife. Barbero turns this secondhand account into a visit. Boureau separately traces the Cuban component from Gómara to Montaigne's transformed social hierarchy and treats the tradition as ideological construction rather than reliable ethnography.
