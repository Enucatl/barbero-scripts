  original_text:
  translation: >-
    In regard to his lordship, the count, she was, saving his honor, one who wanted to obey him, respect him, and serve him in all things. But what he would seek of her was against her virtue, which she held as dear as her life. […] “Since I must obey you,” said she, “I ask that you do me the honor not to dirty me with your dirty riding boots, which are covered with mud and dung, and then I'll satisfy you as to the rest.” […] She purposely pulled it at a wrong angle so that it stuck about halfway off. Then she ran away as fast as her legs could carry her.
  locator: >-
