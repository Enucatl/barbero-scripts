  translation_notes: >-
    Exact excerpts from Rossell Hope Robbins's 1960 English translation, joined with bracketed omissions. The Middle French text was not supplied. Barbero accurately summarizes the scene but changes the tight-fitting riding boot into trousers or breeches and omits that the intermediary is a doctor.
  confidence: high
  status: resolved
  verdict: confirmed-in-substance
  source_replacement: not-applicable
  human_reviewed: true
  research_note: >-
    Robbins confirms the proposal, the maiden's defense of her honor, the encounter while she cuts grass, the half-removed boot trick, her escape, and the count's later arrangement of a favorable marriage at considerable expense. Retain Barbero's contextual translation because he summarizes an extended narrative rather than quoting one clean passage.
