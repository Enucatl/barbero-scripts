  target:
    kind: script
    chapter_id: CH-006
    current_text: Medieval taxes had all kinds of local names. In France, a tax collected on various occasions—including,
      sometimes, marriage—could be called *coillage*. When notaries translated that word into Latin, some
      wrote *culagium*.
    current_text_sha256: 8816f9981d6b09ca39f00553d352f5040c7360fa08edd38f430ead30a1131df2
  proposed_text: Medieval taxes had all kinds of local names. In France, a tax sometimes collected at
    marriage was called *coillage*; in notarial Latin, it could become *culagium*.
  reason: Keep *culagium* only with an immediate explanation of what the underlying tax was.
  preserves:
  - coillage
  - culagium
  - the false-etymology mechanism
  quotation_refs: []
  decision: reject
  decision_note: null
- id: ER-007
  issue_type: terminology
