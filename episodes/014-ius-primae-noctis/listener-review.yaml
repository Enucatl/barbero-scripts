  proposed_text: 'The investigation begins with a simple test: if this right existed, where should it
    appear in the sources handed down from the Middle Ages? Let’s start with two places.'
  reason: Make the detective method audible at the first major transition.
  preserves:
  - source-based inquiry
  - Barbero's question
  quotation_refs: []
  decision: accept
  decision_note: null
