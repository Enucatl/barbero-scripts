  outline_sections:
  - 1
  target:
    kind: script
    chapter_id: CH-001
    current_text: 'Tonight''s subject may be the best-known of the three we''re covering in this series.
      I think we all have in mind this image that we associate with the Middle Ages, the *ius primae noctis*.
      I know, I just contradicted myself: we all know the image, but let''s define it anyway.'
    current_text_sha256: d5fbba821d11cda1b916643ebc748ac60052efc4c40a8b897b72cff4ca46422e
  proposed_text: This episode's subject is the so-called right of the first night—*ius primae noctis*. The
    image is familiar, but let’s define it before using the Latin name.
  reason: Introduce the English concept before asking listeners to retain the Latin term.
  preserves:
  - Barbero's opening definition
  - the distinction between image and evidence
  quotation_refs: []
  decision: accept
  decision_note: null
- id: ER-003
  issue_type: proper-name-hierarchy
  listener_need: remember
  severity: recommended
  outline_sections:
  - 1
  target:
    kind: script
    chapter_id: CH-001
    current_text: 'How many places have this story in their memory, in their tradition? Fiuggi; Sant''Agata
      di Puglia; Roccascalegna in Abruzzo; several villages in Liguria, Montalto Ligure, Onzo; several
      villages in Piedmont, Nizza Monferrato, Rocca Grimalda; even Ivrea, where the Ivrea Carnival—you
      know, the carnival where they throw oranges—is said today to originate in an episode in which an
      evil tyrant demands the *ius primae noctis* until a girl cleverer than the others rebels: Violetta,
      the beautiful miller''s daughter.'
    current_text_sha256: 2cbb276e3dffbcaef5e0cd9b2793914a8cf9303e21045278300daabff42e2321
  proposed_text: Versions of the story appear in towns across Italy. Ivrea’s orange-throwing carnival,
    for example, is now said to recall a clever miller’s daughter named Violetta rebelling against a tyrant
    who demanded the *ius primae noctis*.
  reason: Condense incidental place names while preserving the vivid Ivrea example and its later dating
    clue.
  preserves:
  - Ivrea
  - Violetta
  - the spread of local legends
  quotation_refs: []
  decision: accept
  decision_note: null
