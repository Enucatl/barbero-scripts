  target:
    kind: script
    chapter_id: CH-006
    current_text: Here's another example. Medieval peasants sometimes paid a levy to feed the lord's horses—basically
      a fodder tax. In Italy, it was called *fodro*, a word related to the English “fodder.”
    current_text_sha256: 16b70d63512951727a21cef66deb1c2d2b7ff071aeaeaa194d511bfbcc80d7ee
  proposed_text: Another example begins with a levy for feeding the lord’s horses—a fodder tax called
    *fodro*, a word related to the English “fodder.”
  reason: Keep *fodro* with its useful immediate context and make the etymological setup easier to hear.
  preserves:
  - fodro
  - the horse levy
  - the later false derivation
  quotation_refs: []
  decision: accept
  decision_note: null
