  source_ids: [SRC-009, SRC-010]
  category: factual-error
  original_assertion: The Custom of the Country was staged in London in 1619 and written by Beaumont and Fletcher.
  proposed_correction: The Custom of the Country was probably first performed around 1619–1620 and is now attributed to John Fletcher and Philip Massinger; Beaumont's name entered the attribution through the 1647 collected folio.
  decision: retain-original
