  source_ids: [SRC-018]
  category: factual-error
  original_assertion: In tale XXIV of Les Cent Nouvelles nouvelles, the maiden partly removes the count's tight leather trousers and escapes when he falls while trying to pursue her.
  proposed_correction: The maiden offers to remove the count's mud-covered, tight-fitting riding boots, deliberately leaves one boot stuck halfway off, and escapes while he is unable to pursue her.
