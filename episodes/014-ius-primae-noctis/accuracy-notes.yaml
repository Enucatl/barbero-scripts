- id: N-002
  transcript: [U-00247–U-00277]
  claim_ids: [C-004]
  quotation_ids: [Q-004]
  source_ids: [SRC-018]
  category: factual-error
  original_assertion: Tale XXXII is set in Girona, where the Franciscans tell women that the pope has granted them a tithe of their nights with their husbands.
  proposed_correction: Tale XXXII is set in Hostalrich in Catalonia, where the Observant Franciscans falsely claim a spiritual tithe of one encounter in ten; the tale does not invoke papal authorization.
  decision: apply
- id: N-003
  transcript: [U-00353–U-00403]
  claim_ids: [C-007, C-008]
  quotation_ids: [Q-005]
  source_ids: [SRC-004, SRC-006]
  category: misleading-compression
  original_assertion: A document from 1247 contains the Verson obligations and the monk's rhymed French addition about fathers surrendering their daughters.
  proposed_correction: A Latin compilation of Verson's obligations dates to 1247; the retrospective passage about a peasant delivering his daughter to his lord appears in a related Old French poem composed around 1270.
  decision: retain-original
- id: N-004
  transcript: [U-00505–U-00529]
  claim_ids: [C-010]
  quotation_ids: [Q-007]
  source_ids: [SRC-006, SRC-019, SRC-020, SRC-021]
  category: misleading-compression
  original_assertion: Alvise Cadamosto went to Tenerife and reported the alleged custom there, as part of the same pattern in which merchants, nobles, or a commoner's lord preceded the husband.
  proposed_correction: Cadamosto reported the alleged Tenerife custom secondhand; his voyage account says that he visited Gomera and El Hierro and passed La Palma, not that he visited Tenerife. The hierarchy involving merchants, officers, nobles, and a commoner's lord comes from Montaigne's later adaptation of a Cuban report.
  decision: retain-original
- id: N-005
  transcript: [U-00530–U-00544]
  claim_ids: [C-010]
  quotation_ids: [Q-008]
  source_ids: [SRC-007, SRC-008]
  category: factual-error
  original_assertion: Las Casas was a Jesuit who denounced Gómara's book as false and succeeded in having the king prohibit it because it slandered the Indigenous peoples.
  proposed_correction: Bartolomé de las Casas was a Dominican friar and bishop who accused Gómara of calumniating Indigenous peoples; the surviving evidence does not establish that Las Casas personally caused the crown to prohibit Gómara's book.
  decision: apply
- id: N-006
  transcript: [U-00574–U-00584]
