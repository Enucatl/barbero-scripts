  source_ids: [SRC-006, SRC-015]
  category: misleading-compression
  original_assertion: At the end of the fourteenth century, one Amiens lawsuit over the first-night marriage payment lasted sixteen years before the Parlement of Paris reached a decision.
  proposed_correction: The Amiens and Abbeville litigation concerned payment for permission to waive three nights of marital continence; its surviving decisions form a longer sequence dated 1398, 1401, 1409, and 1501 rather than one continuous sixteen-year trial.
  decision: retain-original
- id: N-009
  transcript: [U-00809–U-00830]
  claim_ids: [C-016]
  quotation_ids: [Q-013]
  source_ids: [SRC-006, SRC-013, SRC-017]
  category: material-uncertainty
  original_assertion: Exactly five seigneurial declarations are known, distributed as one in the fifteenth century, three in the sixteenth, and one at the end of the seventeenth century under Louis XIV.
  proposed_correction: Specialist surveys identify only a tiny cluster of late medieval and early modern declarations in which lords retrospectively linked marriage payments to an ancestral sexual claim; the exact total and distribution depend on which documents and later recensions are counted.
  decision: retain-original
