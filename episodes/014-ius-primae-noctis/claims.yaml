- id: C-001
  claim: The alleged right of the first night remains common in modern historical fiction and popular images of the Middle Ages.
  transcript:
  - U-00015–U-00108
  centrality: supporting
  supporting_sources:
  - SRC-001
  - SRC-002
  conflicting_sources: []
  status: resolved
  research_note: Both cited modern works use the alleged right as an inciting oppression. They establish the examples, not a quantitative prevalence claim.
- id: C-002
  claim: Numerous Italian local traditions explain rebellion or civic ritual through an alleged lord's sexual claim.
  transcript:
  - U-00109–U-00135
  centrality: sampled-incidental
  supporting_sources:
  - SRC-005
  - SRC-014
  conflicting_sources: []
  status: resolved
  research_note: Cuneo and Nizza provide documented late foundation legends. The other named local traditions were not individually dated, so they remain folklore examples rather than medieval evidence.
- id: C-003
  claim: Medieval novelle, fabliaux, and sexual comic stories do not attest an enforceable right of the first night.
  transcript:
  - U-00147–U-00190
  centrality: central
  supporting_sources:
  - SRC-006
  - SRC-017
  conflicting_sources: []
  status: resolved
  research_note: Boureau's source survey supports the negative finding. It is a corpus-level argument from silence, not proof that every surviving tale was checked in this episode audit.
- id: C-004
  claim: Les Cent Nouvelles nouvelles contains the two contrasting sexual-power tales summarized in the lecture.
  transcript:
  - U-00193–U-00277
  centrality: supporting
  supporting_sources:
  - SRC-003
  - SRC-018
  conflicting_sources: []
  status: resolved
  research_note: >-
    The two tales are nouvelle XXIV, La Botte à demi, and nouvelle XXXII, Les Dames dismées. The collection dates to ca. 1464–1467, and Robbins's complete English translation confirms both plots in substance. Barbero changes the boot to trousers in XXIV; in XXXII he substitutes Girona for Hostalrich and adds papal authorization absent from the translation.
