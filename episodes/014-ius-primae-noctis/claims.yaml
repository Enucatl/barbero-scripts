  transcript:
  - U-00599–U-00644
  centrality: central
  supporting_sources:
  - SRC-006
  - SRC-013
  conflicting_sources: []
  status: resolved
  research_note: Boureau and Wettlaufer document the early-modern conversion of ambiguous marriage dues and learned etymology into proof of a prior sexual service.
- id: C-013
  claim: Hector Boece's 1526 Scottish history made the Evenus story part of a fabricated national past involving Malcolm and Margaret.
  transcript:
  - U-00645–U-00689
  centrality: supporting
  supporting_sources:
  - SRC-011
  - SRC-012
  - SRC-013
  conflicting_sources: []
  status: resolved
  research_note: Boece's Latin directly contains Evenus, Malcolm, Margaret, and the substituted payment. The work was first printed in 1527, not 1526, and the early royal sequence is legendary.
- id: C-014
  claim: Misreadings of coillage/culagium and fodro helped turn ordinary dues into apparent sexual evidence.
  transcript:
  - U-00690–U-00735
  centrality: central
  supporting_sources:
  - SRC-012
  - SRC-013
  - SRC-014
  conflicting_sources: []
  status: resolved
  research_note: Culagium/cullage/coillage is documented as a marriage payment with disputed but non-probative etymology. Cordara's Fodero is a satirical foundation poem first printed in 1788; the lecture's account of the folk etymology is sound in substance.
- id: C-015
  claim: A late-fourteenth-century Amiens marriage payment arose from commutation of three nights' continence and was later misread as evidence of the alleged right.
  transcript:
  - U-00736–U-00784
  centrality: supporting
  supporting_sources:
  - SRC-006
  - SRC-015
  conflicting_sources: []
  status: resolved
  research_note: The Amiens/Abbeville record explicitly concerns permission to waive first-, second-, and third-night continence. The surviving decisions span 1398, 1401, 1409, and 1501, so the lecture's single sixteen-year process is an over-compression.
- id: C-016
  claim: Only after the legend circulated did a handful of lords retrospectively claim that marriage dues commuted an ancestral sexual right.
  transcript:
  - U-00785–U-00830
  centrality: central
  supporting_sources:
  - SRC-006
  - SRC-013
  - SRC-017
  conflicting_sources: []
  status: resolved
  research_note: >-
    Specialist surveys identify only a tiny cluster of late retrospective declarations, often framed as commutation. Vannozzi's 1610 text confirms that he reported Cardinal Hieronimo della Rovere personally claiming to have burned his family's privilege; it remains testimony to a retrospective belief, not proof that the alleged charter or sexual custom existed. Barbero's exact total and distribution are approximate.
- id: C-017
  claim: Public wedding payments, roadblocks, banquet precedence, and bride-escort rituals supplied a social context for later reinterpretation.
  transcript:
  - U-00831–U-00862
  centrality: supporting
  supporting_sources:
  - SRC-013
  - SRC-017
  conflicting_sources: []
  status: resolved
  research_note: Comparative legal history documents marriage payments and community roadblock/redemption customs. The banquet and bride-escort examples are plausible contextual customs but were not individually sourced here.
- id: C-018
  claim: Real sexual exploitation under unequal power must be distinguished from an enforceable legal right, whose invention marks the past as barbaric.
  transcript:
  - U-00863–U-00913
  centrality: central
  supporting_sources:
  - SRC-006
  - SRC-013
  - SRC-017
  conflicting_sources: []
  status: resolved
  research_note: 'The central conclusion matches modern specialist historiography: sexual coercion and abuse of power are historically real but do not establish the alleged normative legal right. Orwell supplies an exact modern example of invented legal history.'
