- id: C-006
  claim: The right's absence from detailed grievance and obligation records is strong, though not logically conclusive, negative evidence.
  transcript:
  - U-00325–U-00349
  centrality: central
  supporting_sources:
  - SRC-006
  - SRC-013
  - SRC-017
  - SRC-022
  conflicting_sources: []
  status: resolved
  research_note: Modern specialist treatments find no normative medieval institution. A few late retrospective declarations are evidence for the developing myth, not for an earlier generally enforceable right.
- id: C-007
  claim: A thirteenth-century Verson record and complaint describe a three-sou payment when a daughter married outside the lordship.
  transcript:
  - U-00353–U-00403
  centrality: supporting
  supporting_sources:
  - SRC-004
  - SRC-013
  conflicting_sources: []
  status: resolved
  research_note: The three-sou payment for marrying a daughter outside the lordship is explicit. The 1247 compilation and ca. 1270 poem must be chronologically distinguished.
- id: C-008
  claim: The Verson passage resembles the later myth only retrospectively and presents sex as an alternative to a heavy payment, not a legal entitlement.
  transcript:
  - U-00403–U-00419
  centrality: central
  supporting_sources:
  - SRC-004
  - SRC-006
  - SRC-017
  conflicting_sources: []
  status: resolved
  research_note: The poem places the surrender of a daughter in an undefined past as an alternative to property or payment; it does not formulate a current sexual entitlement.
- id: C-009
  claim: The recognizable legend first circulates in late medieval and Renaissance civic accounts of oppressive former lords.
  transcript:
  - U-00420–U-00487
  centrality: central
  supporting_sources:
  - SRC-005
  - SRC-006
  - SRC-017
  conflicting_sources: []
  status: resolved
  research_note: Rebaccini's 1484 Cuneo chronicle is an early clear Italian attestation framed as ancestral oppression. 'First' should remain qualified because Verson and a small number of earlier retrospective texts complicate the chronology.
- id: C-010
  claim: European travel and conquest literature attributed analogous customs to peoples represented as savage, while Las Casas challenged such denigration.
  transcript:
  - U-00489–U-00544
  centrality: supporting
  supporting_sources:
  - SRC-007
  - SRC-008
  - SRC-019
  - SRC-020
  - SRC-021
  conflicting_sources:
  - SRC-007
  status: resolved
  research_note: >-
    Cadamosto's Tenerife passage and the Gómara–Montaigne Cuban transmission are recovered. Both belong to colonial representations of Indigenous sexuality, not independent proof of the alleged customs. Cadamosto did not visit Tenerife, and Barbero compresses his secondhand report into a visit. Las Casas's polemic against Gómara is secure, but his role in the royal prohibition remains hypothetical.
- id: C-011
  claim: Beaumont and Fletcher's 1619 play locates a right-of-first-night custom in an Italian setting.
  transcript:
  - U-00554–U-00593
  centrality: sampled-incidental
  supporting_sources:
  - SRC-009
  - SRC-010
  conflicting_sources: []
  status: resolved
  research_note: The custom and governor are explicit in Act I. Folger dates first performance to ca. 1619–1620 and attributes the play to Fletcher and Massinger, not Beaumont and Fletcher; the Italian setting is conventional scholarly identification rather than explicit opening exposition.
- id: C-012
