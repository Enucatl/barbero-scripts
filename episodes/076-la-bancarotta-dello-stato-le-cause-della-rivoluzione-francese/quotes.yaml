  attribution: Louis XIV, as reported by his surgeon Maréchal to Saint-Simon; the alleged opinion is attributed only generically to Sorbonne doctors and conveyed by Father Le Tellier
  source_id: SRC-006
  original_language: fr
  original_text: "[Le P. Tellier] étoit revenu avec une consultation des plus habiles docteurs de Sorbonne qui décidoit nettement que tous les biens de ses sujets étoient à lui en propre, et que, quand il les prenoit, il ne prenoit que ce qui lui appartenoit ; qu’il avouoit que cette décision l’avoit mis fort au large, ôté tous ses scrupules, et lui avoit rendu le calme et la tranquillité qu’il avoit perdue. [...] Le roi, mis au large par le P. Tellier et sa consultation de Sorbonne, ne douta plus que tous les biens de ses sujets ne fussent siens, et que ce qu’il n’en prenoit pas et qu’il leur laissoit étoit pure grâce."
  translation: "[Father Le Tellier] had returned with an opinion from the most learned doctors of the Sorbonne, which decided plainly that all his subjects’ goods were his own property and that, when he took them, he took only what belonged to him; [the king] admitted that this decision had greatly relieved him, removed all his scruples, and restored the calm and tranquillity he had lost. [...] The king, relieved by Father Le Tellier and his Sorbonne opinion, no longer doubted that all his subjects’ goods were his and that whatever he did not take from them and left them was a matter of pure grace."
  locator: 'Saint-Simon, Mémoires du duc de Saint-Simon, ed. Adolphe Chéruel, vol. 9 (Paris: Hachette, 1856), pp. 7 and 9 (Wikisource scans 10 and 12), year 1710, chapter headed ''Dixième denier'''
  translation_notes: 'Direct translation of Saint-Simon''s French. Barbero accurately condenses both passages: his written ''parere,'' the unnamed Sorbonne theologians, royal ownership of subjects'' goods, removal of scruples, restored good humor, and ''pura grazia'' are all present. He changes the memoir''s nested report into a directly narrated scene: Saint-Simon says Maréchal told him that Louis XIV told Maréchal what Le Tellier had brought. ''Dopo qualche giorno'' compresses Le Tellier''s request for ''quelques jours''; the memoir does not say that Saint-Simon himself witnessed any part of the exchange.'
  confidence: medium
  status: resolved
  research_note: 'Verdict: confirmed in substance as a faithful rendering of Saint-Simon''s anecdote, but not independently confirmed as an authentic Sorbonne consultation. Evidence tier 1 for the wording in Saint-Simon''s primary autobiographical source; tier 3 for the underlying event because the memoir, composed decades later, transmits Louis XIV''s private statement through Maréchal and neither names the doctors nor reproduces their document. No signed consultation, faculty act, named theologian, archival identifier, or independent contemporary attestation was located. Pierre Bliard''s focused 1891 study (SRC-007, pp. 372–378) disputes the story and expressly calls the alleged doctors'' decision a myth, but it is a partisan Jesuit rehabilitation and does not prove nonexistence. The Chéruel footnote juxtaposes a related maxim from Louis XIV''s instructions to his son—royal disposition of ecclesiastical and lay goods as a wise steward for the state''s general need—but that is not the alleged consultation and does not say that private goods were the king''s property. Qualify the script explicitly as Saint-Simon''s late, multiply mediated anecdote; do not present the Sorbonne opinion as a surviving institutional document. Sources: SRC-006, SRC-007.'
