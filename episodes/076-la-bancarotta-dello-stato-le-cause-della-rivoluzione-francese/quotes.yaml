  translation_notes: 'Direct translation of Saint-Simon''s French. Barbero compresses several judgments in the memoir narrative into the single formula that France''s ruin began at Turin. Saint-Simon does not use that exact formula: he calls the consequences exceptionally dreadful and rapid and says Turin cost France all of Italy. Barbero''s ''quando siamo stati buttati fuori dall''Italia'' accurately condenses the last point, while ''da lì è cominciata la nostra rovina'' is interpretive synthesis rather than quotation.'
