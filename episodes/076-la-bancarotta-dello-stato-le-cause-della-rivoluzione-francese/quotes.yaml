  attribution: Louis de Rouvroy, duc de Saint-Simon, Mémoires (retrospective account of the fiscal crisis of 1710)
  source_id: SRC-006
  original_language: fr
  original_text: La capitation doublée et triplée à volonté arbitraire des intendants des provinces, les marchandises et les denrées de toute espèce imposées en droit au quadruple de leur valeur, taxes d’aisés et autres de toute nature et sur toutes sortes de choses, tout cela écrasoit nobles et roturiers, seigneurs et gens d’Église, sans que ce qu’il en revenoit au roi pût suffire, qui tiroit le sang de tous ses sujets sans distinction, qui en exprimoit jusqu’au pus, et qui enrichissoit une armée infinie de traitants et d’employés à ces divers genres d’impôts, entre les mains de qui en demeuroit la plus grande et la plus claire partie.
  translation: 'The capitation tax, doubled and tripled at the arbitrary will of the provincial intendants; goods and foodstuffs of every kind taxed at four times their value; taxes on the well-to-do and others of every nature and on all sorts of things—all this crushed nobles and commoners, lords and churchmen, without what reached the king being enough: he drew the blood of all his subjects without distinction, squeezed them even to the pus, and enriched an infinite army of tax contractors and employees in these various kinds of taxes, in whose hands the largest and best part remained.'
  locator: 'Saint-Simon, Mémoires du duc de Saint-Simon, ed. Adolphe Chéruel, vol. 9 (Paris: Hachette, 1856), pp. 4–5 (Wikisource scans 7–8), year 1710, chapter headed ''Dixième denier'''
  translation_notes: 'Direct translation of Saint-Simon''s French, retaining the fiscal terms and violent bodily metaphor. Barbero follows the sentence almost verbatim: ''cavava sangue'' renders ''tiroit le sang,'' ''li spremeva fino al pus'' renders ''en exprimoit jusqu''au pus,'' and his tax contractors and employees correspond exactly to ''traitants et employés.'' His ''il grosso del ricavato'' is a natural compression of ''la plus grande et la plus claire partie.'' He omits the preceding catalogue of capitation increases and commodity taxes, which supplies the grammatical and historical context.'
  confidence: high
  status: resolved
  research_note: 'Verdict: confirmed. Evidence tier 1 for a primary autobiographical source in Chéruel''s first complete edition conformed to Saint-Simon''s manuscript, verified against the digitized page images. Author: Saint-Simon; described setting: the kingdom''s fiscal exhaustion in 1710 immediately before Desmarets''s proposal of the dixième. Document type and transmission: a retrospective memoir written decades after the events and published posthumously, not an official fiscal account, contemporary transcript, or statement spoken by Louis XIV. Preserve Barbero''s quotation while identifying it as Saint-Simon''s polemical retrospective characterization; it directly continues his account of depreciated royal paper, specie shortage, and proliferating taxes. Source: SRC-006.'
