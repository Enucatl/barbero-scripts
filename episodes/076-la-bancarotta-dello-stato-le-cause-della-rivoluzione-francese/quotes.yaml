  attribution: Louis de Rouvroy, duc de Saint-Simon, reporting details he says Chancellor Pontchartrain supplied the next day
  source_id: SRC-006
  original_language: fr
  original_text: Ainsi le mardi matin, 30 septembre, Desmarets entra au conseil des finances avec l’édit du dixième dans son sac. [...] Tout le monde assis, et Desmarets tirant un gros cahier de son sac, le roi prit la parole [...]. Aussitôt, et sans attendre de réponse, il se mit à lire l’édit, et il le lut d’un bout à l’autre tout de suite sans aucune interruption, puis il se tut. [...] Ainsi fut bâclée cette sanglante affaire, et immédiatement après signée, scellée, enregistrée parmi les sanglots suffoqués, et publiée parmi les plus douces mais les plus pitoyables plaintes. La levée ni le produit n’en furent pas tels à beaucoup près qu’on se l’étoit figuré dans ce bureau d’anthropophages, et le roi ne paya non plus un seul denier à personne qu’il faisoit auparavant. [...] Je sus dès le lendemain tout le détail que je viens de rapporter, par le chancelier.
  translation: Thus, on Tuesday morning, 30 September, Desmarets entered the Council of Finance with the edict of the tenth in his bag. [...] Once everyone was seated, and as Desmarets was drawing a large document from his bag, the king began to speak [...]. At once, without waiting for an answer, he began to read the edict and read it straight through from beginning to end without any interruption, then fell silent. [...] Thus was this bloody affair hurried through, and immediately afterward signed, sealed, registered amid stifled sobs, and published amid the gentlest but most pitiful complaints. Neither the collection nor its proceeds came anywhere near what had been imagined in that bureau of cannibals, and the king did not pay anyone a single penny more than he had before. [...] The very next day I learned from the chancellor all the details I have just related.
  locator: 'Saint-Simon, Mémoires du duc de Saint-Simon, ed. Adolphe Chéruel, vol. 9 (Paris: Hachette, 1856), pp. 9–12 (Wikisource scans 12–15), especially pp. 9–11 for the council and p. 11 for ''sanglots suffoqués'' and ''bureau d’anthropophages''; year 1710, chapter headed ''Dixième denier'''
  translation_notes: 'Direct translation of Saint-Simon''s French. Barbero closely follows the order and much of the language, but compresses the king''s and Desmarets''s speeches. D''Aguesseau is not called the oldest councillor: Saint-Simon says he was ''le dernier du conseil'' and therefore spoke first. Nor does the memoir record a formal unanimous vote: everyone remained silent except Beauvilliers, who briefly supported the measure. ''Fra il pianto generale'' strengthens ''publiée parmi les plus douces mais les plus pitoyables plaintes''; only the registration is said to occur ''parmi les sanglots suffoqués.'' Barbero''s ''commissione di antropofagi'' changes Saint-Simon''s ''bureau d''anthropophages,'' which refers contemptuously to the group that devised the expected yield.'
  confidence: high
  status: resolved
  research_note: 'Verdict: confirmed in substance. Evidence tier 1 for the wording in Saint-Simon''s primary autobiographical source, verified in the page images of Chéruel''s first complete edition conformed to the manuscript; tier 2 for the council scene because Saint-Simon was not present and explicitly says Chancellor Pontchartrain gave him the details the next day. Speaker/author: Saint-Simon narrates Louis XIV, Controller-General Nicolas Desmarets, Chancellor Pontchartrain, d''Aguesseau, and Beauvilliers. Date and setting: Tuesday 30 September 1710, the royal Council of Finance, before the edict establishing the dixième was issued on 14 October. Document type and transmission: retrospective memoir written decades later, published posthumously, not minutes or an official protocol; however, Saint-Simon identifies his near-contemporary informant. Preserve the vivid authentic phrases ''sanglots suffoqués'' and ''bureau d''anthropophages,'' but qualify the scene as Saint-Simon''s second-hand account and correct or soften the oldest-councillor, unanimous-approval, and general-weeping embellishments. Source: SRC-006.'
