  attribution: Julie de Lespinasse, letter to Jacques-Antoine-Hippolyte de Guibert, 6 July 1775
  source_id: SRC-012
  original_language: fr
  original_text: 'Oh ! pour le coup soyez assuré que le bien se fera, et qu''il se fera bien, parce que ce sont les lumières qui dirigeront la vertu et l''amour du bien public. Jamais, non jamais deux hommes plus vertueux, plus désintéressés, plus actifs n''ont été réunis et animés plus fortement d''un intérêt plus grand et plus élevé. Vous le verrez : leur ministère laissera une profonde trace dans l''esprit des hommes. [...] Oh ! le mauvais temps pour les fripons et pour les courtisans !'
  translation: 'Oh! This time, be assured that good will be done, and that it will be done well, because enlightenment will guide virtue and love of the public good. Never, no never, have two men more virtuous, more disinterested, more active been brought together and more powerfully animated by a greater and higher interest. You will see: their ministry will leave a profound mark on the minds of men. [...] Oh! What bad times for rogues and courtiers!'
  locator: 'Letter CXV, Julie de Lespinasse to Jacques-Antoine-Hippolyte de Guibert, Thursday 6 July 1775, in Lettres de Mlle de Lespinasse (Paris: Garnier Frères, 1893), pp. 258–260, especially pp. 259–260; scan-backed transcription at Wikisource.'
  translation_notes: Direct translation. Barbero follows the letter's sequence closely but turns its plural subjects into Turgot alone. Lespinasse wrote on the confidential news that Malesherbes would replace La Vrillière; 'deux hommes' and 'leur ministère' refer jointly to Malesherbes and Turgot. She was a prominent Parisian salonnière styled Mlle de Lespinasse, not an identified titled noblewoman in this source.
  confidence: high
  status: resolved
  research_note: 'Verdict: confirmed in substance. Evidence tier 2: a dated contemporary private letter, recovered through a scan-backed 1893 printed edition rather than an inspected autograph or modern critical edition. Speaker/writer: Julie de Lespinasse; recipient: Jacques-Antoine-Hippolyte de Guibert; date and setting: Paris, 6 July 1775, while Malesherbes''s appointment was still confidential; document type: private correspondence. Transmission: the Guibert letters first appeared posthumously in 1809; the accessible witness used here is the Garnier 1893 edition, pp. 258–260. Barbero accurately translates and compresses the wording, but misframes a joint encomium of Malesherbes and Turgot—occasioned by Malesherbes joining the ministry—as praise of Turgot alone. Qualify the script by naming Lespinasse, Malesherbes, and the dual referents. The autograph and its archival location were not established in this pass, so exact authorial accidentals cannot be guaranteed. Source: SRC-012.'
  quotation_kind: near-direct
  verdict: confirmed-in-substance
  source_replacement: eligible
- id: Q-011
  barbero_utterances:
