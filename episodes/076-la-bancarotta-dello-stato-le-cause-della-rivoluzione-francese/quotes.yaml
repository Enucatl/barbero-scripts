  attribution: John Law, Money and Trade Considered (1705), chapters VI–VII
  source_id: SRC-008
  original_language: en
  original_text: 'What I shall propose, is to make money of land equal to its value; and that money to be equal in value to silver-money; and not lyable to fall in value as silver-money falls. [...] To supply the nation with money, it is humbly propos’d, that 40 commissioners be appointed by parliament [...]. That the commissioners have power to coin notes: which notes to be received in payments, where offer’d. [...] There are three ways humbly offer’d to the parliament, for giving out these notes [...]: 1. To authorize the commission to lend notes on land security, the debt not exceeding one half, or two thirds of the value [...]. 2. To give out the full price of land, as it is valued, 20 years purchase more or less [...]. 3. To give the full price of land, upon sale made of such lands [...]. [...] This paper-money will not fall in value as silver-money has fallen, or may fall [...]. After the method propos’d, the quantity being always equal to the demand for it, it will keep its value [...]. [...] Tho’ silver were our product, yet it is not so proper to be made money as land. land is what produces every thing, silver is only the product. land does not increase or decrease in quantity, silver or any other product may. so land is more certain in its value than silver, or any other goods.'
  translation: 'What I shall propose, is to make money of land equal to its value; and that money to be equal in value to silver-money; and not lyable to fall in value as silver-money falls. [...] To supply the nation with money, it is humbly propos’d, that 40 commissioners be appointed by parliament [...]. That the commissioners have power to coin notes: which notes to be received in payments, where offer’d. [...] There are three ways humbly offer’d to the parliament, for giving out these notes [...]: 1. To authorize the commission to lend notes on land security, the debt not exceeding one half, or two thirds of the value [...]. 2. To give out the full price of land, as it is valued, 20 years purchase more or less [...]. 3. To give the full price of land, upon sale made of such lands [...]. [...] This paper-money will not fall in value as silver-money has fallen, or may fall [...]. After the method propos’d, the quantity being always equal to the demand for it, it will keep its value [...]. [...] Tho’ silver were our product, yet it is not so proper to be made money as land. land is what produces every thing, silver is only the product. land does not increase or decrease in quantity, silver or any other product may. so land is more certain in its value than silver, or any other goods.'
  locator: 'John Law, Money and Trade Considered: With a Proposal for Supplying the Nation with Money (Edinburgh, 1705; Glasgow: R. & A. Foulis, 1750 reprint), chap. VI, pp. 157–158; chap. VII, pp. 159–169, especially pp. 159–161 and 166–169; concluding comparison, pp. 188–191. Internet Archive identifier moneytradeconsid00lawj; Project Gutenberg ebook 70784 reproduces the pagination.'
  translation_notes: 'Direct translation of Law''s English. Barbero correctly compresses Law''s land-backed paper-money proposal and his argument that land is more stable than silver. But Law expressly says silver has value as a metal, so ''non hanno nessun valore di per sé'' is inaccurate. His notes were to be issued by a parliamentary commission, not literally a modern central bank, through three alternatives: loans secured on land, redeemable transfer of land, or outright sale. A note did not generically entitle its bearer to one fixed hectare: Law uses an acre only as a valuation example, while land or security could be assigned upon payment to the commission. Nor did he simply abolish all metallic money: the proposal retained newly standardized silver coin while limiting contractual substitution of silver for paper. His stability claim depended on issue and withdrawal matching demand, not land backing alone.'
  confidence: high
  status: resolved
  research_note: 'Verdict: confirmed in substance. Evidence tier 1: Law''s own published treatise/proposal, checked in a page-image-derived transcription of the 1750 reprint of the 1705 text. Speaker/author: John Law of Lauriston. Date and setting: written for the Parliament of Scotland and published at Edinburgh in 1705. Document type and transmission: contemporary printed economic treatise and legislative proposal; the accessible paginated witness used here is the 1750 Glasgow reprint, digitized by Internet Archive and transcribed by Project Gutenberg, with the 1705 imprint independently reproduced by Yale''s Avalon transcription. Barbero preserves the central contrast—silver varies with quantity and demand, whereas notes issued against land would be more stable—but modernizes the commission into a central bank and overstates four points: Law recognizes silver''s intrinsic/use value as metal; retains standardized metal coin; does not make every note a standing claim to one hectare; and says stability also requires elastic issue and retirement of notes. Preserve the core explanation but qualify these mechanics. Source: SRC-008.'
  quotation_kind: paraphrase
  verdict: confirmed-in-substance
