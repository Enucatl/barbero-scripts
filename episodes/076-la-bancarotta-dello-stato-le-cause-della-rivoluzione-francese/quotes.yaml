  status: resolved
  research_note: 'Verdict: confirmed in substance. Evidence tier 1 for the wording visible/transcribed from surviving banknotes; the Banque générale witness is available as a published plate image rather than a holding institution''s object record, while the Banque royale witness has a museum catalogue record and full recto transcription. Document type: bearer banknotes, not reported speech. Institutional chronology matters: Law''s private Banque générale was chartered in 1716; the surviving 50-écu example is dated 10 June 1718. The crown converted it into the Banque royale by the declaration of 4 December 1718; the museum note belongs to the royal stage in 1719. Preserve the explanation of sight payment to the bearer, but qualify the script with the actual denominations and distinguish the General Bank''s issue-date weight/fineness guarantee from the Royal Bank''s livres-tournois promise. Sources: SRC-010, SRC-011.'
