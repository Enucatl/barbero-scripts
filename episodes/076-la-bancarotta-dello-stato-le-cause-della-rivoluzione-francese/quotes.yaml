  attribution: Louis de Rouvroy, duc de Saint-Simon, Mémoires (retrospective character portrait of Philippe, duc d'Orléans, under the year 1715)
  source_id: SRC-009
  original_language: fr
  original_text: La curiosité d’esprit de M. le duc d’Orléans, jointe à une fausse idée de fermeté et de courage, l’avoit occupé de bonne heure à chercher à voir le diable, et à pouvoir le faire parler. Il n’oublioit rien, jusqu’aux plus folles lectures, pour se persuader qu’il n’y a point de Dieu, et il croyoit le diable jusqu’à espérer de le voir et de l’entretenir. Ce contraste ne se peut comprendre, et cependant il est extrêmement commun.
  translation: The curiosity of M. le duc d’Orléans, joined to a false notion of firmness and courage, had from early on occupied him in seeking to see the devil and to make him speak. He neglected nothing, even the maddest reading, to persuade himself that there is no God, and he believed in the devil to the point of hoping to see him and converse with him. This contrast cannot be understood, and yet it is extremely common.
  locator: 'Saint-Simon, Mémoires du duc de Saint-Simon, ed. Adolphe Chéruel, vol. 12 (Paris: Hachette, 1857), p. 113 (Wikisource scan 116), year 1715, chap. V, character portrait of the duc d''Orléans, section ''Quel étoit M. le duc d''Orléans sur la religion'''
  translation_notes: 'Direct translation of Saint-Simon''s French. Barbero''s punch line closely compresses ''pour se persuader qu’il n’y a point de Dieu, et il croyoit le diable.'' But Saint-Simon does not call Orléans an absolute atheist: a few paragraphs later he says the prince desired that there be no God yet had too much understanding to be an atheist, vacillated without a settled religious system, and affected impiety. The memoir says Orléans and Mirepoix spent nights making invocations in the quarries of Vanves and Vaugirard; it does not say here that he paid enormous sums to magicians or fraudsters.'
  confidence: high
  status: resolved
  research_note: 'Verdict: confirmed in substance. Evidence tier 1 for Saint-Simon''s own retrospective memoir, verified in the page image of Chéruel''s edition conformed to the manuscript. Author: Saint-Simon; subject: Philippe, duc d''Orléans, the future Regent. Setting and date: a thematic character portrait inserted under the memoir year 1715 before Louis XIV''s death, recounting practices from Orléans''s earlier life rather than a single dated scene. Document type and transmission: memoir composed decades after the events and published posthumously, not a spoken quip or contemporary transcript; Saint-Simon does say Orléans personally admitted that his attempts had produced nothing. Qualify Barbero''s compact antithesis because it is a faithful synthesis, but correct ''assolutamente ateo'': Saint-Simon explicitly denies that Orléans was an atheist and describes an unstable, affected impiety. The claims about Good Friday orgies and large payments are not established by this passage. Source: SRC-009.'
  quotation_kind: near-direct
  verdict: confirmed-in-substance
  source_replacement: eligible
