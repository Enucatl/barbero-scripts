  original_text: Jamais bataille ne coûta moins de soldats que celle de Turin, jamais de retraite plus tranquille de la part des ennemis, ni laissée plus à choix, jamais suites plus affreuses ni plus rapides. [...] celle de Turin coûta toute l’Italie.
  translation: Never did a battle cost fewer soldiers than the one at Turin, never was the enemy's withdrawal calmer or allowed more freedom of choice, never were the consequences more dreadful or more rapid. [...] the battle of Turin cost all of Italy.
