  original_language: fr
  original_text: 'Banque générale, 50-écu note of 10 June 1718: ''La Banque promet payer au Porteur à vûe cinquante Ecus d''Especes du poids & titre de ce jour, Valeur reçûe à Paris le dix Juin mil sept cens dix-huit.'' Banque royale, 100-livre note dated 1 April 1719: ''La Banque promet payer au porteur à vûe, Cent Livres Tournois en Especes d''Argent, valeur receûe à Paris le 1e avril 1719.'''
  translation: 'Banque générale: The Bank promises to pay the bearer at sight fifty écus in specie of the weight and fineness current this day, value received at Paris on 10 June 1718. Banque royale: The Bank promises to pay the bearer at sight one hundred livres tournois in silver specie, value received at Paris on 1 April 1719.'
  locator: 'Banque générale: Newman Numismatic Portal, Early Paper Money of America image collection, image 610011, 50 écus, 10 June 1718 (plate image of surviving note). Banque royale: Paris Musées, Musée Carnavalet, billet no. 401920, 100 livres tournois, text dated 1 April 1719 and object production date 1 August 1719, principal recto inscription.'
  translation_notes: Direct translations of the two institutionally distinct formulas. Barbero accurately reproduces the operative words 'pagabile/pagare a vista al portatore' but modernizes the denomination to generic francs. The private Banque générale note was denominated in écus and fixed redemption to specie of the weight and fineness current on its issue date. After the crown acquired and renamed the bank in December 1718, Banque royale notes were denominated in livres tournois and promised silver specie without that weight-and-fineness clause. Thus no surviving Law note located says simply '100/1000 francs.'
