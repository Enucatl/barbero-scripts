  translation: MINT NOTE RENEWED AND CERTIFIED pursuant to the Declaration of 24 May 1707. In the amount of [...] 1,000 livres tournois. FOR the sum of one thousand livres, which I will pay in one year to the bearer, value received in another mint note. Made at the Paris Mint on 15 June 1707.
