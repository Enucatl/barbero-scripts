  attribution: An unnamed royal workshop worker; repeated by Louis XVI to Marie-Antoinette and subsequently attributed to the king
  source_id: SRC-013
  original_language: fr
  original_text: Sire, je ne vois ici que vous et M. Turgot qui soyez amis du peuple.
  translation: Sire, I see no one here but you and Monsieur Turgot who are friends of the people.
  locator: 'Joseph-Alphonse de Véri, Journal, entry dated 20 February 1776, in Philippe Haudrère, ed., Le règne de Louis XVI et la Révolution française, 1774–1799 (Geneva: Droz, 2016), p. 413; compare Condorcet, Vie de Monsieur Turgot (1786), digital ed., p. 62.'
  translation_notes: Direct translation of the worker's wording recorded by Véri. Barbero's Italian closely matches the famous later form, 'Il n'y a que M. Turgot et moi qui aimions le peuple,' but turns a worker's compliment into a verbatim declaration by Louis XVI. Véri says the king merely repeated the worker's remark to the queen, who circulated it.
  confidence: high
  status: resolved
  research_note: 'Verdict: misattributed. Evidence tier 2: Véri''s dated contemporary diary entry, consulted through Haudrère''s 2016 critical edition rather than the autograph, explicitly distinguishes public report from what Véri calls the true event. On 20 February 1776, amid agitation over Turgot''s popular edicts abolishing corvées and guild restrictions, Véri records that an unnamed worker employed when Louis XVI amused himself at the lathe told him, ''Sire, je ne vois ici que vous et M. Turgot qui soyez amis du peuple.'' The king repeated this compliment to Marie-Antoinette, who spread it. Condorcet''s posthumous 1786 Vie de Monsieur Turgot (SRC-014), p. 62, transmits the polished royal form, ''Il n''y a que M. Turgot et moi qui aimions le peuple,'' but places it retrospectively in his account of the May 1775 Flour War, showing that wording and occasion had already shifted. Qualify rather than present the familiar sentence as ''testuale'': identify it as a celebrated formulation derived from a worker''s remark that the king repeated. The worker is unnamed, the exact words Louis repeated are not recorded, and the diary autograph was not inspected. Sources: SRC-013, SRC-014.'
  quotation_kind: slogan
  verdict: misattributed
  source_replacement: not-applicable
- id: Q-012
  barbero_utterances:
  - U-00817–U-00854
  barbero_timestamp: '54:32'
  attribution: Clugny de Nuits and contemporary political chansonniers
  source_id: SRC-015
  original_language: fr
  original_text: 'Un jour le Sr. de Vaines étant allé le voir, lui disoit pour le rassurer sur son état, qu''il devoit se rappeller l''axiome si connu : qu''un contrôleur-général ne meurt jamais en place : oh ! bien, répondit-il avec gaieté, je ferai mentir le proverbe. [...] On n''a pas manqué de lui faire une épitaphe [...]: Ci gît un contrôleur digne qu''on le pleurât, / Aimant beaucoup la France & point du tout la vie : / Consentant de bon cœur qu''elle lui fût ravie / Lorsqu''il auroit éteint les dettes de l''état.'
  translation: 'One day, when Monsieur de Vaines had gone to see him, he told him, to reassure him about his condition, that he should remember the well-known maxim that a controller-general never dies in office. ''Oh! Well,'' he replied cheerfully, ''I shall prove the proverb wrong.'' [...] They did not fail to compose an epitaph for him [...]: Here lies a controller worthy of mourning, / Loving France greatly and life not at all, / Gladly consenting that it be taken from him / Once he had extinguished the state''s debts.'
  locator: 'Mathieu-François Pidansat de Mairobert, L''Espion anglois, ou Correspondance secrète entre Milord All''Eye et Milord All''Ear, vol. 4 (London [Amsterdam?]: John Adamson, 1780), Letter LV, pp. 233–235; especially the exchange at pp. 233–234 and the posthumous epitaph at p. 235.'
  translation_notes: Direct translation, with spelling silently modernized only in the ledger's displayed French. Barbero preserves the maxim and Clugny's reply in substance but moves the exchange from Clugny's final illness to his arrival in office. The same near-contemporary chronique transmits a posthumous satirical epitaph about his supposed deathbed wish to live until the state debt was extinguished; it is not the later unsourced formulation that dying was the only way he found to remain in office.
  confidence: high
  status: resolved
  research_note: 'Verdict: composite. Evidence tier 2. Mairobert''s political chronique, published in 1778 and consulted in a 1780 reprint, places the proverb exchange during Clugny''s fatal illness in October 1776: de Vaines uses the maxim to reassure him, and Clugny replies, ''je ferai mentir le proverbe.'' It therefore confirms the words in substance but contradicts Barbero''s placement at the start of the ministry. The same letter records posthumous satire, including an epitaph based on reports of Clugny''s delirious promise to die willingly after paying the state''s debts. This verifies contemporary satirical circulation, but not an exact chanson saying that his death fulfilled a promise made on taking office. The chronique uses fictive letter dates (it prints 1775 for events demonstrably occurring in 1776), appeared roughly two years after the events, and does not name its informant for the exchange or epitaph. Qualify the scene and keep the comic reversal as paraphrase, not as a verbatim inaugural boast or a recoverable chanson refrain. Source: SRC-015.'
  quotation_kind: composite
  verdict: composite
  source_replacement: eligible
- id: Q-013
  barbero_utterances:
  - U-01073–U-01079
  barbero_timestamp: '70:17'
  attribution: National Assembly, collective paraphrase of its 17 and 23 June 1789 acts
  source_id: SRC-016
  original_language: fr
  original_text: '17 June: ''puisqu''il n''appartient qu''aux représentants vérifiés de concourir à former le vœu national [...] il lui appartient, et il n''appartient qu''à elle, d''interpréter et de présenter la volonté générale de la nation ; il ne peut exister entre le trône et cette Assemblée aucun veto, aucun pouvoir négatif. [...] La dénomination d''Assemblée nationale est la seule qui convienne [...] parce que la représentation étant une et indivisible, aucun des députés, dans quelque ordre ou classe qu''il soit choisi, n''a le droit d''exercer ses fonctions séparément de la présente Assemblée.'' 23 June: ''nous ne quitterons nos places que par la puissance des baïonnettes.'' The deputies answered unanimously: ''Tel est le vœu de l''Assemblée.'''
  translation: '17 June: Since only the verified representatives may contribute to forming the national will, it belongs to this Assembly, and to it alone, to interpret and present the general will of the nation; between the throne and this Assembly there can be no veto or negative power. The name National Assembly is the only fitting one because representation is one and indivisible, and no deputy, whatever the order or class that chose him, has the right to exercise his functions separately from this Assembly. 23 June: We will leave our places only by the force of bayonets. The deputies answered unanimously: Such is the will of the Assembly.'
  locator: 'Archives parlementaires, 1st ser., vol. 8 (Paris: P. Dupont, 1875), p. 127, adopted resolution taking the title National Assembly, 17 June 1789; p. 146, account of the exchange with Dreux-Brézé after the royal session, 23 June 1789. Persée document identifiers arcpa_0000-0000_1875_num_8_1_4503_t2_0127_0000_7 and arcpa_0000-0000_1875_num_8_1_4537_t2_0146_0000_5.'
  translation_notes: Direct translation of selected clauses, with OCR artifacts silently corrected against the page images. Barbero's 'Noi siamo il paese, noi siamo il popolo, noi abbiamo il potere. Il re senza di noi non è nulla' is not present verbatim. It compresses the Assembly's formal 17 June claim to represent and state the nation's general will, excluding a royal veto over that representative claim, together with the 23 June refusal to leave after the king ordered the estates to deliberate separately. 'Popolo' modernizes the documents' 'nation'; 'il re [...] non è nulla' overstates a text that still addresses the king and initially frames national restoration under a monarch.
  confidence: high
  status: resolved
  research_note: 'Verdict: composite. Evidence tier 1 for the adopted 17 June resolution as reproduced in the documentary Archives parlementaires; tier 2 for the 23 June spoken exchange in the same later compilation. The institutional subject on 17 June was no longer the Estates-General as three separately acting orders: the verified deputies of the Commons, joined by a small number of clergy, constituted themselves the National Assembly and claimed the exclusive right to interpret and present the nation''s general will. On 20 June they took the Tennis Court Oath. At the royal session on 23 June Louis XVI ordered continued deliberation by separate orders and directed the deputies to disperse; the National Assembly remained. The compilation records Mirabeau''s bayonets formula and the deputies'' unanimous assent, but expressly notes that Mirabeau''s speech was not printed in the Moniteur, so it is not an official verbatim protocol. Barbero fuses these stages and calls the resisting body ''gli stati generali''; retain his causal point only as an attributed paraphrase of the National Assembly''s sovereignty claim, while separating 17 June constitution, 20 June oath, and 23 June defiance. Do not print the Italian triad as a quotation. Source: SRC-016.'
  quotation_kind: paraphrase
  verdict: composite
  source_replacement: not-applicable
