- id: C-001
  claim: "The monarchy's fiscal collapse forced Louis XVI to convene the Estates-General, opening the French Revolution."
  transcript: [U-00025–U-00044]
  centrality: central
  supporting_sources:
    - source_id: SRC-017
      locator: "pp. 61–62, 84–86; translated republication of Journal of Economic History 49 (1989), pp. 545–568"
      note: "Reconstructs the 1780s budget crisis and identifies the loss of fiscal control and credit as the immediate institutional crisis, while rejecting a simple inevitable decline driven by the inherited debt stock."
    - source_id: SRC-018
      locator: "section '1788–1848 : les premières réflexions autour du suffrage,' paragraph beginning 'Le 8 août 1788'"
      note: "The French National Assembly's institutional history explicitly links Louis XVI's 8 August 1788 convocation for May 1789 to the grave financial crisis."
    - source_id: SRC-016
      locator: "Archives parlementaires, vol. 8, pp. 127 and 146"
      note: "Documents the revolutionary consequence after convocation: the deputies' assumption of national legislative authority on 17 June and refusal to disperse on 23 June 1789."
  conflicting_sources:
    - source_id: SRC-017
      locator: "pp. 61–62, 84–86"
      note: "White disputes an inevitable long-run collapse and locates the irreversible breakdown in policy choices and peacetime deficits after 1781; finance explains the convocation, not by itself the Revolution's broader social and political causation."
  status: resolved
  script_treatment: qualify
  research_note: "Evidence tier 2: strong scholarly reconstruction plus institutional documentary history. Retain the fiscal crisis as the immediate cause of convocation and convocation as the opening arena of Revolution, but do not make insolvency a sufficient cause of the Revolution or imply that the revolutionary outcome was automatic."
- id: C-002
  claim: "A century of heavy expenditure and defective taxation produced the monarchy's accumulated deficit."
  transcript: [U-00027–U-00044]
  centrality: central
  supporting_sources:
    - source_id: SRC-017
      locator: "pp. 61–62, 67–76, tables 1–3; pp. 84–86"
      note: "Budget reconstruction shows large war borrowing and debt service, structural difficulty raising revenue, and the decisive return of a large peacetime deficit in the 1780s."
    - source_id: SRC-023
      locator: "pp. 2–3, 7–11; notes 12–19"
      note: "Shows the monarchy's dependence on tax-farm credit and expensive wartime finance; reports that the General Farms supplied roughly 40 percent of tax revenue and cites an average 19 percent lease profit."
  conflicting_sources:
    - source_id: SRC-017
      locator: "pp. 61–62 and 84–86"
      note: "The accounts do not show a slow, inevitable century-long decline: economies and restructuring after 1770 allowed borrowing until the mid-1780s, and White emphasizes reversal of reforms and a peacetime deficit after 1781."
  status: resolved
  script_treatment: qualify
  research_note: "Evidence tier 2. Replace 'a century of mad expenditure and delirious taxation' with a differentiated account: repeated wars, costly debt service, a fragmented and politically constrained revenue system, and failed/reversed reform culminated in the 1780s crisis. Court expenditure is not established here as a primary driver."
- id: C-003
  claim: "Under French absolutism the king could legislate, imprison by lettre de cachet, and impose taxes without representative approval."
  transcript: [U-00058–U-00076]
  centrality: supporting
  supporting_sources:
    - source_id: SRC-019
      locator: "chapter 1, pp. 13–15 (PDF pp. 29–32), especially pp. 13–14"
      note: "Documents royal lettres de cachet and the crown's ability to force registration, while describing provincial estates, corporations, and parlements as practical and institutional constraints."
    - source_id: SRC-002
      locator: "chapter 1, pp. 10–12, especially p. 11 nn. 2–4"
      note: "Defines French absolute monarchy through contemporary legal sources while emphasizing that absolutism was a contested juridical claim rather than unlimited practical power."
  conflicting_sources:
    - source_id: SRC-019
      locator: "pp. 13–14"
      note: "France was centralized in theory but corporatist in practice; parlements registered edicts and could remonstrate, while provincial estates retained fiscal privileges."
  status: resolved
  script_treatment: qualify
  research_note: "Evidence tier 2. The king was the legislative source and lettres de cachet enabled detention without trial, and he did not require a standing national representative vote for ordinary taxation. But laws normally passed through registration, parlements and provincial estates could resist, and fundamental laws, privileges, custom, and administrative capacity limited action. Avoid equating absolutism with legally or practically unlimited government."
- id: C-004
  claim: "Saint-Simon's memoirs express high-aristocratic opposition to Louis XIV's absolutism."
  transcript: [U-00083–U-00104]
  centrality: supporting
  supporting_sources:
    - source_id: SRC-020
      locator: "chapter 4, pp. 105–128, abstract"
      note: "Places Saint-Simon in the high-aristocratic reform current around the duc de Bourgogne, opposing Louis XIV's displacement of old institutions and the political role of the high aristocracy."
    - source_id: SRC-021
      locator: "BnF exhibition record, manuscript NAF 23096, fols. 84–85; descriptive paragraphs"
      note: "Identifies the autograph manuscript, the 1739–1749 composition period, the events covered (1691–1723), and its retrospective, personally inflected character."
  conflicting_sources:
    - source_id: SRC-021
      locator: "descriptive paragraph beginning 'Longtemps passés au crible'"
      note: "The BnF cautions against reducing the memoirs to transparent contemporary reportage: they are a late literary-historical construction shaped by memory, sources, personality, and disappointed ambitions."
  status: resolved
  script_treatment: qualify
  research_note: "Evidence tier 2. Barbero's characterization is sound if framed as Saint-Simon's aristocratic-monarchical critique, not modern constitutional opposition. State explicitly that the surviving Mémoires were composed retrospectively in 1739–1749, decades after many narrated events."
- id: C-005
  claim: "The defeat at Turin was a major turning point in France's Italian position during the War of the Spanish Succession."
  transcript: [U-00105–U-00122]
  centrality: sampled-incidental
  supporting_sources:
    - source_id: SRC-022
      locator: "chapter 'The Primacy of the Atlantic World,' pp. 67–69, especially p. 68 and n. 46"
      note: "Calls the relief of Turin a decisive turning point and traces it to the French retreat, fall of Spanish Milan, and subsequent Habsburg conquests in Italy."
    - source_id: SRC-003
      locator: "vol. 13, p. 86"
      note: "Provides Saint-Simon's near-contemporary narrative perspective on the French defeat, useful as testimony to court interpretation rather than as sole proof of strategic consequences."
  conflicting_sources: []
  status: resolved
  script_treatment: retain
  research_note: "Evidence tier 2. Scholarly synthesis supports Turin (September 1706) as a decisive turning point in the Italian theater, followed by loss of Milan and expansion of Habsburg control. Keep the scope to France's Italian position; it was one of several decisive European battles, not by itself the turning point of the entire war."
- id: C-006
  claim: "Around 1710 the insolvent crown met obligations with mint notes that traded at deep discounts while specie was hoarded."
  transcript: [U-00123–U-00176]
  centrality: central
  supporting_sources:
    - source_id: SRC-004
      locator: "recto of billet no. A000001, dated 15 June 1707, issued under declaration of 24 May 1707"
      note: "Surviving 1,000-livre billet de monnaie confirms the instrument, denomination, date, official renewal, and mint/merchant signatures."
    - source_id: SRC-005
      locator: "note 8 and diplomatic transcription of billet no. 29,211"
      note: "Documents forced acceptance and the 1707 payment promise attached to a billet de monnaie."
    - source_id: SRC-024
      locator: "article sections II–IV, especially discussion of the 1708–1709 crisis and Desmaretz's 1709 monetary measures"
      note: "Scholarly reconstruction connects proliferating state paper, wartime remittance failures, the Lyon crash, and the 1709 devaluation; it shows that the instruments and monetary crisis evolved over several years."
  conflicting_sources:
    - source_id: SRC-024
      locator: "sections II–IV"
      note: "The crisis involved multiple instruments and monetary operations, not a single generic wage-paying mint note; no support was located for Barbero's illustrative exchange of a 1,000-livre note for 100 livres specie."
  status: resolved
  script_treatment: qualify
  research_note: "Evidence tier 2 for the instruments and severe depreciation, tier 3 for generalized specie hoarding. Billets de monnaie originated in recoinage and became state obligations with forced circulation; they were not modern banknotes. Say they traded at heavy discounts, but omit the unsupported 90 percent example. Also correct 'francs' to livres tournois and avoid saying paper currency had not been invented."
- id: C-007
  claim: "The monarchy outsourced much tax collection to private financiers organized in the Ferme générale, who retained substantial proceeds."
  transcript: [U-00186–U-00209]
  centrality: central
  supporting_sources:
    - source_id: SRC-023
      locator: "pp. 2–3, 5–9 and notes 14–23"
      note: "Explains consolidation of leases into the Company of General Farms, its collection and lending functions, approximately 40 percent share of tax revenue, lease accounting, and average profits."
    - source_id: SRC-025
      locator: "pp. 636–663, especially pp. 638–648 and 654–660"
      note: "Principal-agent analysis documents fixed leases, crown monitoring, employees, borrowing advantages, and the gradual move toward government-administered collection."
  conflicting_sources:
    - source_id: SRC-025
      locator: "pp. 638–648 and 654–660"
      note: "The crown supervised and repeatedly redesigned collection, and the Farm chiefly handled indirect taxes; this conflicts with the lecture's claims of no control and collection of all taxes including direct levies and tithes."
  status: resolved
  script_treatment: qualify
  research_note: "Evidence tier 2. Retain outsourcing to private syndicates that advanced a fixed lease price and kept residual returns, later consolidated as the Ferme générale. Qualify 'substantial proceeds' with the documented average lease profit (about 19 percent), and remove 'without any control,' 'all taxes,' and tithes: royal oversight existed and the Farm principally collected customs and indirect duties, while also lending to the crown."
- id: C-008
  claim: "Desmarets proposed a proportional levy on wealth in addition to existing taxes during Louis XIV's late-war fiscal emergency."
  transcript: [U-00210–U-00239]
  centrality: supporting
  supporting_sources:
    - source_id: SRC-026
      locator: "chapter III, paras. 43–47 and nn. 93–102"
      note: "Desmarets's archival drafts and the declaration of 14 October 1710 establish a wartime levy of one tenth of income from property, introduced in addition to existing imposts."
    - source_id: SRC-027
      locator: "pp. 387–389"
      note: "Characterizes the dixième as a proportional tax on personal income of property owners, created for the War of the Spanish Succession."
  conflicting_sources:
    - source_id: SRC-026
      locator: "paras. 43–47 and nn. 93–102"
      note: "The taxable base was annual income (revenu), including differentiated income streams, not the capital value of net wealth; 'property tax' is therefore imprecise."
  status: resolved
  script_treatment: qualify
  research_note: "Evidence tier 1–2. Call the 1710 dixième a nominal ten-percent levy on declared income, especially income from property, imposed as an emergency war tax on top of existing taxes. Vauban's earlier Dîme royale was a replacement scheme, whereas Desmarets's measure was additional. Do not translate patrimoniale literally as a modern net-wealth tax; collection rules and clerical composition also prevented complete universality."
- id: C-009
  claim: "Saint-Simon describes Desmarets's reform as approved by a family-connected commission and a Finance Council whose consent was effectively predetermined by Louis XIV."
  transcript: [U-00240–U-00357]
  centrality: supporting
  supporting_sources:
    - source_id: SRC-028
      locator: "tome IX, chapter 1, pp. 8–25, especially pp. 8–10 and 18–22"
      note: "Saint-Simon narrates the hand-picked bureau, Louis XIV's advance endorsement, Desmarets's uninterrupted reading, and the council's sequential assent."
    - source_id: SRC-026
      locator: "chapter III, paras. 43–47 and nn. 93–102"
      note: "Archival drafts and Dangeau independently confirm Desmarets's preparation of the declaration and a royal Finance Council meeting on 14 October 1710."
  conflicting_sources:
    - source_id: SRC-026
      locator: "paras. 44–47 and nn. 93–97"
      note: "The archival reconstruction describes several memoranda and a long examination, so Saint-Simon's nepotistic sham-commission framing cannot stand as a neutral account of the entire preparatory process."
  status: resolved
  script_treatment: qualify
  research_note: "Evidence tier 1 for Saint-Simon's testimony and Desmarets's surviving drafts, tier 2 for the modern archival synthesis. Preserve the vivid council scene explicitly as Saint-Simon's retrospective, hostile account. Independent evidence supports prior royal approval and formal council presentation, but not every family relationship or the inference that no substantive technical study occurred. The declaration is dated 14 October, while Saint-Simon places the staged council on Tuesday 30 September; flag this chronological tension rather than harmonizing it."
- id: C-010
  claim: "The new levy produced far less than projected and failed to reach financiers' concealed wealth."
  transcript: [U-00358–U-00364]
  centrality: supporting
  supporting_sources:
    - source_id: SRC-026
      locator: "chapter III, para. 47 and nn. 98–102"
      note: "Net receipts averaged roughly 22–24 million livres annually, far below pre-enactment projections near 117–120 million; Desmarets blamed false declarations."
    - source_id: SRC-028
      locator: "tome IX, chapter 1, pp. 23–25"
      note: "Saint-Simon says the yield disappointed and financiers escaped through concealed portfolios while taxpayers faced intrusive assessment."
  conflicting_sources:
    - source_id: SRC-026
      locator: "para. 47 and nn. 98–102"
      note: "The levy still produced about 96 million net over four years and was an effective direct tax; comparing annual receipts with Vauban's theoretical yield makes 'failed' too absolute."
  status: resolved
  script_treatment: qualify
  research_note: "Evidence tier 2 for reconstructed receipts, tier 1 for Saint-Simon's contemporary-world testimony. State the measured outcome: about 28 million net in 1711 and 22–23 million in each of 1712–14, roughly 96 million total, against promotional/theoretical estimates around 117–120 million per year. False declarations are documented, but the claim that financiers uniquely escaped is Saint-Simon's polemical generalization, not a demonstrated incidence study."
- id: C-011
  claim: "At Louis XIV's death, the Regency considered repudiating a royal debt roughly equal to ten years of revenue."
  transcript: [U-00365–U-00390, U-00463–U-00470]
  centrality: central
  supporting_sources:
    - source_id: SRC-029
      locator: "paras. 2–4 and nn. 2–3"
      note: "Reports 1715 net fiscal receipts of 69 million, expenditure of 146 million, total debt above 2 billion, and 90 million annual interest, while describing repudiation as one option before the Regent."
    - source_id: SRC-030
      locator: "pp. 213–220, especially paras. 5–15"
      note: "Reconstructs the 1715–16 visa, forced reductions and interest cuts as selective default/debt restructuring rather than full repudiation."
  conflicting_sources:
    - source_id: SRC-031
      locator: "pp. 19–25"
      note: "Published estimates for debt at Louis XIV's death range from about 1.25 to 3.46 billion livres because categories and valuation dates differ; no single ten-years-of-revenue ratio is secure."
  status: resolved
  script_treatment: qualify
  research_note: "Evidence tier 2. The fiscal emergency and debate over bankruptcy are secure, but 'ten years' revenue' is only a rough rhetorical ratio and varies sharply with gross versus net revenue and debt definitions. Use dated figures and ranges: net receipts about 69 million in 1715, expenditures 146 million, total obligations commonly estimated above 2 billion. The Regency rejected blanket repudiation but imposed a visa, conversion of floating paper, and interest reductions—forms of partial/selective default."
- id: C-012
  claim: "John Law fled Britain after a duel conviction and advocated paper currency ultimately grounded in land rather than specie."
  transcript: [U-00391–U-00434]
  centrality: supporting
  supporting_sources:
    - source_id: SRC-032
      locator: "Wilson v Law, 95 ER 510; report beginning 'John Law a Scot'"
      note: "The King's Bench report records Law's Old Bailey murder conviction and death judgment after killing Edward Wilson in a duel, followed by reprieve and custody during the private appeal."
    - source_id: SRC-008
      locator: "Money and Trade Considered (1705), pp. 80–120, especially pp. 89–96 and proposal pp. 102–120"
      note: "Law proposes notes issued on land security and explains their issue/retirement, while retaining coin and distinguishing money's functions from metal's use value."
  conflicting_sources:
    - source_id: SRC-008
      locator: "pp. 89–96 and 102–120"
      note: "Law did not simply advocate permanently replacing specie with notes each representing a fixed plot: his proposal used land valuation and mortgages, controlled issue, and convertibility mechanisms."
  status: resolved
  script_treatment: qualify
  research_note: "Evidence tier 1 for the reported court judgment and Law's own 1705 treatise. Law killed Edward Wilson in a duel, was convicted of murder and sentenced to death, was reprieved, then escaped custody while a private appeal was pending and fled to the Continent. Preserve the land-security core of his Scottish proposal but not the simplified hectare-for-note mechanism; his later French bank was initially a private specie-convertible bank, not the same land bank."
- id: C-013
  claim: "The Regent Philippe d'Orléans authorized Law's project amid the crown's severe fiscal crisis."
  transcript: [U-00435–U-00472]
  centrality: supporting
  supporting_sources:
    - source_id: SRC-033
      locator: "letters patent of 2 May and regulation registered 20 May 1716, especially arts. I–VI"
      note: "The royal letters patent issued under the Regency authorized Law and his company to establish the Banque générale for twenty years with six million livres capital."
    - source_id: SRC-029
      locator: "paras. 3–10 and nn. 3–8"
      note: "Places the Regent's authorization in the severe debt and cash-flow crisis and distinguishes Law's initially rejected state-bank plan from the private bank charter granted in May 1716."
  conflicting_sources:
    - source_id: SRC-029
      locator: "paras. 5–10"
      note: "Orléans did not adopt Law's complete project at once: the Regency council rejected the December 1715 state-bank proposal, and the May 1716 authorization was for a narrower private joint-stock bank."
  status: resolved
  script_treatment: qualify
  research_note: "Evidence tier 1–2. Attribute authorization to the Regency government under Philippe d'Orléans and date the decisive charter to 2 May 1716 (registered/regulation 20 May). Correct the lecture's compressed sequence: Law's broader public-bank proposal met council opposition in late 1715; the Regent then permitted a private Banque générale. Fiscal crisis was essential context, but the full debt-conversion 'System' developed in later stages rather than being approved wholesale in 1716."
- id: C-014
  claim: "Law's bank issued shares and banknotes, accepted old royal paper, and benefited from government acceptance and guarantees."
  transcript: [U-00472–U-00534]
  centrality: central
  supporting_sources:
    - source_id: SRC-034
      locator: "pp. 10–13, 22–25, especially pp. 11–12 and 22–23"
      note: "The private Banque générale raised capital in shares (mostly payable in discounted billets d'État), issued on-demand silver-convertible notes, and gained tax acceptance for notes through decrees of 1716–17; after royalization in December 1718, its notes progressively became state-backed fiat money."
  conflicting_sources:
    - source_id: SRC-034
      locator: "pp. 11–17 and 18–22"
      note: "Tax collectors accepted banknotes, not bank shares. The initial bank held billets d'État as subscribed assets; the later Compagnie d'Occident, whose shares were wholly payable in billets d'État, performed the debt-for-equity conversion. The lecture merges these distinct instruments and stages."
  status: resolved
  script_treatment: qualify
  research_note: "Evidence tier 2, based on a specialist economic reconstruction with precise decree and archival references. Separate four instruments: Banque générale shares; its silver-convertible bearer notes; depreciated state billets used to subscribe bank/company equity; and Compagnie shares. The government made banknotes acceptable for taxes in 1717 and bought the bank in December 1718, after which the crown bore the bank's gains and risks. Do not say bank shares circulated as tax payment or that the original private bank itself steadily extinguished the public debt."
- id: C-015
  claim: "Law's financial system joined the bank to a company holding colonial trade and tax-collection monopolies."
  transcript: [U-00535–U-00565]
  centrality: central
  supporting_sources:
    - source_id: SRC-034
      locator: "pp. 13–16, 18–22, and table 9 at p. 41"
      note: "The Compagnie d'Occident received Louisiana and Canadian-beaver privileges in 1717, then accumulated tobacco, Senegal, East India/China, North African, mint, General Farms, and direct-tax collection rights in 1718–19; the Royal Bank merged into it in February 1720."
  conflicting_sources:
    - source_id: SRC-034
      locator: "pp. 13–16 and table 9 at p. 41"
      note: "There was no single immediate monopoly over all colonial commerce, nor a generic sugar monopoly: privileges were acquired piecemeal, had different geographic/commodity scopes, and the General Farms covered most excises rather than literally every royal tax."
  status: resolved
  script_treatment: qualify
  research_note: "Evidence tier 2. Preserve the central claim of institutional concentration but give the sequence: Compagnie d'Occident (August 1717); tobacco and Senegal (1718); Indies/China, North Africa, mints, General Farms, and recettes générales (1719); bank merger (February 1720). By then the conglomerate collected about 90% of taxes and monopolized overseas trade in broad but legally differentiated fields. Avoid the lecture's 'all colonial trade,' sugar-monopoly, and all-taxes formulations."
- id: C-016
  claim: "The Mississippi bubble enriched speculators and coincided with the emergence of the French term 'millionnaire.'"
  transcript: [U-00566–U-00575]
  centrality: sampled-incidental
  supporting_sources:
    - source_id: SRC-034
      locator: "pp. 1–2, figure 4 at p. 16, and pp. 44–47"
