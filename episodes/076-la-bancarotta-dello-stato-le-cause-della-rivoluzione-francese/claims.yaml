- id: C-018
  claim: "Law's ministry restricted private specie holdings, authorized searches, and punished public critics of the system."
  transcript: [U-00586–U-00611]
  centrality: supporting
  supporting_sources:
    - source_id: SRC-034
      locator: "pp. 23–25, especially decree chronology at pp. 23–24"
      note: "Documents progressive restrictions: payment limits in December 1719; the 27 February 1720 ban on owning more than 500 livres in gold or silver coin; and the 11 March plan for surrendering specie to the mints and eliminating most private monetary metal."
