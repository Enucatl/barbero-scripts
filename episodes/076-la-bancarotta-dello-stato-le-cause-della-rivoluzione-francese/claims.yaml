- id: C-019
  claim: "Redemptions by informed princes helped trigger a bank run in which seventeen people died before payments ceased."
  transcript: [U-00612–U-00636]
  centrality: supporting
  supporting_sources:
    - source_id: SRC-034
      locator: "pp. 28–33, especially pp. 29–30 and 33"
      note: "Documents company price support, large-scale conversion of shares into notes, limited specie redemption, reopening on 9 July, and indefinite suspension after the 17 July mêlées."
    - source_id: SRC-038
      locator: "tome 18, chapter 2, paragraphs 69–75, especially paragraphs 70 and 74"
      note: "Saint-Simon's retrospective eyewitness-era memoir dates the fatal bank crowd to 17 July, reports ten or twelve people suffocated, and says the next day's royal ordinance closed the bank until further order."
  conflicting_sources:
    - source_id: SRC-038
      locator: "tome 18, chapter 2, paragraphs 69–75"
      note: "The contemporary-near account gives ten or twelve deaths, not seventeen, and places the crowd at the bank and neighboring streets; the bank then occupied the Hôtel de Nevers complex by rue Vivienne, not rue Quincampoix."
