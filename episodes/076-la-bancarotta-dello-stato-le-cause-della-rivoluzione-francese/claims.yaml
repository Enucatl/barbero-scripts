  script_treatment: qualify
  research_note: "Evidence tier 1–2 for chronology and institutional outcome; tier 3 for named-prince anecdotes. Separate early-1720 court profit-taking from the 17 July crowd disaster. Use 'ten or twelve according to Saint-Simon' or 'roughly a dozen' and locate it at the Royal Bank near rue Vivienne. The windows closed indefinitely on 17–18 July; high notes lost monetary use on 1 October/1 November while conversion outlets into bonds, accounts, shares, and some specie continued. Omit the single-cause insider-trading scene and the unsupported immediate imprisonment coda."
