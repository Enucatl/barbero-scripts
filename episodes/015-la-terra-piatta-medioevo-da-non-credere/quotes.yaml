  original_text: "Se tel chose peüst avenir qu'il n'eüst riens seur terre, ne yaue, ne autre chose qui destornast la voie quel part que l'en alast, l'en pourroit aler environ toute la terre, ou homme, ou beste, sus et jus, quel part qu'il voudroit, ausi comme une mouche iroit entour une pomme reonde."
  translation: "If it could happen that there were nothing on Earth—neither water nor anything else—to obstruct the route in whatever direction one went, a person or animal could go all around the Earth, above and below, whichever way it wished, just as a fly would go around a round apple."
