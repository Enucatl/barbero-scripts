<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width">
<meta name="robots" content="noindex,nofollow"><title>{{ config.title }}</title>
<style>{% include "style.css" %}</style></head><body><main>
<header><img class="cover" src="cover.png" alt="{{ config.title }} cover"><div><h1>{{ config.title }}</h1><p class="subtitle">{{ config.subtitle }}</p><p>{{ config.description }}</p><p><a href="feed.xml">Subscribe to the private RSS feed</a></p></div></header>
<h2>Episodes</h2>{% for episode in episodes %}<article><h3><a href="episodes/{{ episode.slug }}/">{{ episode.title }}</a></h3><p>{{ episode.summary }}</p><audio controls preload="none" src="media/{{ episode.media_name }}"></audio></article>{% endfor %}
</main></body></html>
