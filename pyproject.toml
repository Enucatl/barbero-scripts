[project]
name = "barbero-scripts"
version = "0.1.0"
description = "Editorial pipeline for English adaptations of Alessandro Barbero lectures"
requires-python = ">=3.11"
dependencies = ["PyYAML>=6.0.2"]

[project.scripts]
barbero = "barbero_scripts.cli:main"

[dependency-groups]
dev = ["pytest>=8.3", "ruff>=0.9"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.pytest.ini_options]
testpaths = ["tests"]

