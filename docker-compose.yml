services:
  caddy:
    extends:
      file: ../compose-security-baseline/hardening.yml
      service: hardened-small
    image: caddy:2.10.2-alpine
    cap_add:
      - NET_BIND_SERVICE
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - /scratch/archive/barbero-english/published:/srv/published:ro
    networks:
      - podcast_internal
    tmpfs:
      - /config
      - /data
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://127.0.0.1:8080/healthz"]
      interval: 30s
      timeout: 3s
      retries: 3
      start_period: 5s

  cloudflared:
    extends:
      file: ../compose-security-baseline/hardening.yml
      service: hardened-small
    image: cloudflare/cloudflared:latest
    user: "0:0"
    environment:
      TUNNEL_TOKEN_FILE: /run/secrets/cloudflare_tunnel_token
      TUNNEL_METRICS: 127.0.0.1:20241
    command: tunnel --no-autoupdate run
    secrets:
      - cloudflare_tunnel_token
    networks:
      - podcast_internal
      - internet
    depends_on:
      caddy:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "cloudflared", "tunnel", "--metrics", "127.0.0.1:20241", "ready"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s

secrets:
  cloudflare_tunnel_token:
    file: ./secrets/cloudflare-tunnel-token

networks:
  podcast_internal:
    internal: true
  internet:
